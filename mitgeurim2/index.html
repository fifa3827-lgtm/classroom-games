<style>

<body>
<canvas id="cv"></canvas>
<button id="fsBtn" aria-label="전체화면"></button>
<div id="fsMsg"></div>
<div id="rotate"><div>밑그림은 가로 화면에서 그려집니다.<br>기기를 옆으로 돌려 주세요.<br><button id="rotFs">전체화면 가로로 보기</button></div></div>
<script>// 글씨나무 — 연필 손그림: 종이, 찢긴 카드, 흔들리는 연필 선, 빗금, 목탄
(function (root) {
  const rng = seed => { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const INK = '#222120';
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  // 점 목록을 촘촘하게(흔들림을 넣을 수 있게) 다시 나눈다
  const resample = (pts, step) => { const out = []; for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(d / step)); for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]); } out.push(pts[pts.length - 1]); return out; };

  // 연필 한 획: 두세 번 겹쳐 긋고, 겹마다 조금씩 어긋나며, 획 끝은 가늘어진다
  const stroke = (c, pts, o) => {
    o = o || {}; const r = o.r || rng(o.seed || 7); const w = o.w || 2.2, passes = o.passes || 2, jit = o.jit == null ? 1.3 : o.jit, col = o.color || INK, alpha = o.alpha || 0.9;
    const P = resample(pts, o.step || 6);
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col;
    for (let p = 0; p < passes; p++) {
      const off = [(r() - 0.5) * jit, (r() - 0.5) * jit]; let drift = [0, 0];
      const Q = P.map(([x, y], i) => { drift = [drift[0] * 0.8 + (r() - 0.5) * jit * 0.6, drift[1] * 0.8 + (r() - 0.5) * jit * 0.6]; return [x + off[0] + drift[0], y + off[1] + drift[1]]; });
      // 획을 짧은 토막으로 그려 굵기와 진하기를 바꾼다 (시작·끝은 가늘게)
      for (let i = 0; i < Q.length - 1; i++) { const t = i / Math.max(1, Q.length - 2); const taper = o.noTaper ? 1 : Math.min(1, Math.sin(Math.PI * Math.min(1, Math.max(0, t))) * 1.8 + 0.25);
        c.globalAlpha = alpha * (p === 0 ? 1 : 0.55) * (0.75 + r() * 0.25); c.lineWidth = w * taper * (p === 0 ? 1 : 0.7) * (0.85 + r() * 0.3);
        c.beginPath(); c.moveTo(Q[i][0], Q[i][1]); c.lineTo(Q[i + 1][0], Q[i + 1][1]); c.stroke(); }
    }
    c.restore();
  };
  const circlePts = (cx, cy, rx, ry, a0, a1, n) => { a0 = a0 || 0; a1 = a1 == null ? Math.PI * 2 : a1; n = n || Math.max(16, Math.round(Math.max(rx, ry) * 0.9)); const out = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return out; };
  // 손으로 그린 원은 끝이 조금 겹친다
  const ring = (c, cx, cy, rx, ry, o) => { const r = (o && o.r) || rng((o && o.seed) || 3); const a0 = r() * 6.28; stroke(c, circlePts(cx, cy, rx, ry, a0, a0 + Math.PI * 2.08), Object.assign({ r }, o)); };
  const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y + 1]];
  const box = (c, x, y, w, h, o) => { const r = (o && o.r) || rng((o && o.seed) || 5); const sides = [[[x, y], [x + w, y]], [[x + w, y], [x + w, y + h]], [[x + w, y + h], [x, y + h]], [[x, y + h], [x, y]]];
    sides.forEach(([a, b]) => { const ex = (r() - 0.3) * 4; stroke(c, [[a[0] - (b[0] - a[0]) * 0.02, a[1] - (b[1] - a[1]) * 0.02], [b[0] + (b[0] - a[0]) * 0.02 + ex * 0, b[1] + (b[1] - a[1]) * 0.02]], Object.assign({ r }, o)); }); };

  // 빗금: 모양(path2D) 안에 비스듬한 연필 선을 채운다
  const hatch = (c, path, bb, o) => { o = o || {}; const r = o.r || rng(o.seed || 11); const ang = o.angle == null ? -0.9 : o.angle, sp = o.spacing || 7; const [x, y, w, h] = bb;
    c.save(); c.clip(path); const L = Math.hypot(w, h), cx = x + w / 2, cy = y + h / 2, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let d = -L / 2; d < L / 2; d += sp * (0.7 + r() * 0.6)) { const px = cx - sa * d, py = cy + ca * d; const t0 = o.sketch ? -L / 2 + r() * L * 0.5 : -L / 2, t1 = o.sketch ? L / 2 - r() * L * 0.5 : L / 2, wob = (r() - 0.5) * 0.06; const c2 = Math.cos(ang + wob), s2 = Math.sin(ang + wob); stroke(c, [[px + c2 * t0, py + s2 * t0], [px + c2 * t1, py + s2 * t1]], { r, w: (o.w || 1.1) * (0.7 + r() * 0.6), passes: 1, alpha: (o.alpha || 0.55) * (0.6 + r() * 0.5), jit: 1.2, step: 14, noTaper: !o.sketch }); }
    if (o.cross) { const a2 = ang + 1.3, c2 = Math.cos(a2), s2 = Math.sin(a2); for (let d = -L / 2; d < L / 2; d += sp * 1.3 * (0.8 + r() * 0.4)) { const px = cx - s2 * d, py = cy + c2 * d; stroke(c, [[px - c2 * L / 2, py - s2 * L / 2], [px + c2 * L / 2, py + s2 * L / 2]], { r, w: (o.w || 1.1) * 0.9, passes: 1, alpha: (o.alpha || 0.55) * 0.8, jit: 1, step: 14, noTaper: true }); } }
    c.restore(); };

  // 목탄 칠: 짙은 바탕 + 결 따라 문지른 획 + 털처럼 일어난 가장자리
  const polyPath = pts => { const p = new Path2D(); pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
  const charcoal = (c, path, bb, o) => { o = o || {}; const [x, y, w, h] = bb; const pad = 30; const L = mk(w + pad * 2, h + pad * 2), l = L.getContext('2d'); l.translate(-x + pad, -y + pad);
    const col = o.color || '#1d1c1a'; const r = o.r || rng(o.seed || 17);
    l.fillStyle = col; l.globalAlpha = o.base == null ? 0.82 : o.base; l.shadowColor = col; l.shadowBlur = o.soft == null ? 2.5 : o.soft; l.fill(path); l.shadowBlur = 0; l.globalAlpha = 1;
    // 속: 결 방향으로 짧게 문지른 획 (밝고 어두운 결)
    l.save(); l.clip(path); const g = o.grain == null ? -1.0 : o.grain, ca = Math.cos(g), sa = Math.sin(g);
    for (let i = 0; i < (w * h) / 55; i++) { const sx = x + r() * w, sy = y + r() * h, len = 6 + r() * 22; l.globalAlpha = 0.18 + r() * 0.35; l.strokeStyle = r() < 0.72 ? '#0e0d0c' : '#5b5752'; l.lineWidth = 0.8 + r() * 2.2; l.beginPath(); l.moveTo(sx, sy); l.lineTo(sx + ca * len, sy + sa * len); l.stroke(); }
    l.restore();
    // 가장자리 털: 윤곽 점에서 바깥으로 짧은 획
    if (o.pts) { const Pp = resample(o.pts.concat([o.pts[0]]), o.fur ? 5 : 9); for (let i = 0; i < Pp.length - 1; i++) { const [px, py] = Pp[i], [qx, qy] = Pp[i + 1]; let tx = qx - px, ty = qy - py; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl; const nx = ty, ny = -tx;
      if (o.fur && r() < 0.55) { const k = o.fur * (0.4 + r() * 0.9), sw = (r() - 0.3) * 1.2; l.globalAlpha = 0.25 + r() * 0.4; l.strokeStyle = col; l.lineWidth = 0.7 + r() * 1.1; l.beginPath(); l.moveTo(px - nx * 1.5, py - ny * 1.5); l.quadraticCurveTo(px + nx * k * 0.6 + tx * k * sw * 0.5, py + ny * k * 0.6 + ty * k * sw * 0.5, px + nx * k + tx * k * sw, py + ny * k + ty * k * sw); l.stroke(); }
      // 윤곽: 연필로 한 번 더 (살짝 흔들리게)
      l.globalAlpha = 0.5 + r() * 0.4; l.strokeStyle = col; l.lineWidth = 1.2 + r() * 1.3; l.beginPath(); l.moveTo(px + (r() - 0.5) * 1.5, py + (r() - 0.5) * 1.5); l.lineTo(qx + (r() - 0.5) * 1.5, qy + (r() - 0.5) * 1.5); l.stroke(); } }
    l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < (L.width * L.height) / 45; i++) { l.globalAlpha = 0.06 + r() * 0.16; l.fillRect(r() * L.width, r() * L.height, 1 + r() * 2, 1); }
    c.save(); c.globalAlpha = o.alpha == null ? 1 : o.alpha; c.drawImage(L, x - pad, y - pad); c.restore(); };
  // 문지른 그늘: 넓고 흐린 목탄 번짐
  const smudge = (c, x, y, w, h, o) => { o = o || {}; const r = o.r || rng(o.seed || 31); const L = mk(w, h), l = L.getContext('2d');
    const g = l.createLinearGradient(0, 0, 0, h); const top = o.up ? o.alpha || 0.2 : 0, bot = o.up ? 0 : o.alpha || 0.2; g.addColorStop(0, `rgba(30,28,26,${top})`); g.addColorStop(1, `rgba(30,28,26,${bot})`); l.fillStyle = g; l.fillRect(0, 0, w, h);
    const gx = l.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, 'rgba(0,0,0,1)'); gx.addColorStop(0.12, 'rgba(0,0,0,0)'); gx.addColorStop(0.88, 'rgba(0,0,0,0)'); gx.addColorStop(1, 'rgba(0,0,0,1)'); l.globalCompositeOperation = 'destination-out'; l.fillStyle = gx; l.fillRect(0, 0, w, h);
    for (let i = 0; i < w * h / 70; i++) { l.globalAlpha = 0.05 + r() * 0.2; l.fillRect(r() * w, r() * h, 3 + r() * 26, 1); }
    c.drawImage(L, x, y); };
  // 종이: 따뜻한 회백색, 섬유와 얼룩, 가장자리로 갈수록 어둡다
  const paperTex = (w, h, seed) => { const C = mk(w, h), x = C.getContext('2d'); const r = rng(seed || 99);
    x.fillStyle = '#e6e2da'; x.fillRect(0, 0, w, h);
    const img = x.getImageData(0, 0, w, h), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; } x.putImageData(img, 0, 0);
    for (let i = 0; i < w * h / 900; i++) { x.globalAlpha = 0.04 + r() * 0.05; x.strokeStyle = r() < 0.5 ? '#8d887e' : '#fff'; x.lineWidth = 0.6; x.beginPath(); const sx = r() * w, sy = r() * h, a = r() * 6.28, l = 4 + r() * 14; x.moveTo(sx, sy); x.quadraticCurveTo(sx + Math.cos(a) * l * 0.5 + (r() - 0.5) * 4, sy + Math.sin(a) * l * 0.5 + (r() - 0.5) * 4, sx + Math.cos(a) * l, sy + Math.sin(a) * l); x.stroke(); }
    for (let i = 0; i < 18; i++) { x.globalAlpha = 0.025; x.fillStyle = '#6f6a61'; x.beginPath(); x.ellipse(r() * w, r() * h, 40 + r() * 160, 30 + r() * 120, r() * 3, 0, 6.28); x.fill(); }
    x.globalAlpha = 1; const g = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(40,36,30,.22)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    return C; };
  // 찢긴 종이 가장자리
  const tornPath = (x, y, w, h, seed, amp) => { const r = rng(seed || 5); amp = amp || 5; const p = new Path2D(); const pts = [];
    const edge = (x0, y0, x1, y1) => { const n = Math.round(Math.hypot(x1 - x0, y1 - y0) / 7); for (let i = 0; i < n; i++) { const t = i / n, nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny); const k = (r() - 0.5) * amp + (r() < 0.06 ? (r() - 0.5) * amp * 2.2 : 0); pts.push([x0 + (x1 - x0) * t + nx / L * k, y0 + (y1 - y0) * t + ny / L * k]); } };
    edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
    pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
  const card = (c, x, y, w, h, seed) => { const path = tornPath(x, y, w, h, seed); c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 24; c.shadowOffsetY = 6; c.fillStyle = '#ddd8cf'; c.fill(path); c.restore();
    c.save(); c.clip(path); c.drawImage(paperTex(w, h, seed), x, y); c.restore(); return path; };

  // 흑연 결: 그려진 먹을 종이 결대로 조금 지워 연필처럼 보이게
  const graphite = (layer, seed) => { const x = layer.getContext('2d'), r = rng(seed || 21); x.save(); x.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < layer.width * layer.height / 40; i++) { x.globalAlpha = 0.08 + r() * 0.22; x.fillRect(r() * layer.width, r() * layer.height, 1, 1); } x.restore(); };

  root.Pencil = { polyPath, smudge, rng, mk, stroke, ring, box, rectPts, circlePts, hatch, charcoal, paperTex, tornPath, card, graphite, resample, INK };
})(window);
</script>
<script>
// 밑그림2 — 엔진: 화면, 입력, 허브 방, 퍼즐 카드, 투사지(베끼기·겹치기), 음절판, 나무, 소리, 저장
(function (root) {
  const P = root.Pencil; const W = 1600, H = 900;
  const CARD = { x: 36, y: 40, w: 1190, h: 820 };
  const CHO = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈ', JUNG = 'ㅏㅓㅗㅜㅡㅣ';
  const CHO_I = { 'ㄱ': 0, 'ㄴ': 2, 'ㄷ': 3, 'ㄹ': 5, 'ㅁ': 6, 'ㅂ': 7, 'ㅅ': 9, 'ㅇ': 11, 'ㅈ': 12 };
  const JUNG_I = { 'ㅏ': 0, 'ㅓ': 4, 'ㅗ': 8, 'ㅜ': 13, 'ㅡ': 18, 'ㅣ': 20 };
  const JONG_I = { '': 0, 'ㄱ': 1, 'ㄴ': 4, 'ㄷ': 7, 'ㄹ': 8, 'ㅁ': 16, 'ㅂ': 17, 'ㅅ': 19, 'ㅇ': 21, 'ㅈ': 22 };
  const keyOf = (tab, v) => Object.keys(tab).find(k => tab[k] === v);
  const compose = (c, j, g) => String.fromCharCode(0xAC00 + (CHO_I[c] * 21 + JUNG_I[j]) * 28 + JONG_I[g || '']);
  const decompose = s => { const k = s.charCodeAt(0) - 0xAC00; return [keyOf(CHO_I, Math.floor(k / 588)), keyOf(JUNG_I, Math.floor(k / 28) % 21), keyOf(JONG_I, k % 28)]; };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const INKW = '#e8e4dc';
  const SW = 460, SH = 420; // 투사지 크기
  const rad = d => d * Math.PI / 180;
  const rot = (x, y, a) => { const c = Math.cos(rad(a)), s = Math.sin(rad(a)); return [x * c - y * s, x * s + y * c]; };

  // ---------- 손글씨 자모 (획 좌표, 0~1 칸) ----------
  const JS = {
    'ㄱ': [[[0.16, 0.2], [0.82, 0.2], [0.78, 0.86]]],
    'ㄴ': [[[0.2, 0.14], [0.2, 0.8], [0.86, 0.8]]],
    'ㄷ': [[[0.84, 0.2], [0.2, 0.2], [0.2, 0.8], [0.86, 0.8]]],
    'ㄹ': [[[0.18, 0.14], [0.82, 0.14], [0.82, 0.47], [0.2, 0.47], [0.2, 0.84], [0.86, 0.84]]],
    'ㅁ': [[[0.2, 0.2], [0.8, 0.2], [0.8, 0.82], [0.2, 0.82], [0.2, 0.2]]],
    'ㅂ': [[[0.22, 0.1], [0.22, 0.86], [0.8, 0.86], [0.8, 0.1]], [[0.22, 0.46], [0.8, 0.46]]],
    'ㅅ': [[[0.52, 0.14], [0.16, 0.86]], [[0.46, 0.44], [0.86, 0.86]]],
    'ㅇ': 'O',
    'ㅈ': [[[0.18, 0.18], [0.82, 0.18]], [[0.64, 0.2], [0.16, 0.86]], [[0.46, 0.5], [0.86, 0.86]]],
    'ㅏ': [[[0.4, 0.1], [0.4, 0.9]], [[0.4, 0.5], [0.78, 0.5]]],
    'ㅓ': [[[0.6, 0.1], [0.6, 0.9]], [[0.22, 0.5], [0.6, 0.5]]],
    'ㅗ': [[[0.1, 0.66], [0.9, 0.66]], [[0.5, 0.3], [0.5, 0.66]]],
    'ㅜ': [[[0.1, 0.34], [0.9, 0.34]], [[0.5, 0.34], [0.5, 0.72]]],
    'ㅡ': [[[0.1, 0.5], [0.9, 0.5]]],
    'ㅣ': [[[0.5, 0.1], [0.5, 0.9]]],
  };
  const jamo = (c, ch, x, y, s, o) => { o = o || {}; const r = P.rng(o.seed || ch.charCodeAt(0)); const d = JS[ch]; if (!d) return;

  // =====================================================================
  // 3막 — 그림자. 철사 조각의 윤곽을 빛에서 벽으로 실제 투영한다
  //   맞는 조건에서 벽의 글자 점마다, 빛에서 그 점으로 가는 빛줄기 위의 한 점을 골라 조각을 만든다.
  //   깊이는 철사를 따라 크게 굽이쳐서, 조건이 조금만 어긋나도 그림자가 흐트러진다
  // =====================================================================
  const FR = { x: 420, y: 150, w: 360, h: 290 }, TABLE = 720;
  // 음절 획 (엔진의 손글씨 배치와 같은 자리)
  const sylStrokes = (s, x, y, sz) => { const [ch, ju, jo] = G.decompose(s); const side = 'ㅏㅓㅣ'.includes(ju); const top = jo ? 0.62 : 1; const out = [];
    const put = (c, px, py, sc) => { const d = JS[c]; if (d === 'O') { out.push(P.circlePts(px + sc / 2, py + sc / 2, sc * 0.32, sc * 0.34, -1.5, -1.5 + Math.PI * 2, 40)); return; } d.forEach(st => out.push(st.map(([a, b]) => [px + a * sc, py + b * sc]))); };
    if (side) { put(ch, x + sz * 0.02, y + sz * (jo ? 0.04 : 0.08), sz * 0.52 * (jo ? 1 : 1.2)); put(ju, x + sz * 0.5, y, sz * top); }
    else { put(ch, x + sz * 0.22, y - sz * 0.02, sz * 0.56 * (jo ? 0.85 : 1)); put(ju, x + sz * 0.05, y + sz * (jo ? 0.2 : 0.3), sz * 0.9 * (jo ? 0.72 : 0.9)); }
    if (jo) put(jo, x + sz * 0.22, y + sz * 0.56, sz * 0.5); return out; };
  const target = s => { const sz = 250; const st = sylStrokes(s, 0, 0, sz); const xs = st.flat().map(p => p[0]), ys = st.flat().map(p => p[1]); const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2; return st.map(s2 => s2.map(([a, b]) => [a - cx + FR.x + FR.w / 2, b - cy + FR.y + FR.h / 2])); };
  // 조각 만들기: ray(w, z) → 3차원 점. 깊이 z는 철사를 따라 굽이친다
  // 깊이는 철사를 따라 완만하게 바뀐다: 조금 어긋나면 글자가 휘고 밀릴 뿐, 많이 어긋나야 흐트러진다
  const sculpt = (tgt, ray, z0, z1, seed, grow) => { let k = seed || 0; return tgt.map(st => P.resample(st, 11).map(w => { k++; const t = 0.5 + 0.42 * Math.sin(k * 0.11 + seed) + 0.08 * Math.sin(k * 0.29 + seed * 3); const z = z0 + (z1 - z0) * clamp(t, 0, 1);
    // 손으로 구부린 흔들림: 벽 위에서 7px 안팎이 되도록, 빛에서 멀수록(그림자가 커질수록) 작게
    const g = grow ? grow(z) : 1; const ex = (Math.sin(k * 0.21 + seed * 1.7) + 0.6 * Math.sin(k * 0.57 + seed)) * 4.5 / g, ey = (Math.cos(k * 0.19 + seed * 0.9) + 0.6 * Math.sin(k * 0.43 + seed * 2)) * 4.5 / g; const p = ray(w, z); return [p[0] + ex, p[1] + ey, p[2]]; })); };
  const lowest = W => W.flat().reduce((a, p) => p[1] > a[1] ? p : a);
  // 그림자: 3차원 점 → 벽의 점. 벽(탁자 위)에만 진다

  const SPOTS = { frame: [170, 230], sink: [390, 230], balloon: [610, 230], bookend: [830, 230], desk: [1060, 230], lake: [190, 560], mobile: [400, 560], lantern: [600, 560], candle: [800, 560], twin: [1000, 560], sun: [1150, 470] };
  const HB = 190;
  G.puzzles.forEach(p => { const ic = icons[p.id], [hx, hy] = SPOTS[p.id]; const [x0, y0, x1, y1] = ic.box; const k = Math.min(HB / (x1 - x0), HB / (y1 - y0));
    p.hub = { x: hx, y: hy, w: HB + 20, h: HB + 20, r: HB * 0.5, draw(x, r, G) { x.save(); x.translate(10 + (HB - (x1 - x0) * k) / 2, 10 + (HB - (y1 - y0) * k) / 2); x.scale(k, k); x.translate(-x0, -y0); ic.draw(x, r, false); x.restore(); } }; }); // 방에서는 늘 처음 모습 (맞춘 모습은 곧 답이다)
  G.HUB = { draw(x, r) {
    P.smudge(x, C.x + 10, 690, C.w - 20, 120, { alpha: 0.18, seed: 2 }); P.stroke(x, [[C.x + 30, 780], [C.x + C.w - 30, 772]], { r, w: 2.4 });
    const wall = new Path2D(); wall.rect(C.x, C.y, C.w, 740); P.hatch(x, wall, [C.x, C.y, C.w, 740], { angle: Math.PI / 2, spacing: 26, alpha: 0.06, sketch: true, seed: 4 });
    const sh = [[70, 342], [1190, 336], [1190, 352], [70, 358]]; P.charcoal(x, P.polyPath(sh), [70, 336, 1120, 22], { r, pts: sh, base: 0.4 }); } };

  // =====================================================================
  // 마지막: 원고지 2·4·2·3칸에 열한 글자를 늘어놓는다
  // =====================================================================
  (() => {
    const SENT = ['모든', '그림자는', '불을', '등진다']; const FLAT = SENT.join('').split('');
    const ORDER = ['림', '다', '모', '을', '진', '는', '그', '불', '든', '등', '자']; // 늘어놓기 전 순서 (문장과 무관)
    const CS = 78; const slots = []; let x = 150; SENT.forEach(wd => { for (let i = 0; i < wd.length; i++) { slots.push({ x, y: 330 }); x += CS; } x += 40; });
    const tile = i => ({ x: 170 + i * 88, y: 590 });
    G.FINAL = { id: 'final', ans: SENT.join(' '), noPad: true, hints: ['띄어쓰기가 칸을 나눈다. 넉 자 낱말과 석 자 낱말부터.', '그림자는 늘 어느 쪽에 생겼는가.', '모든 ○○○○ ○○ ○○○.'],
      init(st, G) { st.cells = new Array(11).fill(null); st.pick = null; st.drag = null; },
      glyph(G, ch) { return G.art('fc-' + ch, 90, 90, (x, r) => G.syl(x, ch, 12, 8, 60, { r, w: 3.5 })); },
      slotAt(p) { return slots.findIndex(s => p.x > s.x - 8 && p.x < s.x + CS + 4 && p.y > s.y - 14 && p.y < s.y + CS + 14); },
      tileAt(st, p) { for (let i = 0; i < 11; i++) { if (st.cells.includes(i)) continue; const tr = tile(i); if (p.x > tr.x && p.x < tr.x + 76 && p.y > tr.y && p.y < tr.y + 80) return i; } return -1; },
      draw(c, st, G) { const base = G.art('final-base', G.W, G.H, (x, r) => { slots.forEach(s => P.stroke(x, P.rectPts(s.x, s.y, CS - 4, CS - 4), { r, w: 1.2, alpha: 0.5, passes: 1 })); P.stroke(x, [[C.x + 80, 520], [C.x + C.w - 80, 516]], { r, w: 0.8, alpha: 0.25, passes: 1 }); }); G.ink(c, base, 0, 0);
        c.save(); c.font = '34px "Nanum Pen Script", cursive'; c.fillStyle = '#3a3733'; c.textAlign = 'center'; c.fillText('찾은 열한 글자를 원고지에 늘어놓는다. 칸 사이 띈 자리는 띄어쓰기다.', C.x + C.w / 2, 200); c.restore();
        const d = st.drag; const hov = d && d.moved ? this.slotAt(d) : -1;
        if (hov >= 0) { c.save(); c.fillStyle = 'rgba(40,38,34,.08)'; c.fillRect(slots[hov].x, slots[hov].y, CS - 4, CS - 4); c.restore(); }
        st.cells.forEach((t, i) => { if (t == null || (d && d.moved && d.fromCell === i)) return; G.ink(c, this.glyph(G, ORDER[t]), slots[i].x - 6, slots[i].y - 2); });
        ORDER.forEach((ch, i) => { if (st.cells.includes(i) || (d && d.moved && d.t === i)) return; const tr = tile(i); c.save(); if (st.pick === i) c.translate(0, -10); G.ink(c, this.glyph(G, ch), tr.x - 6, tr.y - 2); c.restore(); });
        if (d && d.moved) { c.save(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 12; c.shadowOffsetY = 6; G.ink(c, this.glyph(G, ORDER[d.t]), d.x - 45, d.y - 50); c.restore(); }
        c.save(); c.font = '28px "Nanum Pen Script", cursive'; c.fillStyle = '#55514b'; c.textAlign = 'center'; c.fillText('글자를 끌어 칸에 놓는다 · 놓인 글자를 끌어 옮기거나 칸 밖으로 빼낸다', C.x + C.w / 2, 720); c.restore(); },
      down(st, p, G) { const lu = G.lockUntil.final || 0; if (G.t < lu) { G.toast('종이가 번져 있다… ' + Math.ceil(lu - G.t) + '초'); return; }
        const ti = this.tileAt(st, p); if (ti >= 0) { st.drag = { t: ti, fromCell: -1, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false }; G.Snd.pick(); return; }
        const si = this.slotAt(p); if (si >= 0 && st.cells[si] != null) { st.drag = { t: st.cells[si], fromCell: si, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false }; G.Snd.pick(); return; }
        // 누르기 방식: 고른 글자가 있으면 빈 칸에 놓는다
        if (si >= 0 && st.pick != null) { this.put(st, st.pick, si, -1, G); st.pick = null; } },
      move(st, p) { const d = st.drag; if (!d) return; d.x = p.x; d.y = p.y; if (Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true; },
      up(st, p, G) { const d = st.drag; if (!d) return; st.drag = null;
        if (!d.moved) { if (d.fromCell >= 0) { st.cells[d.fromCell] = null; G.Snd.erase(); } else st.pick = st.pick === d.t ? null : d.t; return; }
        const si = this.slotAt(p); if (si < 0) { if (d.fromCell >= 0) { st.cells[d.fromCell] = null; G.Snd.erase(); } return; }
        this.put(st, d.t, si, d.fromCell, G); },
      // 칸 si에 글자 t를 놓는다. 칸에 글자가 있으면 옮겨 온 자리와 맞바꾸거나 밖으로 뺀다
      put(st, t, si, from, G) { const prev = st.cells[si]; if (from >= 0) st.cells[from] = prev != null ? prev : null; st.cells[si] = t; st.pick = null; G.Snd.snap();
        if (st.cells.every(v => v != null)) { const wrong = st.cells.filter((tt, j) => ORDER[tt] !== FLAT[j]).length; if (!wrong) { G.solved.final = true; G.save(); G.Snd.solved(); G.flash = 1; setTimeout(() => G.ending(), 2200); } else G.fail(this, wrong + '칸이 맞지 않는다'); } },
    };
    G.FLAT = FLAT; G.ORDER = ORDER;
  })();
})(window.MG);
</script>
<script>MG.init();</script>
