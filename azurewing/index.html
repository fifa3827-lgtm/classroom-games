<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;600;700&family=Gothic+A1:wght@500;700&display=swap">
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:grid;place-items:center;background:#05070c;background:radial-gradient(120% 90% at 50% 0%,#17233a 0%,#0a0f1a 55%,#05070c 100%)}
  canvas{display:block;touch-action:none;border-radius:8px;box-shadow:0 0 0 1px rgba(150,190,255,.10),0 30px 90px rgba(0,0,0,.65)}
  @media (max-width:600px){canvas{border-radius:0;box-shadow:none}}
  #rot{display:none;position:fixed;inset:0;z-index:5;background:#05070c;color:#e8f0fb;place-items:center;text-align:center;font-family:'Gothic A1',sans-serif;padding:24px}
  #rot b{display:block;font-family:'Black Han Sans','Gothic A1',sans-serif;font-weight:400;font-size:30px;margin:14px 0 8px}
  #rot span{font-size:16px;opacity:.8}
  #rot i{display:inline-block;width:40px;height:66px;border:4px solid #cfe6ff;border-radius:9px;animation:turn 2.4s ease-in-out infinite}
  #rot i::after{content:'';display:block;width:12px;height:3px;margin:52px auto 0;border-radius:2px;background:#cfe6ff}
  @keyframes turn{0%,25%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
  body.landscape-touch #rot{display:grid}
</style>
</head>
<body>
<canvas id="c" aria-label="창공요격대 — 세로 스크롤 비행 슈팅 게임"></canvas>
<div id="rot" role="alert"><div><i aria-hidden="true"></i><b>세로로 돌려 주세요</b><span>이 게임은 세로 화면에 맞춰져 있어요</span></div></div>
<script>
'use strict';
/* =====================================================================
   창공요격대 AZURE WING
   세로 스크롤 비행 슈팅 — 천공비행단의 후속작
   ===================================================================== */

// ---------- 기본 유틸 ----------
const W=432,H=768,TAU=Math.PI*2;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[(Math.random()*a.length)|0];
const d2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
function angLerp(a,b,t){const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*Math.min(1,t);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function srng(seed){let s=(Math.floor(seed)*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
let K=1;const SPR=3;
function layout(){
  const vw=innerWidth,vh=innerHeight,s=Math.min(vw/W,vh/H);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  K=clamp(s*(devicePixelRatio||1),1,IS_TOUCH?2.4:3);
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
}
addEventListener('resize',layout);layout();

// ---------- 스프라이트 도우미 ----------
function mk(w,h,fn,s=SPR){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*s));c.height=Math.max(1,Math.ceil(h*s));const g=c.getContext('2d');g.scale(s,s);fn(g,w,h);c.w=w;c.h=h;return c;}
function blit(c,x,y,rot,sc,a){sc=sc||1;const w=c.w*sc,h=c.h*sc;if(a!==undefined)ctx.globalAlpha=a;
  if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(c,-w/2,-h/2,w,h);ctx.restore();}else ctx.drawImage(c,x-w/2,y-h/2,w,h);
  if(a!==undefined)ctx.globalAlpha=1;}
function silhouette(c,col){const s=document.createElement('canvas');s.width=c.width;s.height=c.height;const g=s.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col||'#000';g.fillRect(0,0,s.width,s.height);s.w=c.w;s.h=c.h;return s;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
// 적기는 그린 뒤 180° 돌리므로, 빛 방향이 뒤집히지 않게 그라데이션도 함께 뒤집는다
let FLIP=false;
function lg(g,x0,y0,x1,y1,st){if(FLIP){let t=x0;x0=x1;x1=t;t=y0;y0=y1;y1=t;}const q=g.createLinearGradient(x0,y0,x1,y1);for(const s of st)q.addColorStop(s[0],s[1]);return q;}
function rg(g,cx,cy,ox,oy,r0,r1,st){if(FLIP){ox=-ox;oy=-oy;}const q=g.createRadialGradient(cx+ox,cy+oy,r0,cx,cy,r1);for(const s of st)q.addColorStop(s[0],s[1]);return q;}
const SO=()=>FLIP?-1:1;

const S={};       // 스프라이트 저장소
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];return glowCache[col]=mk(64,64,g=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,col);r.addColorStop(.5,hexA(col,.3));r.addColorStop(1,hexA(col,0));g.fillStyle=r;g.fillRect(0,0,64,64);},1.5);}

// ---------- 비행기 그리기 ----------
function wingPath(S_,ch,tip,sw,y,root){const p=new Path2D(),h=S_/2;for(const s of[-1,1]){p.moveTo(s*root,y);p.lineTo(s*(h-tip*.35),y+sw);p.quadraticCurveTo(s*h,y+sw,s*h,y+sw+tip*.5);p.quadraticCurveTo(s*h,y+sw+tip,s*(h-tip*.4),y+sw+tip);p.lineTo(s*root,y+ch);p.closePath();}return p;}
function fusPath(L,fw){const p=new Path2D(),h=L/2,r=fw/2;p.moveTo(0,-h);p.bezierCurveTo(r*.9,-h,r,-h*.72,r,-h*.42);p.bezierCurveTo(r,h*.15,r*.5,h*.78,r*.28,h);p.lineTo(-r*.28,h);p.bezierCurveTo(-r*.5,h*.78,-r,h*.15,-r,-h*.42);p.bezierCurveTo(-r,-h*.72,-r*.9,-h,0,-h);p.closePath();return p;}
function capsule(x,y,w,h){const p=new Path2D(),r=w/2;p.moveTo(x,y);p.bezierCurveTo(x+r*1.1,y,x+r,y+h*.2,x+r,y+h*.38);p.lineTo(x+r*.55,y+h);p.lineTo(x-r*.55,y+h);p.lineTo(x-r,y+h*.38);p.bezierCurveTo(x-r,y+h*.2,x-r*1.1,y,x,y);p.closePath();return p;}
function shadeFill(g,p,S_,y,hg,c1,c2){g.fillStyle=lg(g,0,y,0,y+hg,[[0,c1],[1,c2]]);g.fill(p);g.fillStyle=lg(g,-S_/2,0,S_/2,0,[[0,'rgba(255,255,255,.16)'],[.5,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.22)']]);g.fill(p);}
function shadeBody(g,p,x,w,C){g.fillStyle=lg(g,x-w/2,0,x+w/2,0,[[0,C.b3],[.28,C.b1],[.55,C.b2],[1,C.b3]]);g.fill(p);}
function mark(g,x,y,r,type){
  g.beginPath();g.arc(x,y,r,0,TAU);
  if(type==='ally'){g.fillStyle='#173a73';g.fill();g.beginPath();g.arc(x,y,r*.68,0,TAU);g.fillStyle='#f3f6fa';g.fill();g.beginPath();g.arc(x,y,r*.36,0,TAU);g.fillStyle='#2c7be0';g.fill();}
  else{g.fillStyle='#262118';g.fill();g.fillStyle='#ef8a2e';g.beginPath();g.moveTo(x,y-r*.72);g.lineTo(x+r*.72,y);g.lineTo(x,y+r*.72);g.lineTo(x-r*.72,y);g.closePath();g.fill();}
}
function planeDefaults(o){
  o=Object.assign({},o);const L=o.len;
  o.wy=o.wy??-L*.06;o.tail=o.tail||{span:o.span*.38,chord:L*.14,y:L/2-L*.17,sweep:1.5};
  o.cy=o.cy??-L*.1;o.cl=o.cl??.1;o.noseLen=o.noseLen??.12;o.nw=o.nw??.8;o.nl=o.nl??(o.chord+L*.25);o.pr=o.pr??o.fw;
  o.eng=o.eng||[];
  o.props=o.jet?[]:(o.eng.length?o.eng.map(x=>[x,o.wy-o.nl*.4]):[[0,-L/2]]);
  o.jets=o.jet?[[0,L/2]]:[];
  return o;
}
function paintPlane(g,o){
  const L=o.len,h=L/2,S_=o.span,ch=o.chord,tip=o.tip,sw=o.sweep||0,wy=o.wy,fw=o.fw,C=PAL[o.pal];
  const root=fw*.4;
  const wing=wingPath(S_,ch,tip,sw,wy,root);
  const T=o.tail,tsw=T.sweep||1.5,tail=wingPath(T.span,T.chord,T.chord*.7,tsw,T.y,fw*.25);
  const fus=fusPath(L,fw);
  const nacs=o.eng.map(x=>({x,p:capsule(x,o.wy-o.nl*.4,fw*o.nw,o.nl)}));
  g.lineJoin='round';
  g.strokeStyle='rgba(6,10,18,.62)';g.lineWidth=2.2;
  for(const p of[wing,tail,fus,...nacs.map(n=>n.p)])g.stroke(p);
  // 주날개
  shadeFill(g,wing,S_,wy,ch+sw,C.w1,C.w2);
  g.save();g.clip(wing);
  g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=.55;
  for(const f of[.36,.7]){g.beginPath();for(const s of[-1,1]){g.moveTo(s*root,wy+ch*f);g.lineTo(s*S_/2,wy+sw+tip*f);}g.stroke();}
  for(const f of[.2,.33,.42]){g.beginPath();for(const s of[-1,1]){g.moveTo(s*S_*f,wy-5);g.lineTo(s*S_*f,wy+ch+sw+5);}g.stroke();}
  g.fillStyle='rgba(0,0,0,.13)';
  for(const s of[-1,1]){g.beginPath();g.moveTo(s*S_*.27,wy+sw*.5+ch*.78);g.lineTo(s*S_*.47,wy+sw+tip*.8);g.lineTo(s*S_*.47,wy+sw+tip+3);g.lineTo(s*S_*.27,wy+sw*.5+ch+3);g.closePath();g.fill();}
  if(C.ws){g.fillStyle=C.ws;for(const s of[-1,1])g.fillRect(s>0?S_*.37:-S_*.37-S_*.045,wy-6,S_*.045,ch+sw+12);}
  g.restore();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=.8;g.beginPath();
  for(const s of[-1,1]){g.moveTo(s*root,wy+.6);g.lineTo(s*(S_/2-tip*.35),wy+sw+.6);}g.stroke();
  if(o.mark){for(const s of[-1,1]){const x=s*S_*.29,f=(S_*.29-root)/(S_/2-root),lc=lerp(ch,tip,f),y=wy+sw*f+lc*.5;mark(g,x,y,Math.min(lc*.34,o.len*.12),o.mark);}}
  // 엔진 나셀
  for(const n of nacs){shadeBody(g,n.p,n.x,fw*o.nw,C);
    g.save();g.clip(n.p);g.fillStyle=C.nose;g.fillRect(n.x-fw,o.wy-o.nl*.4-1,fw*2,o.nl*.16);
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(n.x-fw,o.wy-o.nl*.4+o.nl*.5,fw*2,.8);g.restore();
    g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=.7;g.beginPath();g.moveTo(n.x-fw*o.nw*.22,o.wy-o.nl*.3);g.lineTo(n.x-fw*o.nw*.18,o.wy+o.nl*.4);g.stroke();}
  // 꼬리날개
  shadeFill(g,tail,T.span,T.y,T.chord+tsw,C.w1,C.w2);
  g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=.6;g.beginPath();
  for(const s of[-1,1]){g.moveTo(s*fw*.25,T.y+.5);g.lineTo(s*(T.span/2-T.chord*.25),T.y+tsw+.5);}g.stroke();
  // 동체
  shadeBody(g,fus,0,fw,C);
  g.save();g.clip(fus);
  g.fillStyle=C.nose;g.fillRect(-fw,-h-1,fw*2,L*o.noseLen);
  g.fillStyle=C.band;g.fillRect(-fw,h-L*.3,fw*2,L*.045);
  g.fillStyle=lg(g,0,-h,0,h,[[0,'rgba(255,255,255,.08)'],[.6,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.25)']]);g.fill(fus);
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(-fw,-h+L*o.noseLen,fw*2,.6);g.fillRect(-fw,h*.25,fw*2,.6);
  g.restore();
  // 수직 꼬리(위에서 본 얇은 판)
  g.fillStyle=lg(g,-1.4,0,1.4,0,[[0,C.b1],[1,C.b3]]);rr(g,-1.2,h-L*.25,2.4,L*.25+1,1.1);g.fill();
  // 광택
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=.9;g.beginPath();g.moveTo(-fw*.2,-h*.74);g.quadraticCurveTo(-fw*.27,0,-fw*.12,h*.55);g.stroke();
  // 조종석 캐노피
  const cy=o.cy,crx=fw*.3,cry=L*o.cl;
  g.fillStyle=rg(g,0,cy,-crx*.4,-cry*.45,.3,cry*1.25,[[0,'#f4feff'],[.28,C.can],[1,'#0b1d2e']]);
  g.beginPath();g.ellipse(0,cy,crx,cry,0,0,TAU);g.fill();
  g.strokeStyle='rgba(8,18,28,.65)';g.lineWidth=.6;g.stroke();
  g.beginPath();g.moveTo(-crx,cy+cry*.25);g.lineTo(crx,cy+cry*.25);g.stroke();
  // 스피너
  for(const p of o.props){const r=Math.max(1.6,fw*.17);g.fillStyle=rg(g,p[0],p[1],-r*.4,-r*.4,.2,r*1.2,[[0,'#ffffff'],[.4,C.nose],[1,C.b3]]);g.beginPath();g.arc(p[0],p[1]+r*.3,r,0,TAU);g.fill();}
  if(o.jet){g.fillStyle='#14181e';g.beginPath();g.ellipse(0,h-1.5,fw*.28,1.8,0,0,TAU);g.fill();}
}
function planeSprite(spec,flip,s){
  const o=planeDefaults(spec),pad=5,w=Math.max(o.span,o.tail.span)+pad*2,h=o.len+pad*2;
  FLIP=!!flip;
  const c=mk(w,h,g=>{g.translate(w/2,h/2);if(flip)g.rotate(Math.PI);paintPlane(g,o);if(o.extra)o.extra(g,o);},s||SPR);
  FLIP=false;
  const f=flip?-1:1;
  c.props=o.props.map(p=>[p[0]*f,p[1]*f]);c.jets=o.jets.map(p=>[p[0]*f,p[1]*f]);c.pr=o.pr;c.o=o;c.dir=f;
  c.sh=silhouette(c);c.wh=silhouette(c,'#fff');
  return c;
}

// ---------- 색 팔레트와 기체 제원 ----------
const PAL={
  hawk:{b1:'#f6f8fb',b2:'#b5c0cc',b3:'#5c6876',w1:'#e8edf2',w2:'#8794a3',nose:'#2f6fd0',band:'#2f6fd0',ws:null,can:'#7cc8f0'},
  lance:{b1:'#78a6e6',b2:'#3a64a8',b3:'#142748',w1:'#6496da',w2:'#21406e',nose:'#f2f5f8',band:'#f2f5f8',ws:'rgba(242,245,248,.85)',can:'#a3e6ff'},
  fox:{b1:'#ff8272',b2:'#c8392d',b3:'#57130e',w1:'#f2614f',w2:'#8a2318',nose:'#f6e8c8',band:'#f6e8c8',ws:'rgba(246,232,200,.92)',can:'#a7e2ff'},
  en:{b1:'#a9b37c',b2:'#6c7748',b3:'#2c321c',w1:'#9ba66e',w2:'#4b5432',nose:'#e07a2e',band:'#e07a2e',ws:null,can:'#d6b468'},
  red:{b1:'#ff9a6a',b2:'#d4472a',b3:'#5a150b',w1:'#f26e44',w2:'#93291a',nose:'#ffd25c',band:'#ffd25c',ws:'rgba(255,214,98,.92)',can:'#d6b468'},
  jet:{b1:'#b3c0cf',b2:'#66768a',b3:'#252e3a',w1:'#9aa8ba',w2:'#465365',nose:'#e85d2e',band:'#e85d2e',ws:'rgba(232,93,46,.75)',can:'#ffb35c'},
  gun:{b1:'#98a372',b2:'#5c6640',b3:'#232816',w1:'#8a9564',w2:'#3d4528',nose:'#e07a2e',band:'#e07a2e',ws:'rgba(224,122,46,.6)',can:'#d6b468'},
  heavy:{b1:'#a1aab4',b2:'#5f6a76',b3:'#222932',w1:'#8f99a4',w2:'#39424c',nose:'#d9692b',band:'#d9692b',ws:'rgba(217,105,43,.8)',can:'#ffb35c'},
  ally:{b1:'#eef2f6',b2:'#a8b4c1',b3:'#4f5b68',w1:'#dfe5eb',w2:'#7d8a98',nose:'#2f6fd0',band:'#2f6fd0',ws:'rgba(47,111,208,.7)',can:'#7cc8f0'},
  bear:{b1:'#a3aab2',b2:'#5b636c',b3:'#1f252b',w1:'#929aa3',w2:'#3a4149',nose:'#f2c230',band:'#f2c230',ws:'rgba(242,194,48,.92)',can:'#9fe3ff'},
  bolt:{b1:'#fff6cc',b2:'#e8b830',b3:'#5e4006',w1:'#ffe27a',w2:'#a87a10',nose:'#22262c',band:'#22262c',ws:'rgba(34,38,44,.85)',can:'#7fd8ff'},
  fire:{b1:'#7a6464',b2:'#3e2c2e',b3:'#120a0c',w1:'#64504f',w2:'#221416',nose:'#ff5a1f',band:'#ff5a1f',ws:'rgba(255,90,31,.85)',can:'#ffb35c'},
  boss0:{b1:'#97a7b6',b2:'#566676',b3:'#1f2933',w1:'#8899aa',w2:'#33404c',nose:'#d9692b',band:'#d9692b',ws:'rgba(217,105,43,.75)',can:'#ffb35c'},
};
const SPEC={
  hawk:{len:46,span:62,chord:12,tip:7,sweep:2,fw:8,eng:[-14,14],nw:1.2,nl:24,pal:'hawk',mark:'ally',cy:-8,cl:.12,pr:8.5},
  lance:{len:50,span:52,chord:12,tip:7,sweep:3.5,fw:9,pal:'lance',mark:'ally',cy:-1,cl:.1,pr:9.5,noseLen:.17},
  fox:{len:42,span:56,chord:15,tip:10,sweep:1,fw:12,pal:'fox',mark:'ally',cy:-3,cl:.12,pr:10.5},
  bear:{len:52,span:70,chord:15,tip:9,sweep:1.5,fw:14,eng:[-18,18],nw:.95,nl:28,pal:'bear',mark:'ally',cy:-12,cl:.1,pr:10},
  bolt:{len:50,span:42,chord:17,tip:5,sweep:12,fw:8,pal:'bolt',mark:'ally',jet:1,cy:-7,cl:.12},
  fire:{len:200,span:300,chord:58,tip:22,sweep:28,fw:40,eng:[-52,-98,52,98],nw:.6,nl:64,pal:'fire',mark:'enemy',pr:18,tail:{span:110,chord:30,y:66},cy:-58,cl:.07},
  fighter:{len:34,span:42,chord:10,tip:6,sweep:2,fw:8,pal:'en',mark:'enemy',pr:8},
  red:{len:34,span:42,chord:10,tip:6,sweep:2,fw:8,pal:'red',mark:'enemy',pr:8},
  dart:{len:38,span:30,chord:16,tip:4,sweep:12,fw:7,pal:'jet',mark:'enemy',jet:1,cy:-9},
  gunship:{len:70,span:106,chord:20,tip:11,sweep:3,fw:14,eng:[-28,28],nw:.95,nl:34,pal:'gun',mark:'enemy',pr:12,tail:{span:42,chord:12,y:24}},
  heavy:{len:118,span:196,chord:30,tip:16,sweep:5,fw:22,eng:[-38,-74,38,74],nw:.7,nl:42,pal:'heavy',mark:'enemy',pr:13,tail:{span:72,chord:18,y:40}},

function poly(g,x,y,r,n){g.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU+Math.PI/n;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();}
function tankSprite(c1,c2,c3){return mk(28,36,g=>{g.translate(14,18);
  g.fillStyle='rgba(0,0,0,.35)';rr(g,-12,-15,27,34,3);g.fill();
  for(const s of[-1,1]){g.fillStyle='#22241f';rr(g,s*9-4,-17,8,34,2);g.fill();g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=.6;for(let y=-15;y<17;y+=3){g.beginPath();g.moveTo(s*9-3.5,y);g.lineTo(s*9+3.5,y);g.stroke();}}
  g.fillStyle=lg(g,-8,0,8,0,[[0,c2],[.35,c1],[1,c3]]);rr(g,-7.5,-14,15,28,3);g.fill();g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=.8;g.stroke();
  g.fillStyle='rgba(0,0,0,.28)';for(let i=0;i<3;i++)g.fillRect(-5,7+i*2.2,10,1);
  g.fillStyle='rgba(255,255,255,.2)';g.fillRect(-6.5,-13,1,26);});}
function turretBase(r,c1,c2){return mk(r*2+8,r*2+8,g=>{const c=r+4;g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(c+1.5,c+2,r,0,TAU);g.fill();
  g.fillStyle=rg(g,c,c,-r*.35,-r*.35,r*.1,r,[[0,'#eef1f4'],[.35,c1],[1,c2]]);g.beginPath();g.arc(c,c,r,0,TAU);g.fill();g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1;g.stroke();
  g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.arc(c,c,r*.72,0,TAU);g.stroke();g.fillStyle='rgba(0,0,0,.35)';
  for(let i=0;i<8;i++){const a=i/8*TAU;g.beginPath();g.arc(c+Math.cos(a)*r*.86,c+Math.sin(a)*r*.86,.7,0,TAU);g.fill();}});}
function barrel(len,w,dbl){return mk(len*2+2,w*3+4,g=>{const cy=(w*3+4)/2;const one=y=>{g.fillStyle=lg(g,0,y-w/2,0,y+w/2,[[0,'#d3d8dd'],[.4,'#7d858d'],[1,'#2a3036']]);g.fillRect(len+1,y-w/2,len-1,w);g.fillStyle='#1d2227';g.fillRect(len*2-2.2,y-w/2-.4,2.2,w+.8);};
  if(dbl){one(cy-w*.75);one(cy+w*.75);}else one(cy);
  g.fillStyle=rg(g,len+1,cy,-1.5,-1.5,.3,w*1.4,[[0,'#f2f4f6'],[.5,'#8a9198'],[1,'#3a4046']]);g.beginPath();g.arc(len+1,cy,w*1.3,0,TAU);g.fill();},3);}
function shipHull(w,l){const p=new Path2D();p.moveTo(0,-l/2);p.bezierCurveTo(w*.55,-l*.32,w/2,-l*.1,w/2,l*.1);p.lineTo(w/2*.88,l/2);p.lineTo(-w/2*.88,l/2);p.lineTo(-w/2,l*.1);p.bezierCurveTo(-w/2,-l*.1,-w*.55,-l*.32,0,-l/2);p.closePath();return p;}
function paintShip(g,w,l,o){
  const hull=shipHull(w,l);g.strokeStyle='rgba(4,10,16,.55)';g.lineWidth=3;g.stroke(hull);
  g.fillStyle=lg(g,-w/2,0,w/2,0,[[0,o.h3],[.28,o.h1],[.6,o.h2],[1,o.h3]]);g.fill(hull);
  g.save();g.scale(.84,.95);g.fillStyle=lg(g,0,-l/2,0,l/2,[[0,o.d1],[1,o.d2]]);g.fill(hull);g.restore();
  g.save();g.clip(hull);g.strokeStyle='rgba(0,0,0,.1)';g.lineWidth=.5;for(let x=-w/2;x<w/2;x+=2.6){g.beginPath();g.moveTo(x,-l/2);g.lineTo(x,l/2);g.stroke();}g.restore();
  g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=.8;g.save();g.scale(.84,.95);g.stroke(hull);g.restore();
  for(const b of o.blocks)block(g,b[0],b[1],b[2],b[3],o.s1,o.s2);
  for(const f of o.funnels||[]){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(f[0]+2*SO(),f[1]+3*SO(),f[2],f[2]*1.3,0,0,TAU);g.fill();
    g.fillStyle=rg(g,f[0],f[1],-f[2]*.3,-f[2]*.3,.2,f[2]*1.3,[[0,'#8b9299'],[1,'#30363c']]);g.beginPath();g.ellipse(f[0],f[1],f[2],f[2]*1.3,0,0,TAU);g.fill();
    g.fillStyle='#14181c';g.beginPath();g.ellipse(f[0],f[1],f[2]*.6,f[2]*.85,0,0,TAU);g.fill();}
}
function block(g,x,y,w,h,c1,c2){const so=SO();g.fillStyle='rgba(0,0,0,.35)';rr(g,x-w/2+3*so,y-h/2+4*so,w,h,2);g.fill();
  g.fillStyle=lg(g,x-w/2,y-h/2,x+w/2,y+h/2,[[0,c1],[1,c2]]);rr(g,x-w/2,y-h/2,w,h,2);g.fill();
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=.6;g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();if(so>0){g.moveTo(x-w/2+1,y+h/2-1);g.lineTo(x-w/2+1,y-h/2+1);g.lineTo(x+w/2-1,y-h/2+1);}else{g.moveTo(x+w/2-1,y-h/2+1);g.lineTo(x+w/2-1,y+h/2-1);g.lineTo(x-w/2+1,y+h/2-1);}g.stroke();}
function shipSprite(w,l,o){return mk(w+8,l+8,g=>{g.translate((w+8)/2,(l+8)/2);paintShip(g,w,l,o);});}

function goFull(){try{const d=document.documentElement;if(IS_TOUCH&&!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});}catch(e){}}
function onTap(x,y,e){
  if(inC(x,y,BTN.mute)&&(G.state==='play'||G.state==='over')){setMute(!AU.muted);return;}
  switch(G.state){
    case'title':G.state='select';sfx('select');goFull();break;
    case'select':if(x<80&&y>160&&y<420){G.sel=(G.sel+PLANES.length-1)%PLANES.length;sfx('select');}else if(x>W-80&&y>160&&y<420){G.sel=(G.sel+1)%PLANES.length;sfx('select');}
      else if(y>H-170&&y<H-100&&Math.abs(x-W/2)<130)startGame();break;
    case'play':
      if(G.paused){if(Math.abs(x-W/2)<120){if(Math.abs(y-(H/2+10))<26)G.paused=false;else if(Math.abs(y-(H/2+70))<26)toTitle();}return;}
      if(inC(x,y,BTN.pause)){G.paused=true;G.menu=0;return;}
      if(touchUI&&inC(x,y,BTN.bomb)){useBomb();return;}
      if(touchUI&&inC(x,y,BTN.charge)){useCharge();return;}
      ptrs.set(e.pointerId,{x,y});break;
    case'over':if(G.phaseT>1&&Math.abs(x-W/2)<120){if(Math.abs(y-(H/2+40))<26)continueGame();else if(Math.abs(y-(H/2+100))<26)toTitle();}break;

  }}

function updPlay(dt){
  G.stageT+=dt;G.phaseT+=dt;
  for(const p of PEND)p.t-=dt;const due=PEND.filter(p=>p.t<=0);PEND=PEND.filter(p=>p.t>0);for(const p of due)p.fn();
  switch(G.phase){
    case'intro':if(G.phaseT>2.6){G.phase='waves';G.phaseT=0;}break;
    case'waves':
      G.waveT-=dt;if(G.waveT<=0&&G.stageT<STAGE_LEN-4){formation(pick(CUR.waves));G.waveT=CUR.gap*rnd(.85,1.15);}
      if(CUR.mid&&!G.midDone&&G.stageT>CUR.mid){G.midDone=true;spawnHeavy();G.waveT=9;}
      if(CUR.carry&&G.carryI<CUR.carry.length&&G.stageT>CUR.carry[G.carryI]){G.carryI++;const x=rnd(90,W-90);spawnAir('red',x,-30,{mv:'hover',ty:rnd(120,170),stay:3.2,hov:1,fireT:2,carry:'P',hp:5});banner('보급기 출현!',x,90,'#ff9d7a');}

    case'clear':if(G.phaseT>5.5){if(G.stage>=STAGES.length-1)startEnding();else{startStage(G.stage+1);}}break;
  }

  gun:{hp:16,r:16,score:500},gunN:{hp:22,r:16,score:700},boat:{hp:12,r:16,score:600},destroyer:{hp:70,r:28,score:4000,big:2},

// ---------- 적 탄 ----------
function eShot(x,y,a,s,type){EB.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:type==='big'?7.5:3.6,type:type||'orb',t:0});}

function enemyFire(e,dt){if(!P||P.dead>0||e.y<16||e.y>H*.74||e.x<0||e.x>W)return;e.fireT-=dt;if(e.fireT>0)return;const d=G.stage,b=BS(),x=e.x,y=e.y;

    case'dart':e.fireT=99;eShot(x,y,angTo(x,y),200*b,'needle');break;
    case'gunship':e.fireT=1.6-d*.08;fan(x,y+16,5,.2,150*b,undefined,'orb2');if(d>=3)ring(x,y,10,120*b,rnd(TAU),'orb');break;
    case'heavy':e.c=(e.c||0)+1;if(e.c%3===0){ring(x,y,18+d*2,130*b,e.c*.2,'orb3');e.fireT=1.2;}else if(e.c%3===1){fan(x,y+30,7,.16,165*b,undefined,'orb2');e.fireT=1;}else{for(const s of[-1,1])fan(x+s*56,y,3,.18,180*b);e.fireT=1.3;}break;
    case'tank':case'tankW':case'tankD':case'tankS':e.fireT=rnd(1.9,2.7)-d*.15;eShot(x,y,angTo(x,y),165*b,'needle');break;
    case'gun':case'gunN':e.c=(e.c||0)+1;if(e.c%4){e.fireT=.16;eShot(x,y,angTo(x,y),190*b,'orb2');}else e.fireT=2.2-d*.15;break;
    case'boat':e.fireT=2.3;fan(x,y,2,.12,160*b);break;
    case'destroyer':e.c=(e.c||0)+1;if(e.c%3===0){ring(x,y,12,120*b,rnd(TAU),'orb2');e.fireT=1.6;}else{for(const oy of[-40,38])eShot(x,y+oy,angTo(x,y+oy),175*b);e.fireT=1;}break;
  }}

// ---------- 플레이어 사격 ----------
function pShot(x,y,a,s,dmg,spr,o){PB.push(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,dmg,spr,rot:a+Math.PI/2,r:6},o||{}));}
const UP=-Math.PI/2,DG=Math.PI/180;
function fireMain(){const pw=G.power,x=P.x,y=P.y-18,t=PLANES[P.type].shot;
  if(t==='spread'){P.fireT=.075;const sp=880;
    const lanes=[[[-5,0],[5,0]],[[-5,0],[5,0],[-9,-9],[9,9]],[[-5,0],[5,0],[-9,-10],[9,10],[-12,-20],[12,20]],[[-4,0],[4,0],[-12,0],[12,0],[-10,-10],[10,10],[-14,-20],[14,20]]][pw-1];
    for(const l of lanes)pShot(x+l[0],y,UP+l[1]*DG,sp,1,S.pbGold);}
  else if(t==='lance'){P.fireT=.085;const sp=1150;
    const lanes=[[[0,0]],[[-6,0],[6,0]],[[-10,0],[0,0],[10,0]],[[-10,0],[0,0],[10,0],[-16,-6],[16,6]]][pw-1];
    for(const l of lanes)pShot(x+l[0],y-4,UP+l[1]*DG,sp,pw===1?2.6:2.3,S.pbBlue,{r:8});}
  else if(t==='wide'){P.fireT=.11;const n=[5,7,9,11][pw-1],arc=[36,46,56,66][pw-1]*DG;
    for(let i=0;i<n;i++){const a=UP+(i/(n-1)-.5)*arc;pShot(x+Math.cos(a+Math.PI/2)*6,y,a,760,1.9,S.pbAmber,{r:7,life:.62});}}
  else if(t==='laser'){P.fireT=.055;const lanes=[[-4,4],[-9,0,9],[-12,-4,4,12],[-15,-7,0,7,15]][pw-1];
    for(const l of lanes)pShot(x+l,y-6,UP,1400,.78,S.pbLaser,{r:6,pierce:new Set()});}
  else{P.fireT=.09;const sp=900;const lanes=pw>=4?[-8,0,8]:[-5,5];for(const l of lanes)pShot(x+l,y,UP,sp,1.25,S.pbRed);
    P.misT-=.09;if(pw>=2&&P.misT<=0){P.misT=.62;const n=[0,2,2,4][pw-1];for(let i=0;i<n;i++){const s=i%2?1:-1,k=(i>>1)+1;PB.push({x:x+s*10*k,y:y+14,vx:s*(90+k*30),vy:60,dmg:2,spr:S.missile,rot:0,r:6,hom:1,sp:120,ang:UP+s*.9});}}}
  if(pw>=3){for(const w of P.wing)pShot(w.x,w.y-10,UP,900,.9,S.pbWing,{r:5});}
  sfx('shot');}
function useBomb(){if(G.state!=='play'||G.paused||!P||P.dead>0||P.enter>0||G.bombs<=0||bombFx)return;G.bombs--;const t=PLANES[P.type].shot;sfx('bomb');G.shake=10;G.flash=.6;
  clearBullets(true);P.inv=Math.max(P.inv,t==='missile'?5:2.4);
  if(t==='spread'){bombFx={k:'carpet',t:0,dur:2.2,dropT:0,planes:[{x:W*.2,y:H+80},{x:W*.5,y:H+140},{x:W*.8,y:H+80}]};}
  else if(t==='lance'){bombFx={k:'flash',t:0,dur:1.1,x:P.x,y:P.y,hitSet:new Set()};G.flash=1;}
  else if(t==='wide'){bombFx={k:'storm',t:0,dur:2.2,y0:P.y+40,hitSet:new Set()};}
  else if(t==='laser'){bombFx={k:'thunder',t:0,dur:2.3,ft:0,bolts:[]};G.flash=.4;}
  else{bombFx={k:'barrier',t:0,dur:4.5};damageAll(30);}
}
function useCharge(){if(G.state!=='play'||G.paused||!P||P.dead>0||P.enter>0||G.charge<100||chargeFx)return;G.charge=0;G.readyPlayed=false;sfx('charge');const t=PLANES[P.type].shot;
  if(t==='spread')chargeFx={k:'volley',t:0,dur:1.1,ft:0,n:0};
  else if(t==='lance'){chargeFx={k:'beam',t:0,dur:1.7};sfx('laser');}
  else if(t==='wide'){chargeFx={k:'burst',t:0,dur:.45,ft:0,n:0};}
  else if(t==='laser'){const tg=[];const cand=[...E.filter(e=>!e.dead&&e.y>0&&e.y<H)];
    const B=G.boss;if(B&&!B.entering&&!B.dying&&!B.gone){const arm=B.parts.some(q=>q.k==='armor'&&q.alive);for(const p of B.parts)if(p.alive&&!(p.k==='core'&&p.shield&&arm))cand.push({part:p,x:B.x+p.x,y:B.y+p.y});}
    let cx=P.x,cy=P.y;const pts=[[cx,cy]];for(let k=0;k<10&&cand.length;k++){let bi=0,bd=1e12;cand.forEach((c,i)=>{const d=d2(cx,cy,c.x,c.y);if(d<bd){bd=d;bi=i;}});const c=cand.splice(bi,1)[0];

    if(pts.length<2)pts.push([P.x,-20]);chargeFx={k:'chain',t:0,dur:.7,pts};}
  else{chargeFx={k:'swarm',t:0,dur:.6};for(let i=0;i<16;i++){const s=i%2?1:-1,k=i>>1;PB.push({x:P.x+s*(8+k*4),y:P.y,vx:s*(120+k*40),vy:120-k*20,dmg:6,spr:S.missileBig,rot:0,r:9,hom:1,sp:160,ang:UP+s*(.5+k*.18),big:1});}}
  banner(['번개 연사!','천공창!','여우불!','산탄 폭풍!','번개 사슬!'][P.type],P.x,P.y-50,PLANES[P.type].col);
}
function clearBullets(score){for(const b of EB){if(score){FXA.push({k:'g',spr:S.gold,x:b.x,y:b.y,life:0,max:.4,s:.25,s1:.05});}}if(score)addScore(EB.length*10);EB=[];}

// ---------- 효과(파티클) ----------
function explode(x,y,size,ground){size=size||1;const n=size;
  FXA.push({k:'g',spr:S.white,x,y,life:0,max:.18+n*.04,s:.8+n*.7,s1:1.4+n*1.2,gr:ground});

  for(let i=0;i<2+n*2;i++){const a=rnd(TAU);FX.push({k:'smoke',x:x+rnd(-6,6)*n,y:y+rnd(-6,6)*n,vx:Math.cos(a)*rnd(10,30),vy:Math.sin(a)*rnd(10,30)-10,life:-rnd(.15),max:rnd(.9,1.6),s:.3+n*.15,s1:.9+n*.4,a:.55,rot:rnd(TAU),gr:ground});}
  for(let i=0;i<5+n*5;i++){const a=rnd(TAU),s=rnd(140,380)*(.7+n*.2);FXA.push({k:'sp',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rnd(.25,.55),gr:ground});}
  if(n>=2)FXA.push({k:'ring',x,y,life:0,max:.45,r0:6,r1:30+n*22,gr:ground});
  for(let i=0;i<n*2;i++){const a=rnd(TAU),s=rnd(60,160);FX.push({k:'deb',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rnd(.5,.9),rot:rnd(TAU),vr:rnd(-12,12),sz:rnd(2,4)});}
  if(ground)DEC.push({x,y,r:rnd(TAU),s:.5+n*.35});
  G.shake=Math.max(G.shake,n*2.2);sfx(n>=3?'boomL':n>=2?'boom':'boomS');}
function spark(x,y,col){FXA.push({k:'g',spr:col||S.spark,x,y,life:0,max:.12,s:.22,s1:.4});}
function updFX(dt){const sp=G.spd;
  for(const f of FX){f.life+=dt;if(f.life<0)continue;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt+(f.gr?sp*dt:sp*.35*dt);if(f.vx){f.vx*=1-dt*1.8;f.vy*=1-dt*1.8;}if(f.vr)f.rot+=f.vr*dt;}
  for(const f of FXA){f.life+=dt;if(f.life<0)continue;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt+(f.gr?sp*dt:0);if(f.k==='sp'){f.vx*=1-dt*3;f.vy*=1-dt*3;}else if(f.vx){f.vx*=1-dt*2;f.vy*=1-dt*2;}}
  FX=FX.filter(f=>f.life<f.max);FXA=FXA.filter(f=>f.life<f.max);
  for(const d of DEC)d.y+=sp*dt;DEC=DEC.filter(d=>d.y<H+60);
  for(const t of TXT){t.t+=dt;t.y-=dt*(t.big?10:34);}TXT=TXT.filter(t=>t.t<t.max);
  if(FX.length>420)FX.splice(0,FX.length-420);if(FXA.length>700)FXA.splice(0,FXA.length-700);}

    case'hover':if(e.t<e.stay){e.y+=(e.ty-e.y)*Math.min(1,dt*1.6);if(e.sway)e.x=W/2+Math.sin(e.t*.5)*90;}else{e.vy=(e.vy||0)+dt*140;e.y+=e.vy*dt;}break;

  }

  if(G.state==='select'){drawSelect();return;}
  drawTexts();drawBanner();drawHUD();
  if(G.state==='play'&&G.paused)drawPause();
  if(G.state==='over')drawOver();
}
// 휴대폰·태블릿을 가로로 들면 세로로 돌려 달라고 안내한다 (게임은 그대로 멈춤)
// 휴대폰만 해당: 손가락 입력이 주(coarse)이고 가로로 누운 낮은 화면. 터치 노트북·전자칠판은 그대로 세로 비율로 띄운다
const LS_MQ=matchMedia('(orientation:landscape) and (pointer:coarse) and (max-height:540px)');
function landscapeTouch(){return LS_MQ.matches;}

// ---------- 외부 그림 교체 (제미나이 등) ----------
// art/manifest.json 에 ["hawk","fighter","boss0", ...] 처럼 적고 art/<이름>.png 를 넣으면
// 코드로 그린 그림 대신 그 그림을 쓴다. 그림은 모두 「기수가 위를 향한」 위에서 본 모습, 투명 배경.
const BOSS_KEYS=['seadragon','ironwall','sandstone','blackwing','colossus','flamedrake','citadel'];
const ART_FLIP={fighter:1,red:1,dart:1,gunship:1,heavy:1};BOSS_KEYS.forEach(k=>ART_FLIP[k]=1);
async function loadArt(){let list;try{const r=await fetch('art/manifest.json',{cache:'no-cache'});if(!r.ok)return;list=await r.json();}catch(e){return;}
  if(!Array.isArray(list))return;
  await Promise.all(list.map(k=>new Promise(res=>{const img=new Image();img.onload=()=>{try{applyArt(k,img);}catch(e){console.warn('art',k,e);}res();};img.onerror=res;img.src='art/'+encodeURIComponent(k)+'.png';})));}
function applyArt(k,img){const isBoss=BOSS_KEYS.includes(k);const base=isBoss?bossSprite(k):S[k];if(!base)return;
  const w=base.w,h=base.h,sc=Math.min(w/img.width,h/img.height);
  const c=mk(w,h,g=>{g.translate(w/2,h/2);if(ART_FLIP[k])g.rotate(Math.PI);const iw=img.width*sc,ih=img.height*sc;g.drawImage(img,-iw/2,-ih/2,iw,ih);},isBoss||k==='heavy'||k==='bomber'?2:SPR);
  c.props=[];c.jets=[];c.pr=base.pr;c.o=base.o;c.dir=base.dir;c.sh=silhouette(c);c.wh=silhouette(c,'#fff');S[k]=c;}

// ---------- 시작 ----------
async function boot(){
  requestAnimationFrame(frame);
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);await Promise.race([Promise.all(['76px "Black Han Sans"','700 20px "Chakra Petch"','600 20px "Chakra Petch"','700 14px "Gothic A1"'].map(f=>document.fonts.load(f,'창공AZ1'))),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  buildSprites();buildLogo();await loadArt();CUR=STAGES[0];buildStageAssets(CUR);initSegments();G.state='title';music('title');
  const m=location.hash.match(/stage(\d)/);if(m){G.sel=0;startGame();const n=clamp(+m[1]-1,0,STAGES.length-1);if(n>0)startStage(n);}}
boot();
</script>
