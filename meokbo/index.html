<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물감 먹보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1FF; --surface:#FFFFFF; --surface2:#F4F2FF; --ink:#2D3050; --ink2:#6A6E92; --line:#DADCF2;
  --accent:#7A69DE; --accentInk:#FFFFFF; --gold:#F2B33D; --warn:#E8667A; --stone:#CFC8BA; --stone2:#968E80;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D33; --surface:#25284A; --surface2:#2E3157; --ink:#EEF0FF; --ink2:#A8ACD2; --line:#3B3F68;
    --accent:#A99BFF; --accentInk:#1B1D33; --gold:#FFCB5C; --warn:#FF8C9C; --stone:#77705F; --stone2:#555045; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D33; --surface:#25284A; --surface2:#2E3157; --ink:#EEF0FF; --ink2:#A8ACD2; --line:#3B3F68;
  --accent:#A99BFF; --accentInk:#1B1D33; --gold:#FFCB5C; --warn:#FF8C9C; --stone:#77705F; --stone2:#555045; color-scheme:dark;
}
[hidden]{display:none !important;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  word-break:keep-all;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
.jua{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
button{font:inherit;color:inherit;}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* 시작 화면 */
#menu{padding:20px 20px 18px;overflow-y:auto;}
.hero{display:flex;align-items:center;gap:16px;margin-top:10px;}
.toy{display:grid;grid-template-columns:repeat(3,18px);gap:3px;}
.toy i{width:18px;height:18px;border-radius:5px;display:block;}
.title{font-size:2.8rem;line-height:1.1;margin:0;}
.sub{color:var(--ink2);margin:14px 0 22px;line-height:1.6;}
.label{font-size:1.05rem;margin:0 0 10px;color:var(--ink2);}
.sec{margin-top:26px;}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.stg{border:none;border-radius:18px;background:var(--surface);aspect-ratio:.82;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s;}
.stg:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.stg .e{font-size:1.45rem;line-height:1;}
.stg .n{font-size:1.15rem;line-height:1;}
.stg .s{font-size:.72rem;color:var(--gold);letter-spacing:-1px;}
.stg[disabled],.stg.locked{opacity:.45;box-shadow:none;}
.stg .n.big{font-size:1.55rem;}
.chhead{display:flex;justify-content:space-between;align-items:baseline;}
.total{color:var(--gold);font-size:1.05rem;}
.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
.ch{border:none;border-radius:14px;background:var(--surface);padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:.82rem;color:var(--ink2);}
.ch .e{font-size:1.35rem;line-height:1;}
.ch[aria-pressed="true"]{outline:2.5px solid var(--accent);color:var(--ink);}
.ch.locked{opacity:.5;}
.chinfo{margin:2px 0 10px;color:var(--ink2);font-size:.93rem;line-height:1.5;}
.endless.locked{opacity:.5;}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:1rem;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s;}
.endless{margin-top:16px;width:100%;border:none;border-radius:18px;padding:16px;background:var(--accent);color:var(--accentInk);font-size:1.25rem;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);}
.endless:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000);}
.best{text-align:center;color:var(--ink2);margin:12px 0 0;font-size:.95rem;}
.vsbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.vsb{border:none;border-radius:16px;background:var(--surface);padding:12px 4px;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--line);line-height:1.35;}
.vsb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.hats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.hatb{border:none;border-radius:14px;background:var(--surface);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:.75rem;color:var(--ink2);}
.hatb .e{font-size:1.4rem;line-height:1.1;}
.hatb[aria-pressed="true"]{outline:2.5px solid var(--accent);color:var(--ink);}
.hatb.locked{opacity:.5;}
.menu-foot{margin-top:auto;padding-top:22px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.ghost{border:none;background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink2);}

/* 게임 화면 */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;}
.pill{background:var(--surface);border-radius:999px;padding:7px 13px;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.spacer{flex:1;}
.iconbtn{border:none;background:var(--surface);border-radius:999px;min-width:40px;height:38px;padding:0 12px;cursor:pointer;font-size:.95rem;flex:none;}
.iconbtn.off{opacity:.4;}
.movebox{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 18px 6px;min-height:58px;}
.moves{display:flex;align-items:baseline;gap:8px;}
.moves b{font-size:2.6rem;line-height:1;font-weight:400;transition:color .2s;}
.moves span{color:var(--ink2);}
.moves.low b{color:var(--warn);animation:beat .9s ease-in-out infinite;}
@keyframes beat{50%{transform:scale(1.12);}}
.goal{color:var(--ink2);font-size:.92rem;text-align:right;line-height:1.5;}
.goal em{font-style:normal;color:var(--gold);}
.vsbox{flex:1;display:flex;gap:8px;}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:16px;padding:7px 11px;font-size:1rem;border:3px solid transparent;transition:border-color .2s;}
.chip i{width:18px;height:18px;border-radius:6px;display:block;flex:none;transition:background-color .24s;}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip b{font-size:1.6rem;font-weight:400;margin-left:auto;line-height:1;}
.chip.on{border-color:var(--accent);}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;}
.boardwrap{position:relative;width:min(100%, calc(100vh - 340px));width:min(100%, calc(100dvh - 340px));min-width:220px;aspect-ratio:1;}
.board{display:grid;gap:3px;width:100%;height:100%;padding:6px;border-radius:22px;background:var(--surface);}
.c{position:relative;border-radius:24%;transition:background-color .24s ease,transform .2s ease;}
.c.puff{transform:scale(1.2);z-index:3;}
.c.gulp .face u{animation:chew .26s ease-in-out 3;}
@keyframes chew{50%{height:30%;top:50%;border-radius:50%;border-top:2.5px solid rgba(60,45,95,.85);background:rgba(60,45,95,.85);}}
.face s{position:absolute;top:50%;width:20%;height:18%;border-radius:50%;background:rgba(255,120,150,.6);opacity:0;transform:scale(.3);transition:opacity .2s,transform .2s;}
.face s:nth-of-type(1){left:4%;} .face s:nth-of-type(2){right:4%;}
.c.puff .face s{opacity:1;transform:scale(1);}
.c.peek{animation:peek .7s ease-in-out infinite;box-shadow:inset 0 0 0 3px #fff;}
@keyframes peek{50%{transform:scale(.86);filter:brightness(1.12);}}
.c.rainbow{animation:rainbow .9s ease both;}
@keyframes rainbow{0%{filter:none;transform:none;}30%{filter:hue-rotate(130deg) saturate(1.3);transform:translateY(-18%) scale(1.1);}65%{filter:hue-rotate(260deg);transform:translateY(0) scale(1);}100%{filter:none;transform:none;}}
.boardwrap.shake{animation:shk .36s ease;}
@keyframes shk{20%{transform:translate(-5px,2px);}40%{transform:translate(5px,-2px);}60%{transform:translate(-3px,1px);}80%{transform:translate(2px,-1px);}}
.float.big{font-size:2.2rem;}
.peektip{position:absolute;right:0;top:-36px;z-index:7;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:.95rem;white-space:nowrap;pointer-events:none;}
.c svg.sh{position:absolute;left:30%;top:30%;width:40%;height:40%;opacity:.22;pointer-events:none;}
.c:has(.face) svg.sh,.c:has(.bn) svg.sh{display:none;}
.c.mine{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);}
.c.theirs{box-shadow:inset 0 0 0 3px rgba(45,48,80,.5);}
.c.wall{background:radial-gradient(circle at 32% 28%,var(--stone) 0 18%,transparent 19%),var(--stone2) !important;border-radius:38%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);}
.c.wild{background:conic-gradient(#FFB3A0,#FFDA7A,#7FD8B8,#8CC8F4,#B8A6F4,#F6A6C8,#FFB3A0) !important;}
.c.wild svg.sh{opacity:.55;}
.c.ice::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,0) 0 6px,rgba(255,255,255,.5) 6px 8px),linear-gradient(135deg,rgba(255,255,255,.5),rgba(225,242,255,.15) 50%,rgba(255,255,255,.4));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.95);}
.c.ice svg.sh{opacity:.4;}
.c.thaw{animation:thaw .5s ease both;}
@keyframes thaw{0%{transform:scale(.78);filter:brightness(1.5);}100%{transform:none;filter:none;}}
.c .bn{position:absolute;left:15%;top:15%;width:70%;height:70%;pointer-events:none;z-index:1;}
.c.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.2);}100%{transform:scale(1);}}
.face{position:absolute;inset:0;z-index:2;pointer-events:none;}
.face i{position:absolute;top:36%;width:13%;height:13%;border-radius:50%;background:rgba(60,45,95,.85);}
.face i:nth-child(1){left:28%;} .face i:nth-child(2){right:28%;}
.face u{position:absolute;left:34%;width:32%;top:56%;height:16%;border:2.5px solid rgba(60,45,95,.85);border-top:none;border-radius:0 0 999px 999px;}
.face.happy i{height:6%;top:40%;border-radius:999px 999px 0 0;}
.face.happy u{background:rgba(60,45,95,.85);height:20%;}
.face.worry u{border:2.5px solid rgba(60,45,95,.85);border-bottom:none;border-radius:999px 999px 0 0;top:62%;height:12%;}
.face.p2 i{background:#fff;border:2.5px solid rgba(60,45,95,.85);width:17%;height:17%;top:32%;}
.face.p2.happy i{height:8%;top:40%;background:rgba(60,45,95,.85);}
.face .hat{position:absolute;left:50%;top:-40%;transform:translateX(-50%) rotate(-8deg);line-height:1;font-style:normal;font-weight:400;z-index:4;}
.float{position:absolute;z-index:5;font-size:1.5rem;color:#fff;pointer-events:none;
  text-shadow:-2px 0 0 #6A5ACD,2px 0 0 #6A5ACD,0 -2px 0 #6A5ACD,0 2px 0 #6A5ACD,0 4px 0 rgba(70,60,140,.45);animation:rise .9s ease-out forwards;}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8);}to{opacity:0;transform:translate(-50%,-46px) scale(1.15);}}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(60,55,120,.82);color:#fff;
  border-radius:22px;padding:14px 22px;text-align:center;width:max-content;max-width:92%;pointer-events:none;transition:opacity .4s;}
.banner b{display:block;font-size:1.5rem;font-weight:400;margin-bottom:4px;}
.banner span{font-size:1rem;opacity:.92;}
.banner.hide{opacity:0;}
.swatches{display:grid;gap:8px;padding:8px 14px 6px;}
.sw{-webkit-touch-callout:none;touch-action:manipulation;border:none;border-radius:16px;aspect-ratio:1.15;cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .08s,opacity .2s;}
.sw svg{position:absolute;left:34%;top:30%;width:32%;height:40%;opacity:.35;}
.sw:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.12);}
.sw[aria-disabled="true"]{opacity:.35;cursor:default;box-shadow:none;}
.sw.hint{animation:wig .5s ease-in-out 4;outline:3px solid var(--ink);outline-offset:2px;}
.sw.guide{outline:3px solid var(--ink);outline-offset:2px;}
.sw.guide::after{content:"👆";position:absolute;left:50%;bottom:-14px;font-size:1.9rem;line-height:1;animation:tap .9s ease-in-out infinite;}
@keyframes tap{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-10px);}}
@keyframes wig{25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
.bar{display:flex;gap:8px;justify-content:center;padding:6px 14px 12px;}
.bar .iconbtn{height:40px;padding:0 16px;}
.result{position:absolute;inset:-4px;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.result h2{font-size:2.3rem;margin:0;}
.result .stars{font-size:2.2rem;letter-spacing:6px;color:var(--gold);min-height:1.1em;}
.result p{margin:0 0 6px;color:var(--ink2);line-height:1.5;}
.rbtns{display:flex;flex-direction:column;gap:8px;width:min(230px,100%);}
.rbtn{border:none;border-radius:16px;padding:12px;font-size:1.08rem;cursor:pointer;background:var(--surface2);}
.rbtn.primary{background:var(--accent);color:var(--accentInk);}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="app">

  <section class="screen" id="menu">
    <div class="hero">
      <div class="toy" aria-hidden="true">
        <i style="background:#7FD8B8"></i><i style="background:#7FD8B8"></i><i style="background:#FFDA7A"></i>
        <i style="background:#7FD8B8"></i><i style="background:#B8A6F4"></i><i style="background:#FFB3A0"></i>
        <i style="background:#8CC8F4"></i><i style="background:#F6A6C8"></i><i style="background:#FFDA7A"></i>
      </div>
      <h1 class="title jua">물감 먹보</h1>
    </div>
    <p class="sub">색을 고르면 친구가 붙어 있는 같은 색 칸을 꿀꺽 삼켜요. 정해진 횟수 안에 판 전체를 한 가지 색으로 만들면 성공!</p>
    <div class="chhead"><p class="label jua">마당 고르기</p><span class="total jua" id="total"></span></div>
    <div class="chapters" id="chapters"></div>
    <p class="chinfo" id="chinfo"></p>
    <div class="stages" id="stages"></div>
    <button class="endless jua" id="goEndless">연속 도전</button>
    <p class="best" id="best"></p>

    <p class="label jua sec">둘이 맞붙기</p>
    <p class="chinfo">번갈아 색을 골라 땅을 더 많이 차지하면 이겨요. 상대가 지금 쓰는 색은 고를 수 없어요.</p>
    <div class="vsbtns">
      <button class="vsb jua" data-ai="0">👫<br>친구랑</button>
      <button class="vsb jua" data-ai="1">🤖<br>컴퓨터 · 쉬움</button>
      <button class="vsb jua" data-ai="2">🤖<br>컴퓨터 · 보통</button>
    </div>

    <p class="label jua sec">친구 꾸미기</p>
    <div class="hats" id="hats"></div>

    <div class="menu-foot"><button class="ghost" id="muteM"></button><button class="ghost" id="musicM"></button></div>
  </section>
  <div class="toast jua" id="toast" hidden></div>

  <section class="screen" id="game" hidden>
    <div class="hud">
      <span class="pill jua" id="hudStage"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="musicG" aria-label="음악 켜고 끄기">🎵</button>
      <button class="iconbtn" id="muteG" aria-label="소리 켜고 끄기"></button>
      <button class="iconbtn jua" id="quit">그만</button>
    </div>
    <div class="movebox">
      <div class="moves jua" id="movesBox"><b id="left">0</b><span>번 남았어요</span></div>
      <div class="goal" id="goal"></div>
      <div class="vsbox" id="vsBox" hidden aria-live="polite">
        <div class="chip jua" id="sc1"><i></i><span></span><b></b></div>
        <div class="chip jua" id="sc2"><i></i><span></span><b></b></div>
      </div>
    </div>
    <div class="stage">
      <div class="boardwrap" id="boardwrap">
        <div class="board" id="board"></div>
        <div class="peektip jua" id="peekTip" hidden></div>
        <div class="banner jua hide" id="banner"><b></b><span></span></div>
        <div class="result" id="res" hidden>
          <h2 class="jua" id="resTitle"></h2>
          <div class="stars" id="resStars"></div>
          <p id="resMsg"></p>
          <div class="rbtns" id="resBtns"></div>
        </div>
      </div>
    </div>
    <div class="swatches" id="swatches"></div>
    <div class="bar" id="bar">
      <button class="iconbtn jua" id="hintBtn"></button>
      <button class="iconbtn jua" id="retry">같은 판 처음부터</button>
    </div>
  </section>

</div>
<script>
const $ = s => document.querySelector(s);
const WALL = -1, WILD = 9, ICE = 10;
const FORCE_MUTE = /[?&]mute=1\b/.test(location.search);
const COLS = ['#FFB3A0', '#FFDA7A', '#7FD8B8', '#8CC8F4', '#B8A6F4', '#F6A6C8'];
const NAMES = ['살구색', '노란색', '민트색', '하늘색', '보라색', '분홍색'];
const SHAPES = [
  '<circle cx="12" cy="12" r="9"/>',
  '<path d="M12 3 22 20H2z"/>',
  '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/>',
  '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>',
  '<path d="M12 21s-8.5-5.3-8.5-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.8C20.5 15.7 12 21 12 21z"/>',
  '<path d="M12 2 22 12 12 22 2 12z"/>',
];
const shape = k => `<svg class="sh" viewBox="0 0 24 24" aria-hidden="true" fill="#2D3050">${SHAPES[k]}</svg>`;
const WILDSVG = '<svg class="sh" viewBox="0 0 24 24" aria-hidden="true" fill="#ffffff"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4z"/></svg>';
const BONUSSVG = '<svg class="bn" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#fff" fill-opacity=".92" stroke="#7A69DE" stroke-width="1.6"/><text x="12" y="16.6" text-anchor="middle" font-size="12.5" font-family="Jua, sans-serif" fill="#7A69DE">+1</text></svg>';
const HATS = [
  {e: '', name: '맨머리', need: 0}, {e: '🌼', name: '꽃', need: 10}, {e: '🎀', name: '리본', need: 30},
  {e: '👑', name: '왕관', need: 60}, {e: '🎩', name: '모자', need: 90}, {e: '🏆', name: '트로피', need: 130},
];

/* 같은 번호로 시작하면 늘 같은 판이 나오게 하는 난수 */
function rng(seed){
  let a = seed >>> 0;

/* ── 판 계산 ── */
const NBC = {};
function nbs(N){
  if(NBC[N]) return NBC[N];
  const a = [];
  for(let i = 0; i < N * N; i++){
    const r = Math.floor(i / N), c = i % N, o = [];
    if(r > 0) o.push(i - N); if(r < N - 1) o.push(i + N);
    if(c > 0) o.push(i - 1); if(c < N - 1) o.push(i + 1);
    a.push(o);
  }
  return NBC[N] = a;
}
/* 내 땅: 시작 칸과 이어진 같은 색·무지개 칸 (돌·얼음은 못 지나감) */
function region(b, N, o){
  const T = N * N, nb = nbs(N), seen = new Uint8Array(T), dist = new Uint16Array(T), q = [o], col = b[o]; seen[o] = 1;
  for(let h = 0; h < q.length; h++){
    const i = q[h];
    for(const j of nb[i]){ const v = b[j]; if(!seen[j] && (v === col || v === WILD)){ seen[j] = 1; dist[j] = dist[i] + 1; q.push(j); } }
  }
  return {seen, dist, size: q.length};
}
/* 색을 고른 뒤: 내 땅을 그 색으로 칠하고, 다른 색 물감이 닿은 얼음을 녹인다 */
function flood(b, N, o, c){
  const r = region(b, N, o).seen, n = b.slice();
  for(let i = 0; i < n.length; i++) if(r[i]) n[i] = c;
  if(n.some(v => v >= ICE)){
    const r2 = region(n, N, o).seen, nb = nbs(N);
    for(let i = 0; i < n.length; i++) if(n[i] >= ICE && n[i] - ICE !== c && nb[i].some(j => r2[j])) n[i] -= ICE;
  }
  return n;
}
const openCount = b => b.filter(x => x !== WALL).length;
function connected(b, N, o){
  const seen = new Uint8Array(N * N), q = [o], nb = nbs(N); seen[o] = 1;
  for(let h = 0; h < q.length; h++) for(const j of nb[q[h]]) if(!seen[j] && b[j] !== WALL){ seen[j] = 1; q.push(j); }
  return q.length === openCount(b);
}
function bestColor(b, N, o, K){
  let best = -1, bc = 0;
  for(let c = 0; c < K; c++){ if(c === b[o]) continue; const s = region(flood(b, N, o, c), N, o).size; if(s > best){ best = s; bc = c; } }
  return bc;
}
/* 매번 가장 많이 삼키는 색만 고르는 방법 (욕심쟁이) */
function greedy(b, N, o, K){
  const total = openCount(b); let n = 0;
  while(region(b, N, o).size < total && n < 120){ b = flood(b, N, o, bestColor(b, N, o, K)); n++; }
  return n;
}
/* 욕심쟁이가 동점 색 중 무엇을 골라도 되는 경우 가운데 가장 빨리·가장 늦게 끝나는 횟수 */
function greedyRange(b, N, o, K){
  const total = openCount(b); let level = [b], min = -1;
  for(let n = 0; n < 120; n++){
    const next = new Map();
    for(const s of level){
      if(region(s, N, o).size === total){ if(min < 0) min = n; continue; }
      let best = -1, opts = [];
      for(let c = 0; c < K; c++){
        if(c === s[o]) continue;
        const nb = flood(s, N, o, c), sz = region(nb, N, o).size;
        if(sz > best){ best = sz; opts = [nb]; } else if(sz === best) opts.push(nb);
      }
      for(const nb of opts){ const k = nb.join(); if(!next.has(k)) next.set(k, nb); }
    }
    if(!next.size) return {min, max: n};
    level = [...next.values()].slice(0, 300);
  }
  return {min: min < 0 ? 120 : min, max: 120};
}
/* 욕심쟁이 길에서 +1 칸을 몇 개 삼키는지 */
function greedyBonus(b, N, o, K, bonusArr){
  const total = openCount(b), left = new Set(bonusArr); let got = 0, n = 0;
  while(region(b, N, o).size < total && n++ < 120){
    b = flood(b, N, o, bestColor(b, N, o, K));
    const s = region(b, N, o).seen;
    for(const i of [...left]) if(s[i]){ left.delete(i); got++; }
  }
  return got;
}
/* 몇 수 앞까지 넓게 살펴보는 풀이: 별 세 개 기준과 도움에 씀 */
function solve(b, N, o, K, W = 24){
  const total = openCount(b);
  if(region(b, N, o).size === total) return {moves: 0, first: -1};
  let beam = [{b, first: -1}];
  for(let d = 1; d <= 90; d++){
    const next = [], keys = new Set();
    for(const s of beam){
      for(let c = 0; c < K; c++){
        if(c === s.b[o]) continue;
        const nb = flood(s.b, N, o, c), rr = region(nb, N, o), first = s.first < 0 ? c : s.first;
        if(rr.size === total) return {moves: d, first};
        const key = nb.join(); if(keys.has(key)) continue; keys.add(key);
        let mask = 0, ice = 0;
        for(let i = 0; i < nb.length; i++){ const v = nb[i]; if(rr.seen[i] || v === WALL || v === WILD) continue; if(v >= ICE){ ice++; mask |= 1 << (v - ICE); } else mask |= 1 << v; }
        let cols = 0; for(let m = mask; m; m &= m - 1) cols++;
        next.push({b: nb, first, sc: rr.size * 8 - cols * 3 - ice * 3});
      }
    }
    next.sort((x, y) => y.sc - x.sc); beam = next.slice(0, W);
  }
  return {moves: Infinity, first: bestColor(b, N, o, K)};
}
function gen(c, rnd){
  const R = rnd || Math.random;
  const N = c.n, T = N * N, origin = c.center ? Math.floor(N / 2) * N + Math.floor(N / 2) : 0;
  const cands = []; let last = null;
  for(let tries = 0; tries < 150; tries++){
    const b = Array.from({length: T}, () => Math.floor(R() * c.k));
    const near = new Set([origin, ...nbs(N)[origin]]), bonus = new Set();
    let placed = 0, guard = 0;
    while(placed < (c.walls || 0) && guard++ < 600){
      const i = Math.floor(R() * T); if(near.has(i) || b[i] === WALL) continue;
      const old = b[i]; b[i] = WALL;
      if(!connected(b, N, origin)){ b[i] = old; continue; }
      placed++;
    }
    placed = 0; guard = 0;
    while(placed < (c.wild || 0) && guard++ < 600){
      const i = Math.floor(R() * T); if(i === origin || b[i] === WALL || b[i] === WILD) continue;
      b[i] = WILD; placed++;
    }
    placed = 0; guard = 0;
    while(placed < (c.ice || 0) && guard++ < 600){
      const i = Math.floor(R() * T); if(near.has(i) || b[i] < 0 || b[i] >= c.k) continue;
      b[i] += ICE; placed++;
    }
    placed = 0; guard = 0;
    while(placed < (c.bonus || 0) && guard++ < 600){
      const i = Math.floor(R() * T); if(near.has(i) || b[i] < 0 || b[i] >= c.k || bonus.has(i)) continue;
      bonus.add(i); placed++;
    }
    const gm = greedy(b.slice(), N, origin, c.k);
    const res = {b, origin, greedy: gm, bonus: [...bonus]};
    last = res;
    if(gm >= 3) cands.push(res);
    if(cands.length >= (N >= 9 ? 5 : 8)) break;
  }
  const W = N >= 9 ? 16 : 24;
  const finish = x => { x.best = Math.min(x.greedy, solve(x.b, N, origin, c.k, W).moves); const r = greedyRange(x.b, N, origin, c.k); x.gmin = r.min; x.gmax = r.max; return x; };
  if(!cands.length) return finish(last);
  cands.forEach(finish);
  let pool = cands;
  /* 1마당 뒤로는 욕심쟁이 방법보다 더 좋은 길이 있고, 동점을 어떻게 골라도 욕심쟁이 횟수가 크게 갈리지 않는 판을 고른다 */
  if(c.ch !== 0){
    const p = cands.filter(x => x.best < x.gmin), q = p.filter(x => x.gmax - x.gmin <= c.slack);
    if(q.length) pool = q; else if(p.length) pool = p;
  }
  pool.sort((a, b) => a.greedy - b.greedy || a.best - b.best);
  return pool[Math.round((c.pick || 0) * (pool.length - 1))];
}

  const prevSeen = Uint8Array.from(vs.own, x => x === p ? 1 : 0);
  const r = vsApply(board, vs.own, N, p, k); board = r.b; vs.own = r.own;
  const nowSeen = Uint8Array.from(vs.own, x => x === p ? 1 : 0);
  const o = vs.orig[p - 1], orow = Math.floor(o / N), ocol = o % N;
  const dist = new Uint16Array(N * N).map((_, i) => Math.abs(Math.floor(i / N) - orow) + Math.abs(i % N - ocol));
  const T = N * N, c1 = vsCount(1), c2 = vsCount(2);
  if(c1 + c2 === T || c1 * 2 > T || c2 * 2 > T) done = true;
  else {
    let np = 3 - p;
    if(!vsFrontier(np) && vsFrontier(p)){ banner(`${vsName(np)} 막혔어요`, `${vsName(p)} 한 번 더!`); np = p; }
    vs.p = np;
  }
  render(prevSeen, nowSeen, dist); hud();
  tone(520, .14, 'sine', .12, 0, 1.9);
  for(let n = 0; n < Math.min(6, Math.ceil(r.gain / 2)); n++) tone(pent(n + (p === 1 ? 2 : 0)), .14, 'triangle', .07, .05 + n * .06);
  if(r.gain > 0) floatText('+' + r.gain, r.gain >= 10, false, o);
  if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
  if(done){ later(vsEnd, 900); return; }
  if(vs.ai && vs.p === 2) aiT = later(aiTurn, 800);
}
function aiTurn(){
  const me = board[vs.orig[1]], op = board[vs.orig[0]];
  const opts = [...Array(K).keys()].filter(c => c !== me && c !== op);
  let pickC = opts[0], bs = -1e9;
  if(vs.ai === 1 && Math.random() < .5) pickC = opts[Math.floor(Math.random() * opts.length)];
  else for(const c of opts){
    const r = vsApply(board, vs.own, N, 2, c);
    let sc = r.gain;
    if(vs.ai === 2){
      let og = 0;
      for(let d = 0; d < K; d++) if(d !== c && d !== op) og = Math.max(og, vsApply(r.b, r.own, N, 1, d).gain);
      sc = r.gain - .6 * og;
    }
    sc += Math.random() * .01;
    if(sc > bs){ bs = sc; pickC = c; }
  }
  vsMove(pickC, true);
}
function vsEnd(){
  const c1 = vsCount(1), c2 = vsCount(2), w = c1 > c2 ? 1 : 2;
  if(!vs.ai || w === 1){ sFanfare(); confetti(); } else sFail();
  const title = vs.ai ? (w === 1 ? '이겼어요!' : '컴퓨터가 이겼어요') : `${vsName(w)} 승리!`;
  openResult(title, null, `${vsName(1)} ${c1}칸 : ${c2}칸 ${vsName(2)}`,
    [['한 판 더', () => { vs.first = 3 - vs.first; vsNewBoard(); }, true], ['그만하기', toMenu]]);
}

menuCh = defaultCh();
renderMenu();
show('menu');
</script>
