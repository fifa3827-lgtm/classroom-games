<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사건 파일 검사기 · 탐정 망고</title>
<style>
 body{font-family:"Gowun Dodum",system-ui,sans-serif;background:#f7f1e4;color:#2b2418;margin:0;padding:24px;line-height:1.7}
 .wrap{max-width:860px;margin:0 auto}
 h1{font-size:22px;margin:0 0 4px} .sub{color:#7a6f5c;font-size:13px;margin:0 0 18px}
 .card{background:#fff;border:2px solid #e3d9c6;border-radius:14px;padding:14px 18px;margin-bottom:12px}
 .ok{color:#3d6b3d} .bad{color:#b3402f} .warn{color:#9a7a20}
 li{margin:2px 0} code{background:#f2ece0;padding:1px 5px;border-radius:4px;font-size:12px}
 .sum{font-size:16px;font-weight:700;margin:0 0 8px}
 input{border:2px solid #e3d9c6;border-radius:8px;padding:6px 10px;font:inherit;width:260px}
 button{border:2px solid #2b2418;border-radius:8px;background:#e8b25c;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body><div class="wrap">
<h1>사건 파일 검사기</h1>
<p class="sub">사건 JSON이 논리 공정성 규칙을 지키는지 기계로 확인합니다. 사건을 새로 쓸 때마다 여기부터 통과시키세요.</p>
<p><input id="f" value="data/case-01.json"><button id="go">검사</button></p>
<div id="out"></div>
</div>
<script type="module">
const $=s=>document.querySelector(s);
function run(C){
  const E=[],W=[],I=[];
  const clue=id=>C.clues[id];
  const has=id=>!!C.clues[id];
  /* 현장이 여럿인 사건(C.scenes)과 하나인 사건(C.spots)을 같은 목록으로 본다 */
  const allSpots = (C.scenes&&C.scenes.length) ? C.scenes.reduce((a,sc)=>a.concat(sc.spots||[]),[]) : (C.spots||[]);
  const collectable=new Set();
  (C.startClues||[]).forEach(id=>collectable.add(id));
  allSpots.forEach(s=>{if(!s.decoy&&!(clue(s.id)||{}).locked)collectable.add(s.id)});
  Object.values(C.clues||{}).forEach(c=>{if(c.follow&&c.follow.give)collectable.add(c.follow.give)});
  Object.values(C.suspects||{}).forEach(s=>{
    (s.lines||[]).forEach(L=>{
      if(L.gives)collectable.add(L.gives);
      if(L.hit)Object.values(L.hit).forEach(h=>{
        if(h.give)collectable.add(h.give);
        if(h.flag==='c_stain_found')collectable.add('c_stain');
      });
    });
    if(s.extra&&s.extra.give)collectable.add(s.extra.give);
  });
  collectable.add('c_stain');           // 앞치마 살펴보기로 얻는다

  // 1. 참조 무결성
  allSpots.forEach(s=>{if(!s.decoy&&!has(s.id))E.push(`현장 지점 <code>${s.id}</code> 에 해당하는 단서가 없습니다`)});
  (C.order||[]).forEach(id=>{if(!has(id))E.push(`order 의 <code>${id}</code> 가 clues 에 없습니다`)});
  Object.keys(C.clues||{}).forEach(id=>{if(!(C.order||[]).includes(id))W.push(`<code>${id}</code> 가 order 에 빠져 수첩에 안 보일 수 있습니다`)});
  (C.suspectOrder||[]).forEach(id=>{if(!C.suspects[id])E.push(`suspectOrder 의 <code>${id}</code> 가 suspects 에 없습니다`)});

  // 2. 추리 단계
  (C.steps||[]).forEach((st,i)=>{
    const n=i+1;
    if(!st.need||!st.need.length)E.push(`${n}단계: 정답 단서(need)가 없습니다`);
    (st.need||[]).forEach(id=>{
      if(!has(id))E.push(`${n}단계: 단서 <code>${id}</code> 가 없습니다`);
      else if(!collectable.has(id))E.push(`${n}단계: <code>${id}</code> 는 게임 안에서 모을 수 없습니다`);
    });
    if(st.slots>1&&(st.need||[]).length!==st.slots)
      E.push(`${n}단계: 칸이 ${st.slots}개인데 정답 단서는 ${(st.need||[]).length}개입니다`);
    const ok=(st.opts||[]).filter(o=>o.ok);
    if(ok.length!==1)E.push(`${n}단계: 정답 결론이 ${ok.length}개입니다 (정확히 1개여야 합니다)`);
    (st.opts||[]).forEach((o,k)=>{if(!o.ok&&!o.why)E.push(`${n}단계 ${k+1}번 오답: 「왜 아닌지」 설명(why)이 없습니다`)});
    if((st.opts||[]).length<3)W.push(`${n}단계: 선택지가 ${(st.opts||[]).length}개뿐입니다 (3개 권장)`);
    if(!st.whyClue)W.push(`${n}단계: 막혔을 때 줄 방향 힌트(whyClue)가 없습니다`);
  });

  // 3. 소거
  (C.elim||[]).forEach(e=>{
    const ok=(e.opts||[]).filter(o=>o.ok);
    if(ok.length!==1)E.push(`소거 「${e.name}」: 정답이 ${ok.length}개입니다`);
    (e.opts||[]).forEach((o,k)=>{if(!o.ok&&!o.why)E.push(`소거 「${e.name}」 ${k+1}번 오답: 설명(why)이 없습니다`)});
  });
  const culprits=(C.accuse||[]).filter(a=>a.ok);
  if(culprits.length!==1)E.push(`지목 정답이 ${culprits.length}개입니다 (정확히 1개)`);
  if((C.accuse||[]).length<3)W.push('지목 후보가 너무 적습니다');
  const elimNames=(C.elim||[]).map(e=>e.id);
  if(!elimNames.includes('solo'))W.push('「둘 중 한 명만」 같은 단독범 가설을 소거 대상에 두면 공범 논리가 분명해집니다');

  // 4. 이상한 단서
  const odd=Object.keys(C.clues||{}).filter(id=>C.clues[id].odd);
  if(odd.length!==1)E.push(`「이상한 단서」(odd)가 ${odd.length}개입니다 (사건마다 정확히 1개)`);
  odd.forEach(id=>{
    const inStep=(C.steps||[]).some(s=>(s.need||[]).includes(id));
    const inProof=(C.proofs||[]).includes(id);
    if(inStep||inProof)E.push(`이상한 단서 <code>${id}</code> 가 사건 해결에 쓰이고 있습니다 (쓰이면 안 됩니다)`);
  });

  // 5. 결정적 증거
  (C.proofs||[]).forEach(id=>{
    if(!has(id))E.push(`proofs 의 <code>${id}</code> 가 없습니다`);
    else if(!collectable.has(id))E.push(`결정적 증거 <code>${id}</code> 를 모을 수 없습니다`);
  });

  // 6. 읽기 부담
  Object.values(C.suspects||{}).forEach(s=>(s.lines||[]).forEach(L=>{
    if((L.t||'').length>60)W.push(`「${s.name}」의 진술이 깁니다(${L.t.length}자): "${L.t.slice(0,24)}…"`);
  }));
  if((C.solve?.text||'').length>320)W.push('해결 해설이 깁니다 (5문장 이내 권장)');

  // 6.5 정답 자리 — 정답이 늘 같은 줄에 있으면 읽지 않고도 맞힌다
  const posOf=list=>(list||[]).map(x=>(x.opts||[]).findIndex(o=>o.ok)).filter(i=>i>=0);
  const spread=(name,pos)=>{
    if(pos.length<3)return;
    const cnt={};pos.forEach(i=>cnt[i]=(cnt[i]||0)+1);
    const top=Math.max(...Object.values(cnt));
    if(top===pos.length)E.push(`${name}: 정답이 <b>전부 ${pos[0]+1}번째 줄</b>에 있습니다 — 읽지 않고도 맞힐 수 있습니다`);
    else if(top/pos.length>=0.7)W.push(`${name}: 정답이 한 자리(${Object.keys(cnt).find(k=>cnt[k]===top)*1+1}번째)에 ${top}/${pos.length}로 몰려 있습니다`);
  };
  spread('추리 단계',posOf(C.steps));
  spread('소거',posOf(C.elim));
  const accPos=(C.accuse||[]).findIndex(a=>a.ok);
  if(accPos===0&&(C.accuse||[]).length>2)W.push('지목 후보의 정답이 맨 첫 줄입니다');
  I.push(`정답 자리 — 추리 ${posOf(C.steps).map(i=>i+1).join('·')} / 소거 ${posOf(C.elim).map(i=>i+1).join('·')} / 지목 ${accPos+1}`);

  // 6.55 얻을 수 있는 단서인데 「잠김」으로 선언돼 있지 않은가
  //      (잠김은 「아직 못 얻었다」는 표시다. 주는 단서에 잠김을 달면 얻고도 쓸 수 없다)
  const given=new Set();
  Object.values(C.suspects||{}).forEach(s=>{
    if(s.extra&&s.extra.give)given.add(s.extra.give);
    (s.lines||[]).forEach(L=>{
      if(L.gives)given.add(L.gives);
      Object.values(L.hit||{}).forEach(h=>{if(h.give)given.add(h.give)});
    });
  });
  given.forEach(id=>{
    if(!C.clues[id])return E.push(`심문이 주는 <code>${id}</code> 가 clues 에 없습니다`);
    if(C.clues[id].locked)E.push(`<code>${id}</code> 는 심문에서 얻는 단서인데 <b>locked</b> 입니다 — 얻어도 수첩과 선택창에 나타나지 않습니다`);
  });
  Object.keys(C.clues||{}).forEach(id=>{
    if(!C.clues[id].locked)return;
    const hasSpot=allSpots.some(s=>s.id===id);
    if(!hasSpot&&!given.has(id))W.push(`<code>${id}</code> 는 잠겨 있는데 얻을 길(현장 지점·심문)이 없습니다`);
  });

  // 6.6 추리에 필요한 단서를 정말 모을 수 있는가 (못 모으면 이용자는 영원히 헤맨다)
  (C.steps||[]).forEach((st,i)=>{
    const need=st.need||[];
    const reachable=need.filter(id=>collectable.has(id));
    if(!reachable.length)E.push(`${i+1}단계: 근거 단서를 하나도 모을 수 없습니다`);
    else if(st.slots>1&&reachable.length<need.length)E.push(`${i+1}단계: 근거 ${need.length}개 중 ${reachable.length}개만 모을 수 있습니다`);
  });

  I.push(`단서 ${Object.keys(C.clues||{}).length}개 · 현장 ${(C.scenes||[1]).length}곳 · 조사 지점 ${allSpots.length}개(미끼 ${allSpots.filter(s=>s.decoy).length}) · 인물 ${(C.suspectOrder||[]).length}명`);

  // 11-b. 화면에 글자 그대로 나가는 자리에 HTML 태그가 있으면 안 된다
  //       (사건 3에서 용의자 진술에 <b> 가 들어가 화면에 태그가 그대로 찍혔다)
  const tag=/<[^>]+>/;
  Object.values(C.suspects||{}).forEach(sp=>(sp.lines||[]).forEach(L=>{
    if(tag.test(L.t||''))E.push(`진술 <code>${L.id}</code> 에 HTML 태그가 있습니다 — 화면에 태그가 그대로 보입니다`);
  }));
  allSpots.forEach(s=>{
    if(tag.test(s.label||''))E.push(`미끼 이름 <code>${s.id}</code> 에 HTML 태그가 있습니다`);
    if(typeof s.decoy==='string'&&tag.test(s.decoy))E.push(`미끼 설명 <code>${s.id}</code> 에 HTML 태그가 있습니다`);
  });
  (C.accuse||[]).forEach(a=>{if(tag.test(a.t||''))E.push(`지목 후보 <code>${a.id}</code> 에 HTML 태그가 있습니다`)});
  (C.elim||[]).forEach(e=>{if(tag.test(e.name||''))E.push(`소거 이름 「${e.name}」 에 HTML 태그가 있습니다`)});
  Object.keys(C.clues||{}).forEach(id=>{if(tag.test(clue(id).n||''))E.push(`단서 이름 <code>${id}</code> 에 HTML 태그가 있습니다`)});
  (C.scenes||[]).forEach(sc=>{if(tag.test(sc.label||''))E.push(`현장 이름 「${sc.label}」 에 HTML 태그가 있습니다`)});

  // 12. 얻게 되는 단서는 locked 이면 안 된다 (사건 2의 c_tape 사고)
  collectable.forEach(id=>{ if(has(id)&&clue(id).locked)
    E.push(`<code>${id}</code> 는 얻게 되는 단서인데 locked 로 잠겨 있습니다 — 얻어도 수첩에서 눌리지 않습니다`); });

  // 13. 번호 자물쇠: 모든 자릿수와 「순서」가 단서에 나와야 한다 (찍기 방지)
  const plain=id=>String((clue(id)||{}).t||'').replace(/<[^>]+>/g,'');
  const allText=Object.keys(C.clues||{}).map(plain).join(' ');
  allSpots.forEach(sp=>{
    if(sp.mini!=='lock')return;
    if(!sp.code)return E.push(`자물쇠 지점 <code>${sp.id}</code> 에 code 가 없습니다`);
    [...new Set(String(sp.code).split(''))].forEach(ch=>{
      if(!allText.includes(ch))E.push(`자물쇠 번호의 숫자 <code>${ch}</code> 가 어느 단서에도 나오지 않습니다 — 찍어야 풀립니다`);
    });
    if(!/순서/.test(allText))W.push(`자물쇠 번호의 <b>순서</b>를 알려 주는 단서가 안 보입니다`);
  });

  // 14. 그림자 도구: 정답 시각이 눈금 위에 있어야 한다
  const mm=t=>{const a=String(t).split(':');return (+a[0])*60+(+a[1])};
  allSpots.forEach(sp=>{
    const sh=sp.shadow; if(!sh)return;
    const f=mm(sh.from),t=mm(sh.to),st=sh.step||5,a=mm(sh.answer);
    if(a<f||a>t)E.push(`<code>${sp.id}</code>: 정답 시각 ${sh.answer} 가 다이얼 범위 밖입니다`);
    if((a-f)%st)E.push(`<code>${sp.id}</code>: 정답 시각 ${sh.answer} 가 눈금(${st}분)에 맞지 않습니다`);
    (sh.marks||[]).forEach(k=>{ if((mm(k.at)-f)%st)E.push(`<code>${sp.id}</code>: 표시 ${k.at} 가 눈금에 맞지 않습니다`) });
  });

  // 15. 지점·현장의 조건 단서는 얻을 수 있어야 한다
  allSpots.forEach(sp=>(sp.need||[]).forEach(id=>{
    if(!has(id))E.push(`조사 지점 <code>${sp.id}</code> 의 조건 단서 <code>${id}</code> 가 없습니다`);
    else if(!collectable.has(id))E.push(`조사 지점 <code>${sp.id}</code> 의 조건 단서 <code>${id}</code> 를 얻을 방법이 없습니다`);
    if(!sp.needSay)W.push(`조사 지점 <code>${sp.id}</code> 에 needSay(막혔을 때 안내)가 없습니다`);
  }));
  (C.scenes||[]).forEach(sc=>(sc.need||[]).forEach(id=>{
    if(!collectable.has(id))E.push(`현장 <code>${sc.label||sc.id}</code> 의 조건 단서 <code>${id}</code> 를 얻을 방법이 없습니다`);
    if(!sc.needSay)W.push(`현장 <code>${sc.label||sc.id}</code> 에 needSay 가 없습니다`);
  }));
  I.push(`추리 ${(C.steps||[]).length}단계 · 소거 ${(C.elim||[]).length}명 · 지목 후보 ${(C.accuse||[]).length}명`);
  return {E,W,I};
}
function render(r,name){
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  $('#out').innerHTML=
   `<div class="card"><p class="sum ${r.E.length?'bad':'ok'}">${r.E.length?`❌ 통과 못 함 — 고칠 것 ${r.E.length}건`:'✅ 통과 — 논리 규칙에 어긋나는 곳이 없습니다'}</p>`+
   (r.E.length?`<ul class="bad">${li(r.E)}</ul>`:'')+`</div>`+
   (r.W.length?`<div class="card"><p class="sum warn">⚠ 살펴볼 것 ${r.W.length}건</p><ul class="warn">${li(r.W)}</ul></div>`:'')+
   `<div class="card"><p class="sum">📄 ${name}</p><ul>${li(r.I)}</ul></div>`;
}
async function go(){
  const f=$('#f').value.trim();
  try{
    const C=await (await fetch(f,{cache:'no-cache'})).json();
    render(run(C),f);
  }catch(e){$('#out').innerHTML=`<div class="card bad">읽지 못했습니다: ${e.message}</div>`}
}
$('#go').addEventListener('click',go); go();
</script>
</body></html>
