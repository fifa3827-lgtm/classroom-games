<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffc9b9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>裵鄭 명윤랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Serif+KR:wght@900&text=%E8%A3%B5%E9%84%AD&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a4d;--ink2:#5d5680;--card:#fffaf5;--accent:#ef4f78;--accent-d:#c93a61;--line:#efe3ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd9c7;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.j{font-family:'Jua',system-ui,sans-serif;font-weight:400}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;justify-content:center;pointer-events:none;z-index:2;opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
#hud.on{opacity:1;transform:none}
#hudIn{width:min(100%,560px);display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,250,245,.9);border-radius:999px;padding:6px 11px;font-family:Jua,sans-serif;font-size:16px;box-shadow:0 3px 0 rgba(47,42,77,.13);white-space:nowrap;line-height:1.2}
#scorePill{min-width:64px;text-align:center}
#scorePill.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.15)}}
#prog{flex:1;height:30px;position:relative;background:rgba(255,250,245,.62);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(47,42,77,.08),0 3px 0 rgba(47,42,77,.1)}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffb3c4,#ef4f78);border-radius:999px;transition:width .3s cubic-bezier(.2,1.4,.4,1)}
#progTxt{position:absolute;inset:0;display:grid;place-items:center;font-family:Jua,sans-serif;font-size:14px;color:var(--ink)}
#hearts{font-family:Jua,sans-serif;color:#ef4f78;letter-spacing:1px;font-size:17px}
#hearts .off{color:rgba(47,42,77,.2)}
#hearts.hurt{animation:hurt .5s}
@keyframes hurt{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.ib{pointer-events:auto;border:0;background:rgba(255,250,245,.9);width:36px;height:36px;border-radius:999px;font-family:Jua,sans-serif;font-size:15px;color:var(--ink);box-shadow:0 3px 0 rgba(47,42,77,.13);cursor:pointer;padding:0;flex:none}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(47,42,77,.13)}
.ib.off{color:rgba(47,42,77,.35);text-decoration:line-through}
.ov{position:fixed;inset:0;display:grid;place-items:center;z-index:5;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}
.ov.dim{background:rgba(47,42,77,.28)}
#title{place-items:end center;padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
.card{background:var(--card);border-radius:28px;padding:24px 22px 22px;width:min(92vw,380px);text-align:center;box-shadow:0 22px 50px rgba(90,40,70,.25),0 6px 0 rgba(47,42,77,.08);transform:translateY(18px) scale(.96);transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
.ov.on .card{transform:none}
.ded{font-family:Jua,sans-serif;font-size:18px;color:var(--ink2);margin:0 0 4px;letter-spacing:.5px}
h1{font-family:Jua,sans-serif;font-weight:400;font-size:44px;white-space:nowrap;margin:0;line-height:1.1;color:var(--accent);letter-spacing:-1px;text-shadow:0 4px 0 #ffd3dd}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;flex-wrap:nowrap;white-space:nowrap}
.seal{font-family:'Noto Serif KR',serif;font-weight:900;font-size:30px;line-height:1;color:#fff;background:#d8454f;border-radius:10px;padding:7px 8px 6px;white-space:nowrap;box-shadow:inset 0 0 0 2.5px #fff,inset 0 0 0 4px #d8454f,0 3px 0 #a92f3a;transform:rotate(-4deg)}
.sub b{color:var(--accent);font-weight:400}
.sub{font-family:Jua,sans-serif;font-size:20px;margin:4px 0 14px;color:var(--ink)}
.how{display:grid;gap:8px;margin:0 0 16px;text-align:left}
.how div{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:inset 0 0 0 2px var(--line)}
.how b{font-family:Jua,sans-serif;font-weight:400;flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;color:#fff;font-size:15px}
.btn{border:0;border-radius:999px;background:var(--accent);color:#fff;font-family:Jua,sans-serif;font-size:21px;padding:13px 30px;box-shadow:0 5px 0 var(--accent-d);cursor:pointer;margin:6px 4px 0;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.btn.sub2{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e3d6e2,inset 0 0 0 2px var(--line);font-size:18px;padding:12px 22px}
.best{font-size:14px;color:var(--ink2);margin-top:12px;min-height:18px}
.big{font-family:Jua,sans-serif;font-size:34px;margin:0 0 4px;color:var(--ink)}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0 8px;color:#e9e1ea}
.stars span{display:inline-block;transform:scale(0)}
.stars span.on{color:#ffc53d;text-shadow:0 3px 0 #e89f12}
.ov.on .stars span{animation:starIn .5s cubic-bezier(.2,1.8,.4,1) forwards}
.ov.on .stars span:nth-child(2){animation-delay:.18s}
.ov.on .stars span:nth-child(3){animation-delay:.36s}
@keyframes starIn{to{transform:scale(1)}}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.rows div{background:#fff;border-radius:16px;padding:8px;box-shadow:inset 0 0 0 2px var(--line);font-size:13px;color:var(--ink2)}
.rows b{display:block;font-family:Jua,sans-serif;font-weight:400;font-size:22px;color:var(--ink)}
.msg{font-size:15px;color:var(--ink2);margin:0 0 10px;line-height:1.5}
#banner{position:fixed;left:0;right:0;top:22%;display:grid;place-items:center;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#banner .in{background:rgba(255,250,245,.95);border-radius:24px;padding:14px 22px;text-align:center;box-shadow:0 14px 30px rgba(90,40,70,.2);transform:scale(.8);transition:transform .45s cubic-bezier(.2,1.6,.4,1);max-width:86vw}
#banner.on .in{transform:none}
#bnStage{font-family:Jua,sans-serif;font-size:36px;color:var(--accent);line-height:1.1}
#bnNew{font-size:15px;color:var(--ink);margin-top:6px;line-height:1.45}
#bnNew b{font-family:Jua,sans-serif;font-weight:400;font-size:18px;display:block}
@media (prefers-reduced-motion: reduce){.card,#banner .in{transition:none}.ov.on .stars span{animation:none;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"><div id="hudIn">
  <div class="pill" id="stagePill">1단계</div>
  <div id="prog"><div id="progFill"></div><div id="progTxt">0 / 0</div></div>
  <div class="pill" id="scorePill">0</div>
  <div class="pill" id="hearts"></div>
  <button class="ib" id="btnSnd" aria-label="소리 끄기">♪</button>
  <button class="ib" id="btnPause" aria-label="잠깐 멈춤">II</button>
</div></div>

<div id="banner"><div class="in"><div id="bnStage">1단계</div><div id="bnNew"></div></div></div>

<div class="ov on" id="title"><div class="card">
  <p class="ded">사람들이 사랑하는</p>
  <div class="ttl"><span class="seal" aria-label="배정">裵鄭</span><h1>명윤랜드</h1></div>
  <div class="sub">대관람차에 손님을 <b>배정</b>해 주세요</div>
  <div class="how">
    <div><b style="background:#ff8fa8">1</b>곤돌라가 아래 빛나는 띠에 들어오면</div>
    <div><b style="background:#6cbcff">2</b>같은 색 줄을 톡! 줄줄이 폴짝 타요</div>
    <div><b style="background:#ffb067">3</b>꽉 채우면 꼭대기에서 불꽃이 펑!</div>
  </div>
  <button class="btn" id="btnStart">놀러 가기</button>
  <button class="btn sub2" id="btnCont" hidden>이어서</button>
  <div class="best" id="bestTxt"></div>
</div></div>

<div class="ov dim" id="clear"><div class="card">
  <div class="big" id="clTitle">1단계 성공!</div>
  <div class="stars" id="clStars"><span>★</span><span>★</span><span>★</span></div>
  <div class="rows"><div>점수<b id="clScore">0</b></div><div>최고 콤보<b id="clCombo">0</b></div></div>
  <p class="msg" id="clMsg"></p>
  <button class="btn" id="btnNext">다음 단계</button>
</div></div>

<div class="ov dim" id="over"><div class="card">
  <div class="big">문 닫을 시간이에요</div>
  <p class="msg" id="ovMsg"></p>
  <div class="rows"><div>도착한 단계<b id="ovStage">1</b></div><div>점수<b id="ovScore">0</b></div></div>
  <button class="btn" id="btnRetry">다시 놀기</button>
  <button class="btn sub2" id="btnCheck" hidden>이어서</button>
  <div class="best" id="ovBest"></div>
</div></div>

<div class="ov dim" id="pause"><div class="card">
  <div class="big">잠깐 쉬어요</div>
  <p class="msg">관람차가 멈춰서 기다리고 있어요.</p>
  <button class="btn" id="btnResume">계속하기</button>
  <button class="btn sub2" id="btnHome">처음으로</button>
</div></div>

<script>
(() => {
'use strict';
// =====================================================================
// 裵鄭 명윤랜드 (배정 명윤랜드)
// 소중한 두 사람을 위해 만든 놀이공원 퍼즐. 배정(配定) = 손님을 알맞은 자리에 앉힌다는 뜻도 겹친다.
// 버스 피버(Bus Fever)의 「같은 색 손님을 꽉 채워 출발시키는 쾌감」을 오마주하고,
// 조작은 관람차 타이밍 탭으로 바꿨다. 소리 구조는 Lanternfall(랜턴폴)을 따른다:
//   마림바·칼림바 음정 효과음(연속할수록 5음계로 오름) · 박자 격자에 맞춘 연쇄 · 폭죽 녹음 · 진동 무늬.
// 배경음은 파일 없이 브라우저 안에서 한 번 녹음(OfflineAudioContext)해 빈틈없이 반복한다.
// =====================================================================
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, BOTTOM = Math.PI / 2, TOP = -Math.PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a), ri = n => Math.floor(Math.random() * n);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('myungyun_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('myungyun_' + k, JSON.stringify(v)); } catch (e) {} },
};
const save = Object.assign({ sound: true, bestScore: 0, bestStage: 0, check: 1 }, store.get('save', {}));
const persist = () => store.set('save', save);

// 손님 여섯 친구. f: 머리 모양 (색을 못 가려도 모양으로 구별)
const COLORS = [
  { base: '#ff8fa8', dark: '#d9587a', light: '#ffd3dd', f: 'cat',    name: '딸기냥' },
  { base: '#ffb067', dark: '#dc7f36', light: '#ffe2c4', f: 'sprout', name: '귤싹이' },
  { base: '#ffd95a', dark: '#d2a41b', light: '#fff2bd', f: 'tuft',   name: '레몬삐약' },
  { base: '#6fd8a8', dark: '#35a877', light: '#cdf5e1', f: 'bunny',  name: '민트토끼' },
  { base: '#6cbcff', dark: '#3587d6', light: '#cfe8ff', f: 'antenna',name: '하늘통통' },
  { base: '#b69bff', dark: '#7f63d6', light: '#e6dcff', f: 'bear',   name: '포도곰' },
];

// =====================================================================
// 소리 (Lanternfall 구조)
// 버스: 효과음 SAM → OUT → MASTER, 배경음 MUS → MASTER, 잔향 VERB 1.4초 · wet .32, 압축기 -12dB · 3:1
// =====================================================================
let AC = null, MASTER = null, OUT = null, SAM = null, MUS = null, VERB = null, NOISE = null;
const MUS_VOL = .62, DUCK_VOL = .26;
function audio() {
  if (!AC) { try {
    AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = .002; comp.release.value = .12; comp.connect(AC.destination);
    MASTER = AC.createGain(); MASTER.gain.value = save.sound ? 1 : 0; MASTER.connect(comp);
    OUT = AC.createGain(); OUT.gain.value = 1; OUT.connect(MASTER);
    SAM = AC.createGain(); SAM.gain.value = .75; SAM.connect(OUT);
    MUS = AC.createGain(); MUS.gain.value = MUS_VOL; MUS.connect(MASTER);
    const len = AC.sampleRate * 1.4, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    VERB = AC.createConvolver(); VERB.buffer = ir; const vg = AC.createGain(); vg.gain.value = .32; VERB.connect(vg).connect(MASTER);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    if (G.state === 'title') bgmWant(0); else bgmWant(trackOf(G.stage), lapRate(G.stage));
  } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
document.addEventListener('pointerdown', () => audio(), { capture: true });
document.addEventListener('keydown', () => audio(), { capture: true });
function setSound(on) {
  save.sound = on; persist(); audio();
  if (MASTER) MASTER.gain.setTargetAtTime(on ? 1 : 0, AC.currentTime, .12);
  const b = $('#btnSnd'); b.classList.toggle('off', !on); b.setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기');
}
const PENT = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2, 3, 10/3, 4];
let ROOT = 261.63;     // 으뜸음. 곡이 바뀌면 bgmPlay()가 그 곡의 조에 맞춰 바꾼다 → 효과음이 저절로 배경음과 화음이 된다
function env(g, t, a, peak, d, end = .0001) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(end, t + a + d); }
function tone(type, f0, f1, t, dur, vol, bus = OUT, pan = 0) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur * .3);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let n = o.connect(g); if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; n = n.connect(p); }
  n.connect(bus); o.start(t); o.stop(t + dur + .05); return n;
}
function hit(t, dur, freq, vol, type = 'bandpass', q = .8, bus = SAM) {
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  n.buffer = NOISE; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, .001, vol, dur);
  n.connect(f).connect(g).connect(bus); n.start(t, Math.random() * 1.5); n.stop(t + dur + .05); return g;
}
function partial(f, t, a, vol, d, out) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; env(g, t, a, vol, d); o.connect(g).connect(out); o.start(t); o.stop(t + a + d + .05); }
function toneOut(pan, verb) { const g = AC.createGain(); let n = g; if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; n = g.connect(p); } n.connect(SAM); const v = AC.createGain(); v.gain.value = verb; n.connect(v).connect(VERB); return g; }
function marimba(f, t, vol = .5, pan = 0, dur = .55) {
  const out = toneOut(pan, .3);
  partial(f, t, .002, vol, dur, out); partial(f * 4, t, .001, vol * .35, dur * .35, out); partial(f * 10.1, t, .001, vol * .15, dur * .15, out);
  partial(f * 2, t, .001, vol * .3, .03, out);                        // 나무 때리는 톡
}
function kalimba(f, t, vol = .45, pan = 0, dur = .9) {
  const out = toneOut(pan, .3);
  const o = AC.createOscillator(), m = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain();
  o.frequency.value = f; m.frequency.value = f * 2.01; mg.gain.setValueAtTime(f * .6, t); mg.gain.exponentialRampToValueAtTime(f * .01, t + .45);
  m.connect(mg).connect(o.frequency); env(g, t, .001, vol, dur); o.connect(g).connect(out); o.start(t); m.start(t); o.stop(t + dur + .05); m.stop(t + dur + .05);
  partial(f * 5.4, t, .001, vol * .25, .12, out);                     // 금속 손톱 소리
}
// ---- 폭죽 녹음 (Lanternfall sfx/hq 묶음). 불꽃을 합성음 C로 바꾸며 지금은 불러오지 않는다(loadSfx 호출 없음) ----
const SFX = {}, SFX_NAMES = ['pop1', 'pop1b', 'pop2', 'pop2b', 'pop3', 'pop3b', 'final', 'fuse'];
function loadSfx() {
  if (!AC || SFX._loading) return; SFX._loading = true;
  SFX_NAMES.forEach(n => fetch(`sfx/${n}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => new Promise((res, rej) => AC.decodeAudioData(b, res, rej))).then(buf => {
    const d = buf.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) pk = Math.max(pk, Math.abs(d[i]));
    let i = 0; while (i < d.length && Math.abs(d[i]) < pk * .08) i++;
    buf._off = Math.max(0, i / buf.sampleRate - .002); SFX[n] = buf;   // 실제 시작점부터 틀어 화면과 딱 붙인다
  }).catch(() => { SFX[n] = null; }));
}
function playBuf(buf, t, vol, rate = 1, verb = 0, pan = 0) {
  const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = buf; src.playbackRate.value = rate; g.gain.value = vol;
  let n = src.connect(g); if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; n = n.connect(p); }
  n.connect(OUT); if (verb) { const vg = AC.createGain(); vg.gain.value = verb; n.connect(vg).connect(VERB); }
  src.start(Math.max(t, AC.currentTime), buf._off || 0); return src;
}
const pick = n => { const a = SFX[n], b = SFX[n + 'b']; return b && Math.random() < .5 ? b : a; };

// ---- 효과음 ----
// 탑승: 앞 손님 「폴짝」 = 칼림바 한 음. 연속으로 태울수록 5음계로 한 칸씩 오른다(Lanternfall 연쇄와 같은 규칙).
function sfxHop(note, t, perfect) {
  if (!AC) return;
  const k = Math.min(note, PENT.length - 1), f = ROOT * 2 * PENT[k], pan = rand(-.3, .3);

    if (o.happy) [-1, 1].forEach(sx => { ctx.beginPath(); ctx.arc(sx * r * .32, ey + r * .05, r * .12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    else if (o.blink) [-1, 1].forEach(sx => { ctx.beginPath(); ctx.moveTo(sx * r * .32 - r * .1, ey); ctx.lineTo(sx * r * .32 + r * .1, ey); ctx.stroke(); });
    else [-1, 1].forEach(sx => { ctx.beginPath(); ctx.arc(sx * r * .32, ey, r * .12, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx * r * .32 + r * .04, ey - r * .05, r * .045, 0, TAU); ctx.fill(); ctx.fillStyle = '#2f2a4d'; });
    ctx.beginPath();
    if (o.worried) { ctx.moveTo(-r * .12, r * .3); ctx.quadraticCurveTo(0, r * .2, r * .12, r * .3); }
    else if (o.hop) { ctx.arc(0, r * .25, r * .1, 0, TAU); }
    else { ctx.moveTo(-r * .14, r * .2); ctx.quadraticCurveTo(-r * .07, r * .3, 0, r * .2); ctx.quadraticCurveTo(r * .07, r * .3, r * .14, r * .2); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,150,.45)'; [-1, 1].forEach(sx => { ctx.beginPath(); ctx.arc(sx * r * .58, r * .18, r * .13, 0, TAU); ctx.fill(); });
  }
  ctx.strokeStyle = C.dark; ctx.fillStyle = C.base; ctx.lineWidth = Math.max(1.2, r * .08);
  if (C.f === 'sprout') { ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r * 1.25); ctx.stroke(); ctx.fillStyle = '#7ccf6a'; ctx.strokeStyle = '#4c9e45'; [-1, 1].forEach(sx => { ctx.beginPath(); ctx.ellipse(sx * r * .2, -r * 1.3, r * .22, r * .1, sx * -.5, 0, TAU); ctx.fill(); ctx.stroke(); }); }
  if (C.f === 'tuft') { ctx.beginPath(); [-1, 0, 1].forEach(k => { ctx.moveTo(k * r * .12, -r * .96); ctx.quadraticCurveTo(k * r * .25, -r * 1.3, k * r * .3 + r * .05, -r * 1.25); }); ctx.stroke(); }
  if (C.f === 'antenna') { ctx.beginPath(); ctx.moveTo(r * .1, -r * .97); ctx.quadraticCurveTo(r * .3, -r * 1.3, r * .22, -r * 1.42); ctx.stroke(); ctx.fillStyle = '#ffd95a'; ctx.strokeStyle = '#d2a41b'; ctx.beginPath(); ctx.arc(r * .22, -r * 1.48, r * .14, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function drawHops() {
  for (const h of G.hops) {
    const u = Math.max(0, h.t) / h.dur, gp = gPos(h.g);
    const e = u < 0 ? 0 : u, x = lerp(h.sx, gp.x, e), y = lerp(h.sy, gp.y - L.gh * .1, e) - Math.sin(Math.PI * e) * (L.laneTop - L.py) * .55;
    const sc = lerp(1, .55, e), sq = h.t < 0 ? .12 : Math.sin(e * Math.PI) * -.12;
    critter(x, y, L.pr * sc, h.p.c, { sq, hop: h.t >= 0, happy: e > .6 });
  }
}
function drawParts() {
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.type === 'fw') {
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.px - (p.x - p.px) * 3, p.py - (p.y - p.py) * 3); ctx.lineTo(p.x, p.y); ctx.stroke();
      if (Math.random() < .08 * a) { ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
    } else if (p.type === 'ring') {
      const u = 1 - a; ctx.globalAlpha = a * .7; ctx.strokeStyle = p.col; ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.2 + u), 0, TAU); ctx.stroke();
    } else if (p.type === 'conf') {
      ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2 * Math.abs(Math.cos(p.rot * 1.3)) + 1); ctx.restore();
    } else if (p.type === 'star') {
      ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); const s = p.size * (.5 + a * .5);
      ctx.beginPath(); for (let k = 0; k < 8; k++) { const rr2 = k % 2 ? s * .38 : s; const an = k * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr2, Math.sin(an) * rr2); } ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (p.type === 'heart') {
      ctx.globalAlpha = a; ctx.fillStyle = p.col; heartPath(p.x, p.y, p.size); ctx.fill();
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const r of G.rockets) { ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(r.x, r.y, 3.2, 0, TAU); ctx.fill(); }
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    const a = clamp(t.life / t.max * 1.6, 0, 1), pop = 1 + Math.max(0, (t.life - t.max + .15) / .15) * .3;
    ctx.globalAlpha = a; ctx.font = `${Math.round(t.size * pop)}px Jua`;
    ctx.lineWidth = 5; ctx.strokeStyle = t.glow ? 'rgba(47,42,77,.45)' : 'rgba(255,255,255,.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawHudCanvas() {
  if (G.state !== 'play' && G.state !== 'intro') return;
  const x = GX + 16, y = L.py - 6;
  if (G.combo >= 2) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = `${Math.round(22 + Math.min(G.combo, 20))}px Jua`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.strokeText(G.combo + ' 콤보', x, y); ctx.fillStyle = G.fever > 0 ? '#ef4f78' : '#2f2a4d'; ctx.fillText(G.combo + ' 콤보', x, y);
  }
  // 피버 게이지: 작은 불빛 여섯 개
  const gx = GX + GW - 16, gy = L.py - 14;
  for (let k = 0; k < 6; k++) {
    const on = G.fever > 0 ? (G.fever / 8 > k / 6) : k < G.charge, cx = gx - (5 - k) * 15;
    ctx.fillStyle = on ? (G.fever > 0 ? `hsl(${(k * 50 + G.time * 300) % 360},90%,65%)` : '#ef4f78') : 'rgba(47,42,77,.18)';
    ctx.beginPath(); ctx.arc(cx, gy, on ? 5.5 : 4.5, 0, TAU); ctx.fill();
  }
  ctx.font = '13px Jua'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(47,42,77,.6)'; ctx.fillText(G.fever > 0 ? '피버!' : '피버', gx + 4, gy + 20);
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = G.shake > 0 && !RM ? G.shake * 7 : 0;
  ctx.save(); if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));
  drawBG(); drawPlatform(); drawWheel();
  G.gondolas.forEach(drawGondola); drawHub();
  if (G.state !== 'title') { drawLanes(); drawHops(); }
  drawParts(); drawTexts(); drawHudCanvas();
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = G.fever > 0 ? `hsla(${G.time * 300 % 360},100%,85%,${G.flash * .35})` : `rgba(255,255,255,${G.flash * .35})`; ctx.fillRect(0, 0, W, H); }
  if (G.fever > 0) { const a = .12 + .06 * Math.sin(G.time * 8); const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, `hsla(${G.time * 120 % 360},100%,70%,${a})`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
}
let hudCache = '';
function updateHud(force) {
  if (G.state === 'title') return;
  const key = [G.stage, G.boarded, G.P.target, G.score, G.hearts].join(',');
  if (!force && key === hudCache) return; hudCache = key;
  $('#stagePill').textContent = G.stage + '단계';
  $('#progFill').style.width = (Math.min(1, G.boarded / G.P.target) * 100) + '%';
  $('#progTxt').textContent = `손님 ${Math.min(G.boarded, G.P.target)} / ${G.P.target}`;
  $('#scorePill').textContent = G.score.toLocaleString();
  $('#hearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < G.hearts ? '' : 'off'}">♥</span>`).join('');
}

// =====================================================================
// 입력과 반복
// =====================================================================
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (G.state !== 'play') return;
  const x = e.clientX, y = e.clientY;
  if (y < L.py - L.gh) return;
  const li = clamp(Math.floor((x - L.laneX0) / L.laneW), 0, G.lanes.length - 1);
  tapLane(li);
});
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') tapLane(+e.key - 1);
  if (e.key === 'Escape' || e.key === 'p') pause(G.state !== 'paused');
});
$('#btnStart').onclick = () => startGame(1);
$('#btnCont').onclick = e => startGame(+e.currentTarget.dataset.from || 1);
$('#btnRetry').onclick = () => startGame(1);
$('#btnCheck').onclick = e => startGame(+e.currentTarget.dataset.from || 1);
$('#btnNext').onclick = () => { click(); buzz(HAPTIC.button); showOv('clear', false); G.stage++; G.parts = G.parts.filter(p => p.type === 'conf'); beginStage(); };
$('#btnSnd').onclick = () => { setSound(!save.sound); click(); };
$('#btnPause').onclick = () => { click(); pause(true); };
$('#btnResume').onclick = () => { pause(false); click(); };
$('#btnHome').onclick = () => { showOv('pause', false); if (AC) AC.resume(); toTitle(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * G.timeScale; last = now;
  update(dt); render(); updateHud(); requestAnimationFrame(frame);
}
setupStage(true); resize(); setSound(save.sound); refreshTitle();
requestAnimationFrame(frame);
window.__game = { TRACKS, G, tapLane, windowGondola, params, get BGM() { return BGM; }, get AC() { return AC; }, startGame, renderBGM };   // 검사용
})();
</script>
