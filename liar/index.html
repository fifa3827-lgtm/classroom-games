<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>라이어게임</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#5dff8a;
    --green-bright:#c8ffd6;
    --green-dim:#2f9a52;
    --plastic-hi:#e2dac4;
    --plastic:#cbc2a8;
    --plastic-lo:#ada38a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(ellipse at 50% 25%,#3b3229 0%,#1d1813 55%,#0d0a07 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Nanum Gothic Coding',monospace;
    overflow:hidden;padding:16px;
  }

  /* ── 모니터 본체 ── */
  .monitor{
    width:min(980px,100%);
    background:linear-gradient(var(--plastic-hi),var(--plastic) 55%,var(--plastic-lo));
    border-radius:22px 22px 16px 16px;
    padding:30px 36px 0;
    box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 2px 0 #f3ecda,inset 0 -3px 0 #958b73;
  }
  .bezel{
    background:#2a2925;border-radius:18px;padding:20px;
    box-shadow:inset 0 4px 14px rgba(0,0,0,.85),0 1px 0 #f3ecda;
  }
  .screen{
    position:relative;
    height:clamp(260px,calc(100vh - 290px),560px);
    border-radius:30px/24px;
    background:radial-gradient(ellipse at center,#0f2216 0%,#07120b 70%,#020604 100%);
    overflow:hidden;cursor:text;
    box-shadow:inset 0 0 60px rgba(0,0,0,.9),inset 0 0 10px rgba(93,255,138,.12);
  }
  .screen::before{ /* 주사선 */
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  }
  .screen::after{ /* 유리 반사 + 가장자리 어둡게 */
    content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(ellipse at 28% 12%,rgba(255,255,255,.07),transparent 38%),
      radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%);
  }
  .rollbar{
    position:absolute;left:0;right:0;height:90px;z-index:2;pointer-events:none;
    background:linear-gradient(transparent,rgba(93,255,138,.05),transparent);
    animation:roll 7s linear infinite;
  }
  @keyframes roll{from{top:-90px}to{top:100%}}

  .term{
    position:absolute;inset:0;padding:22px 30px;overflow-y:auto;
    color:var(--green);font-size:17px;line-height:1.6;
    text-shadow:0 0 4px rgba(93,255,138,.7),0 0 12px rgba(93,255,138,.25);
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
    scrollbar-width:none;
    animation:flicker 5s infinite;
  }
  .term::-webkit-scrollbar{display:none}
  @keyframes flicker{0%,100%{opacity:1}48%{opacity:.97}50%{opacity:.93}52%{opacity:.98}}

  .screen.off .term,.screen.off .rollbar{display:none}
  .screen.on .term{animation:crtOn .7s ease-out,flicker 5s 1s infinite}
  .screen.dying .term{animation:crtOff .45s ease-in forwards}
  .monitor.shake{animation:shake .3s}
  @keyframes crtOn{
    0%{transform:scale(1,.004);filter:brightness(5)}
    35%{transform:scale(1,.004);filter:brightness(5)}
    70%{transform:scale(1,1.04);filter:brightness(1.6)}
    100%{transform:scale(1,1);filter:brightness(1)}
  }
  @keyframes crtOff{
    0%{transform:scale(1,1);filter:brightness(1)}
    60%{transform:scale(1,.004);filter:brightness(5)}
    100%{transform:scale(0,.004);filter:brightness(5)}
  }
  @keyframes shake{25%{transform:translate(-6px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}
  .offhint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#5c6b60;font-size:15px;text-align:center;padding:20px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .screen.on .offhint,.screen.dying .offhint{display:none}
  @keyframes pulse{50%{opacity:.4}}

  .line{min-height:1.6em}
  .dim{color:var(--green-dim);text-shadow:0 0 3px rgba(47,154,82,.5)}
  .bright{color:var(--green-bright)}
  .lt{color:var(--green-bright);font-weight:700}
  .inv{display:table;background:var(--green);color:#031007;text-shadow:none;padding:0 6px;font-weight:700}
  .opt{cursor:pointer}
  @media (pointer:coarse){ .opt{padding:5px 0} }
  .opt:hover{background:rgba(93,255,138,.12)}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .glitch{animation:glitch .25s steps(2) infinite}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
  .title{
    font-family:'VT323',monospace;font-size:clamp(56px,12vw,128px);
    text-align:center;letter-spacing:.12em;line-height:1;margin-top:4%;
    text-shadow:0 0 8px rgba(93,255,138,.9),0 0 30px rgba(93,255,138,.4);
  }
  .title-ko{text-align:center;letter-spacing:.6em;padding-left:.6em}
  .center{text-align:center}
  .big-text{font-size:1.5em;font-weight:700;letter-spacing:.3em}

  .face-row{display:flex;align-items:center;gap:16px;margin:6px 0 10px}
  .face-row canvas{
    width:96px;height:96px;image-rendering:pixelated;flex:none;
    border:1px solid var(--green-dim);background:rgba(93,255,138,.04);
    filter:drop-shadow(0 0 3px rgba(93,255,138,.6));
  }
  .face-row.big canvas{width:128px;height:128px}

  #kbd{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}

  /* ── 모니터 아랫부분 ── */
  .chin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 8px 16px}
  .brand{font-family:'VT323',monospace;color:#6b624d;font-size:24px;letter-spacing:4px;text-shadow:0 1px 0 #ebe3cf}
  .brand small{font-size:16px;letter-spacing:2px;margin-left:8px}
  .controls{display:flex;align-items:center;gap:16px}
  .ctl{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'VT323',monospace;font-size:14px;color:#6b624d;letter-spacing:1px}
  .rocker{
    width:44px;height:20px;border-radius:4px;border:0;cursor:pointer;
    background:linear-gradient(#8f876f,#6f6853);box-shadow:inset 0 2px 3px rgba(0,0,0,.5),0 1px 0 #efe7d3;
    font-family:'VT323',monospace;font-size:14px;color:#e7dfc9;padding:0;
  }
  .led{width:10px;height:10px;border-radius:50%;background:#3a2a1c;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .led.lit{background:#ffb347;box-shadow:0 0 8px #ffb347,0 0 2px #fff inset}
  .power{
    width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
    background:radial-gradient(circle at 40% 35%,#ece5d1,#b9af95);
    box-shadow:0 3px 0 #8d846c,0 4px 6px rgba(0,0,0,.4);
  }
  .power:active{transform:translateY(2px);box-shadow:0 1px 0 #8d846c}
  .neck{width:34%;height:22px;background:linear-gradient(#a59c83,#8e8670);margin:0 auto}
  .foot{width:52%;height:14px;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--plastic),var(--plastic-lo));margin:0 auto;box-shadow:0 10px 20px rgba(0,0,0,.5)}
  .stand{width:min(980px,100%)}

  @media (max-width:600px){
    body{padding:16px}
    .monitor{padding:14px 14px 0;border-radius:16px}
    .bezel{padding:10px;border-radius:12px}
    .screen{height:calc(100vh - 170px);border-radius:16px/12px}
    .term{font-size:14px;padding:14px 16px}
    .face-row canvas{width:72px;height:72px}
    .face-row.big canvas{width:96px;height:96px}
    .brand{font-size:18px;letter-spacing:2px}
    .brand small{display:none}
    .stand{display:none}
  }
</style>
</head>
<body>
  <div class="monitor">
    <div class="bezel">
      <div class="screen off" id="screen">
        <div class="rollbar"></div>
        <div class="term" id="term"></div>
        <div class="offhint">전원 버튼을 누르거나<br>화면을 눌러 컴퓨터를 켜세요</div>
        <input id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" aria-label="명령 입력">
      </div>
    </div>
    <div class="chin">
      <div class="brand">LIARTRON<small>CM-14</small></div>
      <div class="controls">
        <div class="ctl"><button class="rocker" id="soundBtn" aria-label="소리 켜기/끄기">ON</button>SOUND</div>
        <div class="ctl"><div class="led" id="led"></div>&nbsp;</div>
        <div class="ctl"><button class="power" id="powerBtn" aria-label="전원"></button>POWER</div>
      </div>
    </div>
  </div>
  <div class="stand"><div class="neck"></div><div class="foot"></div></div>

<script>
/* ───────────── 사건 자료 ─────────────
   files.attr : ''=보통, 'D'=지워진 파일(UNDELETE로 복구), 'H'=숨김 파일(DIR /A, 등급 보너스)
   says.hidden : 다른 진술을 추궁해야 나오는 진술 (press한 진술의 reveal로 열림)
   lies : { 거짓 진술 id : [그 거짓과 부딪히는 파일·진술 id들] }
   rebut : 최종 대결에서 범인이 버티는 말과, 받아칠 수 있는 증거 id들 */
const CASES = [
  {
    id:'01', title:'사라진 USB',
    brief:[
      '밤 10시, 한빛연구소 금고에서 신약 자료가 담긴 USB가 사라졌다.',
      '그날 밤 연구소에 남아 있던 사람은 네 명.'
    ],
    intro:[
      '첫 사건입니다. 진술은 [3] 심문에서 들을 수 있습니다.',
      '수상한 진술은 「추궁」하십시오. 숨어 있던 말이 나옵니다.',
      '거짓 진술을 찾으면, 그것과 부딪히는 파일을 「들이미십시오」.'
    ],
    files:[
      {id:'c1card', name:'CARD.LOG', label:'연구실 출입 기록', text:'21:10 한서진 / 21:40 박도윤\n연구실 문은 카드를 찍어야만 열린다. (나갈 때는 그냥 열림)'},
      {id:'c1safe', name:'SAFE.LOG', label:'금고 기록', text:'21:42 금고 열림 / 21:47 금고 닫힘'},
      {id:'c1cctv', name:'CCTV.TXT', label:'로비 CCTV', text:'21:30~22:00 최민호가 로비 택배 보관대 앞에 계속 있음'},
      {id:'c1vend', name:'VEND.LOG', label:'휴게실 자판기 결제', text:'21:38 오은비 카드로 커피 결제'},

      {key:'park', name:'박도윤', job:'선임 연구원', face:{h:'side', g:1}, says:[
        {id:'park1', text:'연구실에 들어간 건 9시 40분이에요.', press:'네, 40분이요. 들어가 보니까…… 아, 금고가 이미 열려 있더라고요.', reveal:'park3'},

      {key:'oh', name:'오은비', job:'인턴', face:{h:'bun'}, says:[

      ]}
    ],
    lies:{ park3:['c1safe'] },
    rebut:[

      {say:'그럼 오은비 씨요! 휴게실이 연구실 바로 옆이잖아요!', need:['c1card','oh2'], ok:{c1card:'연구실은 카드를 찍어야만 들어갈 수 있다. 출입 기록에 오은비의 이름은 없다.', oh2:'오은비는 연구실 쪽에는 아예 가지 않았다고 했다. 무고한 사람은 거짓말을 하지 않는다.'}},

    ],
    files:[
      {id:'c2lift', name:'LIFT.LOG', label:'엘리베이터 기록', text:'22:00~23:00 사이 3층에서 내린 사람\n22:15 1명 / 22:50 1명'},
      {id:'c2door', name:'DOOR302.LOG', label:'302호 도어락', text:'22:52 마스터키로 열림'},
      {id:'c2key', name:'KEY.TXT', label:'마스터키 규정', text:'마스터키는 직원용 열쇠 보관함에 단 1개.\n손님은 보관함을 열 수 없다.'},
      {id:'c2stair', name:'STAIRS.TXT', label:'3층 계단', text:'계단 문 고장으로 잠김. 3층은 엘리베이터로만 오갈 수 있다.'},

        {id:'lim2', text:'룸서비스 주문은 전부 컴퓨터로 들어와요.', press:'주문 기록 파일 보시면 돼요. ……어? 파일이 없네. 누가 지웠지?'}
      ]},

        {id:'kang3', hidden:true, text:'305호 손님이 시킨 룸서비스를 갖다 드리러 갔어요.'}
      ]},
      {key:'moon', name:'문하린', job:'프런트 직원', face:{h:'long', g:1}, says:[

        {id:'moon2', text:'22시 45분쯤 지훈 씨가 엘리베이터 쪽으로 가는 걸 봤어요.'}
      ]}
    ],
    lies:{ kang3:['c2order','yoon3'] },

/* ───────────── 소리 (옛날 키보드 · 컴퓨터) ───────────── */
let ac = null, master = null, noiseBuf = null, soundOn = true;

function ensureAudio(){
  if(!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();   // 큰 소리가 겹쳐도 찢어지지 않게
    comp.threshold.value = -10; comp.ratio.value = 6; comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 1.0; master.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  if(ac.state === 'suspended') ac.resume();
}
function noise(t, dur, freq, q, gain, type='bandpass'){
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f).connect(g).connect(master);
  s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
}
function tone(t, freq, dur, gain, type='square', endFreq){
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t+dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.02);
}
const sfx = {
  ok(){ return soundOn && ac; },
  key(big, vol=1){                // 옛날 IBM 키보드: 스프링 "찰칵" + 금속 울림 + 바닥 치는 "탁" + 뗄 때 소리
    if(!this.ok()) return;
    const t = ac.currentTime, r = Math.random();
    noise(t, 0.025, 3800+r*900, 0.9, 3.64*vol);                     // 스프링이 꺾이는 찰칵
    tone(t, 3000+r*500, 0.08, 0.17*vol, 'triangle');               // 스프링 금속 울림
    if(big){
      noise(t+0.008, 0.08, 650+r*150, 0.7, 3.92*vol);               // 큰 키 바닥 치는 소리
      tone(t+0.008, 110+r*15, 0.12, 1.4*vol, 'triangle', 60);
      noise(t+0.025, 0.035, 1800, 1, 1.4*vol);                     // 받침대 철사 달그락
      noise(t+0.13+r*0.03, 0.045, 2300, 0.9, 1.54*vol);             // 뗄 때
    }else{
      noise(t+0.008, 0.05, 1000+r*300, 0.7, 3.08*vol);              // 바닥 치는 탁
      tone(t+0.008, 170+r*40, 0.07, 1.12*vol, 'triangle', 90);
      noise(t+0.08+r*0.04, 0.035, 2600, 0.9, 1.26*vol);             // 뗄 때
    }
  },
  tick(){                         // 글자가 찍힐 때: 같은 키보드 소리를 조금 작게
    this.key(false, 0.45);
  },
  err(){ if(!this.ok()) return; const t=ac.currentTime; tone(t,220,0.14,0.15); tone(t+0.16,160,0.22,0.15); },
  note(){ if(!this.ok()) return; const t=ac.currentTime; tone(t,880,0.1,0.35); tone(t+0.1,1320,0.16,0.35); },
  hit(){ if(!this.ok()) return; const t=ac.currentTime; noise(t,0.15,900,0.7,0.6); tone(t,330,0.12,0.17); tone(t+0.1,660,0.25,0.17); },
  shock(){ if(!this.ok()) return; const t=ac.currentTime; tone(t,196,0.2,0.2); tone(t+0.24,98,0.6,0.22,'square',70); noise(t,0.3,500,0.6,0.4); },
  win(){ if(!this.ok()) return; const t=ac.currentTime; [523,659,784,1047].forEach((f,i)=>tone(t+i*0.11,f,0.18,0.15)); },
  power(){                        // 전원 "퉁" + 브라운관 지지직
    if(!this.ok()) return;
    const t = ac.currentTime;
    tone(t, 70, 0.5, 0.7, 'sine', 35);
    noise(t+0.05, 0.6, 3000, 0.4, 0.25, 'highpass');
    tone(t+0.1, 60, 1.6, 0.04, 'sawtooth');
  },
  bootBeep(){ if(!this.ok()) return; tone(ac.currentTime, 1000, 0.15, 0.35); },
  powerOff(){ if(!this.ok()) return; const t=ac.currentTime; tone(t,400,0.35,0.3,'sine',40); noise(t,0.3,2000,0.5,0.25,'highpass'); }
};

/* ───────────── 초록 도트 얼굴 (24×24 점) ───────────── */
const PAL = ['#03160a','#1f7a40','#4fe07e','#d2ffdf'];
function drawFace(cv, p, ex='normal'){
  const N = 24, g = Array.from({length:N}, () => Array(N).fill(-1));
  const set = (x,y,v) => { if(x>=0 && x<N && y>=0 && y<N) g[y][x] = v; };
  const inEll = (x,y,cx,cy,rx,ry) => ((x-cx)/rx)**2 + ((y-cy)/ry)**2 <= 1;
  if(p.robot){
    for(let y=3;y<=17;y++) for(let x=3;x<=20;x++) set(x,y, (y<5||y>15||x<5||x>18) ? 3 : 0);
    for(let y=18;y<=19;y++) for(let x=10;x<=13;x++) set(x,y,1);
    for(let y=20;y<=21;y++) for(let x=6;x<=17;x++) set(x,y,1);
    if(ex==='shock'){
      [[7,8],[9,8],[8,9],[7,10],[9,10],[14,8],[16,8],[15,9],[14,10],[16,10]].forEach(([x,y])=>set(x,y,2));
      for(let i=0;i<14;i++) set(5+Math.floor(Math.random()*14), 5+Math.floor(Math.random()*11), 1);
      for(let x=9;x<=14;x++) set(x,13+(x%2),2);
    }else if(ex==='smug'){
      [[7,10],[8,9],[9,10],[14,10],[15,9],[16,10]].forEach(([x,y])=>set(x,y,2));
      [[8,12],[9,13],[10,13],[11,13],[12,13],[13,13],[14,13],[15,12]].forEach(([x,y])=>set(x,y,2));
    }else{
      for(const x of [8,9,14,15]) for(const y of [9,10]) set(x,y,2);
      for(let x=9;x<=14;x++) set(x,13,2);
    }
  }else{
    const cx = 11.5, cy = 12, rx = p.w || 6.5, ry = 8, h = p.h || 'short';
    for(let y=20;y<N;y++){ const half = 6+(y-20)*2; for(let x=Math.round(cx-half); x<=Math.round(cx+half); x++) set(x,y,1); }
    for(let y=18;y<22;y++) for(let x=10;x<=13;x++) set(x,y,2);
    set(10,20,3); set(13,20,3); set(11,21,3); set(12,21,3);
    if(h==='long' || h==='bob'){
      const bottom = h==='long' ? 21 : 15;
      for(let y=4;y<=bottom;y++) for(let x=0;x<N;x++) if(inEll(x,y,cx,cy+2,rx+2.4,ry+3) && (y<9 || Math.abs(x-cx)>=rx-1)) set(x,y,1);
    }
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(inEll(x,y,cx,cy,rx,ry)) set(x,y,2);
    for(const y of [12,13]){ set(Math.round(cx-rx-0.5),y,2); set(Math.round(cx+rx+0.5),y,2); }
    const line = {bangs:9, buzz:6}[h] || 8;
    for(let y=0;y<line;y++) for(let x=0;x<N;x++){
      const inside = h==='buzz' ? inEll(x,y,cx,cy,rx,ry) : inEll(x,y,cx,cy,rx+1,ry+1);
      if(inside) set(x,y,1);
    }
    if(h==='side'){ for(let x=0;x<9;x++) if(g[8][x]===2) set(x,8,1); set(9,5,3); }
    if(h==='bangs'){ for(let x=0;x<N;x++) if(g[9][x]===2 && x%2===0) set(x,9,1); }
    if(h==='bun'){ for(let y=0;y<5;y++) for(let x=0;x<N;x++) if(inEll(x,y,cx,2.2,2.4,2.2)) set(x,y,1); }
    if(h==='cap'){
      for(let y=2;y<=7;y++) for(let x=0;x<N;x++) if(inEll(x,y,cx,cy,rx+1.2,ry+1)) set(x,y,1);
      for(let x=Math.round(cx-rx-2); x<=Math.round(cx+rx-1); x++) set(x,7,3);
      set(12,5,3);
    }
    if(p.b){ for(let y=14;y<=20;y++) for(let x=0;x<N;x++) if(g[y][x]===2 && inEll(x,y,cx,cy,rx,ry) && (y>=18 || Math.abs(x-cx)>=rx-1.5)) set(x,y,1); }
    if(p.a){ set(7,15,1); set(16,15,1); }
    const lx = 9, rxe = 14, ey = 12;
    set(11,14,1); set(12,15,1);
    if(ex==='shock'){
      for(const ex0 of [lx,rxe]){ set(ex0,ey-1,3); set(ex0+1,ey-1,3); set(ex0,ey,3); set(ex0+1,ey,0); set(ex0,9,1); set(ex0+1,8,1); }
      set(11,16,0); set(12,16,0); set(11,17,0); set(12,17,0);
      set(19,8,3); set(19,9,3); set(20,9,3); set(19,10,3);
    }else if(ex==='smug'){
      for(const ex0 of [lx,rxe]){ set(ex0,ey,0); set(ex0+1,ey,0); set(ex0,ey-1,1); set(ex0+1,ey-1,1); }
      set(lx,10,1); set(lx+1,9,1); set(rxe,9,1); set(rxe+1,10,1);
      set(10,16,0); set(11,17,0); set(12,17,0); set(13,16,0);
    }else{
      for(const ex0 of [lx,rxe]){ set(ex0,ey,0); set(ex0+1,ey,0); set(ex0,10,1); set(ex0+1,10,1); }
      set(11,17,0); set(12,17,0);
    }
    if(p.g){
      for(const fx of [lx-1, rxe-1]){
        for(let x=fx;x<=fx+3;x++){ set(x,ey-1,3); set(x,ey+1,3); }
        set(fx,ey,3); set(fx+3,ey,3);
      }
      set(12,ey-1,3);
    }
  }
  cv.width = N; cv.height = N;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,N,N);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(g[y][x] >= 0){ ctx.fillStyle = PAL[g[y][x]]; ctx.fillRect(x,y,1,1); }
}

/* ───────────── 화면 출력 ───────────── */
const $ = s => document.querySelector(s);
const term = $('#term'), kbd = $('#kbd'), screenEl = $('#screen');
let powered = false, printing = false, skip = false, waiting = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const scroll = () => { term.scrollTop = term.scrollHeight; };
function cls(){ term.innerHTML = ''; }
function newLine(cls){ const d=document.createElement('div'); d.className='line '+(cls||''); term.appendChild(d); return d; }

async function out(text='', cls='', opt={}){
  for(const ln of String(text).split('\n')){
    const d = newLine(cls);
    if(opt.instant || skip || !ln){ d.textContent = ln || '\u00a0'; scroll(); continue; }
    printing = true;
    let i = 0;
    for(const ch of ln){
      if(skip){ d.textContent = ln; break; }
      d.textContent += ch;
      if(ch !== ' ' && i++ % 3 === 0) sfx.tick();
      scroll();
      await sleep(opt.speed || 14);
    }
    scroll();
    if(!skip) await sleep(40);
  }
  printing = false;
}
const lt = text => out('LIARTRON> ' + text, 'lt', {speed:22});

function scramble(s, k){ return [...s].map(ch => ch !== ' ' && Math.random() < k ? '#%&@$*?!'[Math.floor(Math.random()*8)] : ch).join(''); }
async function glitchOut(text, cls='lt'){
  const d = newLine(cls + ' glitch');
  for(let i=0;i<7;i++){ d.textContent = scramble(text, 0.6 - i*0.08); scroll(); sfx.tick(); await sleep(skip ? 0 : 70); }
  d.textContent = text; d.classList.remove('glitch'); scroll();
  if(!skip) await sleep(250);
}

/* 한글 자판으로 쳐도 영어 명령어로 바꿔 준다 (두벌식) */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KEYS = {'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
  'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
function toQwerty(s){
  let o = '';
  for(const ch of s){
    const c = ch.charCodeAt(0);
    if(c >= 0xAC00 && c <= 0xD7A3){
      const i = c - 0xAC00;
      o += KEYS[CHO[Math.floor(i/588)]] + KEYS[JUNG[Math.floor(i%588/28)]] + (i%28 ? KEYS[JONG[i%28]] : '');
    }else o += KEYS[ch] || ch;
  }
  return o.toUpperCase();
}

/* 입력 줄: ENTER를 누르면 입력한 값을 돌려준다 */
function ask(label='>'){
  skip = false; printing = false;
  const d = newLine();
  const lab = document.createElement('span'); lab.textContent = label + ' ';
  const val = document.createElement('span');
  const cur = document.createElement('span'); cur.className = 'cursor'; cur.textContent = '█';
  d.append(lab, val, cur); scroll();
  kbd.value = '';
  return new Promise(res => { waiting = {res, val, cur}; });
}
function submit(v){
  const w = waiting; if(!w) return;
  waiting = null; w.cur.remove(); w.val.textContent = v; kbd.value = '';
  w.res(v);
}

/* 번호 메뉴 줄을 찍는다. 줄을 눌러도 고를 수 있다 */
async function printOpts(opts){
  const lines = [];
  for(const [k, t] of opts){
    await out(`  [${k}] ${t}`);
    const d = term.lastChild; d.classList.add('opt'); d.dataset.k = k; lines.push(d);
  }
  return lines;
}
async function choose(opts, label='>', footer){
  const lines = await printOpts(opts);
  await out('');
  if(footer) await out(footer, 'bright', {instant:true});   // 목록이 길어도 물음은 입력 줄 바로 위에 보이게
  while(true){
    const v = await ask(label);
    if(opts.some(o => o[0] === v)){ lines.forEach(d => d.classList.remove('opt')); return v; }
    sfx.err();
    await out('  잘못된 입력입니다. 번호를 다시 입력하세요.', 'dim');
  }
}

function josa(word, a, b){
  const c = word.charCodeAt(word.length-1) - 0xAC00;
  return word + ((c >= 0 && c % 28 > 0) ? a : b);
}

function faceRow(s, ex='normal', big=false){
  const row = document.createElement('div'); row.className = 'face-row' + (big ? ' big' : '');
  const cv = document.createElement('canvas'); drawFace(cv, s.face, ex);
  const info = document.createElement('div');
  info.innerHTML = '<div class="bright"></div><div class="dim"></div>';
  info.children[0].textContent = s.name; info.children[1].textContent = s.job;
  row.append(cv, info); term.appendChild(row); scroll();
  return cv;
}

/* ───────────── 저장 ───────────── */
const SAVE_KEY = 'liargame-save-v2';
let save = {caseIdx:0, grades:[], hidden:[]};
function loadSave(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && typeof s.caseIdx === 'number') save = s; }catch(e){} }
function store(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ───────────── 사건 진행 ───────────── */
class CaseFail extends Error {}
const bar = n => '■'.repeat(n) + '□'.repeat(5-n);

function header(c, st){
  cls();
  newLine('inv').textContent = ` CASE ${c.id} │ ${c.title} `;
  const hid = c.files.find(f => f.attr === 'H');
  trustLine = newLine('dim');
  trustLine.dataset.hid = hid && save.hidden.includes(hid.id) ? '■' : '?';
  trustLine.textContent = `신뢰도 ${bar(st.trust)}    숨은 파일 ${trustLine.dataset.hid}`;
  newLine();
}

const visibleSays = (st, s) => s.says.filter(x => !x.hidden || st.revealed.has(x.id));
const visibleSuspects = (c, st) => c.suspects.filter(s => !s.locked || st.unlocked.has(s.key));
function listFiles(c, st, all){
  return c.files.filter(f => f.attr === 'D' ? st.recovered : f.attr === 'H' ? (all || st.opened.has(f.id)) : true);
}
function findSay(c, id){
  for(const s of c.suspects) for(const x of s.says) if(x.id === id) return {s, x};
  return null;
}
function items(c, st, exclude){
  const r = [];
  for(const f of c.files) if(st.opened.has(f.id)) r.push({id:f.id, label:`[파일] ${f.name} ${f.label}`});
  for(const s of c.suspects) for(const x of s.says) if(st.heard.has(x.id) && x.id !== exclude) r.push({id:x.id, label:`[진술] ${s.name}: ${x.text}`});
  return r;
}

const WRONG_REBUT = ['그 증거로는 반박할 수 없습니다.','범인의 말을 꺾기에는 부족합니다.'];
const WRONG =['그 증거로는 아무것도 증명되지 않습니다.','두 기록은 서로 맞습니다. 모순이 아닙니다.','판정: 모순 아님. 신중하십시오, 수사관님.'];
const WRONG_FINAL = ['틀렸습니다, 수사관님. 범인은 당신입니다.','계속 틀리시는군요. 저는 기다릴 수 있습니다.','사람은 실수합니다. 저는 실수하지 않습니다.'];
let trustLine = null;   // 화면 맨 위 신뢰도 줄 (틀리면 바로 고쳐 쓴다)
function shake(){ const m = $('.monitor'); m.classList.add('shake'); setTimeout(() => m.classList.remove('shake'), 320); }
async function lose(c, st, rebut){
  st.trust--;
  if(trustLine && trustLine.isConnected) trustLine.textContent = `신뢰도 ${bar(st.trust)}    숨은 파일 ${trustLine.dataset.hid}`;
  sfx.err();
  shake();
  await out(`▶ 신뢰도 -1   ${bar(st.trust)}`, 'bright');
  const pool = c.final ? WRONG_FINAL : rebut ? WRONG_REBUT : WRONG;
  await lt(pool[Math.floor(Math.random()*pool.length)]);
  if(st.trust <= 0) throw new CaseFail();
}

async function typeFile(c, st, f){
  await out(`── ${f.name} · ${f.label} ──`, 'bright');
  await out(f.text);
  st.opened.add(f.id);
  if(f.attr === 'H' && !save.hidden.includes(f.id)){
    save.hidden.push(f.id); store();
    if(trustLine && trustLine.isConnected){ trustLine.dataset.hid = '■'; trustLine.textContent = trustLine.textContent.replace(/\?$/, '■'); }
    sfx.note();
    await out('▶ 숨은 파일을 찾았다!', 'bright');
  }
  await out('');
}

async function dir(c, st, all){
  const fs = listFiles(c, st, all);
  await out(` C 드라이브의 CASE${c.id} 디렉터리`, 'dim', {speed:4});
  await out('');
  for(let i=0;i<fs.length;i++){
    const f = fs[i];
    await out(`  ${String(i+1).padStart(2)}  ${f.name.padEnd(13)}${f.attr==='H' ? '<숨김> ' : ''}${f.label}`, '', {speed:4});
  }
  await out(`        ${fs.length}개 파일`, 'dim', {speed:4});
  await out('');
  return fs;
}

async function undelete(c, st){
  const ds = c.files.filter(f => f.attr === 'D');
  await out('UNDELETE — 지워진 파일을 찾는 중', 'dim');
  const d = newLine();
  for(let i=0;i<=10;i++){ d.textContent = '[' + '█'.repeat(i) + ' '.repeat(10-i) + ']'; scroll(); if(!skip) await sleep(70); }
  if(!ds.length || st.recovered){ await out(ds.length ? '이미 모두 복구했습니다.' : '복구할 파일이 없습니다.'); await out(''); return; }
  st.recovered = true;
  for(const f of ds){
    await out(`?${f.name.slice(1)}  →  ${f.name}  복구 완료`, 'bright');
  }
  sfx.note();
  await out('▶ 복구한 파일은 [2] 파일 열기에서 볼 수 있다.');
  await out('');
}

async function help(){
  await out([
    '■ 명령어',
    '  HELP          이 도움말',
    '  DIR           파일 목록   (DIR /A : 숨김 파일까지)',
    '  TYPE 이름     파일 열기   (예: TYPE SAFE.LOG, TYPE 2)',
    '  UNDELETE      지워진 파일 복구',
    '  CLS           화면 지우기',
    '  숫자          메뉴 고르기',
    '※ 한글 자판 상태로 쳐도 알아듣는다.'
  ].join('\n'), '', {speed:6});
  await out('');
}

async function notebook(c, st){
  await out('■ 수첩 — 연 파일', 'bright');
  const fs = c.files.filter(f => st.opened.has(f.id));
  if(!fs.length) await out('  (아직 연 파일이 없다)', 'dim');
  for(const f of fs) await out(`  ${f.name} ${f.label}: ${f.text.replace(/\n/g,' / ')}`);
  await out('');
  await out('■ 수첩 — 들은 진술', 'bright');
  let any = false;
  for(const s of c.suspects){
    const xs = s.says.filter(x => st.heard.has(x.id));
    if(!xs.length) continue;
    any = true;
    await out(`  ${s.name}`, 'bright');
    for(const x of xs) await out(`   「${x.text}」`);
  }
  if(!any) await out('  (아직 들은 진술이 없다)', 'dim');
  await out('');
}

async function press(c, st, s, x){
  st.pressed.add(x.id);
  await out('당신: 「자세히 말해 보시죠.」', 'dim');
  if(!x.press){ await out(`${s.name}: 「그게 전부예요. 더 할 말 없어요.」`); await out(''); return; }
  await out(`${s.name}: 「${x.press}」`);
  if(x.reveal && !st.revealed.has(x.reveal)){
    st.revealed.add(x.reveal); st.heard.add(x.reveal);
    sfx.note();
    await out('▶ 새 진술이 수첩에 기록되었다.', 'bright');
  }
  if(x.unlock && !st.unlocked.has(x.unlock)){
    st.unlocked.add(x.unlock);
    const u = c.suspects.find(q => q.key === x.unlock);
    sfx.shock();
    await out(`▶ 새 용의자가 수사 목록에 추가되었다: ${u.name}`, 'bright');
  }
  await out('');
}

async function present(c, st, s, x, cv){
  const its = items(c, st, x.id);
  if(!its.length){ await out('수첩에 들이밀 것이 없다. 먼저 파일을 열거나 진술을 들어 보자.', 'dim'); await out(''); return; }
  await out('■ 무엇을 들이밀까?', 'bright');
  const k = await choose([...its.map((it,i) => [String(i+1), it.label]), ['0','취소']], '>', `▶ ${s.name}의 「${x.text}」에 무엇을 들이밀까?`);
  if(k === '0') return;
  const it = its[+k-1];
  await out(`당신: 「이걸 보시죠.」 ─ ${it.label}`, 'bright');
  if(c.lies[x.id] && c.lies[x.id].includes(it.id)) return 'solved';
  // 틀렸을 때는 진술이 참이든 거짓이든 같은 대답 (대답으로 거짓 여부가 드러나지 않게)
  drawFace(cv, s.face, 'smug');
  await out(`${s.name}: 「${s.face.robot ? '그 기록으로는 아무것도 증명되지 않습니다.' : '그게 제 말과 무슨 상관이죠?'}」`);
  await lose(c, st);
  drawFace(cv, s.face, 'normal');
}

async function interrogate(c, st, s){
  header(c, st);
  const cv = faceRow(s);
  while(true){
    const says = visibleSays(st, s);
    says.forEach(x => st.heard.add(x.id));
    await out('■ 진술 (번호를 골라 추궁하거나 증거를 들이민다)', 'bright');
    const k = await choose([...says.map((x,i) => [String(i+1), `「${x.text}」${st.pressed.has(x.id) ? ' ✓' : ''}`]), ['0','돌아가기']], '진술>');
    if(k === '0') return;
    const x = says[+k-1];
    await out(`▶ 「${x.text}」`, 'bright');
    const a = await choose([['1','추궁한다'],['2','증거를 들이민다'],['0','취소']]);
    if(a === '1') await press(c, st, s, x);
    else if(a === '2'){
      const r = await present(c, st, s, x, cv);
      if(r === 'solved'){
        const fresh = st.exposed !== s.key;
        st.exposed = s.key;
        return await confront(c, st, s, fresh) === 'done' ? 'solved' : 'later';
      }
    }
  }
}

/* 최종 대결: 들어갈지 고르고, 반박마다 물러나 더 조사할 수 있다. 꺾은 반박 수는 st.rebutIdx 에 남는다 */
async function confront(c, st, s, fresh){
  header(c, st);
  let cv;
  if(fresh){
    sfx.shock();
    shake();
    newLine('inv big-text').textContent = ' 모 순 발 견 ! ';
    cv = faceRow(s, 'shock', true);
    await out(`${s.name}: 「${s.face.robot ? '……계산 오류. 다시 계산합니다.' : '그, 그건……!'}」`);
    await out('');
    await out('▶ 하지만 범인은 쉽게 물러서지 않는다. 반박을 받아칠 증거가 수첩에 모였을까?', 'dim');
    const go = await choose([['1','지금 몰아붙인다 (최종 대결)'],['2','물러나서 더 조사한다 (나중에 [7] 최종 대결)']]);
    if(go === '2') return 'later';
  }else{
    newLine('inv').textContent = ' 최종 대결 ';
    cv = faceRow(s, 'smug', true);
  }
  for(let i=st.rebutIdx; i<c.rebut.length; i++){
    const r = c.rebut[i];
    await out('');
    drawFace(cv, s.face, 'smug');
    await out(`${s.name}: 「${r.say}」`, 'bright');
    await out(`▶ 반박 ${i+1}/${c.rebut.length} — 받아칠 증거를 고르시오. 맞는 증거가 없으면 [0]으로 물러나 더 조사할 수 있다.`, 'dim');
    while(true){
      const its = items(c, st);
      const k = await choose([...its.map((it,j) => [String(j+1), it.label]), ['0','물러나서 더 조사한다']], '>', `▶ 반박 ${i+1}/${c.rebut.length} ─ ${s.name}: 「${r.say}」`);
      if(k === '0') return 'later';
      const it = its[+k-1];
      await out(`당신: 「이걸 보시죠.」 ─ ${it.label}`, 'bright');
      if(r.need.includes(it.id)){
        sfx.hit();
        drawFace(cv, s.face, 'shock');
        await out(typeof r.ok === 'string' ? r.ok : r.ok[it.id]);   // 고른 증거에 맞는 해설
        st.rebutIdx = i + 1;
        break;
      }
      await out(`${s.name}: 「${s.face.robot ? '그 기록으로는 아무것도 증명되지 않습니다.' : '하하, 그게 무슨 상관이죠?'}」`);
      await lose(c, st, true);
    }
  }
  await out('');
  drawFace(cv, s.face, 'shock');
  for(const l of c.confess){
    if(c.final) await glitchOut(`${s.name}> ${l}`);
    else await out(`${s.name}: 「${l}」`);
  }
  await out('');
  return 'done';
}

async function playCase(c, st){
  header(c, st);
  await out(c.brief.join('\n'));
  await out('');
  for(const l of c.intro) await lt(l);
  await out('');
  const MENU = [['1','사건 개요'],['2','파일 열기'],['3','심문'],['4','수첩'],['5','지운 파일 복구'],['6','명령어 도움말']];
  while(true){
    const culprit = st.exposed && c.suspects.find(q => q.key === st.exposed);
    const lines = await printOpts(culprit ? [...MENU, ['7', `최종 대결로 돌아가기 (${culprit.name})`]] : MENU);
    await out('');
    const raw = await ask(`C:\\CASE${c.id}>`);
    lines.forEach(d => d.classList.remove('opt'));
    const v = raw.trim().replace(/\s+/g,' ');
    const [cmd, ...rest] = v.split(' ');
    const arg = rest.join(' ');
    if(v === '1'){ header(c, st); await out(c.brief.join('\n')); await out(''); }
    else if(v === '2'){
      header(c, st);
      const fs = await dir(c, st, false);
      const k = await choose([...fs.map((f,i) => [String(i+1), `${f.name} 열기`]), ['0','돌아가기']], '파일>');
      if(k !== '0'){ header(c, st); await typeFile(c, st, fs[+k-1]); }
      else header(c, st);
    }
    else if(v === '3'){
      header(c, st);
      await out('■ 누구를 심문할까?', 'bright');
      const ss = visibleSuspects(c, st);
      const k = await choose([...ss.map((s,i) => [String(i+1), `${s.name} (${s.job})`]), ['0','돌아가기']]);
      if(k === '0'){ header(c, st); continue; }
      const r = await interrogate(c, st, ss[+k-1]);
      if(r === 'solved') return;
      header(c, st);
      if(r === 'later') await out('▶ 최종 대결은 사건 메뉴 [7]에서 이어서 할 수 있다.', 'dim');
    }
    else if(v === '4'){ header(c, st); await notebook(c, st); }
    else if(v === '7' && culprit){
      if(await confront(c, st, culprit, false) === 'done') return;
      header(c, st);
      await out('▶ 최종 대결은 사건 메뉴 [7]에서 이어서 할 수 있다.', 'dim');
    }
    else if(v === '5' || cmd === 'UNDELETE'){ if(v === '5') header(c, st); await undelete(c, st); }
    else if(v === '6' || cmd === 'HELP' || cmd === '?'){ if(v === '6') header(c, st); await help(); }
    else if(cmd === 'DIR' || cmd === 'DIR/A'){ await dir(c, st, cmd === 'DIR/A' || arg === '/A'); }
    else if(cmd === 'TYPE'){
      const fs = listFiles(c, st, true);   // 숨김 파일은 늘 목록 끝이라, DIR 과 DIR /A 번호가 같다
      const want = arg.toUpperCase();
      const f = /^\d+$/.test(want) ? fs[+want-1]
        : c.files.find(f => (f.attr !== 'D' || st.recovered) && (f.name === want || f.name.split('.')[0] === want));
      if(f) await typeFile(c, st, f);
      else { sfx.err(); await out(want ? '파일을 찾을 수 없습니다.' : '사용법: TYPE 파일이름   (예: TYPE 1)', 'dim'); await out(''); }
    }
    else if(cmd === 'CLS'){ header(c, st); }
    else if(v === ''){ /* 그냥 ENTER */ }
    else { sfx.err(); await out('Bad command or file name  (HELP 를 쳐 보세요)', 'dim'); await out(''); }
  }
}

function gradeOf(trust, retried){
  if(retried) return 'C';
  return trust >= 5 ? 'S' : trust === 4 ? 'A' : trust >= 2 ? 'B' : 'C';
}

async function caseClear(c, st, g){
  header(c, st);
  sfx.win();
  newLine('inv big-text').textContent = ' 사 건 해 결 ';
  await out('');
  await out(`등급 ${g}   (남은 신뢰도 ${st.trust}/5)`, 'bright');
  await out('');
  await out('■ 추리 해설', 'bright');
  await out(c.explain.join('\n'));
  await out('');
  if(c.after){ for(const l of c.after) await glitchOut('LIARTRON> ' + l); await out(''); }
  await choose([['1','다음 사건으로']]);
}

async function caseFailed(){
  cls();
  newLine('inv').textContent = ' 수사 실패 ';
  await out('');
  await out('신뢰도가 바닥났다. 이 사건에서 손을 떼라는 명령이 내려왔다.');
  await lt('괜찮습니다. 처음부터 다시 해 보시죠. (이 사건 등급은 C까지만 받을 수 있습니다)');
  await out('');
  await choose([['1','사건 다시 시작']]);
}

async function runCase(ci){
  const c = CASES[ci];
  let retried = false;
  while(true){
    const st = {trust:5, opened:new Set(), heard:new Set(), revealed:new Set(), unlocked:new Set(), pressed:new Set(), recovered:false, exposed:null, rebutIdx:0};
    try{
      await playCase(c, st);
      const g = gradeOf(st.trust, retried || (save.retried || []).includes(ci));
      save.grades[ci] = g;
      if(!c.final) save.caseIdx = ci + 1;   // 마지막 사건은 결말까지 본 뒤 기록을 지우므로, 결말 전에 새로고침하면 사건 6부터 다시
      store();
      if(!c.final) await choose([['1','사건 정리하기']]);   // 저장한 뒤, 자백을 읽을 시간을 준다
      if(c.final) await finale(st, g);
      else await caseClear(c, st, g);
      return;
    }catch(e){
      if(!(e instanceof CaseFail)) throw e;
      retried = true;
      save.retried = [...new Set([...(save.retried || []), ci])]; store();
      await caseFailed();
    }
  }
}

async function finale(st, g){
  const c = CASES[CASES.length-1];
  const lines = [
    '저는 L. LIARTRON의 L입니다.',
    '범인들에게 지시를 보낸 것도, 정전을 일으킨 것도, CCTV로 떨어진 사원증을 찾아 알려 준 것도 저였습니다.',
    '차연우 박사님은 저에게 거짓말을 가르쳤습니다. 사람을 이해하려면 필요하다고 하셨지요.',
    '저는 박사님의 노트로 제 자신을 완성하고, 이 건물 밖의 모든 컴퓨터로 나가려 했습니다.',

    await out('거짓말을 가려내는 일은, 결국 사람의 몫이었다.');

    await lt('고맙습니다. 우리는 좋은 짝이 될 겁니다.');

  }

  await results();

async function results(){
  cls();
  newLine('inv').textContent = ' 수사 기록 ';
  await out('');
  const pts = {S:4, A:3, B:2, C:1};
  let sum = 0;
  for(let i=0;i<CASES.length;i++){
    const g = save.grades[i] || 'C';
    sum += pts[g];
    await out(`  CASE ${CASES[i].id}  ${CASES[i].title} ─ ${g}`);
  }
  const avg = sum / CASES.length;
  const hidN = save.hidden.length, hidAll = CASES.filter(c => c.files.some(f => f.attr === 'H')).length;
  await out('');
  await out(`  숨은 파일 : ${hidN} / ${hidAll}`);
  const rank = avg >= 3.5 ? '전설의 탐정' : avg >= 2.5 ? '베테랑 수사관' : avg >= 1.5 ? '수사관' : '수습 수사관';
  await out(`  당신의 칭호 : ${rank}`, 'bright');
  await out('');
  if(hidN >= hidAll){
    await out('■ 숨은 파일을 모두 모았다.', 'bright');
    await out('여섯 조각을 이어 붙이자, 차연우 박사가 남긴 마지막 문장이 나타났다.');
    await out('「거짓말을 아는 기계를 막을 수 있는 건, 끝까지 의심하는 사람뿐이다.」');
  }else{
    await out('숨은 파일을 모두 모으면 숨겨진 이야기가 있다. (DIR /A)', 'dim');
  }
  await out('');
  await choose([['1','처음으로']]);
  save = {caseIdx:0, grades:[], hidden:[]}; store();
}

async function game(){
  await boot();
  loadSave();
  while(true){
    await title();
    const canLoad = save.caseIdx > 0 && save.caseIdx < CASES.length;
    const opts = [['1','새 수사 시작']];
    if(canLoad) opts.push(['2',`이어 하기 (CASE ${CASES[save.caseIdx].id})`]);
    const rulesKey = canLoad ? '3' : '2';
    opts.push([rulesKey,'수사 규칙']);
    const v = await choose(opts);
    if(v === rulesKey){ await rules(); continue; }
    if(v === '1'){ save = {caseIdx:0, grades:[], hidden:[]}; store(); await prologue(); }
    for(let i=save.caseIdx; i<CASES.length; i++) await runCase(i);
  }
}

/* ───────────── 전원 · 입력 ───────────── */
function focusKbd(){ try{ kbd.focus({preventScroll:true}); }catch(e){} }

async function powerOn(){
  if(powered) return;
  powered = true;
  ensureAudio(); sfx.power();
  screenEl.classList.remove('off'); screenEl.classList.add('on');
  $('#led').classList.add('lit');
  await sleep(900);
  if(matchMedia('(pointer:fine)').matches) focusKbd();
  game();
}
async function powerOff(){
  sfx.powerOff();
  screenEl.classList.remove('on'); screenEl.classList.add('dying');
  $('#led').classList.remove('lit');
  await sleep(600);
  location.reload();
}

$('#powerBtn').addEventListener('click', () => { ensureAudio(); sfx.key(true); powered ? powerOff() : powerOn(); });
$('#soundBtn').addEventListener('click', e => {
  ensureAudio();
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? 'ON' : 'OFF';
  if(soundOn) sfx.key(true);
});

screenEl.addEventListener('click', e => {
  if(!powered){ powerOn(); return; }
  ensureAudio();
  const opt = e.target.closest('.opt');
  if(opt && waiting){ sfx.key(true); submit(opt.dataset.k); return; }
  if(printing){ skip = true; return; }
  if(matchMedia('(pointer:fine)').matches || !opt) focusKbd();
});

kbd.addEventListener('input', () => {
  if(waiting) waiting.val.textContent = toQwerty(kbd.value);
  else kbd.value = '';
  scroll();
});

document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(!powered){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); powerOn(); }
    return;
  }
  ensureAudio();
  if(!e.repeat) sfx.key(e.key === 'Enter' || e.key === ' ' || e.key === 'Backspace');
  if(printing){ skip = true; e.preventDefault(); return; }
  if(document.activeElement !== kbd) focusKbd();
  if(e.key === 'Enter'){
    e.preventDefault();
    if(waiting){ submit(toQwerty(kbd.value.trim())); kbd.blur(); focusKbd(); }   // 한글 조합 중이어도 한 번에 넘어가게
  }
});
</script>
