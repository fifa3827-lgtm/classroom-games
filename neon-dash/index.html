<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DASH! 전력질주!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* DASH! 전력질주! — 맑은 날 학교 운동장 */
:root{
  --sky:#7fd0ff; --sky2:#d9f2ff; --ground:#e9b77a; --grass:#7ccf5a;
  --ink:#1f2a5a; --ink-dim:#5d6899; --panel:#ffffff; --line:#d7def2; --danger:#e53950;
  --accent:#ff7a1a; --accent-d:#d85a00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--sky);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow:auto}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen.on{display:flex}

/* 하늘 + 운동장 (그림이 있으면 그림을 깐다) */
#lobby,#room,#result{
  background:
    linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.25) 100%),
    var(--bgimg,none) center bottom/cover no-repeat,
    linear-gradient(180deg,var(--sky) 0%,var(--sky2) 62%,var(--grass) 62%,var(--grass) 70%,var(--ground) 70%);
}
.title{margin:0;text-align:center;line-height:.92;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;color:#fff;
  -webkit-text-stroke:0;paint-order:stroke fill;
  text-shadow:0 5px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 5px 0 var(--ink),-4px 5px 0 var(--ink),0 10px 0 rgba(31,42,90,.25)}
.title .t1{display:block;font-size:clamp(64px,15vw,132px);color:#ffe14a;transform:rotate(-4deg)}
.title .t2{display:block;font-size:clamp(36px,8vw,70px);color:#fff;margin-top:4px}
#lobby .sub{color:var(--ink);background:rgba(255,255,255,.75);border-radius:99px;padding:6px 16px;margin:14px 0 22px;font-size:16px;font-weight:700;text-align:center}
.card{width:min(520px,100%);background:var(--panel);border:3px solid var(--ink);border-radius:24px;padding:22px;box-shadow:0 8px 0 var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:14px;color:var(--ink-dim);margin-bottom:6px;font-weight:700}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#f6f8ff;color:var(--ink);font-size:20px;outline:none}
.field input:focus{border-color:var(--ink)}
.swatches{display:flex;gap:10px;justify-content:space-between;margin-bottom:20px}
.sw{flex:1;aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line);transition:transform .12s}
.sw.sel{box-shadow:0 0 0 4px var(--ink);transform:scale(1.14)}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:24px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px)}
.btn.primary{background:var(--accent);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 var(--accent-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);font-size:20px;padding:13px}
.btn:disabled{opacity:.4}
.stack{display:flex;flex-direction:column;gap:12px}
#joinCode{flex:1 1 0;min-width:0;width:0;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:#f6f8ff;color:var(--ink);font-size:22px;letter-spacing:.15em;text-align:center;outline:none}
#joinCode::placeholder{letter-spacing:0;font-size:18px;color:var(--ink-dim)}
#joinCode:focus{border-color:var(--ink)}
#btnJoin{flex:none;width:auto;padding:12px 22px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role{padding:14px 10px;border-radius:16px;border:2px solid var(--line);font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:24px;line-height:1.1;text-align:center;background:#f6f8ff}
.role small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--ink-dim);margin-top:4px}
.role.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.role.sel small{color:#c9d2ff}
.notice{font-size:14px;line-height:1.5;color:var(--ink-dim);margin:0 0 16px;text-align:center}
.notice.off{color:#8a1b2b;background:#ffe9ec;border:1px solid #ffb3bf;border-radius:12px;padding:10px 12px;text-align:left}
#btnTest{font-size:17px;padding:10px;margin:-6px 0 6px}
.testOut{margin:0 0 14px;text-align:center;font-size:15px;line-height:1.5;min-height:0}
.testOut:empty{display:none}
.testOut.ok{color:#1f8a3a}.testOut.warn{color:#b07800}.testOut.bad{color:#c62a3e}
#netDown{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--danger);color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;font-size:16px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
body.netDown #netDown{display:block}
.specDesc{color:var(--ink-dim);font-size:16px;line-height:1.6;margin:0 0 16px}
.hint{color:var(--ink-dim);font-size:14px;text-align:center;margin-top:14px;line-height:1.5}
.err{color:var(--danger);font-size:15px;text-align:center;min-height:20px;margin-top:8px}

#room .code{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(64px,16vw,140px);line-height:1;letter-spacing:.12em;margin:0;color:#fff;
  text-shadow:0 5px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 5px 0 var(--ink),-4px 5px 0 var(--ink)}
#room .codeLabel{color:var(--ink);background:rgba(255,255,255,.8);border-radius:99px;padding:4px 14px;font-size:16px;font-weight:700;margin-bottom:8px}
#qr{background:#fff;padding:10px;border-radius:16px;border:3px solid var(--ink);margin:14px 0 4px}
#qr canvas,#qr img{display:block}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%);margin:18px 0}
.pl{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:54px;box-shadow:0 3px 0 var(--ink)}
.pl i{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.pl .av{width:34px;height:34px;flex:none;object-fit:contain}
.pl b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.empty{background:rgba(255,255,255,.82);justify-content:center;color:var(--ink-dim);border-style:dashed;box-shadow:none}
.pl .host{font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin-left:auto}
#roomStatus{color:var(--ink);background:rgba(255,255,255,.75);border-radius:99px;padding:4px 14px;font-size:16px;font-weight:700;text-align:center;min-height:24px}
#roomStatus:empty{display:none}

#game{padding:0;background:var(--sky)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none}
#hudRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.outl{color:#fff;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink)}
#dist{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(52px,10vw,92px);line-height:.95}
#dist small{font-size:.42em;margin-left:4px}
#score{display:inline-block;transition:transform .05s}
#score.bump{transform:scale(1.08)}
#side{text-align:right}
#combo{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(22px,4.5vw,38px);min-height:1.2em}
#combo .x{color:var(--mc,#ffe14a)}
#gauge{width:min(240px,40vw);height:14px;border-radius:99px;background:rgba(255,255,255,.7);border:3px solid var(--ink);margin:6px 0 0 auto;overflow:hidden;opacity:0;transition:opacity .2s}
#gauge.on{opacity:1}
#gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe14a,var(--accent));border-radius:99px;transition:width .08s}
#place{font-size:18px;font-weight:700;margin-top:6px;color:var(--ink);display:inline-block;background:rgba(255,255,255,.8);border-radius:99px;padding:2px 12px}
#place:empty{display:none}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(44px,9vw,86px);pointer-events:none;opacity:0}
#banner.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}20%{opacity:1;transform:scale(1.12) rotate(-3deg)}80%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(1.05) rotate(-3deg)}}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(130px,30vw,280px);pointer-events:none}
#countdown.go{color:#ffe14a}

/* 탭 유도 장치 — 두드리는 곳을 보여 주는 커다란 버튼 모양 + 퍼지는 고리 */
#tapCue{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transition:opacity .25s}
#tapCue.on{opacity:1}
#tapCue .pad{position:relative;width:clamp(96px,16vw,132px);height:clamp(96px,16vw,132px);border-radius:50%;background:var(--accent);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(28px,5vw,40px);color:#fff;text-shadow:0 3px 0 var(--accent-d);animation:press .36s ease-in-out infinite}
#tapCue .pad::before,#tapCue .pad::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid #fff;animation:ring .72s ease-out infinite}
#tapCue .pad::after{animation-delay:.36s}
#tapCue .cap{font-size:17px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:99px;padding:4px 14px;white-space:nowrap}
#tapCue kbd{font-family:"Black Han Sans","Noto Sans KR",sans-serif;padding:0 8px;border-radius:7px;background:var(--ink);color:#fff}
body.desk #tapCue .pad{width:clamp(210px,26vw,300px);height:auto;padding:18px 0;border-radius:18px;font-size:clamp(26px,3.4vw,36px)}
body.desk #tapCue .pad::before,body.desk #tapCue .pad::after{border-radius:22px}
@keyframes press{0%,100%{transform:translateY(0);box-shadow:0 7px 0 var(--ink)}50%{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.spec #tapCue,.spec #gauge{display:none!important}

/* 소리 켜기/끄기 */
#snd{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:22px;line-height:1}
#snd svg{width:24px;height:24px;display:block;margin:auto}

#result h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(40px,8vw,72px);margin:0 0 4px;text-align:center;line-height:1}
#result .winner{font-size:clamp(28px,6vw,48px);font-family:"Black Han Sans","Noto Sans KR",sans-serif;text-align:center;margin-bottom:8px}
#podium{height:clamp(120px,22vh,200px);margin-bottom:10px}
#podium img{height:100%;animation:hop .6s ease-in-out infinite alternate}
#podium:empty{display:none}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.board{width:min(520px,100%);display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.br{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.br .n{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:26px;width:34px;color:var(--ink-dim)}
.br i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.br .av{width:36px;height:36px;object-fit:contain;flex:none}
.br b{flex:1;font-weight:700}
.br span{color:var(--ink-dim);font-size:15px}
.br.first{background:#fff4c2;border-width:3px}
.br.first .n{color:#d08a00}
.spec .board{width:min(900px,100%)}
.spec .br{font-size:28px;padding:14px 22px}
.spec .br .n{font-size:36px;width:50px}
.spec .br span{font-size:22px}
.spec .br .av{width:56px;height:56px}
.spec #qr canvas,.spec #qr img{width:220px!important;height:220px!important}
@media (prefers-reduced-motion:reduce){#banner.pop{animation-duration:.01s}#tapCue .pad,#tapCue .pad::before,#tapCue .pad::after,#podium img{animation:none}}

/* 가로 태블릿: 제목은 왼쪽, 입력 카드는 오른쪽 (높이가 낮아도 한 화면에) */
@media (orientation:landscape) and (max-height:900px) and (min-width:700px){
  #lobby.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);grid-template-rows:1fr auto auto 1fr;column-gap:clamp(24px,4vw,56px);align-items:center;justify-items:center;padding:16px clamp(20px,4vw,48px)}
  #lobby>h1{grid-column:1;grid-row:2;margin:0!important;white-space:nowrap;font-size:clamp(40px,6vw,84px)}
  #lobby .title .t1{font-size:clamp(56px,10vw,120px)} #lobby .title .t2{font-size:clamp(32px,5.4vw,64px)}
  #lobby>.sub{max-width:100%}
  #lobby>.sub{grid-column:1;grid-row:3;margin:14px 0 0!important}
  #lobby>.card{grid-column:2;grid-row:1/5;align-self:center;margin:0!important;width:100%;padding:16px 18px}
  #lobby .roles{margin-bottom:10px}
  #lobby .role{padding:10px 8px}
  #lobby .field{margin-bottom:10px}
  #lobby .field input{padding:10px 14px}
  #lobby .swatches{margin-bottom:12px}
  #lobby .stack{gap:8px}
  #lobby .btn{padding:12px}
  #lobby .notice{margin-bottom:10px}
}

/* 안내 글씨는 한 줄로 (좁은 화면에서는 글씨를 줄인다) */
#roomStatus,#lobby .sub,.codeLabel{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#roomStatus{font-size:clamp(12px,3.4vw,18px)}
#lobby .sub{font-size:clamp(11px,3.3vw,17px)}
.pl{white-space:nowrap;font-size:clamp(12px,3.4vw,16px);min-width:0}
.pl.empty{padding-left:6px;padding-right:6px}
</style>
</head>
<body>

<section id="lobby" class="screen on">
  <h1 class="title"><span class="t1">DASH!</span><span class="t2">전력질주!</span></h1>
  <p class="sub">최대 6명 · 100m 달리기 · 빠르게 두드려서 먼저 골인!</p>
  <div class="card">
    <div class="roles">
      <button class="role sel" data-role="play" aria-pressed="true">태블릿<small>직접 플레이해요</small></button>
      <button class="role" data-role="spec" aria-pressed="false">큰 화면<small>중계만 해요</small></button>
    </div>
    <input type="checkbox" id="specMode" hidden>
    <p class="notice" id="netHint"></p>
    <button class="btn ghost" id="btnTest">연결 테스트</button>
    <p class="testOut" id="testOut" role="status"></p>
    <div id="playPane">
      <label class="field"><span>이름</span><input id="name" maxlength="8" placeholder="8자 이내" autocomplete="off"></label>
      <div class="swatches" id="swatches"></div>
      <div class="stack">
        <div class="row">
          <input id="joinCode" maxlength="4" placeholder="방 코드 4자리" inputmode="numeric">
          <button class="btn primary" id="btnJoin">입장</button>
        </div>
        <button class="btn ghost" id="btnCreate">방 만들기 (중계 없이)</button>
        <button class="btn ghost" id="btnSolo">혼자 연습 (봇 5명)</button>
      </div>
    </div>
    <div id="specPane" hidden>
      <p class="specDesc">이 기기(노트북·TV)에 방 코드와 QR이 크게 떠요. 손님들은 태블릿으로 QR을 찍어 들어오고, 모두 모이면 이 화면에서 시작을 눌러요.</p>
      <button class="btn primary" id="btnCreateSpec">중계 방 만들기</button>
    </div>
    <div class="err" id="lobbyErr"></div>
  </div>
</section>

<div id="netDown" role="alert">연결이 끊겨서 다시 연결하는 중…</div>
<section id="room" class="screen">
  <div class="codeLabel">이 코드를 입력해서 들어오세요</div>
  <h2 class="code" id="roomCode">0000</h2>
  <div id="qr"></div>
  <div class="players" id="playerList"></div>
  <div id="roomStatus"></div>
  <div class="stack" style="width:min(520px,100%);margin-top:10px">
    <button class="btn primary" id="btnStart" style="display:none">시작</button>
    <button class="btn ghost" id="btnLeave">나가기</button>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="cv"></canvas>
  <div id="hud"><div id="hudRow"><div id="dist" class="outl"><span id="score">0</span><small>m</small></div><div id="side"><div id="combo" class="outl"></div><div id="gauge"><i></i></div><div id="place"></div></div></div></div>
  <div id="tapCue" aria-hidden="true"><div class="pad" id="cuePad">탭!</div><div class="cap" id="cueCap">화면 아무 데나 빠르게 두드려요</div></div>
  <div id="banner" class="outl"></div>
  <div id="countdown" class="outl"></div>
</section>

<section id="result" class="screen">
  <h2 class="outl">경기 종료</h2>
  <div id="podium"></div>
  <div class="winner outl" id="winnerName"></div>
  <div class="board" id="board"></div>
  <div class="stack" style="width:min(520px,100%)">
    <button class="btn primary" id="btnAgain">한 판 더</button>
    <button class="btn ghost" id="btnHome">처음으로</button>
  </div>
</section>
<button id="snd" type="button"></button>

<script>
/* 축제 게임 실시간 연결 (웹소켓) — 게임 코드가 쓰는 firebase 호출 모양을 그대로 흉내 냄 */
(function(){
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const split=p=>String(p).split('/').filter(Boolean);
  const join=(a,b)=>split(a).concat(split(b)).join('/');
  const overlaps=(a,b)=>a===b||a.startsWith(b+'/')||b.startsWith(a+'/');
  function getIn(t,p){ let n=t; for(const k of split(p)){ if(n==null||typeof n!=='object') return null; n=n[k]; } return n===undefined?null:n; }
  function setIn(t,p,v){ const ks=split(p); let n=t; for(let i=0;i<ks.length-1;i++){ if(n[ks[i]]==null||typeof n[ks[i]]!=='object') n[ks[i]]={}; n=n[ks[i]]; } const l=ks[ks.length-1]; if(v==null) delete n[l]; else n[l]=clone(v);
    const chain=[t]; n=t; for(let i=0;i<ks.length-1;i++){ n=n&&n[ks[i]]; if(!n||typeof n!=='object') return; chain.push(n); } for(let i=chain.length-1;i>0;i--){ if(Object.keys(chain[i]).length) break; delete chain[i-1][ks[i-1]]; } }
  const snap=(key,v)=>({key, val:()=>clone(v), exists:()=>v!=null});
  const TS={'.sv':'timestamp'};

  function DB(url){
    const self=this; let ws=null, open=false, q=[], seq=0; const wait={}, listeners=[], ondc=new Set(), subs=new Set(); const tree={};
    let offset=0; const offCbs=[], statusCbs=[];
    function raw(m){ const s=JSON.stringify(m); if(open) ws.send(s); else q.push(s); }
    function req(m){ return new Promise(res=>{ m.id=++seq; wait[m.id]=res; raw(m); }); }
    function syncTime(){ const t0=Date.now(); req({t:'time'}).then(m=>{ const t1=Date.now(); offset=m.now-(t0+t1)/2; offCbs.forEach(cb=>cb(snap('serverTimeOffset',offset))); }); }
    function connect(){
      ws=new WebSocket(url);
      ws.onopen=()=>{ open=true; for(const p of subs) ws.send(JSON.stringify({t:'sub',path:p,id:0})); for(const p of ondc) ws.send(JSON.stringify({t:'ondc',path:p})); while(q.length) ws.send(q.shift()); syncTime(); statusCbs.forEach(cb=>cb(true)); };
      ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
        if(m.t==='w'){ apply(m.op,m.path,m.val); }
        else if(m.t==='snap'){ setIn(tree,m.path,m.val); fire(m.path); if(wait[m.id]){ wait[m.id](m); delete wait[m.id]; } }
        else if(wait[m.id]){ wait[m.id](m); delete wait[m.id]; } };
      ws.onclose=()=>{ if(open) statusCbs.forEach(cb=>cb(false)); open=false; setTimeout(connect,1000); };
      ws.onerror=()=>{};
    }
    function apply(op,p,v){ if(op==='set') setIn(tree,p,v); else if(op==='update'&&v) for(const k of Object.keys(v)) setIn(tree,join(p,k),v[k]); fire(p); }
    function fire(p){
      for(const L of listeners.slice()){ if(!overlaps(L.path,p)) continue;
        const now=getIn(tree,L.path);
        if(L.ev==='value'){ const j=JSON.stringify(now); if(j!==L.last||!L.fired){ L.last=j; L.fired=true; L.cb(snap(split(L.path).pop(),now)); } continue; }
        const prev=L.prev||{}, cur=(now&&typeof now==='object')?now:{};
        if(L.ev==='child_added') for(const k in cur) if(!(k in prev)) L.cb(snap(k,cur[k]));
        if(L.ev==='child_removed') for(const k in prev) if(!(k in cur)) L.cb(snap(k,prev[k]));
        if(L.ev==='child_changed') for(const k in cur) if(k in prev&&JSON.stringify(cur[k])!==JSON.stringify(prev[k])) L.cb(snap(k,cur[k]));
        L.prev=clone(cur); }
    }
    function local(op,p,v){ // 내 쓰기는 바로 반영 (서버 시간값은 대충 채움)
      const fix=x=>{ if(x&&typeof x==='object'){ if(x['.sv']==='timestamp') return Date.now()+offset; const o=Array.isArray(x)?[]:{}; for(const k in x) o[k]=fix(x[k]); return o; } return x; };
      apply(op,p,fix(v)); }
    function Ref(p){ this.path=split(p).join('/'); this.key=split(p).pop()||null; }
    Ref.prototype.child=function(c){ return new Ref(join(this.path,c)); };
    Ref.prototype.set=function(v){ local('set',this.path,v); raw({t:'set',path:this.path,val:v}); return Promise.resolve(); };
    Ref.prototype.update=function(v){ local('update',this.path,v); raw({t:'update',path:this.path,val:v}); return Promise.resolve(); };
    Ref.prototype.remove=function(){ return this.set(null); };
    Ref.prototype.get=function(){ const p=this.path; return req({t:'get',path:p}).then(m=>snap(split(p).pop(),m.val)); };
    Ref.prototype.transaction=function(fn){ const p=this.path; return this.get().then(s=>{ const v=fn(s.val()); if(v!==undefined) return new Ref(p).set(v); }); };
    Ref.prototype.onDisconnect=function(){ const p=this.path; return { remove:()=>{ ondc.add(p); raw({t:'ondc',path:p}); return Promise.resolve(); } }; };
    Ref.prototype.on=function(ev,cb){
      if(this.path==='.info/serverTimeOffset'){ offCbs.push(cb); cb(snap('serverTimeOffset',offset)); return cb; }
      const L={path:this.path,ev,cb}; listeners.push(L);
      const have=[...subs].some(s=>this.path===s||this.path.startsWith(s+'/'));
      if(have){ const now=getIn(tree,this.path); if(ev==='value'){ L.fired=true; L.last=JSON.stringify(now); cb(snap(this.key,now)); } else { L.prev={}; fire(this.path); } }
      else { if(ev!=='value') L.prev={}; subs.add(this.path); raw({t:'sub',path:this.path,id:0}); }
      return cb; };
    Ref.prototype.off=function(ev,cb){ const i=listeners.findIndex(L=>L.path===this.path&&L.ev===ev&&L.cb===cb); if(i>=0) listeners.splice(i,1);
      if(!listeners.some(L=>L.path===this.path)&&subs.has(this.path)){ subs.delete(this.path); raw({t:'unsub',path:this.path}); } };
    self.ref=p=>new Ref(p||'');
    self.onStatus=cb=>{ statusCbs.push(cb); };
    self.isOpen=()=>open;
    self.ping=()=>{ const t0=performance.now(); return req({t:'time'}).then(()=>performance.now()-t0); };
    connect();
  }
  let inst=null;
  window.firebase={ initializeApp(cfg){ inst=new DB(cfg.url); }, database:Object.assign(()=>inst,{ServerValue:{TIMESTAMP:TS}}) };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* 네온 대시 — 네온 스네이크 아레나와 같은 게임 서버를 씁니다 */
/* 게임 서버 주소. 예) 'wss://game.edoori.kr/ws'
   비워 두면: 주소 뒤 #ws=wss://... 로 한 번 열면 저장되고,
   게임이 서버와 같은 주소에서 열리면 자동으로 그 서버의 /ws 를 씁니다. */
const SERVER_URL = 'wss://game.edoori.co.kr/ws';
const COLORS=['#ff3d8a','#21e6ff','#a8ff3d','#ff9a2e','#b26bff','#ffe63d'];
const COLOR_NAMES=['핑크','하늘','라임','주황','보라','노랑'];
const GOAL=100, LIMIT_MS=30000, COMBO_GAP=350, SEND_MS=110, STEP=0.4;
// 최고 속도(초당 m): 아무리 빨리 두드려도 100m에 10초쯤 걸리게. 달릴 힘이 초당 VCAP씩 차오르고, 한 번 두드릴 때마다 꺼내 쓴다
const VCAP=11, VBANK=2.2;

const $=s=>document.querySelector(s);
const screens={lobby:$('#lobby'),room:$('#room'),game:$('#game'),result:$('#result')};
function show(n){ for(const k in screens) screens[k].classList.toggle('on',k===n); try{ musicFor(n==='game'?'race':n); }catch(e){} }
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, now=()=>performance.now();
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 게임 서버 연결 ---------- */
let fbCfg = null;
try{
  const h = new URLSearchParams(location.hash.slice(1));
  let u = SERVER_URL || h.get('ws') || '';
  if (!u && h.get('fb')) { try{ u = JSON.parse(atob(h.get('fb'))).url||''; }catch(e){} }
  if (h.get('ws')) localStorage.setItem('rturl', h.get('ws'));
  if (!u) u = localStorage.getItem('rturl') || '';
  if (!u && /^https?:$/.test(location.protocol) && !/claude|github\.io|usercontent/.test(location.host)) u = (location.protocol==='https:'?'wss://':'ws://')+location.host+location.pathname.replace(/[^/]*\/[^/]*$/,'')+'ws';
  if (u) fbCfg = { url:u };
}catch(e){}
let db = null, serverOffset = 0;
if (fbCfg && window.WebSocket){
  try{ firebase.initializeApp(fbCfg); db = firebase.database(); db.ref('.info/serverTimeOffset').on('value', s=>{ serverOffset = s.val()||0; }); }
  catch(e){ console.error(e); db=null; }
}
const serverNow=()=>Date.now()+serverOffset;

/* ---------- 로비 ---------- */
const myId=sessionStorage.getItem('pid')||Math.random().toString(36).slice(2,8); sessionStorage.setItem('pid',myId);
let myColor=Math.floor(Math.random()*6), myName=localStorage.getItem('name')||'';
$('#name').value=myName;
const sw=$('#swatches');
COLORS.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.style.setProperty('--c',c); b.setAttribute('aria-label',COLOR_NAMES[i]); b.onclick=()=>{myColor=i;paintSw();try{SND.fx.click();}catch(e){}}; sw.appendChild(b); });
function paintSw(){ [...sw.children].forEach((b,i)=>{ b.classList.toggle('sel',i===myColor); let f=null; try{ f=faceSrc(i); }catch(e){} if(f){ b.style.backgroundImage=`url('${f}')`; b.style.backgroundSize='118%'; b.style.backgroundPosition='center 30%'; } }); } paintSw();
function getName(){ myName=($('#name').value.trim()||'익명').slice(0,8); localStorage.setItem('name',myName); return myName; }
if(!db){ $('#btnCreate').disabled=true; $('#btnJoin').disabled=true; $('#btnCreateSpec').disabled=true; $('#netHint').classList.add('off'); $('#netHint').textContent='아직 게임 서버가 연결되지 않아서 방 만들기·입장·중계 버튼이 꺼져 있어요. 지금은 혼자 연습만 할 수 있어요.'; }
else $('#netHint').textContent='같은 방 코드로 태블릿 6대까지 함께 할 수 있어요.';
const qsRoom=new URLSearchParams(location.search).get('room'); if(qsRoom) $('#joinCode').value=qsRoom;

$('#btnSolo').onclick=()=>{ getName(); startSolo(); };
// 연결 테스트: 서버에 5번 신호를 보내 응답 속도를 잰다
$('#btnTest').onclick = async ()=>{
  const out=$('#testOut'); out.className='testOut';
  if (!db){ out.classList.add('bad'); out.textContent='서버 주소가 아직 설정되지 않았어요.'; return; }
  out.textContent='서버에 연결하는 중…'; $('#btnTest').disabled=true;
  const timeout=ms=>new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms));
  try{
    const t=[]; for (let i=0;i<5;i++){ t.push(await Promise.race([db.ping(), timeout(i?3000:8000)])); }
    t.sort((a,b)=>a-b); const med=Math.round(t[2]), worst=Math.round(t[4]);
    if (med<150&&worst<400){ out.classList.add('ok'); out.textContent=`서버 연결 OK · 응답 ${med}ms (좋음)`; }
    else { out.classList.add('warn'); out.textContent=`서버 연결 OK · 응답 ${med}ms, 가장 느릴 때 ${worst}ms. 게임은 되지만 조금 끊길 수 있어요.`; }
  }catch(e){ out.classList.add('bad'); out.textContent='서버에 연결하지 못했어요. 와이파이가 인터넷에 연결되어 있는지, 서버가 켜져 있는지 확인해 주세요. (무료 서버는 처음 깨어날 때 1분쯤 걸려요. 잠시 뒤 다시 눌러 보세요.)'; }
  $('#btnTest').disabled=false;
};
// 경기 중 연결이 끊기면 화면 위에 알림
if (db){ let downT=null; db.onStatus(up=>{ clearTimeout(downT); if(up) document.body.classList.remove('netDown'); else downT=setTimeout(()=>document.body.classList.add('netDown'),800); }); }
const specBox=$('#specMode');
function setRole(r){ specBox.checked=r==='spec'; document.querySelectorAll('.role').forEach(b=>{ const on=b.dataset.role===r; b.classList.toggle('sel',on); b.setAttribute('aria-pressed',on); }); $('#playPane').hidden=r==='spec'; $('#specPane').hidden=r!=='spec'; $('#lobbyErr').textContent=''; }
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
if (new URLSearchParams(location.search).get('spec')) setRole('spec');
$('#btnCreateSpec').onclick=()=>{ setRole('spec'); createRoom(); };
$('#btnCreate').onclick=()=>{ setRole('play'); createRoom(); };
$('#btnJoin').onclick=()=>joinRoom($('#joinCode').value.trim());
$('#btnLeave').onclick=()=>{ leaveRoom(); show('lobby'); };
$('#btnHome').onclick=()=>{ leaveRoom(); show('lobby'); };
$('#btnAgain').onclick=()=>{ if(net.ref){ if(net.isHost) net.ref.update({state:'lobby',startAt:null}); show('room'); } else startSolo(); };
$('#btnStart').onclick=hostStart;

/* ---------- 방 ---------- */
const net={spec:false,ref:null,isHost:false,host:null,players:{},state:'lobby',startAt:0,unsub:[]};
const ROOT='dash/rooms/';
async function createRoom(){ const asSpec=$('#specMode').checked; if(!asSpec) getName(); const code=String(Math.floor(1000+Math.random()*9000));
  const snap=await db.ref(ROOT+code).get(); if(snap.exists()&&snap.val().state==='playing') return createRoom();
  await db.ref(ROOT+code).set({host:myId,state:'lobby',created:firebase.database.ServerValue.TIMESTAMP}); if(asSpec) spectate(code); else enterRoom(code); }
async function joinRoom(code){ getName(); $('#lobbyErr').textContent='';
  if(!/^\d{4}$/.test(code)){ $('#lobbyErr').textContent='방 코드는 숫자 4자리예요.'; return; }
  const snap=await db.ref(ROOT+code).get(); if(!snap.exists()){ $('#lobbyErr').textContent='그 코드의 방이 없어요.'; return; }
  const r=snap.val(); if(Object.keys(r.players||{}).length>=6&&!(r.players||{})[myId]){ $('#lobbyErr').textContent='방이 꽉 찼어요 (6명).'; return; }
  enterRoom(code); }
async function enterRoom(code){
  net.viewers=undefined; net.hostKnown=false;
  net.ref=db.ref(ROOT+code);
  const ps=(await net.ref.child('players').get()).val()||{};
  const used=new Set(Object.values(ps).filter(p=>p.id!==myId).map(p=>p.color));
  if(used.has(myColor)){ for(let i=0;i<6;i++) if(!used.has(i)){ myColor=i; break; } paintSw(); }
  const me=net.ref.child('players/'+myId);
  await me.set({id:myId,name:myName,color:myColor,joined:firebase.database.ServerValue.TIMESTAMP,score:0});
  me.onDisconnect().remove();
  $('#roomCode').textContent=code; $('#qr').innerHTML='';
  const url=location.origin+location.pathname+'?room='+code+(fbCfg&&!SERVER_URL?'#ws='+encodeURIComponent(fbCfg.url):'');
  try{ new QRCode($('#qr'),{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.L}); }catch(e){}
  show('room');
  const r=net.ref;
  const a=r.child('players').on('value',s=>{ net.players=s.val()||{}; renderPlayers(); syncRemote(); });
  const b=r.child('state').on('value',s=>{ net.state=s.val(); onState(); });
  const c=r.child('startAt').on('value',s=>{ net.startAt=s.val()||0; });
  const d=r.child('host').on('value',s=>{ net.host=s.val(); net.hostKnown=true; net.isHost=net.host===myId; renderPlayers(); });
  const e=r.child('viewers').on('value',s=>{ net.viewers=s.val()||{}; renderPlayers(); });
  net.unsub=[()=>r.child('viewers').off('value',e),()=>r.child('players').off('value',a),()=>r.child('state').off('value',b),()=>r.child('startAt').off('value',c),()=>r.child('host').off('value',d)];
}
function renderPlayers(){
  const list=$('#playerList'); list.innerHTML='';
  const arr=Object.values(net.players).sort((a,b)=>(a.joined||0)-(b.joined||0));
  if(net.ref&&arr.length&&net.hostKnown&&net.viewers!==undefined&&!arr.some(p=>p.id===net.host)&&!net.viewers[net.host]&&arr[0].id===myId) net.ref.child('host').set(myId);
  for(let i=0;i<6;i++){ const p=arr[i], d=document.createElement('div');
    if(p){ d.className='pl'; d.style.setProperty('--c',COLORS[p.color]); d.innerHTML=`${avatar(p.color)}<b>${esc(p.name)}</b>`+(p.id===net.host?'<span class="host">방장</span>':''); }
    else{ d.className='pl empty'; d.textContent='자리 비었음'; }
    list.appendChild(d); }
  $('#btnStart').style.display=net.isHost?'block':'none'; $('#btnStart').disabled=arr.length<2;
  $('#roomStatus').textContent=net.spec?(arr.length<2?`${arr.length}명 입장 · QR을 찍거나 코드를 입력하세요`:`${arr.length}명 입장 · 준비되면 시작을 누르세요`):net.isHost?(arr.length<2?'친구가 들어오면 시작할 수 있어요':`${arr.length}명 · 시작을 누르면 바로 출발`):'방장이 시작하기를 기다리는 중…';
}
function onState(){
  if(net.state==='lobby'&&screens.result.classList.contains('on')) show('room');
  if(net.state==='playing'&&!G.running) startMulti();
}
async function hostStart(){ const u={state:'playing',startAt:serverNow()+3500};
  Object.keys(net.players).forEach(id=>{ u['players/'+id+'/score']=0; u['players/'+id+'/fin']=null; }); await net.ref.update(u); }
// 중계 화면이 방을 만들고 방장이 됨 (게임에는 참여 안 함)
async function spectate(code){ $('#lobbyErr').textContent='';
  net.spec=true; document.body.classList.add('spec'); net.ref=db.ref(ROOT+code); net.code=code; net.host=myId; net.isHost=true;
  const v=net.ref.child('viewers/'+myId); v.set(true); v.onDisconnect().remove();
  $('#roomCode').textContent=code; $('#qr').innerHTML='';
  const url=location.origin+location.pathname+'?room='+code+(fbCfg&&!SERVER_URL?'#ws='+encodeURIComponent(fbCfg.url):'');
  try{ new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.L}); }catch(e){}
  show('room'); const r=net.ref;
  const a=r.child('players').on('value',s=>{ net.players=s.val()||{}; renderPlayers(); syncRemote(); });
  const b=r.child('state').on('value',s=>{ net.state=s.val(); onState(); });
  const c=r.child('startAt').on('value',s=>{ net.startAt=s.val()||0; });
  const d=r.child('host').on('value',s=>{ net.host=s.val(); net.hostKnown=true; net.isHost=net.host===myId; renderPlayers(); });
  const e=r.child('viewers').on('value',s=>{ net.viewers=s.val()||{}; renderPlayers(); });
  net.unsub=[()=>r.child('viewers').off('value',e),()=>r.child('players').off('value',a),()=>r.child('state').off('value',b),()=>r.child('startAt').off('value',c),()=>r.child('host').off('value',d)];
}
function leaveRoom(){ if(!net.ref) return; if(net.spec){ net.spec=false; document.body.classList.remove('spec'); net.unsub.forEach(f=>f()); net.ref.child('viewers/'+myId).remove(); net.ref=null; net.players={}; G.running=false; return; } net.unsub.forEach(f=>f()); net.ref.child('players/'+myId).remove(); net.ref=null; net.players={}; net.state='lobby'; G.running=false; }

/* ---------- 그림 (제미나이 그림이 있으면 쓰고, 없으면 코드 그림으로) ---------- */
const ART_KEYS=['pink','sky','lime','orange','purple','yellow'];
const ART={bg:null,run1:[],run2:[],win:[],face:[]};
function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
(async()=>{
  ART.bg=await loadImg('img/school.webp');
  if(ART.bg) document.documentElement.style.setProperty('--bgimg',"url('img/school.webp')");
  await Promise.all(ART_KEYS.map(async(k,i)=>{
    [ART.run1[i],ART.run2[i],ART.win[i],ART.face[i]]=await Promise.all(['run1','run2','win','face'].map(f=>loadImg(`img/${k}-${f}.webp`)));
  }));
  paintSw(); if(net.ref) renderPlayers();
})();
const faceSrc=i=>ART.face[i]?ART.face[i].src:null;
const avatar=(i,cls='av')=>faceSrc(i)?`<img class="${cls}" src="${faceSrc(i)}" alt="">`:`<i style="background:${COLORS[i]}"></i>`;

/* ---------- 소리 (파일 없이 코드로 만든다) ---------- */
const SND=(()=>{
  let AC=null, master=null, sfx=null, bgm=null, muted=false;
  try{ muted=localStorage.getItem('dashMute')==='1'; }catch(e){}
  function ac(){
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();
      master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
      const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(master);
      sfx=AC.createGain(); sfx.gain.value=.8; sfx.connect(comp);
      bgm=AC.createGain(); bgm.gain.value=.0; bgm.connect(comp); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }
  function tone(f,dur,type='square',vol=.2,when=0,to=null,dest=null){
    const a=ac(); if(!a) return; const t=a.currentTime+when;
    const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(dest||sfx); o.start(t); o.stop(t+dur+.02);

  ctx.fillStyle='#c84f36'; ctx.fillRect(-20,top,W+40,bot-top+H);
  order.forEach((r,i)=>{ ctx.fillStyle=i%2?'#d65a3f':'#cf5539'; ctx.fillRect(-20,top+lh*i,W+40,lh); });
  ctx.fillStyle='#fff'; for(let i=0;i<=order.length;i++) ctx.fillRect(-20,top+lh*i-1.5,W+40,3);
  ctx.fillStyle='#7ccf5a'; ctx.fillRect(-20,bot+2,W+40,H);
  // 25m 50m 75m
  for(const m of [25,50,75]){ const x=xs(m); ctx.fillStyle='rgba(255,255,255,.35)'; for(let y=top;y<bot;y+=16) ctx.fillRect(x-1,y,2,8); outlText(m+'m',x,bot+Math.min(H-bot,40)*.72,Math.max(13,Math.min(H-bot,40)*.55),'#fff','center',3); }
  // 출발선
  ctx.fillStyle='#fff'; ctx.fillRect(x0-3,top,5,bot-top);
  // 결승선 (체크무늬) + 결승 테이프
  const cs=Math.max(8,Math.min(12,lh*.12));
  for(let y=top,k=0;y<bot;y+=cs,k++) for(let j=0;j<2;j++){ ctx.fillStyle=(k+j)%2?'#fff':INK; ctx.fillRect(x1+j*cs-cs,y,cs,Math.min(cs,bot-y)); }
  const post=(y,h)=>{ ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.fillRect(x1+cs+4,y,8,h); ctx.strokeRect(x1+cs+4,y,8,h); };
  post(top-lh*.55,lh*.62); post(bot-6,lh*.5);
  ctx.lineCap='round'; ctx.lineWidth=5;
  if(!G.tapeAt){ ctx.strokeStyle='#ff3b5c'; ctx.beginPath(); ctx.moveTo(x1+cs+8,top-lh*.4); for(let y=top-lh*.4;y<bot;y+=12) ctx.lineTo(x1+cs+8+Math.sin(y*.05+t/300)*3,y); ctx.stroke(); }
  else { const k=clamp((t-G.tapeAt)/500,0,1), sway=Math.sin(t/260)*(1-k*.5)*12;
    ctx.strokeStyle='#ff3b5c'; ctx.beginPath(); ctx.moveTo(x1+cs+8,top-lh*.4); ctx.quadraticCurveTo(x1+cs+30+sway,top+lh*.3,x1+cs+18+sway*1.4,top+lh*(.4+k*.6)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1+cs+8,bot); ctx.quadraticCurveTo(x1+cs+34-sway,bot-lh*.2,x1+cs+44-sway,bot-lh*(.1+.1*(1-k))); ctx.stroke(); }
  outlText('골인',x1,top-lh*.62,Math.max(18,lh*.26),'#ffe14a');
  // 선수 (위 레인부터 그려서 아래 선수가 앞에 오게)
  const el=elapsed();
  order.forEach((r,i)=>{
    const y0=top+lh*i, c=COLORS[r.color], isMe=r.id===myId, gy=y0+lh*.88;
    if(isMe){ ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(-20,y0+1.5,W+40,lh-3); }
    // 레인 번호
    outlText(String(i+1),x0*.5,y0+lh*.66,Math.max(16,lh*.34),'rgba(255,255,255,.9)','center',3);
    const h=clamp(lh*1.3,34,net.spec?190:150);
    const sp=clamp(r.vel/10,0,1.4);
    let x=xs(r.shown); if(r.fin&&r.shown>GOAL-.5) x=Math.min(W-h*.3,x1+cs+14+h*.32);
    // 그림자
    ctx.fillStyle='rgba(31,42,90,.25)'; ctx.beginPath(); ctx.ellipse(x,gy,h*.24,h*.06,0,0,7); ctx.fill();
    // 속도선
    if(sp>.25&&!r.fin){ ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineCap='round'; for(let k=0;k<3;k++){ ctx.globalAlpha=Math.min(1,sp)*.7; ctx.lineWidth=3; const yy=gy-h*(.35+k*.18), len=h*(.3+sp*.5)*(0.6+((k*37+Math.floor(t/70))%10)/22); ctx.beginPath(); ctx.moveTo(x-h*.34,yy); ctx.lineTo(x-h*.34-len,yy); ctx.stroke(); } ctx.globalAlpha=1; }
    // 흙먼지
    if(sp>.3&&!r.fin&&Math.random()<.45) G.parts.push({x:x-h*.12,y:gy-2,vx:rnd(-140,-50),vy:rnd(-70,-20),life:.35,t:.35,c:'rgba(255,236,220,.85)',sz:rnd(2,4)});
    drawStudent(r,x,gy,h,sp,t,el);
    // 이름표 (머리 위)
    const fs=clamp(lh*.19,11,net.spec?26:16); ctx.font=`bold ${fs}px "Noto Sans KR",sans-serif`;
    const label=isMe?'나':r.name, tw=ctx.measureText(label).width, px=x, py=gy-h*1.02;
    ctx.fillStyle=isMe?c:'#fff'; ctx.strokeStyle=INK; ctx.lineWidth=2;
    const bw=tw+fs*1.1, bh=fs*1.5; ctx.beginPath(); ctx.roundRect(px-bw/2,py-bh,bw,bh,bh/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,px,py-bh/2+1); ctx.textBaseline='alphabetic';
    if(isMe&&!r.fin){ const bob=Math.sin(t/160)*3; ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(px-6,py+2+bob); ctx.lineTo(px+6,py+2+bob); ctx.lineTo(px,py+9+bob); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    // 등수 메달
    if(r.fin){ const p=G.finOrder.indexOf(r.id)+1, mr=clamp(lh*.2,12,net.spec?30:22), mx=x1-cs-mr-8, my=y0+lh*.5;
      ctx.fillStyle=p===1?'#ffd23a':p===2?'#dfe6f0':p===3?'#f0a867':'#fff'; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle=INK; ctx.font=`${mr*1.1}px "Black Han Sans","Noto Sans KR",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p,mx,my+1); ctx.textBaseline='alphabetic'; }
  });
  // 탭 자국, 불꽃
  for(const r of G.rings){ ctx.strokeStyle='#fff'; ctx.globalAlpha=r.life/.4; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); ctx.strokeStyle=r.c; ctx.lineWidth=3; ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const p of G.parts){ const a=clamp(p.life/p.t,0,1); ctx.globalAlpha=a; ctx.fillStyle=p.c;
    if(p.conf){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.life*8); ctx.fillRect(-p.sz,-p.sz*.5,p.sz*2,p.sz); ctx.restore(); } else { ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*a+.5,0,7); ctx.fill(); } }
  ctx.globalAlpha=1;
  if(G.flash>0){ ctx.fillStyle='#fff'; ctx.globalAlpha=G.flash*.6; ctx.fillRect(-20,-20,W+40,H+40); ctx.globalAlpha=1; }
}
// 학생 한 명: 그림이 있으면 달리기 두 장면을 번갈아, 골인하면 만세 그림
function drawStudent(r,x,gy,h,sp,t,el){
  const i=r.color, moving=el>=0&&!r.fin&&r.vel>.6;
  let im=ART.run1[i];
  if(r.fin&&ART.win[i]) im=ART.win[i];
  else if(moving&&ART.run2[i]&&Math.floor(r.phase/Math.PI)%2) im=ART.run2[i];
  if(im){
    // 같은 인물은 같은 배율 (달리기 그림 높이 = h), 만세 그림도 그 배율 그대로
    const k=h/ART.run1[i].height, w=im.width*k, ih=im.height*k;
    let hop=0, sx=1, sy=1, rot=0;
    if(r.fin){ hop=Math.abs(Math.sin(t/170+i))*h*.08; }
    else if(moving){ const c=Math.cos(r.phase), s2=Math.abs(Math.sin(r.phase)); hop=s2*h*.07; sy=1-.05*(1-s2); sx=1+.03*(1-s2); rot=clamp(sp*.07,0,.09)+Math.sin(r.phase)*.035; }
    else if(el<0){ sy=1-.015*(1+Math.sin(t/220+i)); }
    ctx.save(); ctx.translate(x,gy-hop); ctx.rotate(rot); ctx.scale(sx,sy);
    ctx.drawImage(im,-w/2,-ih,w,ih); ctx.restore(); return;
  }
  const s=h*.36, hy=gy-s*1.02;
  drawRunner(x,hy,s,INK,r.phase,sp,r.id===myId,r.fin,4); drawRunner(x,hy,s,COLORS[i],r.phase,sp,r.id===myId,r.fin,0);
}
function drawRunner(x,y,s,c,ph,sp,isMe,fin,extra){
  const lean=fin?0:clamp(sp*.35,0,.4), sw=fin?.2:(.5+sp*.35);
  const hip={x,y}, sh={x:x+Math.sin(lean)*s*.9,y:y-s*.9};
  const head={x:sh.x+Math.sin(lean)*s*.45,y:sh.y-s*.45};
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=c;
  const limb=(o,a1,a2,l1,l2,w)=>{ const k={x:o.x+Math.sin(a1)*l1,y:o.y+Math.cos(a1)*l1}; const e={x:k.x+Math.sin(a2)*l2,y:k.y+Math.cos(a2)*l2}; ctx.lineWidth=w+extra; ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(k.x,k.y); ctx.lineTo(e.x,e.y); ctx.stroke(); };
  const p=Math.sin(ph), q=Math.sin(ph+Math.PI), lw=Math.max(3,s*.2);
  limb(hip,q*sw,q*sw-Math.max(0,-q)*1.2*sw-.2,s*.55,s*.55,lw);
  limb(sh,-q*sw*1.2+lean,-q*sw*1.2+lean+1.3,s*.42,s*.38,lw*.85);
  ctx.lineWidth=lw*1.3+extra; ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(sh.x,sh.y); ctx.stroke();
  limb(hip,p*sw,p*sw-Math.max(0,-p)*1.2*sw-.2,s*.55,s*.55,lw);
  limb(sh,-p*sw*1.2+lean,-p*sw*1.2+lean+1.3,s*.42,s*.38,lw*.85);
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(head.x,head.y,s*.3+extra/2,0,7); ctx.fill();
  if(!extra){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(head.x+s*.12,head.y-s*.04,s*.09,0,7); ctx.fill(); ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(head.x+s*.14,head.y-s*.04,s*.045,0,7); ctx.fill(); }
  if(fin){ ctx.lineWidth=lw*.85+extra; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-s*.3,sh.y-s*.7); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x+s*.3,sh.y-s*.7); ctx.stroke(); }
}

/* ---------- 종료 ---------- */
async function finish(){
  G.ended=true;
  if(!G.solo&&net.ref){ const me=G.racers[myId]; if(me&&!net.spec) await net.ref.child('players/'+myId).update({score:Math.round(me.d*10)/10,fin:me.fin||0}); await new Promise(r=>setTimeout(r,1300));
    const ps=(await net.ref.child('players').get()).val()||{}; for(const p of Object.values(ps)){ const r=G.racers[p.id]; if(r){ r.d=p.score||0; if(p.fin) r.fin=p.fin; } }
    if(net.isHost) net.ref.update({state:'ended'}); }
  else await new Promise(r=>setTimeout(r,1400));
  G.running=false;
  const arr=ranked(), w=arr[0];
  $('#podium').innerHTML=ART.win[w.color]?`<img src="${ART.win[w.color].src}" alt="">`:'';
  $('#winnerName').innerHTML=`<span style="color:${COLORS[w.color]}">${esc(w.name)}</span> 1등`;
  $('#board').innerHTML=arr.map((r,i)=>`<div class="br ${i===0?'first':''}" style="--c:${COLORS[r.color]}"><span class="n">${i+1}</span>${avatar(r.color)}<b>${esc(r.name)}</b><span>${r.fin?(r.fin/1000).toFixed(2)+'초':Math.floor(r.d)+'m'}${r.id===myId?` · 최고 ${G.bestCombo}콤보`:''}</span></div>`).join('');
  $('#btnAgain').textContent=(!G.solo&&!net.isHost)?'대기실로':'한 판 더';
  show('result'); SND.fx.win();
}

/* 항상 전체 화면: 전체 화면이 아니면 다음 터치·클릭 때 다시 켠다 (브라우저는 사용자가 누를 때만 전체 화면을 허락함) */
function goFull(){ const d=document, el=d.documentElement; if(d.fullscreenElement||d.webkitFullscreenElement) return;
  const f=el.requestFullscreen||el.webkitRequestFullscreen; if(!f) return;
  try{ const p=f.call(el,{navigationUI:'hide'}); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
addEventListener('pointerup',goFull,{capture:true}); addEventListener('keyup',goFull,{capture:true});
