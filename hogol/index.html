<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>호랑이골 이야기 1 · 금방울 원정대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{ --ink:#3b2a20; --cream:#fff7e8; --sky:#bfe6ff; --pink:#ff8fb1; --orange:#ff9f43; --mint:#7ed6b8; color-scheme:light; }
html,body{height:100%;margin:0;background:#2b2140;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#4a3a6a 0%,#231a33 100%)}
canvas{display:block;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#tools{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px;z-index:4}
#tools button{font:15px "Jua",sans-serif;background:rgba(255,247,232,.92);color:var(--ink);border:2px solid #c9a27a;border-radius:10px;padding:4px 12px;cursor:pointer}
#tools button{box-shadow:0 3px 0 rgba(60,40,30,.28);transition:transform .08s,box-shadow .08s,background .12s,border-color .12s}
#tools button:hover{background:#fff1dc;border-color:#ff9f43;transform:translateY(-2px);box-shadow:0 5px 0 rgba(60,40,30,.25)}
#tools button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,40,30,.3);background:#ffe3c0}
#tools button:focus-visible{outline:3px solid var(--orange)}
#mobile{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#fff7e8;z-index:5;text-align:center;padding:24px;font-size:17px;line-height:1.6}
#mobile b{font-family:"Jua",sans-serif;font-size:40px;color:#ff7a45;font-weight:400}
@media (max-width:820px) and (pointer:coarse){#mobile{display:flex}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="960" height="540" aria-label="호랑이골 이야기 게임 화면"></canvas></div>
<div id="tools"><button id="btnSound" type="button">소리 켬</button><button id="btnFull" type="button">전체화면</button></div>
<div id="mobile"><b>호랑이골 이야기</b><span>이 게임은 PC 키보드용이에요.<br>컴퓨터에서 열어 주세요.</span></div>

// 한 줄을 지금 주인공 것으로 고르고 ' / '를 줄바꿈으로
function storyLine(l, cls) { if (l && typeof l === 'object') l = l[cls] || l.beom; return String(l).replace(/ \/ /g, '\n'); }
function storyLines(arr, cls) { cls = cls || (Game.state && Game.state.cls) || 'beom'; const out = []; for (const l of arr || []) { if (l === '*heroClose') STORY.heroClose[cls].forEach(x => out.push(storyLine(x, cls))); else out.push(storyLine(l, cls)); } return out; }
function storyScene(ch, key) { const C = STORY.chapters.find(c => c.id === ch); if (!C) return null; for (const a of C.acts) for (const s of a.scenes) if (s.key === key) return s; return null; }
// 장면을 한 번만 보여 준다(이야기 책에 기록). force면 다시 봤어도 보여 준다
async function playScene(ch, key, o = {}) {
  const st = Game.state, s = storyScene(ch, key); if (!s || !st) return false; st.flags.seen = st.flags.seen || {}; const id = ch + ':' + key;
  if (st.flags.seen[id] && !o.force) return false; st.flags.seen[id] = true; await Dialog.say((o.pre || []).concat(storyLines(s.lines))); return true;
}

  // Shift+왼쪽 버튼을 누르고 있는 동안: 커서 쪽을 보며 기본 공격 연타(콤보가 끝나면 처음부터 다시)

(async function boot() {

  const fsNow = () => document.fullscreenElement || document.webkitFullscreenElement;

    if (!req) { fail(); return; } try { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.then) r.then(() => { wantFull = true; lockEsc(); }, fail); else { wantFull = true; lockEsc(); } } catch (_) { fail(); } };

})();
