<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F1">
<title>쵸코와 한글</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@700&display=swap">
<style>
:root{
  --bg:#FFF9F1; --card:#FFFFFF; --ink:#3A3130; --muted:#857B76; --line:#EFE4D6;
  --mint:#CDEBE1; --mint-deep:#7FC4AF; --peach:#FFD4BF; --peach-deep:#F3A07F;
  --lavender:#E4DCF7; --lavender-deep:#B49FE3; --yellow:#FFE9A8; --yellow-deep:#F0C64B;
  --brown:#8B5A3C; --brown-deep:#6B4229; --cream:#F6E7D3;
  --ok:#5DB889; --shadow:0 6px 0 rgba(139,90,60,.10);
  --r:20px; --rb:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(circle at 15% 10%, rgba(205,235,225,.45) 0 22%, transparent 23%),radial-gradient(circle at 90% 30%, rgba(255,212,191,.45) 0 18%, transparent 19%),radial-gradient(circle at 20% 90%, rgba(228,220,247,.5) 0 20%, transparent 21%);background-attachment:fixed}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.screen{display:none;flex-direction:column;gap:16px;flex:1}
.screen.on{display:flex}
h1,h2,.display{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
.jamo{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:700}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:var(--rb);background:var(--brown);color:#fff;font-family:"Jua",sans-serif;font-size:20px;box-shadow:0 5px 0 var(--brown-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brown-deep)}
.btn.soft{background:var(--card);color:var(--brown);box-shadow:0 5px 0 var(--line)}
.btn.soft:active{box-shadow:0 1px 0 var(--line)}
.btn.small{min-height:46px;font-size:17px;padding:8px 16px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* 쵸코 */
.choco{width:120px;height:120px;flex:none;position:relative}
.choco svg,.choco img{width:100%;height:100%;display:block}
.choco.big{width:170px;height:170px}
.choco.sm{width:64px;height:64px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wiggle{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.jump{animation:jump .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.06)}}
.bubble{position:relative;background:var(--card);border-radius:var(--r);padding:12px 16px;font-size:18px;box-shadow:var(--shadow);flex:1;min-height:52px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:18px;height:18px;background:var(--card);transform:translateY(-50%) rotate(45deg);border-radius:4px}
.hero{display:flex;align-items:center;gap:16px;padding-top:8px}

/* 홈 */
.today{background:linear-gradient(135deg,var(--yellow),#FFF3CF);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);width:100%;text-align:left}
.today .icon{font-size:40px;line-height:1}
.today .label{font-size:14px;color:var(--brown);font-family:"Jua",sans-serif}
.today .title{font-size:23px;font-family:"Jua",sans-serif}
.today .go{margin-left:auto}
.stage{border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stage.mint{background:var(--mint)} .stage.peach{background:var(--peach)} .stage.lavender{background:var(--lavender)} .stage.yellow{background:var(--yellow)}
.stage-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage-head .sub{opacity:.7;font-size:15px}
.stage-head .lock{margin-left:auto;font-size:14px;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 10px}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson{background:var(--card);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:96px;box-shadow:0 4px 0 rgba(139,90,60,.08);transition:transform .08s}
.lesson:active{transform:scale(.97)}
.lesson .ic{font-size:26px;line-height:1}
.lesson .t{font-family:"Jua",sans-serif;font-size:18px;line-height:1.2}
.lesson .stars{font-size:15px;letter-spacing:2px;color:var(--yellow-deep)}
.lesson .stars .off{color:var(--line)}
.lesson .freetag{font-size:13px;color:var(--muted)}
.lesson.done{outline:3px solid var(--yellow-deep)}
.setline{font-size:14px;color:var(--brown);background:rgba(255,255,255,.7);border-radius:999px;padding:3px 12px;display:inline-block;margin-bottom:10px}
.soon{background:rgba(255,255,255,.6);border-radius:16px;padding:18px;text-align:center;font-family:"Jua",sans-serif;color:var(--muted)}
.teachfoot{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.teachfoot a{font-size:13px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 12px;box-shadow:0 2px 0 var(--line)}
.teachfoot a:active{transform:translateY(2px);box-shadow:none}

/* 놀이 공통 */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .back{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.progress{flex:1;height:14px;background:var(--card);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--mint-deep);border-radius:999px;transition:width .4s}
.topbar .count{font-family:"Jua",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.stagecard{background:var(--card);border-radius:var(--r);padding:18px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow);flex:1}
.prompt{display:flex;align-items:center;gap:12px;width:100%}
.area{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}

/* 글자 블록 */
.block{display:inline-flex;align-items:center;justify-content:center;background:var(--cream);border-radius:18px;box-shadow:0 6px 0 rgba(139,90,60,.18);min-width:132px;min-height:132px;font-size:88px;line-height:1;padding:8px 14px}
.block.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.slots{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:nowrap}
.slot{width:74px;height:88px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;font-size:46px;background:#FFFDF9;flex:none}
.slots .block{min-width:84px;min-height:88px;font-size:54px;padding:6px 8px;flex:none}
.slots .plus,.slots .eq{font-size:24px;flex:none}
.slot.filled{border-style:solid;border-color:var(--mint-deep);background:var(--mint)}
.plus,.eq{font-family:"Jua",sans-serif;font-size:30px;color:var(--muted)}
.speaker{width:110px;height:110px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-size:50px;box-shadow:0 6px 0 var(--peach-deep);transition:transform .08s;flex:none}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--peach-deep)}
.speaker.playing{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* 선택지 */
.options{display:grid;gap:10px;width:100%}
.options.n2{grid-template-columns:1fr 1fr}
.options.n3{grid-template-columns:1fr 1fr 1fr}
.options.n4{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s,border-color .15s,background .15s;padding:8px}
.opt:active{transform:scale(.96)}
.opt .jamo{font-size:52px;line-height:1.05}
.opt .pic{font-size:44px;line-height:1.1}
.opt .word{font-family:"Jua",sans-serif;font-size:21px}
.opt .en{font-size:13px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:#EAF7EF}
.opt.wrong{border-color:var(--peach-deep);background:#FFF1EA;animation:shake .35s}
.opt.dim{opacity:.35;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.chip{min-width:62px;min-height:62px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-size:34px;display:grid;place-items:center;transition:transform .08s}
.chip:active{transform:scale(.94)}
.chip.picked{border-color:var(--mint-deep);background:var(--mint)}
.chip.wrong{border-color:var(--peach-deep);background:#FFF1EA;animation:shake .35s}
.rowlabel{font-size:14px;color:var(--muted);align-self:flex-start}

/* 글자판 */
.boardwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table.board{border-collapse:separate;border-spacing:6px;margin:0 auto}
table.board th{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:26px;color:var(--brown);background:var(--cream);border-radius:10px;width:52px;height:44px}
table.board th.corner{background:transparent}
table.board td{padding:0}
.cell{width:52px;height:52px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:28px;display:grid;place-items:center;transition:transform .08s,background .15s}
.cell:active{transform:scale(.9)}
.cell.hit{background:var(--mint);border-color:var(--mint-deep)}
.boardview{display:flex;align-items:center;gap:12px;justify-content:center;min-height:150px;width:100%}
.boardview .parts{display:flex;flex-direction:column;gap:6px;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:34px;color:var(--brown)}
.tapcount{font-size:14px;color:var(--muted)}

/* 읽어 보기 */
.readrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.mic{width:110px;height:110px;border-radius:50%;background:var(--lavender);display:grid;place-items:center;font-size:46px;box-shadow:0 6px 0 var(--lavender-deep);flex:none;transition:transform .08s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lavender-deep)}
.mic.rec{background:#FFD6D6;box-shadow:0 6px 0 #E58585;animation:pulse .8s ease-in-out infinite}
.hintline{font-size:15px;color:var(--muted);text-align:center}

/* 결과 */
.result{align-items:center;text-align:center;gap:14px}
.starsbig{font-size:60px;letter-spacing:6px;color:var(--yellow-deep)}
.starsbig .off{color:var(--line)}
.starsbig span{display:inline-block;animation:starin .5s cubic-bezier(.34,1.56,.64,1) both}
.starsbig span:nth-child(2){animation-delay:.2s}.starsbig span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* 시작 덮개 */
.cover{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;padding:24px;text-align:center}
.cover p{color:var(--muted);margin:0;max-width:32ch}

/* 선생님 모드 */
dialog{border:none;border-radius:var(--r);padding:0;max-width:min(92vw,480px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(58,49,48,.25)}
dialog::backdrop{background:rgba(58,49,48,.4)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:85dvh;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=url],.field select{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--brown);outline-offset:1px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;background:var(--bg);padding:8px 12px;border-radius:12px}
.hint{font-size:13px;color:var(--muted)}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td,table.log th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* 태블릿 가로 — 좌우 2단 */
@media (orientation:landscape) and (min-width:820px) and (min-height:470px){
  .app{max-width:1040px;padding:18px 26px calc(20px + env(safe-area-inset-bottom))}
  .updown{flex-direction:column;text-align:center;gap:10px}
  .updown .bubble{flex:none;width:100%;justify-content:center;text-align:center}
  .updown .bubble::before{left:50%;top:-8px;transform:translateX(-50%) rotate(45deg)}

  #home.on{display:grid;grid-template-columns:290px 1fr;gap:14px 24px;align-items:start}
  #home .hero{grid-column:1;grid-row:1 / span 3;position:sticky;top:18px;padding-top:0}
  #home .hero .choco{width:172px;height:172px}
  #home .today,#home #stages,#home .teachfoot{grid-column:2}
  #home .lessons{grid-template-columns:repeat(3,1fr)}

  .stagecard{flex-direction:row;align-items:stretch;gap:24px;padding:20px 20px 24px}
  .stagecard .prompt{flex:0 0 232px;align-self:center}
  .stagecard .prompt .choco.sm{width:134px;height:134px}
  .area{flex:1 1 auto;min-width:0;width:auto;justify-content:center}
  .screen.result{justify-content:center}
  .options.n4{grid-template-columns:repeat(4,1fr)}
  .options.n2,.options.n3{grid-template-columns:repeat(3,1fr)}
  .block{min-width:150px;min-height:150px;font-size:100px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="choco big bob" id="coverChoco"></div>
  <h1 id="coverTitle">쵸코와 한글</h1>
  <p>소리가 나오는 놀이예요. 이어폰을 꽂고 시작해요.</p>
  <button class="btn" id="startBtn">▶ 시작</button>
  <p class="hint" id="audioNote"></p>
</div>

<div class="app">

  <!-- 홈 -->
  <section class="screen" id="home">
    <div class="hero updown">
      <button class="choco bob" id="homeChoco" aria-label="쵸코"></button>
      <div class="bubble" id="homeBubble">안녕! 나는 쵸코야.</div>
    </div>
    <button class="today" id="todayCard">
      <span class="icon" id="todayIcon">🧱</span>
      <span>
        <span class="label">오늘은 여기!</span><br>
        <span class="title" id="todayTitle">글자판</span>
      </span>
      <span class="go btn small">가자</span>
    </button>
    <div id="stages"></div>
    <div class="teachfoot">
      <a href="worksheets/1단계학습지.pdf" target="_blank" rel="noopener">🖨️ 1단계 학습지</a>
      <a href="worksheets/읽기확인표.pdf" target="_blank" rel="noopener">📋 읽기 확인표</a>
    </div>
  </section>

  <!-- 놀이 -->
  <section class="screen" id="play">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="마을로">🏠</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="count" id="count"></span>
    </div>
    <div class="stagecard">
      <div class="prompt updown">
        <button class="choco sm" id="playChoco" aria-label="쵸코 — 다시 들려줘"></button>
        <div class="bubble" id="playBubble"></div>
      </div>
      <div id="stage-area" class="area"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen result" id="result">
    <div class="choco big" id="resultChoco"></div>
    <h1 id="resultTitle">다 했어!</h1>
    <div class="starsbig" id="resultStars"></div>
    <p id="resultText" style="margin:0;color:var(--muted)"></p>
    <div class="row">
      <button class="btn soft" id="againBtn">🔁 한 번 더</button>
      <button class="btn" id="homeBtn">🏠 마을로</button>
    </div>
  </section>
</div>

<dialog id="pinDlg"><form method="dialog" class="dlg">
  <h2>선생님 모드</h2>
  <div class="field"><label for="pin">비밀번호</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"></div>
  <div class="row"><button class="btn soft small" value="cancel">닫기</button><button class="btn small" value="ok">열기</button></div>
</form></dialog>

<dialog id="teacherDlg"><div class="dlg">
  <h2>선생님 모드</h2>
  <div class="field"><label for="tSet">글자판에 열어 둘 범위</label><select id="tSet"></select></div>
  <div class="field"><label for="tStudent">학생 별칭 (시트에 기록되는 이름)</label><input type="text" id="tStudent"></div>
  <div class="field"><label for="tSheet">구글 Apps Script 웹앱 주소 (비우면 기기 안에만 저장)</label><input type="url" id="tSheet" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="field"><label>열린 단계</label><div class="checks" id="tStages"></div></div>
  <div class="field"><label><input type="checkbox" id="tEn"> 낱말에 영어 뜻 보이기</label></div>
  <div class="field"><label><input type="checkbox" id="tMic"> 「읽어 보기」에서 아이 목소리 녹음</label></div>
  <div class="field"><label>소리 <span class="hint" id="tAudio"></span></label></div>
  <div class="field"><label>최근 기록 <span class="hint" id="tQueue"></span></label><div style="max-height:170px;overflow:auto"><table class="log" id="tLog"></table></div></div>
  <div class="row">
    <button class="btn soft small" id="tSend">대기 중인 기록 보내기</button>
    <button class="btn soft small" id="tReset" style="color:#B5482F">진도 초기화</button>
  </div>
  <div class="row"><button class="btn" id="tClose">저장하고 닫기</button></div>
  <p class="hint">쵸코 그림 바꾸기: hangul/choco/ 폴더에 idle.png, cheer.png, happy.png, retry.png를 넣으면 자동으로 바뀝니다.</p>
</div></dialog>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
const D = window.HANGUL_DATA;
const KEY = 'choco-hangul-v2';
const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- 한글 조합 ---------- */
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG=["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const compose = (c,v) => String.fromCharCode(0xAC00 + (CHO.indexOf(c)*21 + JUNG.indexOf(v))*28);
function split(ch){
  const c = ch.charCodeAt(0)-0xAC00;
  if(c<0||c>11171) return null;
  const jong=c%28, jung=((c-jong)/28)%21, cho=Math.floor(((c-jong)/28)/21);
  return { cho:CHO[cho], jung:JUNG[jung], jong };
}

/* ---------- 소리 ----------
   1순위: 음성 파일(한 파일 안의 구간). 2순위: 기기 내장 기계 음성.
   파일 방식은 아이폰에서도 막히지 않는다. */
const Voice = {
  ctx:null, buf:null, map:null, ready:false, source:null, el:null, timer:null, mode:null,
  async init(){
    const a = D.audio || {};
    if(!a.file || !a.map) return;
    this.map = a.map;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    // 1순위: 통째로 읽어 두고 구간 재생 (가장 정확)
    if(this.ctx){
      try{
        const res = await fetch(a.file);
        if(!res.ok) throw new Error('no file');
        this.buf = await this.ctx.decodeAudioData(await res.arrayBuffer());
        this.ready = true; this.mode = 'buffer';
        return;
      }catch(e){}
    }
    // 2순위: <audio>로 구간 재생 (파일을 직접 열었을 때도 됨)
    try{
      const el = document.createElement('audio');
      el.preload = 'auto'; el.src = a.file;
      const ok = await new Promise(res=>{
        el.addEventListener('loadedmetadata', ()=>res(true), {once:true});
        el.addEventListener('error', ()=>res(false), {once:true});
        setTimeout(()=>res(el.readyState>=1), 6000);
      });
      if(ok && el.duration > 1){ this.el = el; this.ready = true; this.mode = 'element'; }
    }catch(e){}
  },
  unlock(){
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    if(this.el){ this.el.play().then(()=>this.el.pause()).catch(()=>{}); }
  },
  stop(){
    if(this.source){ try{ this.source.stop(); }catch(e){} this.source=null; }
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.el){ try{ this.el.pause(); }catch(e){} }
    if('speechSynthesis' in window) speechSynthesis.cancel();
  },
  has(key){ return !!(this.ready && this.map && this.map[key]); },
  say(key){
    this.last = key;
    this.stop();
    if(!this.has(key)) return tts(key);
    const [start, dur] = this.map[key];
    if(this.mode === 'buffer'){
      return new Promise(res=>{
        const s = this.ctx.createBufferSource();
        s.buffer = this.buf; s.connect(this.ctx.destination);
        s.onended = ()=>res();
        this.source = s; s.start(0, start, dur);
        setTimeout(res, dur*1000 + 400);
      });
    }
    return new Promise(res=>{
      const el = this.el, end = start + dur;
      try{ el.currentTime = start; }catch(e){}
      const p = el.play(); if(p && p.catch) p.catch(()=>{});
      this.timer = setInterval(()=>{
        if(el.currentTime >= end || el.paused){ clearInterval(this.timer); this.timer=null; el.pause(); res(); }
      }, 25);
      setTimeout(()=>{ if(this.timer){ clearInterval(this.timer); this.timer=null; } el.pause(); res(); }, dur*1000 + 900);
    });
  }
};
function tts(text){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){ res(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='ko-KR'; u.rate = cfg().speechRate; u.pitch = 1.05;
      const v = speechSynthesis.getVoices().find(x=>/^ko/i.test(x.lang));
      if(v) u.voice = v;
      u.onend = ()=>res(); u.onerror = ()=>res();
      speechSynthesis.speak(u);
      setTimeout(res, 3500);
    }catch(e){ res(); }
  });
}
/* 효과음 */
function tone(f,t,dur,type,vol){
  const c = Voice.ctx; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,c.currentTime+t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,c.currentTime+t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+0.05);
}
const sfx = {
  tap(){ tone(660,0,0.07,'triangle',0.1); },
  click(){ tone(880,0,0.05,'triangle',0.08); },
  ok(){ tone(523,0,0.1,'triangle',0.18); tone(784,0.1,0.18,'triangle',0.18); },
  no(){ tone(300,0,0.16,'sine',0.13); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*0.13,0.22,'triangle',0.2)); tone(1318,0.55,0.5,'triangle',0.2); }
};

/* ---------- 문제 만들기 ---------- */
function setSyllables(){
  const s = curSet(), out = [];
  s.consonants.forEach(c=>s.vowels.forEach(v=>out.push(compose(c,v))));
  return out;
}
function openWords(){
  const id = cfg().openSet;
  return D.words.filter(w=>w.set <= id);
}
function buildQuestions(l){
  const n = cfg().questionsPerActivity;
  const s = curSet();
  if(l.kind==='vowel'){
    const pool=[]; let items=shuffle(l.items);
    while(pool.length<n) pool.push(...shuffle(items));
    return pool.slice(0,n).map(t=>{
      const others = shuffle(l.items.filter(x=>x!==t)).slice(0,3);
      return { target:t, say:D.vowels[t].say, options:shuffle([t,...others]) };
    });
  }
  if(l.kind==='build'){
    const syl = shuffle(setSyllables()).slice(0,n);
    return syl.map(t=>{
      const d = split(t);
      const cOpts = shuffle([d.cho, ...shuffle(s.consonants.filter(x=>x!==d.cho)).slice(0,Math.min(3,s.consonants.length-1))]);
      const vOpts = shuffle([d.jung, ...shuffle(s.vowels.filter(x=>x!==d.jung)).slice(0,Math.min(3,s.vowels.length-1))]);
      return { target:t, cho:d.cho, jung:d.jung, cOpts, vOpts };
    });
  }
  if(l.kind==='read'){
    const syl = shuffle(setSyllables()).slice(0, Math.max(0, n-2));
    const ws = shuffle(openWords()).slice(0,2).map(w=>w.w);
    return shuffle([...syl, ...ws]).map(t=>({ target:t }));
  }
  if(l.kind==='word'){
    const ws = shuffle(openWords());
    const pool=[]; while(pool.length<n && ws.length) pool.push(...shuffle(ws));
    return pool.slice(0,n).map(w=>{
      const i = Math.floor(Math.random()*w.w.length);
      const answer = w.w[i];
      const all = shuffle(setSyllables().filter(x=>x!==answer)).slice(0,2);
      return { word:w, blank:i, answer, options:shuffle([answer, ...all]) };
    });
  }
  return [];
}

/* ---------- 놀이 ---------- */
let cur = null;
function startLesson(l){
  if(l.kind==='board'){ startBoard(l); return; }
  const qs = buildQuestions(l);
  if(!qs.length){ toast('아직 열린 글자가 적어요. 선생님 모드에서 범위를 넓혀 주세요.'); return; }
  cur = { lesson:l, qs, i:0, firstTry:0, misses:[], locked:false, attempted:false, done:0 };
  show('play'); renderChoco($('#playChoco'),'idle');
  nextQuestion();
}
function head(txt){
  $('#playBubble').textContent = txt;
  $('#bar').style.width = cur ? (cur.i/cur.qs.length*100)+'%' : '0%';
  $('#count').textContent = cur ? (cur.i+1)+'/'+cur.qs.length : '';
}
function nextQuestion(){
  if(cur.i >= cur.qs.length){ finish(); return; }
  cur.locked=false; cur.attempted=false;
  const k = cur.lesson.kind;
  if(k==='vowel') renderVowel();
  else if(k==='build') renderBuild();
  else if(k==='read') renderRead();
  else if(k==='word') renderWord();
}

  const checkDone = ()=>{
    if(gotC && gotV){
      const made = compose(gotC, gotV);
      $('#made').textContent = made;

      finishBuild(made === q.target, made, q.target);

async function finishBuild(ok, made, target){
  if(!cur.attempted) cur.firstTry++;
  sfx.ok();
  renderChoco($('#playChoco'),'happy'); animate($('#playChoco'),'jump');
  $('#playBubble').textContent = pick(D.choco.correct);
  streak(true);
  await wait(300); await playKey(made);
  await wait(400);
  cur.i++; renderChoco($('#playChoco'),'idle'); nextQuestion();
}

let mediaRec = null, chunks = [], myUrl = null;
function renderRead(){
  const q = cur.qs[cur.i];
  head(pick(D.choco.read));
  const a = $('#stage-area');
  a.innerHTML =
    '<div class="block jamo pop" id="big">'+q.target+'</div>'

    + '<button class="speaker" id="spk" aria-label="쵸코 소리 듣기">🔊</button>'

    + '</div>'
    + '<p class="hintline" id="readHint">🔊 듣고 → 🎤 누르고 크게 읽어 봐</p>'
    + '<div class="row"><button class="btn soft small" id="cmpBtn" disabled>▶ 이어서 듣기</button><button class="btn small" id="nextBtn">다음 →</button></div>';
  $('#spk').onclick = ()=>playKey(q.target);
  $('#nextBtn').onclick = ()=>{ sfx.tap(); cur.firstTry++; cur.i++; stopRec(); nextQuestion(); };
  const cmp = $('#cmpBtn');
  cmp.onclick = async ()=>{ await playKey(q.target); await wait(250); playMine(); };
  if(cfg().micEnabled) setupMic(q);
  setTimeout(()=>playKey(q.target), 300);
}
function setupMic(q){
  const btn = $('#micBtn'); if(!btn) return;
  btn.onclick = async ()=>{
    if(mediaRec && mediaRec.state === 'recording'){ stopRec(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks = [];
      mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e=>chunks.push(e.data);
      mediaRec.onstop = ()=>{
        stream.getTracks().forEach(t=>t.stop());
        if(myUrl) URL.revokeObjectURL(myUrl);
        myUrl = URL.createObjectURL(new Blob(chunks, {type:'audio/webm'}));
        btn.classList.remove('rec'); btn.textContent='🎤';
        const c=$('#cmpBtn'); if(c) c.disabled=false;
        const h=$('#readHint'); if(h) h.textContent='▶ 이어서 듣기로 쵸코 소리와 견주어 봐';
        playMine();
      };
      mediaRec.start();
      btn.classList.add('rec'); btn.textContent='⏹';
      const h=$('#readHint'); if(h) h.textContent='지금 읽어 봐! 다 하면 다시 눌러';
      setTimeout(()=>{ if(mediaRec && mediaRec.state==='recording') stopRec(); }, 5000);
    }catch(e){
      const h=$('#readHint'); if(h) h.textContent='마이크를 쓸 수 없어요. 🔊를 듣고 소리 내어 읽어 봐';
      btn.style.display='none';
    }
  };
}
function stopRec(){ if(mediaRec && mediaRec.state==='recording'){ try{ mediaRec.stop(); }catch(e){} } }
function playMine(){ if(!myUrl) return; const a=new Audio(myUrl); a.play().catch(()=>{}); }

/* 낱말 채우기 */
function renderWord(){
  const q = cur.qs[cur.i];
  head(pick(D.choco.word));
  const shown = [...q.word.w].map((ch,i)=> i===q.blank ? '□' : ch).join('');
  const a = $('#stage-area');
  a.innerHTML =
    '<div style="font-size:56px;line-height:1">'+q.word.pic+'</div>'
    + '<div class="block jamo" id="big" style="min-width:0;font-size:56px;padding:10px 20px">'+shown+'</div>'
    + (cfg().englishHint && q.word.en ? '<div class="hintline">'+q.word.en+'</div>' : '')
    + '<button class="speaker" id="spk" style="width:78px;height:78px;font-size:34px" aria-label="낱말 듣기">🔊</button>'
    + '<div class="options n3" id="opts"></div>';
  $('#spk').onclick = ()=>playKey(q.word.w);
  const op = $('#opts');
  q.options.forEach(ch=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="jamo">'+ch+'</span>';
    b.onclick=()=>answer(b, ch===q.answer, ch, q.word.w, ()=>{ $('#big').textContent = q.word.w; });
    op.appendChild(b);
  });
  setTimeout(()=>playKey(q.word.w), 300);
}

/* 공통 정답 처리 */
function miss(t){ if(!cur.attempted){ cur.attempted=true; cur.misses.push(t); } }
async function answer(btn, ok, saidKey, targetKey, onRight){
  if(cur.locked) return;
  if(ok){
    cur.locked = true;
    if(!cur.attempted) cur.firstTry++;
    btn.classList.add('right'); sfx.ok();
    document.querySelectorAll('.opt').forEach(o=>{ if(o!==btn) o.classList.add('dim'); });
    renderChoco($('#playChoco'),'happy'); animate($('#playChoco'),'jump');
    $('#playBubble').textContent = pick(D.choco.correct);
    streak(true);
    if(onRight) onRight();
    await wait(250);
    await playKey(targetKey);
    await wait(400);
    cur.i++; renderChoco($('#playChoco'),'idle'); nextQuestion();
  } else {
    miss(targetKey);
    streak(false);
    btn.classList.add('wrong'); sfx.no();
    renderChoco($('#playChoco'),'retry'); animate($('#playChoco'),'wiggle');
    $('#playBubble').textContent = pick(D.choco.retry);
    await playKey(saidKey); await wait(250); playKey(targetKey);
    setTimeout(()=>btn.classList.remove('wrong'), 500);
  }
}
async function playKey(key){
  const s = $('#spk'); if(s) s.classList.add('playing');
  await Voice.say(key);
  if(s) s.classList.remove('playing');
}

/* ---------- 쵸코와 주고받기 ---------- */
function chocoLine(kind){
  const t = (D.chocoText||{})[kind];
  return (t && t.length) ? pick(t) : '';
}
/* 연속 정답 — 세 개마다 신나 한다 */
function streak(ok){
  if(!cur) return;
  if(!ok){ cur.streak = 0; return; }
  cur.streak = (cur.streak||0) + 1;
  if(cur.streak >= 3 && cur.streak % 3 === 0){
    renderChoco($('#playChoco'),'cheer'); animate($('#playChoco'),'jump');
    $('#playBubble').textContent = cur.streak + '개 연속! ' + chocoLine('streak');
    sfx.fanfare();
  }
}
/* 쵸코를 누르면 방금 소리를 다시 들려준다 */
$('#playChoco').addEventListener('click', ()=>{
  sfx.tap(); animate($('#playChoco'),'wiggle');
  if(Voice.last){ $('#playBubble').textContent = chocoLine('again'); Voice.say(Voice.last); }
  else { $('#playBubble').textContent = chocoLine('nudge'); }
  resetIdle();
});
/* 한참 가만히 있으면 쵸코가 먼저 말을 건다 */
let idleTimer = null;
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(nudge, 20000);
}
function nudge(){
  resetIdle();
  if(!$('#play').classList.contains('on')) return;
  if(document.querySelector('dialog[open]')) return;
  const el = $('#playChoco');
  renderChoco(el,'idle'); animate(el,'wiggle');
  const board = cur && cur.lesson && cur.lesson.kind === 'board';
  if(board){
    const line = pick(D.choco.board);
    $('#playBubble').textContent = line;
    if(Voice.has(line)) Voice.say(line);
  }else{
    $('#playBubble').textContent = chocoLine('nudge');
    if(Voice.last) Voice.say(Voice.last);
  }
}
document.addEventListener('pointerdown', resetIdle, true);
resetIdle();

/* 글자판 (자유 탐험) */
function startBoard(l){
  cur = { lesson:l, qs:[], i:0, firstTry:0, misses:[], locked:false, taps:0 };
  show('play'); renderChoco($('#playChoco'),'idle');
  $('#playBubble').textContent = pick(D.choco.board);
  $('#bar').style.width='0%'; $('#count').textContent='';
  const s = curSet();
  let html = '<div class="boardview"><div class="parts"><span id="pC">?</span><span id="pV">?</span></div>'
    + '<span class="eq">=</span><div class="block jamo" id="big">?</div></div>'
    + '<div class="boardwrap"><table class="board"><tr><th class="corner"></th>';
  s.vowels.forEach(v=>{ html += '<th class="jamo">'+v+'</th>'; });
  html += '</tr>';
  s.consonants.forEach(c=>{
    html += '<tr><th class="jamo">'+c+'</th>';
    s.vowels.forEach(v=>{ html += '<td><button class="cell" data-c="'+c+'" data-v="'+v+'">'+compose(c,v)+'</button></td>'; });
    html += '</tr>';
  });
  html += '</table></div><p class="tapcount" id="tapCount">누른 글자 0개</p>';
  $('#stage-area').innerHTML = html;
  $('#stage-area').querySelectorAll('.cell').forEach(b=>{
    b.onclick = async ()=>{
      const c=b.dataset.c, v=b.dataset.v, ch=compose(c,v);
      document.querySelectorAll('.cell.hit').forEach(x=>x.classList.remove('hit'));
      b.classList.add('hit');
      $('#pC').textContent=c; $('#pV').textContent=v;
      const big=$('#big'); big.textContent=ch; big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop');
      cur.taps++; $('#tapCount').textContent = '누른 글자 '+cur.taps+'개';
      sfx.click();
      await Voice.say(ch);
    };
  });
}

/* 끝내기 */
function finish(){
  const l = cur.lesson;
  const total = cur.qs.length, ft = cur.firstTry;
  const stars = ft===total ? 3 : ft >= Math.ceil(total*0.6) ? 2 : 1;
  store.stars[l.id] = Math.max(store.stars[l.id]||0, stars);
  const rec = { code:cfg().studentCode, at:new Date().toISOString(), stage:l.stage, lesson:l.title,
                stars, firstTry:ft, total, misses:cur.misses.join(' '), set:cfg().openSet };
  store.log.push(rec); if(store.log.length>200) store.log.shift();
  store.queue.push(rec); save(); flushQueue();
  show('result');
  renderChoco($('#resultChoco'),'cheer'); animate($('#resultChoco'),'jump');
  $('#resultTitle').textContent = pick(D.choco.clear);
  $('#resultStars').innerHTML = starsHTML(stars);
  $('#resultText').textContent = l.kind==='read'
    ? total + '개를 소리 내어 읽었어요'
    : total + '개 중 ' + ft + '개를 한 번에 맞혔어요';
  sfx.fanfare();
}

/* 구글 시트 */
async function flushQueue(){
  const url = cfg().sheetUrl; if(!url || !store.queue.length) return;
  const batch = store.queue.slice();
  try{
    await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({records:batch})});
    store.queue = store.queue.slice(batch.length); save();
  }catch(e){}
}

/* 선생님 모드 */
let taps=[];
let homeMood = 0;
$('#homeChoco').addEventListener('click', ()=>{
  sfx.tap(); animate($('#homeChoco'),'wiggle');
  const moods = ['happy','cheer','idle'];
  renderChoco($('#homeChoco'), moods[homeMood++ % moods.length]);
  const line = pick(D.choco.hello);
  $('#homeBubble').textContent = line;
  if(Voice.has(line)) Voice.say(line);
  const now=Date.now(); taps = taps.filter(t=>now-t<3000); taps.push(now);
  if(taps.length>=5){ taps=[]; $('#pin').value=''; $('#pinDlg').showModal(); }
});
$('#pinDlg').addEventListener('close', ()=>{
  if($('#pinDlg').returnValue==='ok'){
    if($('#pin').value===cfg().teacherPin) openTeacher(); else toast('비밀번호가 달라요');
  }
});
function openTeacher(){
  const c = cfg();
  $('#tSet').innerHTML = D.sets.map(s=>'<option value="'+s.id+'"'+(s.id===c.openSet?' selected':'')+'>'+s.id+'. '+s.name+' ('+(s.consonants.length*s.vowels.length)+'글자)</option>').join('');
  $('#tStudent').value=c.studentCode; $('#tSheet').value=c.sheetUrl;
  $('#tEn').checked=!!c.englishHint; $('#tMic').checked=!!c.micEnabled;
  $('#tStages').innerHTML = D.stages.map(s=>'<label><input type="checkbox" value="'+s.id+'" '+(c.unlockedStages.includes(s.id)?'checked':'')+'> '+s.id+'. '+s.name+'</label>').join('');
  $('#tAudio').textContent = Voice.ready
    ? '녹음 파일 사용 중 (' + Object.keys(Voice.map).length + '개, ' + (Voice.mode==='buffer'?'통째로 읽음':'파일 재생') + ')'
    : '녹음 파일 없음 — 기기 내장 기계 음성 사용 중';
  $('#tQueue').textContent = store.queue.length ? '(전송 대기 '+store.queue.length+'건)' : (c.sheetUrl ? '(모두 전송됨)' : '(시트 미연결)');
  const rows = store.log.slice(-20).reverse();
  $('#tLog').innerHTML = '<tr><th>날짜</th><th>활동</th><th>별</th><th>틀린 것</th></tr>'
    + (rows.length ? rows.map(r=>'<tr><td>'+r.at.slice(5,16).replace('T',' ')+'</td><td>'+r.lesson+'</td><td>'+'★'.repeat(r.stars)+'</td><td>'+(r.misses||'-')+'</td></tr>').join('')
                   : '<tr><td colspan="4">아직 기록이 없어요</td></tr>');
  $('#teacherDlg').showModal();
}
$('#tSend').onclick = async ()=>{
  store.settings.sheetUrl = $('#tSheet').value.trim(); save(); await flushQueue();
  toast(store.queue.length ? '보내지 못했어요. 주소를 확인하세요' : '보냈어요');
};
$('#tReset').onclick = ()=>{
  if(confirm('별과 기록을 모두 지울까요?')){ store.stars={}; store.log=[]; store.queue=[]; save(); toast('초기화했어요'); renderHome(); }
};
$('#tClose').onclick = ()=>{
  store.settings.openSet = parseInt($('#tSet').value,10) || 1;
  store.settings.studentCode = $('#tStudent').value.trim() || D.config.studentCode;
  store.settings.sheetUrl = $('#tSheet').value.trim();
  store.settings.englishHint = $('#tEn').checked;
  store.settings.micEnabled = $('#tMic').checked;
  store.settings.unlockedStages = [...$('#tStages').querySelectorAll('input:checked')].map(i=>+i.value);
  if(!store.settings.unlockedStages.length) store.settings.unlockedStages=[1];
  save(); $('#teacherDlg').close(); renderHome(); toast('저장했어요');
};

/* 버튼 */
$('#backBtn').onclick = ()=>{ sfx.tap(); Voice.stop(); stopRec(); if(cur && cur.lesson.kind==='board' && cur.taps>0){ finishBoard(); } else { renderHome(); show('home'); } };
function finishBoard(){
  if(cur && cur.taps >= 5){ store.boardRuns = (store.boardRuns||0) + 1; save(); }
  renderHome(); show('home');
}
$('#homeBtn').onclick = ()=>{ sfx.tap(); renderHome(); show('home'); };
$('#againBtn').onclick = ()=>{ sfx.tap(); startLesson(cur.lesson); };
$('#startBtn').onclick = async ()=>{
  sfx.tap();
  Voice.unlock();
  if(!Voice.ready && 'speechSynthesis' in window){
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
  }
  $('#cover').style.display='none';
  renderHome(); show('home');
  Voice.say(D.choco.hello[0]);
  flushQueue();
};

/* 시작 */
renderChoco($('#coverChoco'),'idle');
$('#coverTitle').textContent = D.config.appName;
Voice.init().then(()=>{
  $('#audioNote').textContent = Voice.ready ? '' : '(녹음 파일이 아직 없어 기기 음성으로 읽어 줘요)';
});
})();
</script>
</body>
