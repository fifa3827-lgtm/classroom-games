<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F1">
<title>쵸코와 한글</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@700&display=swap">
<style>
:root{
  --bg:#FFF9F1; --card:#FFFFFF; --ink:#3A3130; --muted:#857B76; --line:#EFE4D6;
  --mint:#CDEBE1; --mint-deep:#7FC4AF; --peach:#FFD4BF; --peach-deep:#F3A07F;
  --lavender:#E4DCF7; --lavender-deep:#B49FE3; --yellow:#FFE9A8; --yellow-deep:#F0C64B;
  --brown:#8B5A3C; --brown-deep:#6B4229; --cream:#F6E7D3;
  --ok:#5DB889; --shadow:0 6px 0 rgba(139,90,60,.10);
  --r:20px; --rb:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(circle at 15% 10%, rgba(205,235,225,.45) 0 22%, transparent 23%),radial-gradient(circle at 90% 30%, rgba(255,212,191,.45) 0 18%, transparent 19%),radial-gradient(circle at 20% 90%, rgba(228,220,247,.5) 0 20%, transparent 21%);background-attachment:fixed}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.screen{display:none;flex-direction:column;gap:16px;flex:1}
.screen.on{display:flex}
h1,h2,.display{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
.jamo{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:700}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 24px;border-radius:var(--rb);background:var(--brown);color:#fff;font-family:"Jua",sans-serif;font-size:20px;box-shadow:0 5px 0 var(--brown-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brown-deep)}
.btn.soft{background:var(--card);color:var(--brown);box-shadow:0 5px 0 var(--line)}
.btn.soft:active{box-shadow:0 1px 0 var(--line)}
.btn.small{min-height:44px;font-size:17px;padding:8px 16px}

/* ---- 쵸코 ---- */
.choco{width:120px;height:120px;flex:none;position:relative}
.choco svg,.choco img{width:100%;height:100%;display:block}
.choco.big{width:170px;height:170px}
.choco.sm{width:72px;height:72px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wiggle{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.jump{animation:jump .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.06)}}
.bubble{position:relative;background:var(--card);border-radius:var(--r);padding:14px 18px;font-size:19px;box-shadow:var(--shadow);flex:1;min-height:56px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:20px;height:20px;background:var(--card);transform:translateY(-50%) rotate(45deg);border-radius:4px}
.hero{display:flex;align-items:center;gap:18px;padding-top:8px}

/* ---- 홈 ---- */
.today{background:linear-gradient(135deg,var(--yellow),#FFF3CF);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.today .icon{font-size:44px;line-height:1}
.today .label{font-size:14px;color:var(--brown);font-family:"Jua",sans-serif}
.today .title{font-size:24px;font-family:"Jua",sans-serif}
.today .go{margin-left:auto}
.stage{border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stage.mint{background:var(--mint)} .stage.peach{background:var(--peach)} .stage.lavender{background:var(--lavender)} .stage.yellow{background:var(--yellow)}
.stage-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.stage-head .sub{color:var(--ink);opacity:.7;font-size:15px}
.stage-head .lock{margin-left:auto;font-size:14px;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 10px}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson{background:var(--card);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:96px;box-shadow:0 4px 0 rgba(139,90,60,.08);transition:transform .08s}
.lesson:active{transform:scale(.97)}
.lesson .ic{font-size:28px;line-height:1}
.lesson .t{font-family:"Jua",sans-serif;font-size:18px;line-height:1.2}
.lesson .stars{font-size:15px;letter-spacing:2px;color:var(--yellow-deep)}
.lesson .stars .off{color:var(--line)}
.lesson.done{outline:3px solid var(--yellow-deep)}
.stage.locked .lessons{opacity:.55;pointer-events:none}
.soon{background:rgba(255,255,255,.6);border-radius:16px;padding:18px;text-align:center;font-family:"Jua",sans-serif;color:var(--muted)}

/* ---- 놀이 ---- */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .back{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:22px;display:grid;place-items:center}
.progress{flex:1;height:14px;background:var(--card);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--mint-deep);border-radius:999px;transition:width .4s}
.topbar .count{font-family:"Jua",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.stagecard{background:var(--card);border-radius:var(--r);padding:20px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:var(--shadow);flex:1}
.prompt{display:flex;align-items:center;gap:14px;width:100%}
.prompt .bubble{font-size:18px}
.speaker{width:120px;height:120px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-size:56px;box-shadow:0 6px 0 var(--peach-deep);transition:transform .08s}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--peach-deep)}
.speaker.playing{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bigletter{font-size:120px;line-height:1;padding:8px 32px;border-radius:var(--r);background:var(--lavender);box-shadow:0 6px 0 var(--lavender-deep);transition:transform .08s}
.bigletter:active{transform:translateY(4px)}
.options{display:grid;gap:12px;width:100%}
.options.n2{grid-template-columns:1fr 1fr}
.options.n3{grid-template-columns:1fr 1fr 1fr}
.options.n4{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:3px solid var(--line);border-radius:var(--r);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .08s,border-color .15s,background .15s;padding:10px}
.opt:active{transform:scale(.96)}
.opt .jamo{font-size:64px;line-height:1}
.opt .pic{font-size:52px;line-height:1.1}
.opt .word{font-family:"Jua",sans-serif;font-size:22px}
.opt .en{font-size:13px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:#EAF7EF;animation:pop .35s}
.opt.wrong{border-color:var(--peach-deep);background:#FFF1EA;animation:shake .35s}
.opt.dim{opacity:.35;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.reward{display:flex;align-items:center;gap:12px;background:var(--mint);border-radius:16px;padding:10px 16px;font-family:"Jua",sans-serif;font-size:22px;min-height:60px;width:100%;justify-content:center}
.reward .pic{font-size:34px}
.reward .en{font-size:14px;color:var(--muted);font-family:"Gowun Dodum",sans-serif}
.reward.hidden{visibility:hidden}

/* ---- 결과 ---- */
.result{align-items:center;text-align:center;gap:14px}
.result .starsbig{font-size:64px;letter-spacing:6px;color:var(--yellow-deep)}
.result .starsbig .off{color:var(--line)}
.result .starsbig span{display:inline-block;animation:starin .5s cubic-bezier(.34,1.56,.64,1) both}
.result .starsbig span:nth-child(2){animation-delay:.2s}.result .starsbig span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---- 시작 덮개 ---- */
.cover{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:50;padding:24px;text-align:center}
.cover p{color:var(--muted);margin:0;max-width:32ch}

/* ---- 선생님 모드 ---- */
dialog{border:none;border-radius:var(--r);padding:0;max-width:min(92vw,480px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(58,49,48,.25)}
dialog::backdrop{background:rgba(58,49,48,.4)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:85dvh;overflow:auto}
.dlg h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=url]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.field input:focus-visible{outline:3px solid var(--brown);outline-offset:1px}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;background:var(--bg);padding:8px 12px;border-radius:12px}
.hint{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.opt .jamo{font-size:72px}}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="choco big bob" id="coverChoco"></div>
  <h1 id="coverTitle">쵸코와 한글</h1>
  <p>소리가 나오는 놀이예요. 이어폰을 꽂고 시작해요.</p>
  <button class="btn" id="startBtn">▶ 시작</button>
</div>

<div class="app">

  <!-- 홈 -->
  <section class="screen" id="home">
    <div class="hero">
      <button class="choco bob" id="homeChoco" aria-label="쵸코"></button>
      <div class="bubble" id="homeBubble">안녕! 나는 쵸코야.</div>
    </div>
    <button class="today" id="todayCard">
      <span class="icon" id="todayIcon">🌱</span>
      <span>
        <span class="label">오늘은 여기!</span><br>
        <span class="title" id="todayTitle">모음 첫걸음</span>
      </span>
      <span class="go btn small">가자</span>
    </button>
    <div id="stages"></div>
  </section>

  <!-- 놀이 -->
  <section class="screen" id="play">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="마을로">🏠</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="count" id="count">1/6</span>
    </div>
    <div class="stagecard">
      <div class="prompt">
        <div class="choco sm" id="playChoco"></div>
        <div class="bubble" id="playBubble">잘 들어 봐!</div>
      </div>
      <div id="stimulus"></div>
      <div class="options" id="options"></div>
      <div class="reward hidden" id="reward"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen result" id="result">
    <div class="choco big" id="resultChoco"></div>
    <h1 id="resultTitle">다 했어!</h1>
    <div class="starsbig" id="resultStars"></div>
    <p id="resultText" style="margin:0;color:var(--muted)"></p>
    <div class="row">
      <button class="btn soft" id="againBtn">🔁 한 번 더</button>
      <button class="btn" id="homeBtn">🏠 마을로</button>
    </div>
  </section>
</div>

<!-- 선생님 모드 -->
<dialog id="pinDlg"><form method="dialog" class="dlg">
  <h2>선생님 모드</h2>
  <div class="field"><label for="pin">비밀번호</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"></div>
  <div class="row"><button class="btn soft small" value="cancel">닫기</button><button class="btn small" id="pinOk" value="ok">열기</button></div>
</form></dialog>

<dialog id="teacherDlg"><div class="dlg">
  <h2>선생님 모드</h2>
  <div class="field"><label for="tStudent">학생 별칭 (시트에 기록되는 이름)</label><input type="text" id="tStudent"></div>
  <div class="field"><label for="tSheet">구글 Apps Script 웹앱 주소 (비우면 기기 안에만 저장)</label><input type="url" id="tSheet" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="field"><label for="tRate">소리 속도 <span id="tRateV"></span></label><input type="range" id="tRate" min="0.5" max="1.2" step="0.05"></div>
  <div class="field"><label>열린 단계</label><div class="checks" id="tStages"></div></div>
  <div class="field"><label><input type="checkbox" id="tEn"> 낱말 카드에 영어 뜻 보이기</label></div>
  <div class="field"><label>최근 기록 <span class="hint" id="tQueue"></span></label><div style="max-height:180px;overflow:auto"><table id="tLog"></table></div></div>
  <div class="row">
    <button class="btn soft small" id="tSend">대기 중인 기록 보내기</button>
    <button class="btn soft small" id="tReset" style="color:#B5482F">진도 초기화</button>
  </div>
  <div class="row"><button class="btn" id="tClose">저장하고 닫기</button></div>
  <p class="hint">쵸코 그림 바꾸기: hangul/choco/ 폴더에 idle.png, cheer.png, happy.png, retry.png를 넣으면 자동으로 바뀝니다.</p>
</div></dialog>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
const D = window.HANGUL_DATA;
const KEY = 'choco-hangul-v1';

/* ---------- 저장 ---------- */
const store = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)||'{}');
    return Object.assign({stars:{}, log:[], queue:[], settings:{}}, s); }
  catch(e){ return {stars:{}, log:[], queue:[], settings:{}}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const cfg = () => Object.assign({}, D.config, store.settings);

/* ---------- 쵸코 ---------- */
let useImages = false;
const probe = new Image();
probe.onload = () => { useImages = true; document.querySelectorAll('.choco').forEach(el => renderChoco(el, el.dataset.mood||'idle')); };
probe.src = 'choco/idle.png';

function chocoSVG(mood){
  const eyes = mood==='happy' ? '<path d="M38 52q6-7 12 0" stroke="#3A3130" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M70 52q6-7 12 0" stroke="#3A3130" stroke-width="4" fill="none" stroke-linecap="round"/>'
            : mood==='retry' ? '<circle cx="44" cy="54" r="4.5" fill="#3A3130"/><circle cx="76" cy="54" r="4.5" fill="#3A3130"/><path d="M36 44l14 4M84 44l-14 4" stroke="#3A3130" stroke-width="3" stroke-linecap="round"/>'
            : '<circle cx="44" cy="54" r="5" fill="#3A3130"/><circle cx="76" cy="54" r="5" fill="#3A3130"/><circle cx="46" cy="52" r="1.6" fill="#fff"/><circle cx="78" cy="52" r="1.6" fill="#fff"/>';
  const mouth = mood==='happy'||mood==='cheer' ? '<path d="M50 66q10 10 20 0" stroke="#3A3130" stroke-width="3.5" fill="#F3A07F" stroke-linecap="round"/>'
            : mood==='retry' ? '<path d="M54 68q6-4 12 0" stroke="#3A3130" stroke-width="3" fill="none" stroke-linecap="round"/>'
            : '<path d="M54 64q6 5 12 0" stroke="#3A3130" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const paws = mood==='cheer' ? '<ellipse cx="22" cy="58" rx="9" ry="11" fill="#8B5A3C"/><ellipse cx="98" cy="58" rx="9" ry="11" fill="#8B5A3C"/>' : '<ellipse cx="44" cy="106" rx="11" ry="8" fill="#8B5A3C"/><ellipse cx="76" cy="106" rx="11" ry="8" fill="#8B5A3C"/>';
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <path d="M28 40 L20 12 L48 28Z" fill="#8B5A3C"/><path d="M92 40 L100 12 L72 28Z" fill="#8B5A3C"/>
    <path d="M30 36 L26 20 L42 30Z" fill="#F3A07F"/><path d="M90 36 L94 20 L78 30Z" fill="#F3A07F"/>
    <ellipse cx="60" cy="98" rx="30" ry="18" fill="#8B5A3C"/>
    <circle cx="60" cy="58" r="36" fill="#8B5A3C"/>
    <ellipse cx="60" cy="70" rx="20" ry="13" fill="#F6E7D3"/>
    ${paws}
    ${eyes}
    <path d="M56 60 l4 4 l4-4z" fill="#F3A07F"/>
    ${mouth}
    <path d="M30 62h14M30 68h14M76 62h14M76 68h14" stroke="#F6E7D3" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <path d="M90 100q22-4 14-22" stroke="#8B5A3C" stroke-width="9" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function renderChoco(el, mood){
  el.dataset.mood = mood;
  el.innerHTML = useImages ? `<img src="choco/${mood}.png" alt="">` : chocoSVG(mood);
}
function animate(el, cls){ el.classList.remove('wiggle','jump'); void el.offsetWidth; el.classList.add(cls); }

/* ---------- 소리 ---------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f, t, dur, type, vol){ const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,c.currentTime+t); g.gain.exponentialRampToValueAtTime(vol||0.25,c.currentTime+t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+0.05); }
const sfx = {
  tap(){ tone(660,0,0.08,'triangle',0.12); },
  ok(){ tone(523,0,0.12,'triangle'); tone(784,0.12,0.2,'triangle'); },
  no(){ tone(300,0,0.18,'sine',0.15); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*0.13,0.22,'triangle',0.22)); tone(1318,0.55,0.5,'triangle',0.22); }
};

let voice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices(); if(!vs.length) return;
  voice = vs.find(v=>/ko[-_]KR/i.test(v.lang) && /Google|Yuna|Heami|Sora|Jimin|Natural/i.test(v.name)) || vs.find(v=>/^ko/i.test(v.lang)) || null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){ res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; if(voice) u.voice=voice; u.rate = rate || cfg().speechRate; u.pitch=1.05;
    u.onend = ()=>res(); u.onerror = ()=>res();
    speechSynthesis.speak(u);
    setTimeout(res, 4000);
  });
}

/* ---------- 도움 ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r=>setTimeout(r,ms));
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function starsHTML(n, cls){ let h=''; for(let i=1;i<=3;i++) h += `<span class="${i<=n?'':'off'}">★</span>`; return h; }

/* ---------- 홈 ---------- */
function nextLesson(){ const c=cfg(); return D.lessons.find(l => c.unlockedStages.includes(l.stage) && (store.stars[l.id]||0) < 3) || D.lessons[0]; }
function renderHome(){
  const c = cfg();
  renderChoco($('#homeChoco'),'idle');
  $('#homeBubble').textContent = pick(D.choco.hello);
  const nl = nextLesson();
  $('#todayIcon').textContent = nl.icon; $('#todayTitle').textContent = nl.title;
  $('#todayCard').onclick = ()=>{ sfx.tap(); startLesson(nl); };
  const wrap = $('#stages'); wrap.innerHTML='';
  D.stages.forEach(st=>{
    const open = c.unlockedStages.includes(st.id);
    const ls = D.lessons.filter(l=>l.stage===st.id);
    const el = document.createElement('div'); el.className = `stage ${st.color}${open?'':' locked'}`;
    el.innerHTML = `<div class="stage-head"><h2>${st.name}</h2><span class="sub">${st.sub}</span>${open?'':'<span class="lock">🔒 아직</span>'}</div>`;
    if(ls.length){
      const grid = document.createElement('div'); grid.className='lessons';
      ls.forEach(l=>{ const n = store.stars[l.id]||0; const b=document.createElement('button'); b.className='lesson'+(n===3?' done':'');
        b.innerHTML = `<span class="ic">${l.icon}</span><span class="t">${l.title}</span><span class="stars">${starsHTML(n)}</span>`;
        b.onclick=()=>{ sfx.tap(); startLesson(l); }; grid.appendChild(b); });
      el.appendChild(grid);
    } else { el.insertAdjacentHTML('beforeend','<div class="soon">쵸코가 준비하고 있어요</div>'); }
    wrap.appendChild(el);
  });
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='16px';
}

/* ---------- 문제 만들기 ---------- */
function buildQuestions(lesson){
  const n = cfg().questionsPerActivity, qs=[];
  if(lesson.kind==='pair'){
    for(let i=0;i<n;i++){ const p = lesson.pairs[i % lesson.pairs.length]; qs.push({kind:'pair', options:shuffle(p), target:pick(p)}); }
    return shuffle(qs);
  }
  let pool = shuffle(lesson.items); while(pool.length<n) pool = pool.concat(shuffle(lesson.items));
  pool = pool.slice(0,n);
  pool.forEach(t=>{
    if(lesson.kind==='listen'){
      const k = Math.min(4, lesson.items.length);
      const others = shuffle(lesson.items.filter(x=>x!==t)).slice(0,k-1);
      qs.push({kind:'listen', target:t, options:shuffle([t,...others])});
    } else {
      const tw = pick(D.jamo[t].words);
      const others = shuffle(lesson.items.filter(x=>x!==t)).slice(0,2).map(x=>pick(D.jamo[x].words));
      qs.push({kind:'picture', target:t, word:tw, options:shuffle([tw,...others])});
    }
  });
  return qs;
}

/* ---------- 놀이 진행 ---------- */
let cur = null;
function startLesson(lesson){
  cur = { lesson, qs: buildQuestions(lesson), i:0, firstTry:0, misses:[], locked:false };
  show('play'); renderChoco($('#playChoco'),'idle');
  nextQuestion();
}
function nextQuestion(){
  const q = cur.qs[cur.i]; if(!q){ finish(); return; }
  cur.attempted=false; cur.locked=false;
  $('#bar').style.width = (cur.i/cur.qs.length*100)+'%';
  $('#count').textContent = `${cur.i+1}/${cur.qs.length}`;
  $('#playBubble').textContent = pick(D.choco.start);
  $('#reward').classList.add('hidden'); $('#reward').innerHTML='';
  const st = $('#stimulus'), op = $('#options'); st.innerHTML=''; op.innerHTML='';
  const j = D.jamo[q.target];

  if(q.kind==='listen' || q.kind==='pair'){
    st.innerHTML = `<button class="speaker" id="spk" aria-label="다시 듣기">🔊</button>`;
    $('#spk').onclick = ()=>playTarget(j);
    op.className = `options n${q.options.length}`;
    q.options.forEach(ch=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<span class="jamo">${ch}</span>`; b.onclick=()=>answer(b, ch===q.target, ch); op.appendChild(b); });
    $('#playBubble').textContent = q.kind==='pair' ? '어느 소리일까?' : pick(D.choco.start);
    setTimeout(()=>playTarget(j), 350);
  } else {
    st.innerHTML = `<button class="bigletter jamo" id="spk" aria-label="글자 소리 듣기">${q.target}</button>`;
    $('#spk').onclick = ()=>playTarget(j);
    op.className = 'options n3';
    q.options.forEach(w=>{ const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<span class="pic">${w[1]}</span><span class="word">${w[0]}</span>${cfg().englishHint?`<span class="en">${w[2]}</span>`:''}`;
      b.onclick=()=>{ speak(w[0]); answer(b, w===q.word, w[0]); }; op.appendChild(b); });
    $('#playBubble').textContent = '이 글자로 시작하는 그림은?';
    setTimeout(()=>playTarget(j), 350);
  }
}
async function playTarget(j){
  const s=$('#spk'); if(s) s.classList.add('playing');
  if(j.silent) await speak(`${j.name}. 소리가 없어요.`); else await speak(j.say);
  if(s) s.classList.remove('playing');
}
async function answer(btn, ok, label){
  if(cur.locked) return;
  const q = cur.qs[cur.i];
  if(ok){
    cur.locked=true;
    if(!cur.attempted) cur.firstTry++;
    btn.classList.add('right'); sfx.ok();
    document.querySelectorAll('.opt').forEach(o=>{ if(o!==btn) o.classList.add('dim'); });
    renderChoco($('#playChoco'),'happy'); animate($('#playChoco'),'jump');
    $('#playBubble').textContent = pick(D.choco.correct);
    const j = D.jamo[q.target];
    if(q.kind!=='picture'){
      const w = pick(j.words);
      $('#reward').innerHTML = `<span class="pic">${w[1]}</span><span>${w[0]}</span>${cfg().englishHint?`<span class="en">${w[2]}</span>`:''}`;
      $('#reward').classList.remove('hidden');
      await wait(250); await speak(j.silent ? w[0] : `${j.say}. ${w[0]}`);
    } else { await wait(700); }
    await wait(500);
    cur.i++; renderChoco($('#playChoco'),'idle'); nextQuestion();
  } else {
    if(!cur.attempted){ cur.attempted=true; cur.misses.push(q.target); }
    btn.classList.add('wrong'); sfx.no();
    renderChoco($('#playChoco'),'retry'); animate($('#playChoco'),'wiggle');
    $('#playBubble').textContent = pick(D.choco.retry);
    if(q.kind!=='picture'){ await speak(D.jamo[label].silent ? D.jamo[label].name : D.jamo[label].say, 0.8); await wait(300); playTarget(D.jamo[q.target]); }
    setTimeout(()=>btn.classList.remove('wrong'), 500);
  }
}
function finish(){
  const total = cur.qs.length, ft = cur.firstTry;
  const stars = ft===total ? 3 : ft>=Math.ceil(total*0.6) ? 2 : 1;
  const prev = store.stars[cur.lesson.id]||0;
  store.stars[cur.lesson.id] = Math.max(prev, stars);
  const rec = { code: cfg().studentCode, at: new Date().toISOString(), stage: cur.lesson.stage, lesson: cur.lesson.title, stars, firstTry: ft, total, misses: cur.misses.join(' ') };
  store.log.push(rec); if(store.log.length>200) store.log.shift();
  store.queue.push(rec); save(); flushQueue();
  show('result');
  renderChoco($('#resultChoco'),'cheer'); animate($('#resultChoco'),'jump');
  $('#resultTitle').textContent = pick(D.choco.clear);
  $('#resultStars').innerHTML = starsHTML(stars);
  $('#resultText').textContent = `${total}개 중 ${ft}개를 한 번에 맞혔어요`;
  sfx.fanfare();
  setTimeout(()=>speak(stars===3 ? '와, 별 세 개! 최고야!' : stars===2 ? '별 두 개! 잘했어!' : '별 하나! 다음엔 더 잘할 거야.'), 900);
}

/* ---------- 구글 시트 전송 ---------- */
async function flushQueue(){
  const url = cfg().sheetUrl; if(!url || !store.queue.length) return;
  const batch = store.queue.slice();
  try{
    await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ records: batch }) });
    store.queue = store.queue.slice(batch.length); save();
  }catch(e){ /* 다음 접속 때 다시 보냄 */ }
}

/* ---------- 선생님 모드 ---------- */
let taps=[], tapTimer=null;
$('#homeChoco').addEventListener('click', ()=>{
  sfx.tap(); animate($('#homeChoco'),'wiggle'); speak(pick(D.choco.hello));
  const now=Date.now(); taps = taps.filter(t=>now-t<3000); taps.push(now);
  if(taps.length>=5){ taps=[]; $('#pin').value=''; $('#pinDlg').showModal(); }
});
$('#pinDlg').addEventListener('close', ()=>{
  if($('#pinDlg').returnValue==='ok'){ if($('#pin').value===cfg().teacherPin) openTeacher(); else toast('비밀번호가 달라요'); }
});
function openTeacher(){
  const c=cfg();
  $('#tStudent').value=c.studentCode; $('#tSheet').value=c.sheetUrl; $('#tRate').value=c.speechRate; $('#tRateV').textContent=c.speechRate; $('#tEn').checked=!!c.englishHint;
  $('#tStages').innerHTML = D.stages.map(s=>`<label><input type="checkbox" value="${s.id}" ${c.unlockedStages.includes(s.id)?'checked':''}> ${s.id}. ${s.name}</label>`).join('');
  $('#tQueue').textContent = store.queue.length ? `(전송 대기 ${store.queue.length}건)` : c.sheetUrl ? '(모두 전송됨)' : '(시트 미연결)';
  const rows = store.log.slice(-20).reverse();
  $('#tLog').innerHTML = '<tr><th>날짜</th><th>활동</th><th>별</th><th>틀린 글자</th></tr>' + (rows.length ? rows.map(r=>`<tr><td>${r.at.slice(5,16).replace('T',' ')}</td><td>${r.lesson}</td><td>${'★'.repeat(r.stars)}</td><td>${r.misses||'-'}</td></tr>`).join('') : '<tr><td colspan="4">아직 기록이 없어요</td></tr>');
  $('#teacherDlg').showModal();
}
$('#tRate').addEventListener('input', e=>{ $('#tRateV').textContent=e.target.value; });
$('#tSend').onclick = async ()=>{ store.settings.sheetUrl=$('#tSheet').value.trim(); save(); await flushQueue(); toast(store.queue.length?'보내지 못했어요. 주소를 확인하세요':'보냈어요'); $('#tQueue').textContent = store.queue.length?`(전송 대기 ${store.queue.length}건)`:'(모두 전송됨)'; };
$('#tReset').onclick = ()=>{ if(confirm('별과 기록을 모두 지울까요?')){ store.stars={}; store.log=[]; store.queue=[]; save(); toast('초기화했어요'); renderHome(); } };
$('#tClose').onclick = ()=>{
  store.settings.studentCode = $('#tStudent').value.trim()||D.config.studentCode;
  store.settings.sheetUrl = $('#tSheet').value.trim();
  store.settings.speechRate = parseFloat($('#tRate').value);
  store.settings.englishHint = $('#tEn').checked;
  store.settings.unlockedStages = [...$('#tStages').querySelectorAll('input:checked')].map(i=>+i.value);
  if(!store.settings.unlockedStages.length) store.settings.unlockedStages=[1];
  save(); $('#teacherDlg').close(); renderHome(); toast('저장했어요');
};

/* ---------- 버튼 ---------- */
$('#backBtn').onclick = ()=>{ sfx.tap(); speechSynthesis.cancel(); renderHome(); show('home'); };
$('#homeBtn').onclick = ()=>{ sfx.tap(); renderHome(); show('home'); };
$('#againBtn').onclick = ()=>{ sfx.tap(); startLesson(cur.lesson); };
$('#startBtn').onclick = async ()=>{
  ac(); sfx.tap(); $('#cover').style.display='none'; renderHome(); show('home');
  await speak(D.choco.hello[0]);
  flushQueue();
};
renderChoco($('#coverChoco'),'idle');
$('#coverTitle').textContent = D.config.appName;

})();
</script>
