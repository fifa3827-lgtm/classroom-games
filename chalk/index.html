<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>분필 대소동</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1F3D2B; }
  body {
    font-family: "Jua", "Gaegu", "Comic Sans MS", system-ui, sans-serif;
    color: #fff; touch-action: none; word-break: keep-all;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  .hidden { display: none !important; }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: safe center; gap: 18px;
    background: rgba(10, 25, 16, 0.55); padding: 16px; box-sizing: border-box;
    text-align: center; overflow-y: auto; touch-action: pan-y;
  }
  #pause, #levelup, #result { background: rgba(10, 25, 16, 0.8); }
  .btn {
    font-family: inherit; min-height: 64px; min-width: 200px; padding: 8px 28px;
    font-size: 28px; color: #fff; background: #2d5a3f; border: 4px solid #fff;
    border-radius: 18px; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .btn.main { background: #FFE066; color: #1F3D2B; border-color: #fff; font-size: 36px; min-width: 260px; min-height: 76px; }
  .btn.small { font-size: 22px; min-height: 56px; min-width: 150px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  h1.big { font-size: clamp(52px, 11vw, 96px); margin: 0; letter-spacing: 2px;
    text-shadow: 0 0 2px #000, 4px 5px 0 rgba(0,0,0,.45); }
  h2.big { font-size: clamp(36px, 7vw, 60px); margin: 0; text-shadow: 3px 4px 0 rgba(0,0,0,.45); }
  .sub { font-size: 24px; opacity: .9; margin: 0; }
  .tiny { font-size: 18px; opacity: .75; margin: 0; }

  #drawCv {
    width: min(300px, 70vw, 45vh); height: min(300px, 70vw, 45vh);
    background: #28513a; border: 6px dashed #fff; border-radius: 16px; touch-action: none;
  }

  #hud { position: fixed; left: 0; right: 0; top: 0; padding: 10px 12px; pointer-events: none;
    display: flex; flex-direction: column; gap: 8px; box-sizing: border-box;
    background: linear-gradient(rgba(10,25,16,.7), rgba(10,25,16,.45) 75%, rgba(10,25,16,0)); padding-bottom: 16px; }
  #hudTop { display: flex; align-items: center; gap: 12px; }
  .bar { position: relative; height: 26px; border: 3px solid #fff; border-radius: 14px;
    background: rgba(0,0,0,.4); overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  .bar .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 19px; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  #hpBar { flex: 1; max-width: 300px; }
  #hpFill { background: #FF6B6B; }
  #lvFill { background: #FFD700; }
  #timeText { flex: 1; text-align: center; font-size: clamp(26px, 5vw, 40px);
    text-shadow: 0 0 3px #000, 2px 3px 0 rgba(0,0,0,.5); white-space: nowrap; }
  #killText { font-size: 20px; text-shadow: 0 0 3px #000; white-space: nowrap; }
  #btnPause { pointer-events: auto; min-width: 64px; width: 64px; height: 64px; padding: 0; font-size: 30px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; font-size: clamp(30px, 6vw, 46px);
    pointer-events: none; text-shadow: 0 0 4px #000, 3px 4px 0 rgba(0,0,0,.5); }
  #banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
    font-size: clamp(40px, 9vw, 72px); color: #FFE066; text-shadow: 0 0 4px #000, 4px 5px 0 rgba(0,0,0,.6); }
  #banner.big { font-size: clamp(48px, 11vw, 96px); color: #fff; }

  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .card { font-family: inherit; color: #1F3D2B; background: #FDFBEF; border: 5px solid #FFE066; border-radius: 20px;
    width: 230px; min-height: 260px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center;
    gap: 8px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.4); touch-action: manipulation; }
  .card:active { transform: translateY(3px); }
  .card .ic { width: 96px; height: 96px; font-size: 72px; line-height: 96px; }
  .card .ic canvas { width: 96px; height: 96px; }
  .card .nm { font-size: 30px; }
  .card .ds { font-size: 22px; }
  .card .st { font-size: 22px; color: #E0A800; }
  @media (max-width: 760px) {
    .card { width: 92vw; min-height: 110px; flex-direction: row; padding: 8px 14px; text-align: left; }
    .card .tx { display: flex; flex-direction: column; gap: 2px; }
  }
  #resStats { font-size: 28px; line-height: 1.55; }
  @media (max-width: 480px) {
    #hudTop { gap: 8px; }
    #hpBar { flex: 0 0 118px; }
    #hpBar .lbl { font-size: 16px; }
    #timeText { font-size: 21px; }
  }
  @media (max-height: 500px) {
    .screen { gap: 10px; padding: 10px; }
    h1.big { font-size: 48px; }
    h2.big { font-size: 32px; }
    .sub { font-size: 20px; }
    #resStats { font-size: 22px; line-height: 1.35; }
    #drawCv { width: min(200px, 45vh); height: min(200px, 45vh); }
    .card { min-height: 0; width: 210px; padding: 8px; gap: 4px; }
    .card .ic, .card .ic canvas { width: 64px; height: 64px; font-size: 48px; line-height: 64px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="hpBar" class="bar"><div id="hpFill" class="fill"></div><div id="hpText" class="lbl"></div></div>
    <div id="timeText"></div>
    <button id="btnPause" class="btn">⏸</button>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <div id="lvBar" class="bar" style="flex:1"><div id="lvFill" class="fill"></div><div id="lvText" class="lbl"></div></div>
    <div id="killText"></div>
  </div>
</div>
<div id="hint" class="hidden"></div>
<div id="banner" class="hidden"></div>

<div id="title" class="screen">
  <h1 class="big">분필 대소동</h1>
  <p class="sub">칠판 낙서 괴물을 4분 동안 지워라!</p>
  <button id="btnStart" class="btn main">시작</button>
  <div class="row">
    <button id="btnDraw" class="btn">✏️ 내 낙서 그리기</button>
    <button id="btnBoss" class="btn"></button>
  </div>
  <p id="bestLine" class="sub"></p>
</div>

<div id="draw" class="screen hidden">
  <h2 class="big">내 낙서 그리기</h2>
  <p class="sub">내가 그린 낙서가 괴물로 나와요!</p>
  <canvas id="drawCv" width="200" height="200"></canvas>
  <div class="row">
    <button id="btnClear" class="btn small">지우기</button>
    <button id="btnDone" class="btn main">다 그렸어!</button>
    <button id="btnDefault" class="btn small">그냥 기본</button>
  </div>
</div>

<div id="pause" class="screen hidden">
  <h2 class="big">잠깐 멈춤</h2>
  <button id="btnResume" class="btn main">계속하기</button>
  <button id="btnHome" class="btn">처음 화면</button>
</div>

<div id="levelup" class="screen hidden">
  <h2 class="big">레벨 업! ⭐</h2>
  <p class="sub">하나를 골라요</p>
  <div id="cards" class="cards"></div>
</div>

<div id="result" class="screen hidden">
  <h2 id="resTitle" class="big"></h2>
  <div id="resStats"></div>
  <div class="row">
    <button id="btnAgain" class="btn main">다시 하기</button>
    <button id="btnCard" class="btn">📷 성적표 저장</button>
  </div>
  <button id="btnHome2" class="btn small">처음 화면</button>
  <p class="tiny">눈을 잠깐 쉬어 가요 👀</p>
</div>

<script src="art.js?v=2610170110"></script>
<script src="sfx.js?v=2610170110"></script>
<script src="game.js?v=2610170110"></script>
</body>
</html>
