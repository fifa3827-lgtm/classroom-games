<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달빛 오락실</title>
<meta name="description" content="달빛 아래 불을 켠 작은 게임기들">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --side-w: 248px; --r: 18px;
    --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
    --bg: #1d1a35; --bg2: #2a2550; --side: #221f3e; --panel: #2b2750;
    --line: rgba(255,255,255,.09); --text: #fbf7ff; --muted: #bab3dc;
    --accent: #ffc6a6; --accent2: #c9b8ff; --gold: #ffe3a3; --pill: rgba(255,198,166,.14);
    --shadow: 0 18px 40px rgba(10,6,30,.45);
    --round: "Jua", "Gowun Dodum", sans-serif;
    --serif: "Gowun Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
    --sans: "Gowun Dodum", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  /* 배경: 별과 은은한 빛 */
  .bgsky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(900px 600px at 85% -10%, var(--bg2), transparent 70%),
                radial-gradient(700px 500px at 20% 110%, color-mix(in srgb, var(--accent2) 14%, transparent), transparent 70%), var(--bg); }
  .bgsky i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--dl); }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }

  /* 왼쪽 메뉴 */
  .side { position: fixed; top: 0; left: 0; bottom: 0; width: var(--side-w); z-index: 20; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 26px) 16px 18px; }
  .logo { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; }
  .moon { width: 42px; height: 42px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #fffbe6, var(--gold) 70%);
    box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 60%, transparent); animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 36px color-mix(in srgb, var(--gold) 85%, transparent); } }
  .logo h1 { font-family: var(--round); font-weight: 400; font-size: 24px; letter-spacing: .5px; line-height: 1.2; }
  .logo p { color: var(--muted); font-size: 12.5px; }

  /* 방문자 숫자 */
  .meter { display: flex; align-items: center; gap: 10px; margin: 0 4px 16px; padding: 10px 14px; border-radius: 14px;
    background: color-mix(in srgb, var(--text) 5%, transparent); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .meter[hidden] { display: none; }
  .meter span { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .meter em { font-style: normal; }
  /* 컴퓨터: 「오늘」·「지금까지」를 두 칸으로 나눠, 숫자가 커져도 칸 밖으로 나가지 않게 */
  @media (min-width: 861px) {
    .meter { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 8px 6px; text-align: center; }
    .meter span { display: block; font-size: 12px; }
    .meter em { display: block; }
    .meter span + i + span { border-left: 1px solid var(--line); }
    .meter i { display: none; }
  }
  .meter b { font-family: var(--round); font-weight: 400; font-size: 19px; color: var(--text); font-variant-numeric: tabular-nums; }
  .meter span:first-child b { color: var(--accent); }
  .meter i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .5; flex: none; }

  .search { position: relative; display: block; margin: 0 4px 16px; }
  .search input { width: 100%; padding: 11px 12px 11px 38px; border-radius: 12px; border: 1px solid var(--line);
    background: color-mix(in srgb, var(--text) 5%, transparent); outline: none; font-size: 14.5px; transition: border-color .2s, box-shadow .2s; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--pill); }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); }

  .nav { position: relative; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; padding: 2px 4px; }
  .nav .bar { position: absolute; left: 4px; right: 4px; top: 0; height: 46px; border-radius: 12px; background: var(--pill);
    box-shadow: inset 3px 0 0 var(--accent); transition: transform .45s var(--spring), opacity .2s; pointer-events: none; }
  .nav button { position: relative; display: flex; align-items: center; gap: 12px; height: 46px; flex: none; padding: 0 12px; border: 0; background: none;
    border-radius: 12px; cursor: pointer; font-size: 15.5px; text-align: left; color: var(--muted); transition: color .25s; }
  .nav button:hover, .nav button[aria-pressed="true"] { color: var(--text); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav button svg { width: 20px; height: 20px; flex: none; transition: transform .35s var(--spring), color .25s; }
  .nav button:hover svg { transform: scale(1.15) rotate(-6deg); }
  .nav button[aria-pressed="true"] svg { color: var(--accent); }
  .nav button span { flex: 1; }
  .nav button small { font-size: 12px; min-width: 26px; text-align: center; padding: 2px 7px; border-radius: 99px; background: color-mix(in srgb, var(--text) 7%, transparent); }
  .nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 10px; flex: none; }

  /* 본문 */
  main { margin-left: var(--side-w); padding: calc(env(safe-area-inset-top, 0px) + 30px) 40px calc(env(safe-area-inset-bottom, 0px) + 60px); min-height: 100vh; }
  #newsslot #newsbar { max-width: 640px; width: 100%; margin: 0 0 24px; }
  .head { margin-bottom: 24px; }
  .head h2 { font-family: var(--round); font-weight: 400; font-size: 38px; line-height: 1.15; overflow-wrap: anywhere; }
  .head p { color: var(--muted); margin-top: 6px; }
  .head.swap { animation: swap .5s var(--ease); }
  @keyframes swap { from { opacity: 0; transform: translateX(-14px); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 22px; }
  .card { --c: #9a8fd6; position: relative; display: flex; flex-direction: column; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line);
    overflow: hidden; isolation: isolate; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
    animation: rise .55s var(--ease) backwards; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.96); } }
  .card:hover, .card:focus-visible { border-color: color-mix(in srgb, var(--c) 70%, transparent); outline: none;
    box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 10px 40px color-mix(in srgb, var(--c) 28%, transparent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: color-mix(in srgb, var(--c) 30%, var(--panel)); }
  .thumb .art { position: absolute; inset: 0; transition: transform .6s var(--ease); }
  .card:hover .thumb .art { transform: scale(1.07); }
  .thumb::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); transform: translateX(-120%); transition: transform .8s var(--ease); }
  .card:hover .thumb::after { transform: translateX(120%); }
  .thumb::before { content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; background: #fff; opacity: 0; transition: opacity .3s; }
  .card.on .thumb::before { opacity: .6; transition: none; }
  .badges { position: absolute; z-index: 6; top: 10px; left: 10px; display: flex; gap: 6px; }
  .badges i { font-style: normal; font-family: var(--round); font-size: 12.5px; padding: 3px 9px; border-radius: 99px; color: #1b1430; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
  .badges .hit { background: var(--gold); }
  .badges .new { background: var(--accent); animation: pop 2.2s ease-in-out infinite; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  .play { position: absolute; z-index: 6; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--c); color: #1b1430; opacity: 0; transform: translateY(8px) scale(.8); transition: all .35s var(--spring); box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .play svg { width: 16px; height: 16px; margin-left: 2px; }
  .card:hover .play, .card:focus-visible .play { opacity: 1; transform: none; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .body h3 { font-family: var(--round); font-weight: 400; font-size: 19.5px; display: flex; align-items: center; gap: 8px; }
  .body h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .body p { color: var(--muted); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
  .tags span { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 55%, var(--text)); }
  .empty { grid-column: 1 / -1; text-align: center; padding: 70px 0; color: var(--muted); }
  .empty b { display: block; font-family: var(--round); font-weight: 400; font-size: 24px; color: var(--text); margin-bottom: 6px; }

  /* 게임기 화면 그림 (특별 장면) */
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .glass {
    position: absolute; inset: 0; background: #231f2e;
    display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); grid-template-rows: repeat(5, minmax(0,1fr));
    gap: 4px; padding: 4px;
  }
  .glass img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; }
  .glass::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,247,215,.25) 42%, transparent 62%); mix-blend-mode: screen; }
  .pet { position: absolute; z-index: 2; bottom: -3%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .sky {
    position: absolute; inset: 0;
    background: radial-gradient(70% 45% at 50% 100%, rgba(244,160,90,.3), transparent 70%), linear-gradient(180deg, #0e1433, #1f2356 60%, #33305f);
  }
  .sky .hills { position: absolute; left: -10%; width: 120%; bottom: 0; filter: brightness(0); opacity: .75; }
  .sky .hills.far { bottom: 16%; opacity: .35; }
  .lantern {
    position: absolute; width: var(--w); left: var(--x); top: var(--y);
    filter: drop-shadow(0 0 14px rgba(255,196,110,.7));
    animation: drift var(--t) ease-in-out infinite alternate; animation-delay: var(--d);
  }
  @keyframes drift { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-10px) rotate(2deg); } }
  .plain {
    position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 6px;
    background: radial-gradient(70% 60% at 50% 45%, color-mix(in srgb, var(--c) 35%, #0b0a18), #07060f);
  }
  .plain b { font-family: var(--serif); font-size: clamp(2.6rem, 11vw, 4.6rem); color: color-mix(in srgb, var(--c) 70%, white); text-shadow: 0 0 20px var(--c); line-height: 1; }
  .plain small { font-size: .78rem; color: #fff; opacity: .8; animation: blink 1.4s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .beam {
    position: absolute; z-index: 2; left: 34%; top: 12%; width: 90%; height: 26%;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, rgba(255,250,235,.55), rgba(255,250,235,0));
    clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 55%);
    animation: sweep 5s ease-in-out infinite alternate; mix-blend-mode: screen;
  }
  @keyframes sweep { from { transform: rotate(-14deg); opacity: .5; } to { transform: rotate(10deg); opacity: .9; } }
  .hangul {
    position: absolute; inset: 0;
    background: radial-gradient(80% 70% at 50% 80%, #fff6d8, #ffe7a8 55%, #f7cf86);
  }
  .jamo {
    position: absolute; width: 22%; aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 18%; color: #3b2a1c; font-family: var(--sans); font-weight: 700;
    font-size: clamp(1rem, 3.4vw, 1.6rem); transform: rotate(var(--r));
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
    animation: bob 2.8s ease-in-out infinite alternate;
  }
  .jamo:nth-child(2n) { animation-delay: -1.2s; }
  @keyframes bob { from { translate: 0 0; } to { translate: 0 -6px; } }

  /* 키가 낮은 노트북 화면(1366×768 등): 왼쪽 메뉴를 촘촘하게 해서 끝까지 보이게 */
  @media (min-width: 861px) and (max-height: 820px) {
    .side { padding-top: 18px; padding-bottom: 12px; }
    .logo { padding-bottom: 12px; }
    .meter, .search { margin-bottom: 10px; }
    .nav .bar, .nav button { height: 38px; }
    .nav hr { margin: 5px 10px; }
  }

  /* 휴대폰·좁은 화면: 왼쪽 메뉴가 위쪽 띠로 */
  @media (max-width: 860px) {
    .side { position: sticky; width: auto; bottom: auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px; border-right: 0; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--side) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .logo { padding: 0 0 12px; } .moon { width: 32px; height: 32px; } .logo h1 { font-size: 20px; } .logo p { display: none; }
    .meter { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; margin: 0; padding: 4px 10px; gap: 0 10px; font-size: 11.5px; line-height: 1.2;
      flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 172px); }
    .meter b { font-size: 15px; line-height: 1.1; }
    /* 숫자가 커지면 로고 글자를 덮지 않고 두 줄로 */
    .meter i { display: none; }
    .search { margin: 0 0 10px; }
    .nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 6px; padding: 0 0 4px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav .bar, .nav hr { display: none; }
    .nav button { height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 14px; gap: 6px; transition: background .25s, color .25s, border-color .25s; }
    .nav button svg { width: 16px; height: 16px; }
    .nav button small { min-width: 0; padding: 0 6px; }
    .nav button[aria-pressed="true"] { background: var(--pill); border-color: var(--accent); }
    main { margin-left: 0; padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
    #newsslot #newsbar { margin: 0 0 18px; }
    .head h2 { font-size: 28px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .body { padding: 10px 12px 12px; gap: 6px; } .body h3 { font-size: 16.5px; } .body p { font-size: 12.5px; }
    .tags { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bgsky" id="stars" aria-hidden="true"></div>

<aside class="side">
  <div class="logo"><div class="moon" aria-hidden="true"></div><div><h1>달빛 오락실</h1><p id="count-line">오늘은 어떤 게임기에 불을 켜 볼까요?</p></div></div>
  <div class="meter" id="meter" hidden><span><em>오늘</em> <b id="m-today"></b>명</span><i aria-hidden="true"></i><span><em>지금까지</em> <b id="m-total"></b>명</span></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="게임 이름 찾기" autocomplete="off" aria-label="게임 이름 찾기"></label>
  <nav class="nav" id="corners" aria-label="게임 코너 고르기"><div class="bar" id="bar"></div></nav>
</aside>

<main>
  <div id="newsslot"></div>
  <div class="head" id="head"><h2 id="h-title">달빛 오락실</h2><p id="h-about">게임기를 켜는 중이에요…</p></div>
  <div class="grid" id="shelf" aria-live="polite"></div>
</main>

<script>
/* ================================================================
   게임 목록 — 서버 game 폴더에 연결된 게임만 오락실에 나타나요.
   새 게임을 넣을 때는 { ... } 한 덩어리를 복사해 글자만 바꾸세요.
   (덩어리 사이에는 쉼표가 있어야 해요)

   folder : 서버 game 폴더 안의 폴더 이름
   cat    : 코너 — puzzle(퍼즐) mystery(추리) action(액션) board(보드게임)
            learn(배움 놀이) party(여럿이 함께). 없으면 맨 앞 「새로 들어온 게임」에 들어가요
   name   : 게임기 간판에 들어갈 이름
   about  : 한두 줄 소개
   tags   : 작은 꼬리표들 (없으면 [])
   color  : 게임기 색
   cover  : 화면 그림 (그림 경로 / 특별 장면 이름 / '' 이면 첫 글자)
   added  : 올린 날짜 — 2주 동안 「새 게임」 표시가 붙어요
   ================================================================ */
var GAMES = [
  { folder: 'kkomul', cat: 'learn', name: '꼬물이 구구단', color: '#ffd3dc', cover: 'intro/kkomul/shot0.webp', added: '2026-10-26',
    about: '꼬물이 친구들을 버스에 태우고, 젤리 병에 방울을 떨어뜨리고, 줄줄이 달리며 구구단을 익혀요. 한 판은 1분 남짓이에요.', tags: ['구구단', '숫자판', '귀여운 친구들'] },
  { folder: 'monggle', cat: 'action', name: '몽글 점프', color: '#ffb3c8', cover: 'intro/monggle/shot1.webp', added: '2026-10-23',
    about: '꾹 눌렀다 떼면 폴짝! 하늘에 뜬 컵케이크·마카롱을 건너뛰며 퍼펙트를 잇고, 별로 3D 친구를 뽑아요.', tags: ['3D', '한 손가락', '친구 뽑기'] },
  { folder: 'sixshots', cat: 'action', name: '여섯 발', color: '#f4c46a', cover: 'intro/sixshots/shot1.webp', added: '2026-10-20',
    about: '총알은 여섯 발뿐. 빗나간 한 발은 적이 주워 나를 쏴요. 술집에서 폐광까지 세 두목을 잡는 서부 슈팅이에요.', tags: ['개발판', '총알 여섯 발', '두목 셋'] },
  { folder: 'meokbo', cat: 'puzzle', name: '물감 먹보', color: '#b8a6f4', cover: 'intro/meokbo/shot1.webp', added: '2026-10-19',
    about: '색을 고르면 얼굴 친구가 같은 색 칸을 꿀꺽 삼켜요. 정해진 횟수 안에 판 전체를 한 색으로!', tags: ['번짐 퍼즐', '둘이 맞붙기'] },

    document.getElementById('h-title').textContent = title;
    document.getElementById('h-about').textContent = about;
    if (anim) { head.classList.remove('swap'); void head.offsetWidth; head.classList.add('swap'); }
    shelf.innerHTML = list.length ? list.map(cardHTML).join('') :
      '<p class="empty"><b>앗, 그런 게임은 아직 없어요</b>다른 이름으로 찾아볼까요?</p>';
  }

  function moveBar() {
    var b = nav.querySelector('button[aria-pressed="true"]');
    bar.style.opacity = b ? 1 : 0;
    if (b) bar.style.transform = 'translateY(' + b.offsetTop + 'px)';
  }

  // 고른 코너만 보이기
  function pick(id, scroll) {
    current = id;
    if (!used.some(function (c) { return c.id === id; })) id = 'all';
    q.value = '';
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-pick') === id ? 'true' : 'false'); });
    moveBar();
    var c = TOPS[id] || used.filter(function (x) { return x.id === id; })[0];
    // HIT 는 인기 순위 그대로, 나머지는 목록 순서대로
    show(id === 'hit' ? hits : live.filter(function (g) { return inView(g, id); }), c.name, c.about, scroll);
    if (scroll && window.scrollY > 0) window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var id = b.getAttribute('data-pick');
    try { history.replaceState(null, '', id === 'all' ? location.pathname : '#' + id); } catch (err) {}
    pick(id, true);
    b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });
  window.addEventListener('hashchange', function () { pick(location.hash.slice(1), true); });
  window.addEventListener('resize', moveBar);

  // 이름 찾기 — 이름·소개·꼬리표에서 찾고, 지우면 고른 코너로 돌아가요
  q.addEventListener('input', function () {
    if (!live.length) return;   // 게임 목록이 오면 render() 가 다시 찾아요
    // 띄어쓰기는 빼고 견줘요(「꼬물이구구단」도 찾게)
    var w = q.value.replace(/\s+/g, '').toLowerCase();
    if (!w) { var keep = current; pick(keep, false); return; }
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', 'false'); });
    moveBar();
    var list = live.filter(function (g) { return (g.name + g.about + (g.tags || []).join('')).replace(/\s+/g, '').toLowerCase().indexOf(w) >= 0; });
    show(list, '「' + q.value.trim() + '」 찾기', '게임 ' + list.length + '개를 찾았어요', false);
  });

  // 인기 순위 — popular.php 가 최근 30일 동안 많이 눌린 게임 폴더를 순서대로 알려 줘요
  // 게임 확인과 동시에 물어보고, 확인이 끝난 뒤 0.8초까지만 기다려요. 더 늦으면 이번에는 HIT 없이 보여 줘요(화면이 갑자기 밀리지 않게)
  var popular = fetch('popular.php', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { return d && Array.isArray(d.top) ? d.top : []; })
    .catch(function () { return []; });

  // 연결된 게임만 켜기 — 폴더에 index.html 이 있는 게임만 보여요
  Promise.all(GAMES.map(function (g) {
    return fetch(g.folder + '/index.html', { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  })).then(function (ok) {
    live = GAMES.filter(function (g, i) { return ok[i]; });
    if (!live.length) { document.getElementById('h-about').textContent = ''; shelf.innerHTML = '<p class="empty">아직 불을 켠 게임기가 없어요.</p>'; return; }
    return Promise.race([popular, new Promise(function (res) { setTimeout(function () { res([]); }, 800); })]).then(function (t) {
      top = t;
      render();
      document.getElementById('count-line').textContent = '게임기 ' + live.length + '대가 기다려요';
    });
  });

  // 방문자 세기 — 한 사람이 하루에 한 번만 세어져요. 숫자는 0부터 차르르 올라가요
  (function () {
    var today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
    var KEY = 'moonlit-arcade-visit', method = 'GET';
    try { if (localStorage.getItem(KEY) !== today) method = 'POST'; } catch (e) { method = 'POST'; }
    function countUp(el, n) {
      if (calm) { el.textContent = n.toLocaleString(); return; }
      var t0 = performance.now();
      (function step(t) {
        var p = Math.min(1, (t - t0) / 1100);
        el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString();
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    }
    fetch('counter.php', { method: method, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (typeof d.total !== 'number') return;
        if (method === 'POST') { try { localStorage.setItem(KEY, today); } catch (e) {} }
        document.getElementById('meter').hidden = false;
        countUp(document.getElementById('m-today'), d.today);
        countUp(document.getElementById('m-total'), d.total);
      })
      .catch(function () {});
  })();

  // 어떤 게임이 인기 있는지 — 누를 때마다 모두 세어요
  function countPlay(a) {
    var folder = a.getAttribute('data-folder');
    var g = GAMES.filter(function (x) { return x.folder === folder; })[0] || {};
    var url = 'counter.php?game=' + encodeURIComponent(folder) + '&name=' + encodeURIComponent(g.name || folder);
    if (navigator.sendBeacon) navigator.sendBeacon(url);
    else fetch(url, { method: 'POST', keepalive: true }).catch(function () {});
  }

  // 누르면 화면이 번쩍, 동전 소리
  var ac;
  function coin() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t = ac.currentTime;
      [[988, 0], [1319, .08]].forEach(function (n) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t + n[1]);
        g.gain.exponentialRampToValueAtTime(0.08, t + n[1] + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + (n[1] ? 0.28 : 0.09));
        o.connect(g).connect(ac.destination); o.start(t + n[1]); o.stop(t + n[1] + 0.3);
      });
    } catch (e) {}
  }
  shelf.addEventListener('click', function (e) {
    var a = e.target.closest('.card');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); coin(); a.classList.add('on');
    countPlay(a);
    // 새 창은 누른 순간 바로 열어야 팝업 차단에 걸리지 않아요
    var w = window.open(a.getAttribute('href'), '_blank');
    if (w) { try { w.opener = null; } catch (err) {} } else { location.href = a.getAttribute('href'); }
    setTimeout(function () { a.classList.remove('on'); }, 350);
  });
  window.addEventListener('pageshow', function () {
    Array.prototype.forEach.call(shelf.querySelectorAll('.card.on'), function (a) { a.classList.remove('on'); });
  });

  // 마우스를 올리면 카드가 살짝 떠서 기울어요
  if (!calm && window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    shelf.addEventListener('pointermove', function (e) {
      var c = e.target.closest('.card'); if (!c) return;
      var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      c.style.transform = 'perspective(800px) translateY(-6px) rotateX(' + (-y * 7) + 'deg) rotateY(' + (x * 7) + 'deg)';
    });
    shelf.addEventListener('pointerout', function (e) {
      var c = e.target.closest('.card'); if (c && !c.contains(e.relatedTarget)) c.style.transform = '';
    });
  }

  // 배경 별
  var stars = document.getElementById('stars');
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('i');
    s.style.cssText = 'left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;--d:' + (2 + Math.random() * 4) + 's;--dl:' + (-Math.random() * 5) + 's;' + (Math.random() < .2 ? 'width:3px;height:3px;' : '');
    stars.appendChild(s);
  }
})();
</script>
