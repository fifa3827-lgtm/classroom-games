<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14183a">
<title>스피드 레이싱 그랑프리</title>
<style>
  :root {
    --bg: #14183a; --panel: #1f2552; --ink: #fff; --dim: #aab0e0;
    --me: #ff4d4d; --drift: #3d8bff; --boost: #ff9a2e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  .screen.on { display: flex; }
  h1 { margin: 0; font-size: 34px; letter-spacing: 2px; text-align: center; word-break: keep-all; }
  h1 small { display: block; font-size: 14px; color: var(--dim); letter-spacing: 0; font-weight: 500; margin-top: 4px; }
  label { font-size: 15px; color: var(--dim); display: block; margin-bottom: 6px; }
  input { font: inherit; font-size: 26px; width: 240px; padding: 10px 14px; border-radius: 14px; border: 3px solid #3a4280;
    background: #0d1030; color: #fff; text-align: center; user-select: text; -webkit-user-select: text; }
  input:focus { outline: none; border-color: #ffd23d; }
  button { font: inherit; cursor: pointer; border: 0; }
  .big { font-size: 24px; font-weight: 800; padding: 14px 40px; border-radius: 16px; background: #ffd23d; color: #2a1e00;
    box-shadow: 0 5px 0 #b38a10; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b38a10; }
  .err { color: #ff8a8a; min-height: 1.3em; font-size: 16px; text-align: center; }
  .kartbadge { width: 120px; height: 120px; border-radius: 30px; background: var(--me); display: grid; place-items: center;
    font-size: 64px; box-shadow: 0 0 0 6px rgba(255,255,255,.15); }
  .myname { font-size: 30px; font-weight: 800; }
  .hint { color: var(--dim); font-size: 17px; text-align: center; line-height: 1.5; }

  /* 조종 화면 */
  #race { padding: 0; gap: 0; justify-content: stretch; }
  .status { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 4px solid var(--me); }
  .rank { font-size: 34px; font-weight: 900; min-width: 76px; }
  .rank small { font-size: 16px; color: var(--dim); font-weight: 600; }
  .lap { font-size: 20px; font-weight: 700; color: var(--dim); }
  .gaugebox { flex: 1; display: flex; align-items: center; gap: 8px; }
  .gauge { flex: 1; height: 16px; background: #0d1030; border-radius: 8px; overflow: hidden; }
  .gauge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d8bff, #6ff0ff); }
  .tag { font-size: 14px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #0d1030; color: var(--dim); }
  .pads { flex: 1; width: 100%; display: flex; gap: 10px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .steer { flex: 1.1; display: flex; border-radius: 22px; overflow: hidden; background: #0d1030; touch-action: none; }
  .steer div { flex: 1; display: grid; place-items: center; font-size: 64px; color: #55609c; transition: background .05s; }
  .steer div.on { background: #2f3a86; color: #fff; }
  .steer div + div { border-left: 3px solid var(--bg); }
  .right { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .row { flex: 1; display: flex; gap: 10px; }
  .pad { flex: 1; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; color: #fff; touch-action: none; position: relative; }
  .pad b { font-size: 32px; }
  .pad span { font-size: 14px; opacity: .8; font-weight: 600; }
  .pad.drift { background: var(--drift); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); flex: 1.6; }
  .pad.boost { background: var(--boost); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
  .row.tall { flex: 1.3; }
  .pad.on { filter: brightness(1.35); transform: scale(.97); }
  .pad.empty { filter: grayscale(.8) brightness(.6); }
  .count { position: absolute; top: 8px; right: 12px; font-size: 22px; font-weight: 900; }
  #msg { position: fixed; left: 0; right: 0; top: 40%; text-align: center; font-size: 72px; font-weight: 900;
    pointer-events: none; text-shadow: 0 4px 0 rgba(0,0,0,.4); display: none; }
  #conn { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: #c0392b; color: #fff;
    padding: 6px 14px; border-radius: 12px; font-size: 15px; display: none; z-index: 9; }
  .place { font-size: 96px; font-weight: 900; line-height: 1; }

  /* 아이템전: 부스터 단추가 「아이템 쓰기」가 되고, 들고 있는 아이템 두 칸을 보여 줘요 */
  .its { display: none; gap: 8px; margin-top: 4px; }
  .its i { width: 50px; height: 50px; border-radius: 12px; background: rgba(0,0,0,.3); display: grid; place-items: center;
    font-style: normal; font-size: 32px; line-height: 1; }
  body.items .its { display: flex; }
  body.items #bsub, body.items #bcount { display: none; }
  body.items .gaugebox { visibility: hidden; }
  #warn { position: fixed; left: 0; right: 0; top: 16%; text-align: center; font-size: 34px; font-weight: 900; padding: 8px 0;
    background: rgba(200,20,40,.82); color: #fff; pointer-events: none; display: none; z-index: 8; animation: wblink .4s steps(1) infinite; }
  /* 태블릿 3D 화면: 왼쪽 위 아이템 칸·순위, 오른쪽 위 바퀴·시속을 가리지 않게 가운데 위쪽에 작게 */
  body.three #warn { left: 50%; right: auto; top: 10px; transform: translateX(-50%); width: max-content; max-width: max(180px, calc(100vw - 360px));
    font-size: clamp(18px, 2.8vw, 30px); padding: 8px 18px; border-radius: 14px; word-break: keep-all; }
  @keyframes wblink { 50% { background: rgba(255,120,40,.82); } }

  /* 태블릿 3D 화면: 내 화면 위에 단추를 반쯤 비치게 겹쳐요 */
  #pad3d { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; pointer-events: none; }
  body.three #pad3d { visibility: visible; }
  body.three .status { display: none; }
  body.three .pads { position: fixed; left: 0; right: 0; bottom: 0; height: min(42vh, 320px); justify-content: space-between;
    padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  body.three .steer { flex: 0 0 min(40vw, 380px); background: rgba(13,16,48,.35); }
  body.three .steer div { color: rgba(255,255,255,.8); }
  body.three .steer div.on { background: rgba(47,58,134,.75); }
  body.three .right { flex: 0 0 min(40vw, 380px); }
  body.three .pad { opacity: .82; }
  body.three.fin .pads { display: none; }
</style>
</head>
<body>
<iframe id="pad3d" title="내 화면"></iframe>

<section class="screen on" id="join">
  <h1>🏁 스피드 레이싱 그랑프리<small>큰 화면의 방 번호를 넣어요</small></h1>
  <div><label for="code">방 번호</label><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"></div>
  <div><label for="name">내 이름 (6글자까지)</label><input id="name" maxlength="6" autocomplete="off"></div>
  <div class="err" id="err"></div>
  <button class="big" id="go">참가하기</button>
</section>

<section class="screen" id="wait">
  <div class="kartbadge" id="badge">🏎️</div>
  <div class="myname" id="wname"></div>
  <div class="hint" id="whint">큰 화면에서 내 캐릭터를 찾아보세요!<br>선생님이 출발시키면 시작해요.</div>
  <div class="hint" id="wload" style="font-size:14px"></div>
  <button class="tag" id="leave" style="margin-top:20px;padding:8px 14px">이름 바꾸기</button>
</section>

<section class="screen" id="race">
  <div class="status">
    <div class="rank" id="rank">-</div>
    <div class="lap" id="lap">1/3바퀴</div>
    <div class="gaugebox"><div class="gauge"><i id="gauge"></i></div></div>
    <div class="tag" id="wrong" style="display:none;background:#c0392b;color:#fff">거꾸로 가요!</div>
  </div>
  <div class="pads">
    <div class="steer" id="steer"><div id="sl">◀</div><div id="sr">▶</div></div>
    <div class="right">
      <div class="row">
        <div class="pad boost empty" id="boost"><b id="bname">부스터</b><span id="bsub">톡 누르기</span><div class="its"><i id="it0"></i><i id="it1"></i></div><div class="count" id="bcount">0</div></div>
      </div>
      <div class="row tall"><div class="pad drift" id="drift"><b>드리프트</b><span>꾹 누른 채 방향 돌리기</span></div></div>
    </div>
  </div>
</section>

<section class="screen" id="done">
  <div class="hint" id="dtitle">결승!</div>
  <div class="place" id="dplace">-</div>
  <div class="hint" id="dhint">큰 화면을 보세요</div>
</section>

<div id="msg"></div>
<div id="warn">🎯 유도탄이 쫓아와요!</div>
<div id="conn">연결 중…</div>

<script type="module">
import { Relay, store } from './net.js?v=2610130000';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let myId = store('kart-id');
if (!myId) { myId = Math.random().toString(36).slice(2, 10); store('kart-id', myId); }

$('code').value = params.get('room') || '';
$('name').value = store('kart-name') || '';
if (!$('code').value) $('code').focus(); else if (!$('name').value) $('name').focus();

let joining = false;        // 참가 버튼을 누른 뒤인지
let phase = 'lobby';
let relay = null;

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);
  if (id === 'join') {   // 방에서 나오면 3D 화면도 멈춰요
    document.body.classList.remove('three', 'fin');
    const p = P(); if (p) p.phase('lobby');
  }
}
function setColor(c) {
  document.documentElement.style.setProperty('--me', c);
  document.querySelector('meta[name=theme-color]').content = c;
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} }

// ── 내 카트 효과음 ── 「참가하기」를 누르는 순간 소리 장치를 켜요 (아이패드는 손가락으로 누른 그 순간에만 켤 수 있어요)
// 주소에 mute가 있으면 소리 없음. 배경 음악은 큰 화면에서만 나와요.
const SND_OFF = params.has('mute');
let actx = null, noise = null;
function audioOn() {
  if (SND_OFF) return;
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noise = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state !== 'running') actx.resume();
    const b = actx.createBufferSource(); b.buffer = actx.createBuffer(1, 1, 22050); b.connect(actx.destination); b.start(0);   // 아이패드 소리 열기
  } catch (_) {}
}
function A() { return actx && actx.state === 'running' ? actx : null; }
function tone(f, dur, type, vol, when = 0, slide = 0) {
  const a = A(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
// 잡음을 걸러 만드는 소리 (f1에서 f2로 높이가 바뀌어요)
function hiss(dur, type, f1, f2, q, vol, att = 0.01) {
  const a = A(); if (!a) return;
  const t = a.currentTime, n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  n.buffer = noise; f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f).connect(g).connect(a.destination); n.start(t, Math.random() * 0.4); n.stop(t + dur + 0.05);
}
const snd = {
  beep: () => tone(523, 0.15, 'square', 0.05),
  go: () => { tone(1046, 0.4, 'square', 0.05); tone(523, 0.4, 'triangle', 0.06); },
  boost: () => { hiss(0.6, 'bandpass', 400, 2600, 1.2, 0.22, 0.06); tone(70, 0.6, 'sawtooth', 0.08, 0, 1.6); },   // 슈욱 + 낮은 엔진 울림
  mini: () => { hiss(0.25, 'bandpass', 900, 3200, 1.5, 0.14, 0.02); tone(330, 0.2, 'triangle', 0.05, 0, 2); },     // 슝
  gauge: () => { tone(1318, 0.18, 'sine', 0.09); tone(1760, 0.3, 'sine', 0.09, 0.09); },                          // 띠링
  wall: () => { tone(110, 0.16, 'sine', 0.22, 0, 0.45); hiss(0.08, 'lowpass', 500, 200, 0.7, 0.12); },              // 쿵
  bump: () => { tone(170, 0.12, 'sine', 0.16, 0, 0.5); hiss(0.07, 'lowpass', 1000, 300, 0.7, 0.1); },
  lap: () => { tone(784, 0.1, 'square', 0.05); tone(1046, 0.15, 'square', 0.05, 0.1); },
  finish: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.05, i * 0.09)),
  // 아이템전
  item: () => [784, 988, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.08, 'square', 0.04, i * 0.07)),     // 뽑기 따르르릉
  box: () => { hiss(0.18, 'highpass', 3000, 6000, 0.8, 0.12); tone(1400, 0.1, 'triangle', 0.05, 0, 0.5); },   // 상자 깨짐
  throw: () => hiss(0.3, 'bandpass', 600, 1800, 1, 0.15, 0.02),                                            // 휙
  hit: () => { tone(400, 0.5, 'sawtooth', 0.06, 0, 0.25); hiss(0.25, 'lowpass', 1200, 200, 0.7, 0.15); },   // 맞음
  hitok: () => { tone(880, 0.1, 'square', 0.05); tone(1320, 0.18, 'square', 0.05, 0.1); },                  // 명중
  block: () => { tone(1568, 0.25, 'sine', 0.09); tone(2093, 0.35, 'sine', 0.07, 0.05); },                   // 막음
  warn: () => { tone(988, 0.12, 'square', 0.05); tone(988, 0.12, 'square', 0.05, 0.2); },
};
// 드리프트 「끼이익」: 드리프트하는 동안 이어지고, 끝나면 짧게 사라져요
const drift = { g: null, f: null, f2: null, n: null };
function driftSnd(on) {
  const a = A();
  if (on && !drift.g && a) {
    const n = a.createBufferSource(), f = a.createBiquadFilter(), f2 = a.createBiquadFilter(), g = a.createGain();
    n.buffer = noise; n.loop = true;
    f.type = 'bandpass'; f.frequency.value = 2000; f.Q.value = 9;
    f2.type = 'bandpass'; f2.frequency.value = 4000; f2.Q.value = 6;
    g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.linearRampToValueAtTime(0.25, a.currentTime + 0.06);
    n.connect(f).connect(g); n.connect(f2).connect(g); g.connect(a.destination); n.start();
    Object.assign(drift, { g, f, f2, n, at: performance.now(), sig: '' });
  } else if (!on && drift.g) {
    const { g, n } = drift, t = actx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, 0.05); n.stop(t + 0.3);
    drift.g = drift.n = drift.f = drift.f2 = null;
  }
}
function driftTune(sp, sl) {   // 세게 미끄러질수록 크고 조금 높게
  if (!drift.g) return;
  const t = actx.currentTime, k = Math.min(1, sl / 14), v = Math.min(1, sp / 50);
  drift.f.frequency.setTargetAtTime(1700 + k * 700 + v * 300, t, 0.08);
  drift.f2.frequency.setTargetAtTime(3600 + k * 900, t, 0.08);
  drift.g.gain.setTargetAtTime(0.12 + 0.18 * k * (0.5 + 0.5 * v), t, 0.08);
}

let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => { lock = null; }; } } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.hidden) driftSnd(false); if (!document.hidden && joining) keepAwake(); });

function sendJoin() {
  relay.send({ t: 'join', code: $('code').value.trim(), info: { id: myId, name: $('name').value.trim() } });
}

$('go').onclick = () => {
  const code = $('code').value.trim(), name = $('name').value.trim();
  if (!/^\d{4}$/.test(code)) { $('err').textContent = '방 번호 네 자리를 넣어 주세요'; return; }
  if (!name) { $('err').textContent = '이름을 넣어 주세요'; return; }
  store('kart-name', name);
  $('err').textContent = '';
  joining = true;
  audioOn();
  keepAwake();
  try {
    const de = document.documentElement;
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // 아이패드 등
  } catch (_) {}
  load3d();
  if (!relay) relay = new Relay(() => { if (joining) sendJoin(); }, onMsg, onConn);
  else sendJoin();
  $('wname').textContent = name;
};
for (const id of ['code', 'name']) $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
$('leave').onclick = () => { joining = false; driftSnd(false); relay && relay.ws && relay.ws.close(); show('join'); };

// ── 태블릿 3D 화면 ── 큰 화면 파일을 「태블릿 모드」로 안에 띄워요.
// 내 카트는 그 안에서 계산하고, 3D가 안 되는 기기는 예전처럼 단추만으로 달려요 (큰 화면이 대신 계산).
const frame3d = $('pad3d');
let padReady = false;
function load3d() {
  if (frame3d.src) return;
  const q = new URLSearchParams({ pad: '1' });
  if (params.has('mute')) q.set('mute', '1');
  if (params.has('debug')) q.set('debug', '1');   // 버벅임 원인 찾기용 숫자 표시
  frame3d.src = 'index.html?' + q;
}
function P() {
  try { const p = frame3d.contentWindow && frame3d.contentWindow.__pad; return p || null; } catch (_) { return null; }
}
let wantTrack = -1;
setInterval(() => {
  const p = P();
  if (p && !padReady) {
    padReady = true;
    p.out = (type, d) => {
      if (!relay) return;
      if (type === 'me') relay.send({ t: 'm', d: Object.assign({ k: 'me' }, d) });
      else if (type === 'sync') relay.send({ t: 'm', d: { k: 'sync' } });
      else if (type === 'fx') onFx(d);
    };
    if (wantTrack >= 0) p.setTrack(wantTrack);
    if (relay && (phase === 'count' || phase === 'race')) relay.send({ t: 'm', d: { k: 'sync' } });   // 경주 중에 준비됐으면 지금 자리를 받아요
  }
  if (p && p.active && drift.g) {   // 드리프트 소리 크기 맞추기 (태블릿 3D 화면에서만)
    const sn = p.snd, sig = sn ? sn.sp + '|' + sn.sl : '';
    if (sig !== drift.sig) { drift.sig = sig; drift.at = performance.now(); }   // 3D 쪽 값이 바뀐 때
    // 손을 뗐거나, 3D 화면이 0.3초 넘게 멈췄거나(탭 숨김 등), 화면이 숨겨지면 끼이익 소리를 꺼요
    if (!sn || !sn.dr || document.hidden || performance.now() - drift.at > 300) driftSnd(false); else driftTune(sn.sp, sn.sl);
  }
  if (p && p.active && !itemMode) {
    const b = p.boosts;
    $('bcount').textContent = b; $('boost').classList.toggle('empty', b <= 0);
  }
  if (itemMode) drawItems();
  if ($('wait').classList.contains('on') && joining) {
    const n = p ? p.loaded : 0;
    $('wload').textContent = !p ? '내 화면 준비 중…' : n < 8 ? `캐릭터 불러오는 중 ${n}/8` : '';
  }
}, 100);

function onConn(s) {
  $('conn').style.display = (joining && s !== 'open') ? 'block' : 'none';
}

function onMsg(m) {
  if (m.t === 'noroom') { joining = false; show('join'); $('err').textContent = '그런 방이 없어요. 번호를 확인해 주세요'; return; }
  if (m.t === 'full') { joining = false; show('join'); $('err').textContent = '자리가 다 찼어요'; return; }
  if (m.t === 'kicked') { joining = false; show('join'); $('err').textContent = '방에서 나왔어요'; return; }
  if (m.t === 'joined') { show('wait'); $('whint').innerHTML = m.host ? '큰 화면에서 내 캐릭터를 찾아보세요!<br>선생님이 출발시키면 시작해요.' : '큰 화면을 기다리는 중이에요…'; return; }
  if (m.t === 'hostgone') { $('conn').textContent = '큰 화면을 기다리는 중…'; $('conn').style.display = 'block'; return; }
  if (m.t === 'hostback') { $('conn').style.display = 'none'; $('conn').textContent = '연결 중…'; return; }
  if (m.t !== 'd' || !m.d) return;
  const d = m.d;
  if (d.k === 'you') {
    setColor(d.color);
    $('wname').textContent = d.char ? `${d.name} · ${d.char}` : d.name;
    if (d.emoji) $('badge').textContent = d.emoji;
    if (d.wait) $('whint').innerHTML = '지금 경주가 진행 중이에요.<br>다음 판에 함께 달려요!';
    else $('whint').innerHTML = '큰 화면에서 내 캐릭터를 찾아보세요!<br>선생님이 출발시키면 시작해요.';
  } else if (d.k === 'full') {
    joining = false; relay.ws && relay.ws.close(); show('join'); $('err').textContent = '자리가 다 찼어요 (8명)';
  } else if (d.k === 'st') {
    onState(d);
  } else if (d.k === 'fx') {
    onFx(d);
  } else if (d.k === 'race') {
    const p = P(); if (p) p.race(d);   // 화면 바꾸기는 곧이어 오는 상태(st)에서 해요
  } else if (d.k === 'pos') {
    const p = P(); if (p) p.pos(d);
  } else if (d.k === 'eff') {   // 아이템 효과: 종류는 정해진 것만
    if (!EFFS.includes(d.e)) return;
    const p = P();
    if (p && p.active && d.e !== 'warn' && p.eff(d) === false) return;   // 3D 화면이 무시한 효과는 「앗!」·진동도 내지 않아요
    onEff(d.e, Math.max(0, Math.min(7, Number(d.t) || 0)));
  }
}

// ── 아이템전 ──
const ITEM_E = ['', '🚀', '🍌', '💧', '🎯', '🛡️', '⚡'];
const EFFS = ['spin', 'bubble', 'shock', 'boost', 'warn'];
let itemMode = false, myItems = [], rollUntil = 0, warnTimer = 0;
function drawItems() {   // 받은 직후 0.6초는 그림이 돌다가 멈춰요
  const rolling = performance.now() < rollUntil;
  for (let j = 0; j < 2; j++) {
    let e = myItems[j] ? ITEM_E[myItems[j]] : '';
    if (rolling && j === myItems.length - 1) e = ITEM_E[1 + ((Math.random() * 6) | 0)];
    $('it' + j).textContent = e;
  }
  $('boost').classList.toggle('empty', !myItems.length);
}
function showWarn(t) {
  clearTimeout(warnTimer);
  $('warn').style.display = t > 0 ? 'block' : 'none';
  if (t > 0) warnTimer = setTimeout(() => { $('warn').style.display = 'none'; }, t * 1000);
}
function onEff(e, t) {
  if (e === 'warn') { showWarn(t); if (t > 0) { buzz([80, 60, 80, 60, 80]); snd.warn(); } return; }
  if (e === 'boost') { buzz(60); snd.boost(); return; }
  showWarn(0); driftSnd(false);
  buzz(220); snd.hit(); flash('앗!', 700);   // 빙글·물방울·번개
}

function onFx(d) {
  if (d.e === 'gauge') { buzz([30, 40, 30]); snd.gauge(); }
  else if (d.e === 'wall') { buzz(25); snd.wall(); }
  else if (d.e === 'bump') { buzz(40); snd.bump(); }
  else if (d.e === 'boost') { buzz(60); snd.boost(); }
  else if (d.e === 'mini') snd.mini();
  else if (d.e === 'drift') driftSnd(!!d.on && phase === 'race');
  else if (d.e === 'lap') { buzz([50, 50, 50]); flash(d.txt || '한 바퀴!', 1000); snd.lap(); }
  else if (d.e === 'finish') { buzz([100, 60, 200]); driftSnd(false); snd.finish(); showWarn(0); }
  else if (d.e === 'item') { buzz(30); snd.item(); }
  else if (d.e === 'box') snd.box();
  else if (d.e === 'throw') { buzz(30); snd.throw(); }
  else if (d.e === 'hitok') { buzz([40, 40, 40]); snd.hitok(); flash('명중!', 700); }
  else if (d.e === 'block') { buzz(80); snd.block(); flash('막았다!', 800); showWarn(0); }
  else if (d.e === 'shield') snd.block();
}

let flashTimer = 0;
function flash(txt, ms) {
  $('msg').textContent = txt; $('msg').style.display = 'block';
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { $('msg').style.display = 'none'; }, ms);
}

let lastCd = -1;
function onState(d) {
  phase = d.ph;
  if (d.ph !== 'race' || d.fin) { driftSnd(false); showWarn(0); }
  const im = !!d.im;
  if (im !== itemMode) {   // 경주 방식이 바뀌면 단추 이름과 칸을 바꿔요
    itemMode = im; document.body.classList.toggle('items', im);
    $('bname').textContent = im ? '아이템 쓰기' : '부스터';
    myItems = []; drawItems();
  }
  const p = P();
  if (d.map != null) { wantTrack = d.map; if (p) p.setTrack(d.map); }
  if (p) { p.phase(d.ph); if (d.fin) p.finish(d.fin); }
  const three = !!(p && p.active) && d.in && d.ph !== 'lobby' && d.ph !== 'result';
  document.body.classList.toggle('three', three);
  document.body.classList.toggle('fin', three && !!d.fin);
  if (!d.in) { if (phase !== 'lobby') show('wait'); else show('wait'); return; }   // 이번 판에 안 달리는 사람
  if (d.ph === 'lobby') { show('wait'); lastCd = -1; return; }
  if (d.ph === 'result' || (d.fin && d.ph !== 'count' && !three)) {
    show('done');
    $('dtitle').textContent = d.fin ? '결승!' : '경기 끝!';
    $('dplace').textContent = d.fin ? d.fin + '등' : '완주 못함';
    $('dhint').textContent = d.ph === 'result' ? '수고했어요! 큰 화면을 보세요' : '다른 친구들을 기다리는 중…';
    return;
  }
  show('race');
  if (d.ph === 'count') {
    if (d.cd !== lastCd) { lastCd = d.cd; flash(d.cd > 0 ? String(d.cd) : '출발!', d.cd > 0 ? 900 : 700); buzz(d.cd > 0 ? 40 : 150); if (d.cd > 0) snd.beep(); else snd.go(); }
  }
  $('rank').innerHTML = `${Number(d.r) | 0}<small>/${Number(d.n) | 0}등</small>${(Number(d.r) | 0) === 1 ? ' 👑' : ''}`;   // 숫자만 넣어요 (이상한 쪽지 막기), 1등이면 왕관
  $('lap').textContent = `${d.lap}/${d.L}바퀴`;
  $('gauge').style.width = Math.round(d.g * 100) + '%';
  if (itemMode) {   // 들고 있는 아이템 (숫자만 받아요)
    const v = Array.isArray(d.it) ? d.it.slice(0, 2).map(Number).filter((x) => Number.isInteger(x) && x >= 1 && x <= 6) : [];   // 모르는 값은 빈 칸
    if (v.length > myItems.length) rollUntil = performance.now() + 600;
    myItems = v; if (p) p.items(v); drawItems();
  } else if (!three) { $('bcount').textContent = d.b; $('boost').classList.toggle('empty', d.b <= 0); }
  $('wrong').style.display = d.wr ? 'block' : 'none';
}

// ── 조종 입력 ────────────────────────────────────────────
const inp = { s: 0, dr: false, br: false };
let lastSent = '';
function sendInput(force) {
  if (!relay) return;
  const key = `${inp.s}|${inp.dr}|${inp.br}`;
  if (!force && key === lastSent) return;
  lastSent = key;
  const p = P(); if (p) p.input(inp);
  relay.send({ t: 'm', d: { k: 'in', s: inp.s, dr: inp.dr, br: inp.br } });
}
setInterval(() => sendInput(true), 150);

// 방향: 왼쪽 판 하나에서 손가락 위치로 정해요 (미끄러지듯 옮겨도 돼요)
const steerEl = $('steer');
const steerTouches = new Map();
function updateSteer() {
  const r = steerEl.getBoundingClientRect();
  let s = 0;
  // 가장 나중에 닿은 손가락을 따라가요
  const last = [...steerTouches.values()].pop();
  if (last !== undefined) s = last < r.left + r.width / 2 ? -1 : 1;
  inp.s = s;
  $('sl').classList.toggle('on', s < 0);
  $('sr').classList.toggle('on', s > 0);
  sendInput();
}
steerEl.addEventListener('pointerdown', (e) => { e.preventDefault(); steerEl.setPointerCapture(e.pointerId); steerTouches.set(e.pointerId, e.clientX); updateSteer(); });
steerEl.addEventListener('pointermove', (e) => { if (steerTouches.has(e.pointerId)) { steerTouches.set(e.pointerId, e.clientX); updateSteer(); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) steerEl.addEventListener(ev, (e) => { steerTouches.delete(e.pointerId); updateSteer(); });

document.addEventListener('pointerdown', () => { if (joining && actx && actx.state !== 'running') audioOn(); });   // 화면이 꺼졌다 켜져 소리가 멈췄으면 다시 켜요
function holdPad(el, onChange) {
  const ids = new Set();
  const set = () => { el.classList.toggle('on', ids.size > 0); onChange(ids.size > 0); };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); ids.add(e.pointerId); set(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, (e) => { ids.delete(e.pointerId); set(); });
}
holdPad($('drift'), (on) => { inp.dr = on; sendInput(); });
function useBoost() {
  if (itemMode) { if (relay) relay.send({ t: 'm', d: { k: 'use' } }); return; }   // 아이템전: 큰 화면이 정해요
  const p = P();
  if (p && p.driving) p.boost();
  else if (relay) relay.send({ t: 'm', d: { k: 'boost' } });
}
$('boost').addEventListener('pointerdown', (e) => { e.preventDefault(); $('boost').classList.add('on'); useBoost(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('boost').addEventListener(ev, () => $('boost').classList.remove('on'));

// 컴퓨터로 시험할 때: 방향키, Shift=드리프트, Space/Ctrl=부스터, ↓=후진(시험용, 단추는 없어요)
const keys = new Set();
function keyInput() {
  inp.s = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
  inp.dr = keys.has('ShiftLeft') || keys.has('ShiftRight');
  inp.br = keys.has('ArrowDown');
  $('sl').classList.toggle('on', inp.s < 0); $('sr').classList.toggle('on', inp.s > 0);
  $('drift').classList.toggle('on', inp.dr);
  sendInput();
}
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ControlLeft' || e.code === 'ControlRight') { useBoost(); e.preventDefault(); return; }
  keys.add(e.code); keyInput();
});
addEventListener('keyup', (e) => { keys.delete(e.code); keyInput(); });
addEventListener('contextmenu', (e) => e.preventDefault());
</script>
