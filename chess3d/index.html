<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>왕좌의 체스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8c46a; --gold2:#b8862e; --ink:#f4ead5; --dim:#b9ab90;
    --glass:rgba(14,10,8,.72); --line:rgba(232,196,106,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#07060a;color:var(--ink);
    font-family:'Noto Serif KR',serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:10px 14px;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}
  .badge{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 12px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.5)}
  #lvBadge .n{font-size:12px;color:var(--gold);letter-spacing:.08em}
  #lvBadge .t{font-size:15px;font-weight:700}
  #status{font-size:15px;font-weight:700;text-align:center;min-width:150px}
  #status.think{color:#ffd88a}
  #status .dot{display:inline-block;animation:blink 1.2s infinite}
  #status .dot:nth-child(2){animation-delay:.2s}#status .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .btns{display:flex;gap:6px}
  .ib{width:42px;height:42px;border-radius:12px;background:var(--glass);border:1px solid var(--line);
    font-size:18px;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .15s, background .15s}
  .ib:hover{background:rgba(60,40,20,.8)} .ib:active{transform:scale(.92)}
  .ib:disabled{opacity:.35;cursor:default}

  #moves{position:fixed;right:14px;top:70px;width:190px;max-height:calc(100% - 100px);overflow:auto;
    font-size:13px;z-index:4;padding:10px 12px}
  #moves h4{font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:6px}
  #moves ol{list-style:none;display:grid;grid-template-columns:28px 1fr 1fr;row-gap:2px}
  #moves li{display:contents}
  #moves .no{color:var(--dim)}
  #moves .last{color:var(--gold);font-weight:700}
  @media (max-width:820px){ #moves{display:none} #status{min-width:0;font-size:13px} #lvBadge .t{font-size:13px} .ib{width:38px;height:38px;font-size:16px} }

  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(40px,9vw,88px);font-weight:900;
    color:#fff3d0;text-shadow:0 0 24px rgba(255,120,60,.9),0 0 60px rgba(255,60,40,.6);pointer-events:none;opacity:0;z-index:6;
    letter-spacing:.1em;white-space:nowrap}
  #toast.show{animation:toast 1.3s ease-out forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}

  /* ---------- 오버레이 ---------- */
  .overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:16px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.15), rgba(0,0,0,.65))}
  .panel{background:linear-gradient(180deg,rgba(28,20,14,.9),rgba(12,9,8,.92));border:1px solid var(--line);
    border-radius:20px;padding:26px 26px 22px;max-width:560px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,230,170,.15);max-height:calc(100% - 20px);overflow:auto}
  .title{font-size:clamp(38px,8vw,60px);font-weight:900;letter-spacing:.12em;line-height:1.1;
    background:linear-gradient(180deg,#fff6d6 0%,#f0cf78 45%,#a8741f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
  .sub{color:var(--dim);margin:8px 0 18px;font-size:14px}
  .sec{font-size:12px;color:var(--gold);letter-spacing:.15em;margin:14px 0 8px}
  #lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lv{position:relative;padding:10px 4px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(232,196,106,.2);
    transition:all .15s}
  .lv .num{font-size:20px;font-weight:900;color:var(--gold)}
  .lv .nm{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.2;min-height:25px}
  .lv:hover:not(:disabled){background:rgba(232,196,106,.12)}
  .lv.sel{background:linear-gradient(180deg,rgba(232,196,106,.35),rgba(184,134,46,.2));border-color:var(--gold);box-shadow:0 0 16px rgba(232,196,106,.35)}
  .lv.sel .nm{color:var(--ink)}
  .lv:disabled{opacity:.4;cursor:default}
  .lv .lock{position:absolute;top:4px;right:6px;font-size:11px}
  .lv .crown{position:absolute;top:3px;right:5px;font-size:11px}
  #lvDesc{margin-top:10px;font-size:13px;color:var(--ink);min-height:20px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{padding:9px 16px;background:transparent;font-size:14px}
  .seg button.on{background:rgba(232,196,106,.25);color:#fff3cf;font-weight:700}
  .big{margin-top:20px;padding:14px 40px;font-size:18px;font-weight:900;border-radius:14px;letter-spacing:.1em;color:#2a1a06;
    background:linear-gradient(180deg,#fbe39a,#d9a441 60%,#a8741f);box-shadow:0 6px 20px rgba(217,164,65,.35), inset 0 1px 0 #fff6d0;
    transition:transform .15s}
  .big:hover{transform:translateY(-2px)} .big:active{transform:scale(.97)}
  .ghost{margin-top:10px;padding:10px 22px;border-radius:12px;background:transparent;border:1px solid var(--line);font-size:14px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6}

  #promo .pieces{display:flex;gap:10px;justify-content:center;margin-top:14px}
  #promo .pieces button{width:70px;height:78px;border-radius:14px;font-size:44px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  #promo .pieces button:hover{background:rgba(232,196,106,.2)}
  #endTitle{font-size:clamp(40px,9vw,64px)}
  #endMsg{margin:10px 0 4px;font-size:15px;line-height:1.6}

  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#07060a;z-index:20;font-size:18px;color:var(--gold);transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">왕좌의 방을 준비하는 중…</div>

<div id="hud" class="hidden">
  <div id="lvBadge" class="badge"><div class="n">LEVEL 1</div><div class="t">견습 시종</div></div>
  <div id="status" class="badge">당신의 차례</div>
  <div class="btns">
    <button class="ib" id="bUndo" title="무르기">↶</button>
    <button class="ib" id="bView" title="시점 바꾸기">🎥</button>
    <button class="ib" id="bSound" title="소리">🔊</button>
    <button class="ib" id="bMenu" title="메뉴">☰</button>
  </div>
</div>
<div id="moves" class="badge hidden"><h4>기 보</h4><ol id="moveList"></ol></div>
<div id="toast"></div>

<div id="menu" class="overlay hidden">
  <div class="panel">
    <div class="title">왕좌의 체스</div>
    <div class="sub">달빛 아래 왕좌의 방, 열 명의 도전자를 차례로 꺾어 보세요</div>
    <div class="sec">도 전 상 대</div>
    <div id="lvGrid"></div>
    <div id="lvDesc"></div>
    <div class="sec">나 의 진 영</div>
    <div class="seg" id="colorSeg">
      <button data-c="1" class="on">⚪ 백 (먼저)</button>
      <button data-c="-1">⚫ 흑</button>
      <button data-c="0">🎲 무작위</button>
    </div>
    <div><button class="big" id="bStart">대국 시작</button></div>
    <div class="hint">말을 누르면 갈 수 있는 칸이 빛나요 · 화면을 끌면 체스판을 돌려 볼 수 있어요<br>상대를 이기면 다음 단계가 열려요</div>
  </div>
</div>

<div id="promo" class="overlay hidden">
  <div class="panel" style="max-width:400px">
    <div class="sec" style="margin-top:0">승 급</div>
    <div style="font-size:18px;font-weight:700">폰이 끝에 닿았어요! 무엇으로 바꿀까요?</div>
    <div class="pieces"></div>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="panel" style="max-width:440px">
    <div class="title" id="endTitle">승리!</div>
    <div id="endMsg"></div>
    <div class="row" id="endBtns"></div>
  </div>
</div>

<div id="confirm" class="overlay hidden">
  <div class="panel" style="max-width:380px">
    <div style="font-size:18px;font-weight:700;margin-bottom:6px">대국을 그만두고 메뉴로 갈까요?</div>
    <div style="color:var(--dim);font-size:13px">지금 대국은 기권으로 처리돼요</div>
    <div class="row"><button class="big" id="cYes" style="padding:11px 26px;font-size:16px">메뉴로</button><button class="ghost" id="cNo" style="margin-top:20px">계속 두기</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- ================= 체스 규칙 엔진 (화면과 AI 워커가 함께 사용) ================= -->
<script id="engine-src">
var LEVELS = [
  {name:'견습 시종',     desc:'체스를 막 배우기 시작한 시종이에요. 실수가 아주 많아요.',      depth:1, noise:380, q:false, time:400},
  {name:'마을 파수꾼',   desc:'공짜 말은 가끔 알아채지만 아직 서툴러요.',                    depth:1, noise:170, q:true,  time:500},
  {name:'성문 경비병',   desc:'한 수 앞을 내다봐요. 말을 함부로 내주지 마세요.',              depth:2, noise:110, q:true,  time:700},
  {name:'젊은 기사',     desc:'두 수 앞을 보며 기회를 노려요.',                              depth:2, noise:55,  q:true,  time:800},
  {name:'원탁의 기사',   desc:'세 수 앞을 읽어요. 이제부터 진짜 대결이에요.',                depth:3, noise:30,  q:true,  time:1000},
  {name:'왕실 근위대장', desc:'실수가 거의 없는 노련한 근위대장이에요.',                     depth:3, noise:10,  q:true,  time:1200},
  {name:'전략가 주교',   desc:'네 수 앞을 계산하는 책략가예요.',                             depth:4, noise:0,   q:true,  time:1600},
  {name:'대원수',        desc:'왕국의 모든 군대를 지휘하는 대원수예요.',                     depth:5, noise:0,   q:true,  time:2200},
  {name:'여왕의 책사',   desc:'깊이 계산하는 냉정한 책사. 작은 실수도 놓치지 않아요.',       depth:6, noise:0,   q:true,  time:3200},
  {name:'체스 황제',     desc:'왕좌의 주인. 이 황제를 꺾으면 당신이 새 황제예요!',           depth:9, noise:0,   q:true,  time:4500}
];
var PIECE_VAL = [0,100,320,330,500,900,20000];
var N_DIRS=[-33,-31,-18,-14,14,18,31,33], B_DIRS=[-17,-15,15,17], R_DIRS=[-16,-1,1,16], K_DIRS=[-17,-16,-15,-1,1,15,16,17];
var CASTLE_MASK = (function(){ var m=new Uint8Array(128); for(var i=0;i<128;i++)m[i]=15;
  m[4]=12; m[7]=14; m[0]=13; m[116]=3; m[119]=11; m[112]=7; return m; })();

var PST = {
 1:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
 2:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
 3:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
 4:[0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
 5:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
 6:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
 7:[-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
};

function Chess(){ this.board=new Int8Array(128); this.stack=[]; this.reset(); }
Chess.prototype.reset=function(){
  var b=this.board, back=[4,2,3,5,6,3,2,4]; b.fill(0);
  for(var f=0;f<8;f++){ b[f]=back[f]; b[16+f]=1; b[96+f]=-1; b[112+f]=-back[f]; }
  this.side=1; this.castle=15; this.ep=-1; this.half=0; this.full=1; this.kw=4; this.kb=116; this.stack=[];
};
Chess.prototype.getState=function(){ return {board:Array.prototype.slice.call(this.board), side:this.side, castle:this.castle, ep:this.ep, half:this.half, full:this.full}; };
Chess.prototype.setState=function(s){
  this.board.set(s.board); this.side=s.side; this.castle=s.castle; this.ep=s.ep; this.half=s.half; this.full=s.full; this.stack=[];
  for(var i=0;i<128;i++){ if(this.board[i]===6)this.kw=i; else if(this.board[i]===-6)this.kb=i; }
};
Chess.prototype.attacked=function(sq,by){
  var b=this.board,i,t,v,d;
  t=sq-16*by-1; if(!(t&0x88)&&b[t]===by) return true;
  t=sq-16*by+1; if(!(t&0x88)&&b[t]===by) return true;
  for(i=0;i<8;i++){ t=sq+N_DIRS[i]; if(!(t&0x88)&&b[t]===2*by) return true; }
  for(i=0;i<8;i++){ t=sq+K_DIRS[i]; if(!(t&0x88)&&b[t]===6*by) return true; }
  for(i=0;i<4;i++){ d=B_DIRS[i]; t=sq+d; while(!(t&0x88)){ v=b[t]; if(v){ if(v===3*by||v===5*by) return true; break; } t+=d; } }
  for(i=0;i<4;i++){ d=R_DIRS[i]; t=sq+d; while(!(t&0x88)){ v=b[t]; if(v){ if(v===4*by||v===5*by) return true; break; } t+=d; } }
  return false;
};
Chess.prototype.inCheck=function(side){ return this.attacked(side===1?this.kw:this.kb,-side); };
Chess.prototype.genMoves=function(capsOnly){
  var mv=[], b=this.board, s=this.side, sq, p, t, to, v, i, d, dirs;
  function add(f,to,p,c,pr,fl){ mv.push({f:f,t:to,p:p,c:c,pr:pr,fl:fl}); }
  for(sq=0;sq<128;sq++){
    if(sq&0x88){ sq+=7; continue; }
    p=b[sq]; if(!p||(p>0)!==(s>0)) continue;
    t=p*s;
    if(t===1){
      var fwd=16*s, rank=sq>>4, promoRank=s===1?6:1, startRank=s===1?1:6;
      to=sq+fwd;
      if(!(to&0x88)&&!b[to]){
        if(rank===promoRank){ add(sq,to,p,0,5*s,0); if(!capsOnly){ add(sq,to,p,0,4*s,0); add(sq,to,p,0,3*s,0); add(sq,to,p,0,2*s,0);} }
        else if(!capsOnly){ add(sq,to,p,0,0,0); if(rank===startRank&&!b[to+fwd]) add(sq,to+fwd,p,0,0,4); }
      }
      for(i=-1;i<=1;i+=2){
        to=sq+fwd+i; if(to&0x88) continue; v=b[to];
        if(v&&(v>0)!==(s>0)){
          if(rank===promoRank){ add(sq,to,p,v,5*s,0); if(!capsOnly){ add(sq,to,p,v,4*s,0); add(sq,to,p,v,3*s,0); add(sq,to,p,v,2*s,0);} }
          else add(sq,to,p,v,0,0);
        } else if(to===this.ep) add(sq,to,p,-s,0,1);
      }
    } else if(t===2||t===6){
      dirs=t===2?N_DIRS:K_DIRS;
      for(i=0;i<8;i++){ to=sq+dirs[i]; if(to&0x88) continue; v=b[to];
        if(!v){ if(!capsOnly) add(sq,to,p,0,0,0); } else if((v>0)!==(s>0)) add(sq,to,p,v,0,0); }
      if(t===6&&!capsOnly){
        if(s===1&&sq===4){
          if((this.castle&1)&&!b[5]&&!b[6]&&b[7]===4&&!this.attacked(4,-1)&&!this.attacked(5,-1)&&!this.attacked(6,-1)) add(4,6,6,0,0,2);
          if((this.castle&2)&&!b[3]&&!b[2]&&!b[1]&&b[0]===4&&!this.attacked(4,-1)&&!this.attacked(3,-1)&&!this.attacked(2,-1)) add(4,2,6,0,0,2);
        } else if(s===-1&&sq===116){
          if((this.castle&4)&&!b[117]&&!b[118]&&b[119]===-4&&!this.attacked(116,1)&&!this.attacked(117,1)&&!this.attacked(118,1)) add(116,118,-6,0,0,2);
          if((this.castle&8)&&!b[115]&&!b[114]&&!b[113]&&b[112]===-4&&!this.attacked(116,1)&&!this.attacked(115,1)&&!this.attacked(114,1)) add(116,114,-6,0,0,2);
        }
      }
    } else {
      dirs=t===3?B_DIRS:t===4?R_DIRS:K_DIRS;
      for(i=0;i<dirs.length;i++){ d=dirs[i]; to=sq+d;
        while(!(to&0x88)){ v=b[to];
          if(!v){ if(!capsOnly) add(sq,to,p,0,0,0); }
          else { if((v>0)!==(s>0)) add(sq,to,p,v,0,0); break; }
          to+=d; } }
    }
  }
  return mv;
};
Chess.prototype.make=function(m){
  var b=this.board, s=this.side;
  this.stack.push(this.castle, this.ep, this.half, this.kw, this.kb);
  b[m.t]=m.pr?m.pr:m.p; b[m.f]=0;

    else if(m.t===118){b[117]=b[119];b[119]=0;} else {b[115]=b[112];b[112]=0;}
  }
  if(m.p===6) this.kw=m.t; else if(m.p===-6) this.kb=m.t;

  this.ep=(m.fl&4)?m.f+16*s:-1;
  this.half=(m.p*s===1||m.c)?0:this.half+1;
  if(s===-1) this.full++;

Chess.prototype.unmake=function(m){

  this.kb=st.pop(); this.kw=st.pop(); this.half=st.pop(); this.ep=st.pop(); this.castle=st.pop();
  b[m.f]=m.p;
  if(m.fl&1){ b[m.t]=0; b[m.t-16*s]=m.c; } else b[m.t]=m.c;
  if(m.fl&2){
    if(m.t===6){b[7]=b[5];b[5]=0;} else if(m.t===2){b[0]=b[3];b[3]=0;}
    else if(m.t===118){b[119]=b[117];b[117]=0;} else {b[112]=b[115];b[115]=0;}

    p=b[sq]; if(!p) continue;

    if(t===6){ if(p>0) wk=sq; else bk=sq; continue; }
    var v=PIECE_VAL[t]+PST[t][idx];
    if(t!==1) npm+=PIECE_VAL[t];
    if(p>0){ score+=v; matW+=PIECE_VAL[t]; } else { score-=v; matB+=PIECE_VAL[t]; }
  }
  var end=npm<=2600;
  var kt=end?PST[7]:PST[6];
  score+=kt[(7-(wk>>4))*8+(wk&7)];
  score-=kt[(bk>>4)*8+(bk&7)];

      var kd=Math.abs(lf-(winner&7))+Math.abs(lr-(winner>>4));
      var bonus=centerDist*12+(14-kd)*5;
      score+=diff>0?bonus:-bonus;
    }
  }
  return score;
};

<!-- ================= 컴퓨터 두뇌 (워커에서 실행) ================= -->
<script id="ai-src" type="text/plain">
function aiThink(state, level){
  var g=new Chess(); g.setState(state);
  var cfg=LEVELS[level-1];
  var MATE=100000, INF=1e9, STOP={stop:1};
  var start=Date.now(), deadline=start+cfg.time, nodes=0, stopAllowed=false;
  var killers=[];
  var noise=cfg.noise, maxDepth=cfg.depth, fullWindow=noise>0;
  if(noise===0 && state.full<=3){ noise=18; fullWindow=true; maxDepth=Math.min(maxDepth,4); }

  function order(moves, ply){
    var k=killers[ply];
    for(var i=0;i<moves.length;i++){
      var m=moves[i], s=0;
      if(m.c) s=10000+PIECE_VAL[Math.abs(m.c)]*10-Math.abs(m.p);
      if(m.pr) s+=9000;
      if(k&&!m.c&&k.f===m.f&&k.t===m.t) s+=5000;
      m.o=s;
    }
    moves.sort(function(a,b){return b.o-a.o;});
  }
  function tick(){ nodes++; if((nodes&2047)===0&&stopAllowed&&Date.now()>deadline) throw STOP; }
  function quiesce(alpha,beta,ply){
    tick();
    var stand=g.evaluate()*g.side;
    if(stand>=beta) return beta;
    if(stand>alpha) alpha=stand;
    if(ply>40) return alpha;
    var moves=g.genMoves(true); order(moves,ply);
    for(var i=0;i<moves.length;i++){
      var m=moves[i]; g.make(m);
      if(g.inCheck(-g.side)){ g.unmake(m); continue; }
      var sc=-quiesce(-beta,-alpha,ply+1); g.unmake(m);
      if(sc>=beta) return beta;
      if(sc>alpha) alpha=sc;
    }
    return alpha;
  }
  function negamax(depth,alpha,beta,ply){
    tick();
    var chk=g.inCheck(g.side);
    if(chk&&ply<maxDepth*2) depth++;
    if(depth<=0) return cfg.q?quiesce(alpha,beta,ply):g.evaluate()*g.side;
    if(g.half>=100) return 0;
    var moves=g.genMoves(false); order(moves,ply);
    var legal=0;
    for(var i=0;i<moves.length;i++){
      var m=moves[i]; g.make(m);
      if(g.inCheck(-g.side)){ g.unmake(m); continue; }
      legal++;
      var sc=-negamax(depth-1,-beta,-alpha,ply+1); g.unmake(m);
      if(sc>=beta){ if(!m.c) killers[ply]=m; return beta; }
      if(sc>alpha) alpha=sc;
    }
    if(!legal) return chk?-MATE+ply:0;
    return alpha;
  }

  var root=g.legalMoves();
  if(!root.length) return null;
  order(root,0);
  var snapshot=null;
  for(var d=1; d<=maxDepth; d++){
    try{
      var alpha=-INF;
      for(var i=0;i<root.length;i++){
        var m=root[i]; g.make(m);
        var sc=fullWindow?-negamax(d-1,-INF,INF,1):-negamax(d-1,-INF,-alpha,1);
        g.unmake(m); m.sc=sc;
        if(sc>alpha) alpha=sc;
      }
      root.sort(function(a,b){return b.sc-a.sc;});
      snapshot=root.map(function(m){return {m:m, sc:m.sc};});
      stopAllowed=true;
      if(alpha>MATE-1000) break;
      if(Date.now()-start>cfg.time*0.45) break;
    }catch(e){
      if(e!==STOP) throw e;
      g.setState(state);
      break;
    }
  }
  var pick=snapshot[0];
  if(noise>0 && !(pick.sc>MATE-1000 && level>=3)){
    var bestV=-INF;
    for(var j=0;j<snapshot.length;j++){
      var v=snapshot[j].sc+Math.random()*noise;
      if(v>bestV){ bestV=v; pick=snapshot[j]; }
    }
  }
  return {f:pick.m.f, t:pick.m.t, pr:pick.m.pr, depth:d, nodes:nodes};
}
</script>

    const va=victim.position.clone(), spin=rand(3,6)*(Math.random()<0.5?-1:1);
    tween(650,k=>{ const e=ease(k); victim.position.lerpVectors(va,dest,e); victim.position.y=va.y+(dest.y-va.y)*e+Math.sin(Math.PI*e)*2.2;
      victim.rotation.y=spin*e*Math.PI; victim.scale.setScalar(1-0.28*e); }).then(()=>{ victim.rotation.y=0; });
  } else SFX.move();
  if(m.pr){
    pieceLayer.remove(mover);
    const np=createPiece(m.pr); np.position.copy(b); pieceLayer.add(np); meshAt.set(m.t,np);
    const flash=new THREE.PointLight(0xffe2a0,4,4,2); flash.position.set(b.x,1,b.z); world.add(flash);
    tone(784,0.3,'triangle',0.1); tone(1175,0.5,'triangle',0.1,0.12);
    await tween(500,k=>{ np.scale.setScalar(0.2+0.8*ease(k)); np.rotation.y=(1-k)*Math.PI*2; flash.intensity=4*(1-k); });
    world.remove(flash);
  }
}

async function playMove(m){
  busy=true; selected=-1; refreshMarks(); updateUndoBtn();
  const san=toSAN(m,legal);
  const side=game.side;
  game.make(m);
  const key=game.key(); posCount.set(key,(posCount.get(key)||0)+1);
  records.push({m,san,side,key});
  renderMoveList();
  await animateMove(m);
  legal=game.legalMoves();
  refreshMarks();
  if(checkResult()) { busy=false; updateUndoBtn(); return; }
  if(game.inCheck(game.side)){ SFX.check(); toast('체크!'); }
  busy=false;
  if(game.side!==playerColor) requestAI();
  else { setStatus('당신의 차례'); }
  updateUndoBtn();
}

function insufficient(){
  const minors=[]; let other=false;
  for(let sq=0;sq<128;sq++){ if(sq&0x88){sq+=7;continue;} const t=Math.abs(game.board[sq]); if(!t||t===6) continue; if(t===2||t===3) minors.push(t); else other=true; }
  return !other&&minors.length<=1;
}
function checkResult(){
  let result=null, reason='';
  if(!legal.length){
    if(game.inCheck(game.side)){ result=game.side===playerColor?'lose':'win'; reason='체크메이트'; }
    else { result='draw'; reason='스테일메이트 (더 이상 둘 곳이 없어요)'; }
  } else if(game.half>=100){ result='draw'; reason='50수 동안 잡거나 폰을 움직이지 않았어요'; }
  else if((posCount.get(game.key())||0)>=3){ result='draw'; reason='같은 장면이 세 번 반복됐어요'; }
  else if(insufficient()){ result='draw'; reason='양쪽 모두 체크메이트할 말이 부족해요'; }
  if(!result) return false;
  endGame(result,reason);
  return true;
}

/* ---------------- 컴퓨터 ---------------- */
const engineSrc=$('engine-src').textContent, aiSrc=$('ai-src').textContent;
let worker=null, workerBroken=false, mainAILoaded=false, pendingJob=null;
function makeWorker(){
  if(workerBroken) return;
  try{
    const src=engineSrc+'\n'+aiSrc+'\nonmessage=function(e){var r=aiThink(e.data.state,e.data.level);postMessage({id:e.data.id,move:r});};';
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));
    worker.onmessage=e=>onAI(e.data);
    worker.onerror=e=>{ e.preventDefault&&e.preventDefault(); workerBroken=true; worker=null; if(pendingJob) runOnMain(pendingJob); };
  }catch(e){ workerBroken=true; worker=null; }
}
function runOnMain(job){
  if(!mainAILoaded){ (0,eval)(aiSrc); mainAILoaded=true; }
  setTimeout(()=>{ const r=window.aiThink(job.state,job.level); onAI({id:job.id,move:r}); },30);
}
function requestAI(){
  busy=true; updateUndoBtn();
  setStatus(`${LEVELS[level-1].name}이(가) 생각 중`,true);
  const job={id:++aiToken, state:game.getState(), level, t0:performance.now()};
  pendingJob=job;
  if(!worker&&!workerBroken) makeWorker();
  if(worker) worker.postMessage(job); else runOnMain(job);
}
function onAI(data){
  if(!pendingJob||data.id!==pendingJob.id||!inGame) return;
  const job=pendingJob; pendingJob=null;
  const wait=Math.max(0,650-(performance.now()-job.t0));
  setTimeout(()=>{
    if(data.id!==aiToken||!inGame) return;
    const r=data.move; if(!r) return;
    const m=legal.find(x=>x.f===r.f&&x.t===r.t&&(x.pr||0)===(r.pr||0))||legal.find(x=>x.f===r.f&&x.t===r.t);
    if(m) playMove(m);
  },wait);
}
function cancelAI(){
  aiToken++; pendingJob=null;
  if(worker){ worker.terminate(); worker=null; }
}

/* ---------------- 승급 선택 ---------------- */
function askPromotion(color){
  return new Promise(res=>{
    const box=$('promo'), wrap=box.querySelector('.pieces');
    const glyph=color>0?{5:'♕',4:'♖',3:'♗',2:'♘'}:{5:'♛',4:'♜',3:'♝',2:'♞'};
    wrap.innerHTML='';
    [5,4,3,2].forEach(t=>{ const b=document.createElement('button'); b.textContent=glyph[t]; b.onclick=()=>{ box.classList.add('hidden'); res(t*color); }; wrap.appendChild(b); });
    box.classList.remove('hidden');
  });
}

/* ---------------- 클릭 ---------------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pickSquare(cx,cy){
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pieceLayer.children,true);
  for(const h of hits){
    let o=h.object; while(o&&o.parent!==pieceLayer) o=o.parent;
    for(const [sq,m] of meshAt) if(m===o) return sq;
  }
  const sh=ray.intersectObjects(squares,false);
  return sh.length?sh[0].object.userData.sq:-1;
}
async function onSquare(sq){
  if(!inGame||busy||gameOver||game.side!==playerColor) return;
  if(selected>=0){
    const cands=legal.filter(m=>m.f===selected&&m.t===sq);
    if(cands.length){
      let m=cands[0];
      if(cands.length>1){ const pr=await askPromotion(playerColor); m=cands.find(c=>c.pr===pr)||cands[0]; }
      liftSelected(false);
      playMove(m); return;
    }
  }
  const p=game.board[sq];
  liftSelected(false);
  if(sq>=0&&p&&(p>0)===(playerColor>0)&&sq!==selected){
    selected=sq; SFX.select(); liftSelected(true);
    if(!legal.some(m=>m.f===sq)) tone(220,0.12,'sine',0.06);
  } else selected=-1;
  refreshMarks();
}
let liftedMesh=null;
function liftSelected(on){
  if(liftedMesh){ const m=liftedMesh, y0=m.position.y; tween(150,k=>{ m.position.y=y0*(1-k); }); liftedMesh=null; }
  if(on){ const m=meshAt.get(selected); if(m){ liftedMesh=m; tween(180,k=>{ if(liftedMesh===m) m.position.y=0.18*ease(k); }); } }
}
let down=null;
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; audio(); });
canvas.addEventListener('pointerup',e=>{
  if(!down) return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dt=performance.now()-down.t; down=null;
  if(moved<8&&dt<600) onSquare(pickSquare(e.clientX,e.clientY));
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||!inGame){ hoverMark.visible=false; return; }
  const sq=pickSquare(e.clientX,e.clientY);
  const can=sq>=0&&!busy&&!gameOver&&game.side===playerColor&&(legal.some(m=>m.f===sq)||(selected>=0&&legal.some(m=>m.f===selected&&m.t===sq)));
  placeMark(hoverMark,can?sq:-1); canvas.style.cursor=can?'pointer':'default';
});

/* ---------------- 카메라 ---------------- */
function seatView(top){
  const asp=(innerWidth&&innerHeight)?innerWidth/innerHeight:16/9;
  camera.fov=asp<1?55:45; camera.updateProjectionMatrix();
  const half=Math.tan(camera.fov*Math.PI/360);
  let d=Math.max(13.5, 6.4/(half*asp));
  const elev=top?1.35:0.8;
  controls.maxDistance=Math.max(26,d*1.4);
  return new THREE.Vector3(0,d*Math.sin(elev),d*Math.cos(elev)*playerColor);
}
function flyTo(target,dur){
  const s=new THREE.Spherical().setFromVector3(camera.position), e=new THREE.Spherical().setFromVector3(target);
  let dth=e.theta-s.theta; while(dth>Math.PI) dth-=Math.PI*2; while(dth<-Math.PI) dth+=Math.PI*2;
  controls.enabled=false;
  return tween(dur,k=>{ const q=ease(k); const sp=new THREE.Spherical(s.radius+(e.radius-s.radius)*q, s.phi+(e.phi-s.phi)*q, s.theta+dth*q);
    camera.position.setFromSpherical(sp); camera.lookAt(0,0,0); }).then(()=>{ controls.target.set(0,0,0); controls.update(); if(inGame) controls.enabled=true; });
}

/* ---------------- 단계 분위기 ---------------- */
function applyLevelMood(lv){
  const c=new THREE.Color(ACCENT[lv-1]);
  rimA.color.copy(c); rimB.color.copy(c); runeMat.color.copy(c);
  skyUniforms.horizon.value.copy(new THREE.Color(0x1a1020).lerp(c,0.22));
}

/* ---------------- 대국 시작 · 끝 ---------------- */
async function startGame(lv,color){
  cancelAI();
  level=lv; playerColor=color;
  game.reset(); records=[]; posCount=new Map([[game.key(),1]]); selected=-1; liftedMesh=null;
  legal=game.legalMoves(); gameOver=false; inGame=true; busy=true; viewMode=0;
  rebuildPieces(); refreshMarks(); renderMoveList(); applyLevelMood(lv);
  const labels=world.getObjectByName('labels'); labels.children.forEach(l=>l.rotation.z=playerColor===1?0:Math.PI);
  $('menu').classList.add('hidden'); $('end').classList.add('hidden');
  $('hud').classList.remove('hidden'); $('moves').classList.remove('hidden');
  $('lvBadge').innerHTML=`<div class="n">LEVEL ${lv}</div><div class="t">${LEVELS[lv-1].name}</div>`;
  setStatus('대국 준비'); updateUndoBtn();
  SFX.start();
  await flyTo(seatView(false),1800);
  busy=false;
  if(game.side!==playerColor) requestAI(); else setStatus('당신의 차례');
  updateUndoBtn();
}
function endGame(result,reason){
  gameOver=true; setStatus(result==='win'?'승리!':result==='lose'?'패배':'무승부');
  const L=LEVELS[level-1];
  let title, msg, btns=[];
  if(result==='win'){
    SFX.win(); title='승리!';
    if(!progress.beaten.includes(level)) progress.beaten.push(level);
    if(level<10&&progress.unlocked<level+1) progress.unlocked=level+1;
    saveProgress();
    if(level<10){ msg=`${reason}! <b>${L.name}</b>을(를) 꺾었어요.<br>다음 상대 <b>${LEVELS[level].name}</b>이(가) 기다려요.`; btns.push(['다음 단계로 ▶','big',()=>startGame(level+1,playerColor)]); }
    else { msg=`${reason}! <b>체스 황제</b>를 꺾었어요.<br>👑 이제 당신이 왕좌의 주인이에요!`; }
    btns.push(['다시 하기','ghost',()=>startGame(level,playerColor)]);
  } else if(result==='lose'){
    SFX.lose(); title='패배'; msg=`${reason}… <b>${L.name}</b>에게 졌어요.<br>한 번 더 도전해 볼까요?`;
    btns.push(['다시 도전','big',()=>startGame(level,playerColor)]);
  } else {
    SFX.draw(); title='무승부'; msg=reason;
    btns.push(['다시 하기','big',()=>startGame(level,playerColor)]);
  }
  btns.push(['메뉴','ghost',showMenu]);
  setTimeout(()=>{
    $('endTitle').textContent=title; $('endMsg').innerHTML=msg;
    const wrap=$('endBtns'); wrap.innerHTML='';
    btns.forEach(([t,cls,fn])=>{ const b=document.createElement('button'); b.className=cls; b.textContent=t; if(cls==='big') b.style.cssText='padding:12px 26px;font-size:16px'; else b.style.marginTop='20px'; b.onclick=fn; wrap.appendChild(b); });
    $('end').classList.remove('hidden');
  },1200);
}

/* ---------------- 메뉴 ---------------- */
let menuLevel=1, menuColor=1;
function buildMenu(){
  const grid=$('lvGrid'); grid.innerHTML='';
  menuLevel=Math.min(menuLevel,progress.unlocked);
  LEVELS.forEach((L,i)=>{
    const n=i+1, b=document.createElement('button'), locked=n>progress.unlocked;
    b.className='lv'+(n===menuLevel?' sel':''); b.disabled=locked;
    b.innerHTML=`<div class="num">${n}</div><div class="nm">${locked?'???':L.name}</div>`+(locked?'<span class="lock">🔒</span>':progress.beaten.includes(n)?'<span class="crown">👑</span>':'');
    b.onclick=()=>{ menuLevel=n; SFX.select(); buildMenu(); applyLevelMood(n); };
    grid.appendChild(b);
  });
  $('lvDesc').textContent=LEVELS[menuLevel-1].desc;
}
function showMenu(){
  cancelAI(); inGame=false; gameOver=true; busy=false; controls.enabled=false; selected=-1; liftedMesh=null;
  $('end').classList.add('hidden'); $('confirm').classList.add('hidden'); $('hud').classList.add('hidden'); $('moves').classList.add('hidden');
  menuLevel=Math.max(1,Math.min(progress.unlocked, level+(progress.beaten.includes(level)?1:0)));
  if(records.length===0){ menuLevel=progress.unlocked; }
  buildMenu(); applyLevelMood(menuLevel); refreshMarks();
  $('menu').classList.remove('hidden');
}
$('colorSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  menuColor=+b.dataset.c; [...$('colorSeg').children].forEach(x=>x.classList.toggle('on',x===b)); SFX.select();
});
$('bStart').onclick=()=>{ audio(); const c=menuColor||(Math.random()<0.5?1:-1); startGame(menuLevel,c); };

/* ---------------- 버튼 ---------------- */
$('bUndo').onclick=()=>{
  if(!inGame||!records.some(r=>r.side===playerColor)) return;
  if(busy&&game.side===playerColor) return;
  cancelAI(); busy=false;
  if(gameOver){ gameOver=false; $('end').classList.add('hidden'); }
  const popOne=()=>{ const r=records.pop(); const c=posCount.get(r.key)-1; if(c>0) posCount.set(r.key,c); else posCount.delete(r.key); game.unmake(r.m); return r; };
  let r; do{ r=popOne(); }while(records.length&&r.side!==playerColor);
  selected=-1; liftedMesh=null; legal=game.legalMoves();
  rebuildPieces(); refreshMarks(); renderMoveList();
  tone(520,0.12,'triangle',0.07); tone(390,0.15,'triangle',0.07,0.08);
  setStatus('당신의 차례'); updateUndoBtn();
};
$('bView').onclick=()=>{ if(!inGame) return; viewMode=1-viewMode; flyTo(seatView(viewMode===1),900); };
$('bSound').onclick=()=>{ soundOn=!soundOn; $('bSound').textContent=soundOn?'🔊':'🔇'; };
$('bMenu').onclick=()=>{ if(gameOver) showMenu(); else $('confirm').classList.remove('hidden'); };
$('cNo').onclick=()=>$('confirm').classList.add('hidden');
$('cYes').onclick=showMenu;

/* ---------------- 반복 렌더 ---------------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  runTweens(now);
  if(!inGame&&!tweens.length){
    const t=now*0.00009;
    camera.position.set(Math.sin(t)*11.5,5.2+Math.sin(t*3)*0.6,Math.cos(t)*11.5); camera.lookAt(0,-0.3,0);
  } else if(controls.enabled) controls.update();
  // 불꽃
  fires.forEach(f=>{
    f.light.intensity=1.4+Math.sin(now*0.013+f.seed)*0.18+Math.sin(now*0.037+f.seed*2)*0.12+Math.random()*0.1;
    for(let i=0;i<f.n;i++){
      f.life[i]+=dt*rand(0.8,1.4);
      if(f.life[i]>=1){ f.life[i]=0; f.pos[i*3]=rand(-0.28,0.28); f.pos[i*3+1]=0; f.pos[i*3+2]=rand(-0.28,0.28); f.vel[i*2]=rand(-0.15,0.15); f.vel[i*2+1]=rand(-0.15,0.15); }
      const L=f.life[i];
      f.pos[i*3]+=f.vel[i*2]*dt-f.pos[i*3]*dt*1.6; f.pos[i*3+2]+=f.vel[i*2+1]*dt-f.pos[i*3+2]*dt*1.6; f.pos[i*3+1]=L*1.3;
      const fade=Math.pow(1-L,1.4);
      f.col[i*3]=1*fade; f.col[i*3+1]=(0.75-L*0.55)*fade; f.col[i*3+2]=(0.35-L*0.35)*fade;
    }
    f.pts.geometry.attributes.position.needsUpdate=true; f.pts.geometry.attributes.color.needsUpdate=true;
  });
  // 불티
  const ep=embers.geometry.attributes.position;
  for(let i=0;i<ep.count;i++){ let y=ep.getY(i)+dt*0.35; if(y>9) y=-1.5; ep.setY(i,y); ep.setX(i,ep.getX(i)+Math.sin(now*0.001+i)*dt*0.1); }
  ep.needsUpdate=true;
  embers.rotation.y+=dt*0.02;
  // 표시 깜빡임
  if(checkMark.visible) checkMat.opacity=0.65+Math.sin(now*0.008)*0.35;
  if(selMark.visible) selMat.opacity=0.45+Math.sin(now*0.006)*0.12;
  dotMat.opacity=0.8+Math.sin(now*0.005)*0.15;
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(!innerWidth||!innerHeight) return;
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight;
  if(inGame){ seatView(viewMode===1); } else camera.updateProjectionMatrix();
  camera.updateProjectionMatrix();
});

/* 시작 */
rebuildPieces(); applyLevelMood(progress.unlocked); menuLevel=progress.unlocked; buildMenu();
requestAnimationFrame(loop);
setTimeout(()=>{ const l=$('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),700); $('menu').classList.remove('hidden'); },300);
})();
</script>
