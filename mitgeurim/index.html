<!doctype html>
<html lang="ko">
<head>

<style>
:root{--ink:#e8e4dc;--dim:#8a857c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#fsBtn{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:60;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(20,20,20,.7)}

#fsMsg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:rgba(20,20,20,.92);border:1px solid #4a4741;border-radius:6px;padding:.7em 1.1em;font-size:15px;line-height:1.5;text-align:center;max-width:86vw;word-break:keep-all;opacity:0;transition:opacity .3s;pointer-events:none}

@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}

<body>
<canvas id="cv"></canvas>
<button id="fsBtn" aria-label="전체화면"></button>
<div id="fsMsg"></div>
<div id="rotate"><div>밑그림은 가로 화면에서 그려집니다.<br>기기를 옆으로 돌려 주세요.<br><button id="rotFs">전체화면 가로로 보기</button></div></div>
<script>// 글씨나무 — 연필 손그림: 종이, 찢긴 카드, 흔들리는 연필 선, 빗금, 목탄
(function (root) {
  const rng = seed => { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  // 점 목록을 촘촘하게(흔들림을 넣을 수 있게) 다시 나눈다

  // 연필 한 획: 두세 번 겹쳐 긋고, 겹마다 조금씩 어긋나며, 획 끝은 가늘어진다

    o = o || {}; const r = o.r || rng(o.seed || 7); const w = o.w || 2.2, passes = o.passes || 2, jit = o.jit == null ? 1.3 : o.jit, col = o.color || INK, alpha = o.alpha || 0.9;

    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col;
    for (let p = 0; p < passes; p++) {
      const off = [(r() - 0.5) * jit, (r() - 0.5) * jit]; let drift = [0, 0];
      const Q = P.map(([x, y], i) => { drift = [drift[0] * 0.8 + (r() - 0.5) * jit * 0.6, drift[1] * 0.8 + (r() - 0.5) * jit * 0.6]; return [x + off[0] + drift[0], y + off[1] + drift[1]]; });
      // 획을 짧은 토막으로 그려 굵기와 진하기를 바꾼다 (시작·끝은 가늘게)
      for (let i = 0; i < Q.length - 1; i++) { const t = i / Math.max(1, Q.length - 2); const taper = o.noTaper ? 1 : Math.min(1, Math.sin(Math.PI * Math.min(1, Math.max(0, t))) * 1.8 + 0.25);
        c.globalAlpha = alpha * (p === 0 ? 1 : 0.55) * (0.75 + r() * 0.25); c.lineWidth = w * taper * (p === 0 ? 1 : 0.7) * (0.85 + r() * 0.3);
        c.beginPath(); c.moveTo(Q[i][0], Q[i][1]); c.lineTo(Q[i + 1][0], Q[i + 1][1]); c.stroke(); }
    }
    c.restore();
  };
  const circlePts = (cx, cy, rx, ry, a0, a1, n) => { a0 = a0 || 0; a1 = a1 == null ? Math.PI * 2 : a1; n = n || Math.max(16, Math.round(Math.max(rx, ry) * 0.9)); const out = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return out; };
  // 손으로 그린 원은 끝이 조금 겹친다
  const ring = (c, cx, cy, rx, ry, o) => { const r = (o && o.r) || rng((o && o.seed) || 3); const a0 = r() * 6.28; stroke(c, circlePts(cx, cy, rx, ry, a0, a0 + Math.PI * 2.08), Object.assign({ r }, o)); };
  const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y + 1]];
  const box = (c, x, y, w, h, o) => { const r = (o && o.r) || rng((o && o.seed) || 5); const sides = [[[x, y], [x + w, y]], [[x + w, y], [x + w, y + h]], [[x + w, y + h], [x, y + h]], [[x, y + h], [x, y]]];
    sides.forEach(([a, b]) => { const ex = (r() - 0.3) * 4; stroke(c, [[a[0] - (b[0] - a[0]) * 0.02, a[1] - (b[1] - a[1]) * 0.02], [b[0] + (b[0] - a[0]) * 0.02 + ex * 0, b[1] + (b[1] - a[1]) * 0.02]], Object.assign({ r }, o)); }); };

  // 빗금: 모양(path2D) 안에 비스듬한 연필 선을 채운다
  const hatch = (c, path, bb, o) => { o = o || {}; const r = o.r || rng(o.seed || 11); const ang = o.angle == null ? -0.9 : o.angle, sp = o.spacing || 7; const [x, y, w, h] = bb;
    c.save(); c.clip(path); const L = Math.hypot(w, h), cx = x + w / 2, cy = y + h / 2, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let d = -L / 2; d < L / 2; d += sp * (0.7 + r() * 0.6)) { const px = cx - sa * d, py = cy + ca * d; const t0 = o.sketch ? -L / 2 + r() * L * 0.5 : -L / 2, t1 = o.sketch ? L / 2 - r() * L * 0.5 : L / 2, wob = (r() - 0.5) * 0.06; const c2 = Math.cos(ang + wob), s2 = Math.sin(ang + wob); stroke(c, [[px + c2 * t0, py + s2 * t0], [px + c2 * t1, py + s2 * t1]], { r, w: (o.w || 1.1) * (0.7 + r() * 0.6), passes: 1, alpha: (o.alpha || 0.55) * (0.6 + r() * 0.5), jit: 1.2, step: 14, noTaper: !o.sketch }); }
    if (o.cross) { const a2 = ang + 1.3, c2 = Math.cos(a2), s2 = Math.sin(a2); for (let d = -L / 2; d < L / 2; d += sp * 1.3 * (0.8 + r() * 0.4)) { const px = cx - s2 * d, py = cy + c2 * d; stroke(c, [[px - c2 * L / 2, py - s2 * L / 2], [px + c2 * L / 2, py + s2 * L / 2]], { r, w: (o.w || 1.1) * 0.9, passes: 1, alpha: (o.alpha || 0.55) * 0.8, jit: 1, step: 14, noTaper: true }); } }
    c.restore(); };

  // 목탄 칠: 짙은 바탕 + 결 따라 문지른 획 + 털처럼 일어난 가장자리
  const polyPath = pts => { const p = new Path2D(); pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
  const charcoal = (c, path, bb, o) => { o = o || {}; const [x, y, w, h] = bb; const pad = 30; const L = mk(w + pad * 2, h + pad * 2), l = L.getContext('2d'); l.translate(-x + pad, -y + pad);
    const col = o.color || '#1d1c1a'; const r = o.r || rng(o.seed || 17);
    l.fillStyle = col; l.globalAlpha = o.base == null ? 0.82 : o.base; l.shadowColor = col; l.shadowBlur = o.soft == null ? 2.5 : o.soft; l.fill(path); l.shadowBlur = 0; l.globalAlpha = 1;
    // 속: 결 방향으로 짧게 문지른 획 (밝고 어두운 결)
    l.save(); l.clip(path); const g = o.grain == null ? -1.0 : o.grain, ca = Math.cos(g), sa = Math.sin(g);
    for (let i = 0; i < (w * h) / 55; i++) { const sx = x + r() * w, sy = y + r() * h, len = 6 + r() * 22; l.globalAlpha = 0.18 + r() * 0.35; l.strokeStyle = r() < 0.72 ? '#0e0d0c' : '#5b5752'; l.lineWidth = 0.8 + r() * 2.2; l.beginPath(); l.moveTo(sx, sy); l.lineTo(sx + ca * len, sy + sa * len); l.stroke(); }
    l.restore();
    // 가장자리 털: 윤곽 점에서 바깥으로 짧은 획
    if (o.pts) { const Pp = resample(o.pts.concat([o.pts[0]]), o.fur ? 5 : 9); for (let i = 0; i < Pp.length - 1; i++) { const [px, py] = Pp[i], [qx, qy] = Pp[i + 1]; let tx = qx - px, ty = qy - py; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl; const nx = ty, ny = -tx;
      if (o.fur && r() < 0.55) { const k = o.fur * (0.4 + r() * 0.9), sw = (r() - 0.3) * 1.2; l.globalAlpha = 0.25 + r() * 0.4; l.strokeStyle = col; l.lineWidth = 0.7 + r() * 1.1; l.beginPath(); l.moveTo(px - nx * 1.5, py - ny * 1.5); l.quadraticCurveTo(px + nx * k * 0.6 + tx * k * sw * 0.5, py + ny * k * 0.6 + ty * k * sw * 0.5, px + nx * k + tx * k * sw, py + ny * k + ty * k * sw); l.stroke(); }
      // 윤곽: 연필로 한 번 더 (살짝 흔들리게)
      l.globalAlpha = 0.5 + r() * 0.4; l.strokeStyle = col; l.lineWidth = 1.2 + r() * 1.3; l.beginPath(); l.moveTo(px + (r() - 0.5) * 1.5, py + (r() - 0.5) * 1.5); l.lineTo(qx + (r() - 0.5) * 1.5, qy + (r() - 0.5) * 1.5); l.stroke(); } }
    l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < (L.width * L.height) / 45; i++) { l.globalAlpha = 0.06 + r() * 0.16; l.fillRect(r() * L.width, r() * L.height, 1 + r() * 2, 1); }
    c.save(); c.globalAlpha = o.alpha == null ? 1 : o.alpha; c.drawImage(L, x - pad, y - pad); c.restore(); };
  // 문지른 그늘: 넓고 흐린 목탄 번짐
  const smudge = (c, x, y, w, h, o) => { o = o || {}; const r = o.r || rng(o.seed || 31); const L = mk(w, h), l = L.getContext('2d');
    const g = l.createLinearGradient(0, 0, 0, h); const top = o.up ? o.alpha || 0.2 : 0, bot = o.up ? 0 : o.alpha || 0.2; g.addColorStop(0, `rgba(30,28,26,${top})`); g.addColorStop(1, `rgba(30,28,26,${bot})`); l.fillStyle = g; l.fillRect(0, 0, w, h);
    const gx = l.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, 'rgba(0,0,0,1)'); gx.addColorStop(0.12, 'rgba(0,0,0,0)'); gx.addColorStop(0.88, 'rgba(0,0,0,0)'); gx.addColorStop(1, 'rgba(0,0,0,1)'); l.globalCompositeOperation = 'destination-out'; l.fillStyle = gx; l.fillRect(0, 0, w, h);
    for (let i = 0; i < w * h / 70; i++) { l.globalAlpha = 0.05 + r() * 0.2; l.fillRect(r() * w, r() * h, 3 + r() * 26, 1); }
    c.drawImage(L, x, y); };
  // 종이: 따뜻한 회백색, 섬유와 얼룩, 가장자리로 갈수록 어둡다
  const paperTex = (w, h, seed) => { const C = mk(w, h), x = C.getContext('2d'); const r = rng(seed || 99);
    x.fillStyle = '#e6e2da'; x.fillRect(0, 0, w, h);
    const img = x.getImageData(0, 0, w, h), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; } x.putImageData(img, 0, 0);
    for (let i = 0; i < w * h / 900; i++) { x.globalAlpha = 0.04 + r() * 0.05; x.strokeStyle = r() < 0.5 ? '#8d887e' : '#fff'; x.lineWidth = 0.6; x.beginPath(); const sx = r() * w, sy = r() * h, a = r() * 6.28, l = 4 + r() * 14; x.moveTo(sx, sy); x.quadraticCurveTo(sx + Math.cos(a) * l * 0.5 + (r() - 0.5) * 4, sy + Math.sin(a) * l * 0.5 + (r() - 0.5) * 4, sx + Math.cos(a) * l, sy + Math.sin(a) * l); x.stroke(); }
    for (let i = 0; i < 18; i++) { x.globalAlpha = 0.025; x.fillStyle = '#6f6a61'; x.beginPath(); x.ellipse(r() * w, r() * h, 40 + r() * 160, 30 + r() * 120, r() * 3, 0, 6.28); x.fill(); }
    x.globalAlpha = 1; const g = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(40,36,30,.22)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    return C; };
  // 찢긴 종이 가장자리
  const tornPath = (x, y, w, h, seed, amp) => { const r = rng(seed || 5); amp = amp || 5; const p = new Path2D(); const pts = [];
    const edge = (x0, y0, x1, y1) => { const n = Math.round(Math.hypot(x1 - x0, y1 - y0) / 7); for (let i = 0; i < n; i++) { const t = i / n, nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny); const k = (r() - 0.5) * amp + (r() < 0.06 ? (r() - 0.5) * amp * 2.2 : 0); pts.push([x0 + (x1 - x0) * t + nx / L * k, y0 + (y1 - y0) * t + ny / L * k]); } };
    edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
    pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
  const card = (c, x, y, w, h, seed) => { const path = tornPath(x, y, w, h, seed); c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 24; c.shadowOffsetY = 6; c.fillStyle = '#ddd8cf'; c.fill(path); c.restore();
    c.save(); c.clip(path); c.drawImage(paperTex(w, h, seed), x, y); c.restore(); return path; };

  // 흑연 결: 그려진 먹을 종이 결대로 조금 지워 연필처럼 보이게
  const graphite = (layer, seed) => { const x = layer.getContext('2d'), r = rng(seed || 21); x.save(); x.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < layer.width * layer.height / 40; i++) { x.globalAlpha = 0.08 + r() * 0.22; x.fillRect(r() * layer.width, r() * layer.height, 1, 1); } x.restore(); };

  root.Pencil = { polyPath, smudge, rng, mk, stroke, ring, box, rectPts, circlePts, hatch, charcoal, paperTex, tornPath, card, graphite, resample, INK };
})(window);
</script>
<script>// 밑그림 — 엔진: 화면, 입력, 허브 방, 퍼즐 카드, 자음판, 나무, 소리, 저장
(function (root) {
  const P = root.Pencil; const W = 1600, H = 900;
  const CARD = { x: 36, y: 40, w: 1190, h: 820 };
  const JAMO = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈ';
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const INKW = '#e8e4dc';

  // ---------- 손글씨 자음 (획 좌표, 0~1 칸) ----------
  const JS = {
    'ㄱ': [[[0.16, 0.2], [0.82, 0.2], [0.78, 0.86]]],
    'ㄴ': [[[0.2, 0.14], [0.2, 0.8], [0.86, 0.8]]],
    'ㄷ': [[[0.84, 0.2], [0.2, 0.2], [0.2, 0.8], [0.86, 0.8]]],
    'ㄹ': [[[0.18, 0.14], [0.82, 0.14], [0.82, 0.47], [0.2, 0.47], [0.2, 0.84], [0.86, 0.84]]],
    'ㅁ': [[[0.2, 0.2], [0.8, 0.2], [0.8, 0.82], [0.2, 0.82], [0.2, 0.2]]],
    'ㅂ': [[[0.22, 0.1], [0.22, 0.86], [0.8, 0.86], [0.8, 0.1]], [[0.22, 0.46], [0.8, 0.46]]],
    'ㅅ': [[[0.52, 0.14], [0.16, 0.86]], [[0.46, 0.44], [0.86, 0.86]]],
    'ㅇ': 'O',
    'ㅈ': [[[0.18, 0.18], [0.82, 0.18]], [[0.64, 0.2], [0.16, 0.86]], [[0.46, 0.5], [0.86, 0.86]]],
  };
  const jamo = (c, ch, x, y, s, o) => { o = o || {}; const r = P.rng(o.seed || ch.charCodeAt(0)); const d = JS[ch]; if (!d) return;
    if (d === 'O') { P.ring(c, x + s / 2, y + s / 2, s * 0.32, s * 0.34, Object.assign({ r, w: o.w || s * 0.06 }, o)); return; }
    d.forEach(st => P.stroke(c, st.map(([a, b]) => [x + a * s, y + b * s]), Object.assign({ r, w: o.w || s * 0.06, jit: s * 0.02 }, o))); };

  // ---------- 소리 (파일 없이 합성) ----------
  const Snd = (() => { let ctx, master, noise, on = true, lastScratch = 0;
    const ensure = () => { if (ctx) return; try { ctx = new (root.AudioContext || root.webkitAudioContext)(); } catch (e) { return; } master = ctx.createGain(); master.gain.value = on ? 0.9 : 0; master.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate * 1, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; };
    const burst = (t, dur, vol, f, q, type) => { const s = ctx.createBufferSource(); s.buffer = noise; const bp = ctx.createBiquadFilter(); bp.type = type || 'bandpass'; bp.frequency.value = f; bp.Q.value = q; const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05); };
    const tone = (f, t, dur, vol, type) => { const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = f; const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); };
    const piano = (f, t, vol) => { tone(f, t, 2.2, vol, 'sine'); tone(f * 2, t, 1.2, vol * 0.35, 'sine'); tone(f * 3, t, 0.6, vol * 0.12, 'triangle'); };
    const api = {
      unlock() { ensure(); if (ctx && ctx.state === 'suspended') ctx.resume(); },

          P.stroke(x, [[900, 540], [620, 548]], { r, w: 7, color: '#101010' }); P.stroke(x, [[660, 520], [618, 548], [662, 574]], { r, w: 7, color: '#101010' }); });
        G.ink(c, ink, 0, 0);
        // 연필 낙서 층 (지우개로 지워지는 층)
        const pen = G.art('p8-pencil', AW, AH, (x, r) => { // 종이를 연필로 까맣게 칠해 두었다 (먹 글씨가 묻힌다)
          const all = new Path2D(); all.rect(0, 0, AW, AH); x.fillStyle = '#4a4843'; x.fill(all); P.charcoal(x, all, [0, 0, AW, AH], { r, base: 0.9, color: '#2b2a28', soft: 0 });
          P.hatch(x, all, [0, 0, AW, AH], { spacing: 6, alpha: 0.5, sketch: true, angle: -0.8, seed: 12, w: 2.2, color: '#1c1b19' });
          // 누군가 지우개로 먼저 써 둔 글자 (함정): 흑연을 지워 흰 획으로 보인다
          x.save(); x.globalCompositeOperation = 'destination-out'; [['ㄱ', 60, 20], ['ㄴ', 360, 330], ['ㄷ', 640, 30]].forEach(([ch, px, py]) => G.jamo(x, ch, px, py, 170, { r, w: 26, color: '#000', alpha: 0.9, passes: 2 })); x.restore(); }, { still: true });
        const L = G._p8 || (G._p8 = P.mk(AW, AH)); const lx = L.getContext('2d'); lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, AW, AH); lx.drawImage(pen, 0, 0); lx.globalCompositeOperation = 'destination-out'; lx.drawImage(mask, 0, 0);
        c.drawImage(L, AX, AY); // 흑연은 불투명하게 덮는다 (먹 글씨가 비치지 않게)
        // 지우개 (커서)
        const h = G.hover; if (h && inR(h, AX - 40, AY - 40, AW + 80, AH + 80)) { const e = G.art('p8-eraser', 120, 80, (x, r) => { const b = [[20, 20], [96, 14], [100, 56], [24, 62]]; P.stroke(x, b.concat([b[0]]), { r, w: 2 }); P.stroke(x, [[62, 17], [66, 59]], { r, w: 1.4 }); const hp = [[62, 17], [96, 14], [100, 56], [66, 59]]; P.hatch(x, P.polyPath(hp), [62, 14, 38, 45], { spacing: 5, alpha: 0.4, seed: 3 }); }); G.ink(c, e, h.x - 30, h.y - 40); } },
      rub(st, p, G) { if (!mctx) return; const x = p.x - AX, y = p.y - AY; if (x < -30 || y < -30 || x > AW + 30 || y > AH + 30) return; mctx.fillStyle = '#000'; mctx.beginPath(); if (st.last) { mctx.lineWidth = 56; mctx.lineCap = 'round'; mctx.strokeStyle = '#000'; mctx.moveTo(st.last[0], st.last[1]); mctx.lineTo(x, y); mctx.stroke(); } mctx.arc(x, y, 28, 0, 7); mctx.fill(); st.last = [x, y]; G.Snd.erase(); },
      down(st, p, G) { st.drag = true; st.last = null; this.rub(st, p, G); },
      move(st, p, G) { if (st.drag) this.rub(st, p, G); },
      up(st) { st.drag = false; st.last = null; },
      solve(st) { if (!mctx) { mask = P.mk(AW, AH); mctx = mask.getContext('2d'); } mctx.fillStyle = '#000'; mctx.fillRect(0, 0, AW, AH); },
    });
  })();

  // =====================================================================
  // 9. 별 종이 — 연필로 잇기. 별의 빛살 수(1,2,3…) 차례로 이으면 별자리마다 자음. 왼쪽부터 ㄴ ㄹ ㄷ
  // =====================================================================
  (() => {
    // 별자리: 점 좌표와 차례(빛살 수)
    const CONS = [ // 점 배치만으로는 여러 자음이 될 수 있다. 빛살 수 차례가 하나로 정한다. ord 0 = 빛살 없는 들러리 별
      { ox: 190, oy: 230, s: 220, pts: [[0.1, 0.05, 1], [0.1, 0.9, 2], [0.95, 0.9, 3], [0.95, 0.05, 0]] },                         // ㄴ
      { ox: 500, oy: 210, s: 250, pts: [[0.05, 0.05, 1], [0.9, 0.05, 2], [0.9, 0.48, 3], [0.1, 0.48, 4], [0.1, 0.92, 5], [0.95, 0.92, 6]] }, // ㄹ
      { ox: 830, oy: 230, s: 220, pts: [[0.92, 0.08, 1], [0.1, 0.08, 2], [0.1, 0.88, 3], [0.94, 0.88, 4]] },           // ㄷ
    ];
    const stars = []; CONS.forEach((k, ci) => k.pts.forEach(([u, v, o]) => stars.push({ ci, ord: o, x: k.ox + u * k.s, y: k.oy + v * k.s })));
    const hitStar = p => stars.findIndex(s => Math.hypot(p.x - s.x, p.y - s.y) < 26);
    G.reg({
      id: 'stars', answer: ['ㄴ', 'ㄹ', 'ㄷ'],
      hints: ['별에서 별로 끌면 연필 선이 그어진다. 틀린 선은 두드려 지운다.', '별의 빛살을 세어 본다. 하나, 둘, 셋…', '같은 무리의 별을 빛살 차례로 잇고, 왼쪽 무리부터 읽는다.'],
      hub: { x: 760, y: 330, w: 150, h: 130, draw(x, r) { const a = [[20, 20], [130, 16], [128, 110], [24, 114]]; P.stroke(x, a.concat([a[0]]), { r, w: 1.8 }); P.stroke(x, [[75, 18], [75, 8]], { r, w: 2 }); [[50, 50], [90, 44], [70, 80], [104, 90], [40, 92]].forEach(([sx, sy]) => { P.stroke(x, [[sx - 5, sy], [sx + 5, sy]], { r, w: 1.4 }); P.stroke(x, [[sx, sy - 5], [sx, sy + 5]], { r, w: 1.4 }); }); } },
      init(st) { st.lines = []; st.drag = null; },
      draw(c, st, G) { const bg = G.art('p9-bg', G.W, G.H, (x, r) => { const sky = P.tornPath(C.x + 90, C.y + 110, C.w - 180, 600, 51, 4); P.charcoal(x, sky, [C.x + 90, C.y + 110, C.w - 180, 600], { r, base: 0.88, soft: 1 });
          const R = P.rng(9); for (let i = 0; i < 90; i++) { x.fillStyle = 'rgba(230,226,218,' + (0.15 + R() * 0.3) + ')'; x.beginPath(); x.arc(C.x + 110 + R() * (C.w - 220), C.y + 130 + R() * 560, 0.8 + R() * 1.2, 0, 7); x.fill(); } });
        G.ink(c, bg, 0, 0);
        // 별 (빛살 수가 차례)
        const sa = G.art('p9-stars', G.W, G.H, (x, r) => { stars.forEach(s => { const n = s.ord; if (!n) { x.fillStyle = '#ece8df'; x.beginPath(); x.arc(s.x, s.y, 4.5, 0, 7); x.fill(); return; } for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / n; P.stroke(x, [[s.x + Math.cos(a) * 4, s.y + Math.sin(a) * 4], [s.x + Math.cos(a) * 17, s.y + Math.sin(a) * 17]], { r, w: 2.4, color: '#ece8df' }); } x.fillStyle = '#ece8df'; x.beginPath(); x.arc(s.x, s.y, 4.5, 0, 7); x.fill(); }); }, { noGrain: true });
        c.drawImage(sa, 0, 0);
        const la = G.art('p9-lines-' + st.lines.map(l => l.join('.')).join('_'), G.W, G.H, (x, r) => st.lines.forEach(([a, b]) => P.stroke(x, [[stars[a].x, stars[a].y], [stars[b].x, stars[b].y]], { r, w: 3, color: '#e0dcd2', alpha: 0.9 })), { noGrain: true, still: true }); c.drawImage(la, 0, 0);
        if (st.drag && G.hover) { c.save(); c.strokeStyle = 'rgba(224,220,210,.6)'; c.lineWidth = 2; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(stars[st.drag.a].x, stars[st.drag.a].y); c.lineTo(G.hover.x, G.hover.y); c.stroke(); c.restore(); } },
      down(st, p, G) { const i = hitStar(p); if (i >= 0) { st.drag = { a: i }; G.Snd.pick(); return; }
        // 선을 두드리면 지운다
        const k = st.lines.findIndex(([a, b]) => { const A = stars[a], B = stars[b]; const t = clamp(((p.x - A.x) * (B.x - A.x) + (p.y - A.y) * (B.y - A.y)) / ((B.x - A.x) ** 2 + (B.y - A.y) ** 2), 0, 1); return Math.hypot(p.x - (A.x + (B.x - A.x) * t), p.y - (A.y + (B.y - A.y) * t)) < 12; }); if (k >= 0) { st.lines.splice(k, 1); G.Snd.erase(); } },
      move(st, p, G) { if (st.drag) G.Snd.scratch(1); },
      up(st, p, G) { const d = st.drag; if (!d) return; st.drag = null; const j = hitStar(p); if (j >= 0 && j !== d.a && !st.lines.some(([a, b]) => (a === d.a && b === j) || (a === j && b === d.a))) { st.lines.push([d.a, j]); G.Snd.scratch(8); } },
      solve(st) { st.lines = []; CONS.forEach((k, ci) => { const idx = o => stars.findIndex(s => s.ci === ci && s.ord === o); const n = k.pts.filter(q => q[2]).length; for (let o = 1; o < n; o++) st.lines.push([idx(o), idx(o + 1)]); }); },
    });
  })();

  // =====================================================================
  // 10. 다 자란 나무 — 마지막. 아홉 열매 중 그림자가 없는 셋을 위에서 아래로: ㄱ ㄹ ㅈ = 그림자
  // =====================================================================
  (() => {
    const FR = [['ㅁ', 470, 250, 1], ['ㄱ', 640, 190, 0], ['ㅂ', 790, 262, 1], ['ㅅ', 420, 370, 1], ['ㄹ', 600, 330, 0], ['ㄴ', 860, 380, 1], ['ㅇ', 510, 470, 1], ['ㅈ', 700, 450, 0], ['ㄷ', 820, 500, 1]]; // [자음, x, y, 그림자 있음?]
    G.reg({
      id: 'tree', final: true, answer: ['ㄱ', 'ㄹ', 'ㅈ'],
      hints: ['빛이 있어야 그림자가 생긴다.', '벽에 그림자가 없는 열매가 있다.', '그 열매들을 위에서부터. 셋이 모이면 낱말이 된다.'],
      hub: { x: 930, y: 610, w: 200, h: 240, draw(x, r, solved, G) { const n = G.nSolved(); const pot = [[60, 200], [140, 200], [130, 236], [70, 236]]; P.charcoal(x, P.polyPath(pot), [60, 200, 80, 36], { r, pts: pot }); const R = P.rng(5); const br = (x0, y0, a, len, d) => { if (d <= 0) return; const x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len; P.stroke(x, [[x0, y0], [x1, y1]], { r, w: Math.max(1, d * 0.9) }); br(x1, y1, a - 0.45 - R() * 0.2, len * 0.72, d - 1); br(x1, y1, a + 0.45 + R() * 0.2, len * 0.72, d - 1); };
        const depth = 1 + Math.min(6, Math.ceil(n * 0.7)); P.stroke(x, [[100, 200], [100, 170 - n * 5]], { r, w: 3 }); br(100, 170 - n * 5, -Math.PI / 2, 24 + n * 3.5, depth); } },
      init(st) { },
      draw(c, st, G) { const night = G.night;
        const bg = G.art('p10-bg', G.W, G.H, (x, r) => { P.stroke(x, [[C.x + 30, 700], [C.x + C.w - 30, 692]], { r, w: 2.4 }); P.smudge(x, C.x + 10, 560, C.w - 20, 140, { alpha: 0.2, seed: 7 });
          const R = P.rng(21); const br = (x0, y0, a, len, d) => { if (d <= 0) return; const x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len; P.stroke(x, [[x0, y0], [(x0 + x1) / 2 + (R() - 0.5) * 6, (y0 + y1) / 2], [x1, y1]], { r, w: Math.max(1.2, d * 1.6) }); br(x1, y1, a - 0.4 - R() * 0.25, len * 0.74, d - 1); br(x1, y1, a + 0.4 + R() * 0.25, len * 0.74, d - 1); };
          P.stroke(x, [[640, 690], [636, 560], [640, 470]], { r, w: 9 }); br(640, 470, -Math.PI / 2, 110, 6); const pot = [[570, 690], [710, 690], [696, 740], [584, 740]]; P.charcoal(x, P.polyPath(pot), [570, 690, 140, 50], { r, pts: pot });
          FR.forEach(([ch, fx, fy]) => { P.stroke(x, [[fx, fy - 40], [fx, fy - 26]], { r, w: 1.4 }); P.ring(x, fx, fy, 26, 28, { r, w: 2 }); G.jamo(x, ch, fx - 17, fy - 17, 34, { r, w: 2.6 }); }); });
        G.ink(c, bg, 0, 0);
        if (!night) { // 전등 빛: 열매 그림자가 오른쪽 벽에 진다 (셋은 그림자가 없다)
          c.save(); c.globalCompositeOperation = 'source-over'; FR.forEach(([ch, fx, fy, has]) => { if (!has) return; const g = c.createRadialGradient(fx + 300, fy + 60, 4, fx + 300, fy + 60, 36); g.addColorStop(0, 'rgba(40,38,36,.5)'); g.addColorStop(1, 'rgba(40,38,36,0)'); c.fillStyle = g; c.beginPath(); c.ellipse(fx + 300, fy + 60, 30, 34, 0, 0, 7); c.fill(); }); c.restore();
          c.save(); const g = c.createRadialGradient(C.x + 60, C.y + 60, 10, C.x + 60, C.y + 60, 1000); g.addColorStop(0, 'rgba(255,248,225,.35)'); g.addColorStop(1, 'rgba(255,248,225,0)'); c.fillStyle = g; c.globalCompositeOperation = 'screen'; c.fillRect(C.x, C.y, C.w, C.h); c.restore(); }
        else { c.save(); c.fillStyle = 'rgba(18,18,24,.6)'; c.fillRect(C.x, C.y, C.w, C.h); c.restore(); } },
      solve(st, G) { G.night = false; },
    });
  })();

})(window.MG);
</script>
<script>MG.init();</script>
