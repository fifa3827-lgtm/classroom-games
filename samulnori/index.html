<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e9d8b6">
<meta name="description" content="사물놀이 삼도농악가락으로 배우는 리듬 게임 - 창신초등학교">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{margin:0; font:14px system-ui,-apple-system,sans-serif; background:#efeae1;}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>우리 장단</title>
</head>
<body>
<style>
  :root{
    --ink:#2f2a33; --hanji:#f4e7cd;
    --red:#d4564f; --blue:#4a7ba7; --yellow:#e8b23a; --green:#5c8d64; --white:#f6efe2;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  #app{
    position:fixed; inset:0; overflow:hidden;
    background:#e9d8b6;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #stage{display:block; position:absolute; inset:0; width:100%; height:100%}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; left:0; right:0;
    top:env(safe-area-inset-top,0px);
    display:flex; align-items:center; gap:12px;
    padding:8px 14px; pointer-events:none;
  }
  #hud .box{
    background:rgba(47,42,51,.72); color:#f6efe2;
    border-radius:12px; padding:6px 12px; backdrop-filter:blur(4px);
  }
  #songName{font-weight:800; font-size:15px; letter-spacing:-.01em}
  #songName span{opacity:.7; font-weight:600; font-size:12px; margin-left:4px}
  #gwrap{flex:1; min-width:0; max-width:420px}
  #gbar{
    position:relative; height:16px; border-radius:99px; overflow:hidden;
    background:rgba(47,42,51,.28); box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
  }
  #gfill{
    display:block; height:100%; width:20%; border-radius:99px;
    background:linear-gradient(90deg,#4a7ba7,#5c8d64,#e8b23a,#d4564f);
    background-size:420% 100%; background-position:0% 0;
    transition:width .12s linear;
  }
  #gstage{
    margin-top:3px; font-size:11.5px; font-weight:800; text-align:center;
    color:#3f3226; letter-spacing:-.01em;
    text-shadow:0 1px 0 rgba(255,250,235,.85);
  }
  #scoreBox{text-align:right; min-width:92px}
  #scoreVal{font-size:19px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums}
  #comboVal{font-size:11px; opacity:.85; font-weight:700}
  #quit{
    pointer-events:auto; border:0; cursor:pointer;
    background:rgba(47,42,51,.72); color:#f6efe2;
    border-radius:12px; padding:8px 12px; font-size:13px; font-weight:700;
    font-family:inherit;
  }

  /* ---------- 추임새 ---------- */
  #chuim{
    position:absolute; left:50%; top:23%; transform:translate(-50%,-50%);
    font-size:clamp(30px,5.6vw,54px); font-weight:900; color:#ffd76a;
    text-shadow:
      -3px -3px 0 #2b232d,  3px -3px 0 #2b232d,
      -3px  3px 0 #2b232d,  3px  3px 0 #2b232d,
       0   -4px 0 #2b232d,  0    4px 0 #2b232d,
      -4px  0   0 #2b232d,  4px  0   0 #2b232d,
       0 0 18px rgba(232,178,58,.55);
    opacity:0; pointer-events:none; letter-spacing:-.02em; white-space:nowrap; z-index:3;
  }
  @keyframes chuimPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.55) rotate(-7deg)}
    22%{opacity:1; transform:translate(-50%,-50%) scale(1.16) rotate(3deg)}
    45%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0; transform:translate(-50%,-125%) scale(.95)}
  }
  #chuim.go{animation:chuimPop 1s ease-out forwards}

  /* ---------- 화면 ---------- */
  .screen{
    position:absolute; inset:0; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(120% 90% at 50% 0%, #fbf0d8 0%, #e9d8b6 55%, #d9c096 100%);
  }
  .title{font-size:clamp(30px,6.4vw,50px); font-weight:900; letter-spacing:-.03em; margin:0; line-height:1.05}
  .title small{display:block; font-size:clamp(12px,2.4vw,15px); font-weight:700; opacity:.6; margin-top:6px; letter-spacing:0}
  .card{
    width:min(560px,100%); background:rgba(255,252,244,.82);
    border:1px solid rgba(47,42,51,.12); border-radius:18px; padding:16px 18px;
    box-shadow:0 6px 22px rgba(90,70,40,.13);
  }
  .row{display:flex; align-items:center; gap:10px; margin:0 0 12px}
  .row:last-child{margin-bottom:0}
  .row > b{font-size:13px; font-weight:800; width:58px; flex:none; opacity:.72}
  .seg{display:flex; gap:6px; flex-wrap:wrap; flex:1}
  .seg button{
    flex:1; min-width:74px; border:1.5px solid rgba(47,42,51,.16); background:#fffdf7;
    border-radius:11px; padding:9px 6px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:inherit; color:var(--ink); transition:.12s;
  }
  .seg button small{display:block; font-size:10.5px; font-weight:600; opacity:.55; margin-top:2px}
  .seg button[aria-pressed="true"]{background:var(--ink); color:#fff6e2; border-color:var(--ink)}
  .seg button[disabled]{opacity:.34; cursor:not-allowed}
  .go{
    border:0; border-radius:16px; padding:17px 46px; cursor:pointer; font-family:inherit;
    background:var(--red); color:#fff6e2; font-size:19px; font-weight:900; letter-spacing:-.02em;
    box-shadow:0 5px 0 #a83f39, 0 10px 22px rgba(168,63,57,.3);
  }
  .go:active{transform:translateY(3px); box-shadow:0 2px 0 #a83f39}
  .hint{font-size:12.5px; line-height:1.65; opacity:.66; text-align:center; max-width:520px; margin:0}
  .hint b{color:var(--red)}

  /* ---------- 결과 ---------- */
  #stars{font-size:46px; letter-spacing:6px; line-height:1}
  #rankName{font-size:clamp(22px,4.6vw,32px); font-weight:900; letter-spacing:-.02em}
  #accVal{font-size:clamp(38px,8vw,58px); font-weight:900; line-height:1; font-variant-numeric:tabular-nums}
  .tally{display:flex; gap:8px; width:min(460px,100%)}
  .tally div{
    flex:1; text-align:center; background:rgba(255,252,244,.82); border-radius:12px; padding:9px 4px;
    border:1px solid rgba(47,42,51,.1);
  }
  .tally b{display:block; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums}
  .tally span{font-size:11px; opacity:.6; font-weight:700}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .ghost{
    border:1.5px solid rgba(47,42,51,.22); background:transparent; color:var(--ink);
    border-radius:14px; padding:14px 26px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  #rotate{
    position:absolute; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom,0px));
    text-align:center; font-size:12px; font-weight:700; color:#6b5a42; pointer-events:none;
  }
</style>

<div id="app">
  <canvas id="stage"></canvas>

  <div id="hud" hidden>
    <div class="box" id="songName">삼채 <span id="lvName">기본형</span></div>
    <div id="gwrap">
      <div id="gbar"><i id="gfill"></i></div>
      <div id="gstage">혼자서</div>
    </div>
    <div class="box" id="scoreBox">
      <div id="scoreVal">0</div>
      <div id="comboVal">0 연속</div>
    </div>
    <button id="quit">그만</button>
  </div>

  <div id="chuim"></div>
  <div id="rotate" hidden>가로로 돌려서 하면 더 잘 보여요</div>

  <!-- ================= 시작 ================= -->
  <section id="start" class="screen">
    <h1 class="title">우리 장단<small>삼도농악가락 · 1단계 시험판</small></h1>

    <div class="card">
      <div class="row">
        <b>악기</b>
        <div class="seg" id="segInst">
          <button aria-pressed="true">장구<small>궁편·채편</small></button>
          <button disabled>꽹과리<small>준비 중</small></button>
          <button disabled>북<small>준비 중</small></button>
          <button disabled>징<small>준비 중</small></button>
        </div>
      </div>
      <div class="row">
        <b>가락</b>
        <div class="seg" id="segLv">
          <button data-v="basic" aria-pressed="true">기본형<small>박만 치기 · 4번</small></button>
          <button data-v="full">원형<small>삼채 가락 · 7번</small></button>
        </div>
      </div>
      <div class="row">
        <b>빠르기</b>
        <div class="seg" id="segBpm">
          <button data-v="90" aria-pressed="true">느리게</button>
          <button data-v="120">보통</button>
          <button data-v="150">빠르게</button>
        </div>
      </div>
      <div class="row">
        <b>도움</b>
        <div class="seg" id="segAid">
          <button data-v="guem" aria-pressed="true">구음 보기<small>노트에 글자</small></button>
          <button data-v="demo">시범 듣기<small>장구도 저절로</small></button>
        </div>
      </div>
    </div>

    <button class="go" id="btnStart">시작하기</button>

    <p class="hint">
      화면 <b>왼쪽</b>을 치면 궁편(<b>쿵</b>), <b>오른쪽</b>을 치면 채편(<b>따</b>),
      <b>양쪽을 동시에</b> 치면 <b>덩</b>이에요.<br>
      컴퓨터에서는 <b>F</b>·<b>J</b> 키, 동시는 <b>스페이스</b>.
    </p>
  </section>

  <!-- ================= 결과 ================= -->
  <section id="result" class="screen" hidden>
    <div id="stars">★★★</div>
    <div id="rankName">상쇠</div>
    <div id="accVal">0%</div>
    <div class="tally">
      <div><b id="tP">0</b><span>정확</span></div>
      <div><b id="tG">0</b><span>좋아요</span></div>
      <div><b id="tW">0</b><span>다른 손</span></div>
      <div><b id="tM">0</b><span>놓침</span></div>
      <div><b id="tC">0</b><span>최고 연속</span></div>
    </div>
    <p class="hint" id="advice"></p>
    <div class="btnrow">
      <button class="go" id="btnAgain">한 번 더</button>
      <button class="ghost" id="btnHome">처음으로</button>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ===================================================================
   장단 데이터 — 최소 단위는 '소박'이다.
   삼채는 3소박 4박 = 한 장단 12소박. 숫자는 장단 안의 소박 자리.
   ※ 가락은 통용되는 기본형이며 강사님 자료로 검증 후 확정한다.
   =================================================================== */
const PATTERN = {
  id:'samchae', name:'삼채', sub:'덩덕궁이', beats:4, subdiv:3,
  janggu:{
    basic:{ name:'기본형', notes:[['덩',0],['쿵',3],['덩',6],['쿵',9]] },
    full :{ name:'원형',   notes:[['덩',0],['쿵',3],['따',5],['쿵',6],['따',8],['덩',9],['따',11]] }
  },
  jing:[['징',0]],
  buk :[['둥',0],['둥',3],['둥',6],['둥',9]],
  // 쇠가락은 열린 소리(갱)와 막은 소리(깩)가 번갈아 난다
  kkwa:[['갱',0],['깩',2],['갱',3],['깩',5],['갱',6],['깩',8],['갱',9],['깩',11]]
};

const OBANG = ['#4a7ba7','#d4564f','#e8b23a','#f6efe2','#5c8d64'];
const CHUIM = ['얼쑤!','좋다!','잘한다!','그렇지!','으이!'];
const RANKS = [
  [0 ,'장구잡이 새내기'],
  [55,'마당쟁이'],
  [72,'소리꾼'],
  [86,'상쇠 후보'],
  [95,'상 쇠']
];

/* =============================== 오디오 ===============================
   악기를 사인파 하나로 흉내내지 않고, 실제 울림통처럼
   여러 고유진동(모드)을 각각 다른 세기·길이로 울린다.
   - 가죽(장구·북): 원형 막의 모드비 1 : 1.59 : 2.13 : 2.92 + 때리는 순간의
     음 높이가 살짝 떨어지는 성질(bend)
   - 쇠(꽹과리·징): 배음이 어긋난 금속 모드 + 맥놀이(beat).
     징은 친 뒤에 소리가 서서히 부풀어 오르는데(swell) 이게 징의 표식이다.
   - 마당 잔향을 얹어 네 악기가 한 자리에서 나는 것처럼 묶는다.
   나중에 학교 악기를 녹음하면 INST 표의 함수만 파일 재생으로 바꾸면 된다.
   ==================================================================== */
let ctx=null, master=null, conv=null, wet=null, nBuf=null;
let gJang=null, gBuk=null, gKkwa=null, gJing=null;

function audioInit(){
  if(ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({latencyHint:'interactive'});
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-6; comp.knee.value=18; comp.ratio.value=3.5; comp.attack.value=.004; comp.release.value=.2;
  master = ctx.createGain(); master.gain.value=.58;
  master.connect(comp); comp.connect(ctx.destination);
  // 마당 잔향
  conv = ctx.createConvolver(); conv.buffer = makeIR(1.35, 2.6);
  wet  = ctx.createGain(); wet.gain.value = .34;
  conv.connect(wet); wet.connect(master);
  const bus = v => { const g=ctx.createGain(); g.gain.value=v; g.connect(master); g.connect(conv); return g; };
  gJang = bus(1);  gJing = bus(.8);  gBuk = bus(0);  gKkwa = bus(0);
}
function makeIR(dur, decay){
  const rate=ctx.sampleRate, len=Math.max(1,Math.floor(rate*dur));
  const b=ctx.createBuffer(2,len,rate);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c);
    for(let i=0;i<len;i++){
      const x=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-x,decay)*.6;
    }
    [[.009,.55],[.017,-.42],[.029,.33],[.044,-.24],[.067,.18]].forEach(([tt,a],k)=>{
      const i=Math.floor(tt*rate*(1+c*.13)); if(i<len) d[i]+=a;
    });
  }
  return b;
}
function noise(){
  if(!nBuf){
    const n = Math.floor(ctx.sampleRate*.5);
    nBuf = ctx.createBuffer(1,n,ctx.sampleRate);
    const d = nBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  }
  return nBuf;
}
/* 고유진동 뱅크 — list: [배수, 세기, 길이(초), 부풀어 오르는 시간?] */
function modes(bus,t,f0,list,g0,opt){
  opt = opt || {};
  const det = 1 + (Math.random()-.5)*.018;       // 칠 때마다 조금씩 다르게
  for(const m of list){
    const f = f0*m[0]*det, dec = m[2];
    const o = ctx.createOscillator(); o.type='sine';
    if(opt.bend){
      o.frequency.setValueAtTime(f*opt.bend, t);
      o.frequency.exponentialRampToValueAtTime(f, t+(opt.bendT||.05));
    } else o.frequency.setValueAtTime(f, t);
    const g = ctx.createGain();
    const peak = Math.max(1e-4, g0*m[1]);
    const sw = m[3] || .004;
    g.gain.setValueAtTime(1e-4, t);
    g.gain.exponentialRampToValueAtTime(peak, t+sw);
    g.gain.exponentialRampToValueAtTime(1e-4, t+dec);
    if(opt.beat){                                  // 금속의 맥놀이
      const l=ctx.createOscillator(); l.type='sine';
      l.frequency.value = opt.beat*(.6+Math.random()*.9);
      const lg=ctx.createGain(); lg.gain.value = peak*.4;
      l.connect(lg); lg.connect(g.gain); l.start(t); l.stop(t+dec+.05);
    }
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dec+.05);
  }
}
/* 때리는 순간의 소리 — 채가 닿는 딱 소리, 가죽 쓸리는 소리 */
function strike(bus,t,g0,dur,freq,q,type){
  const s=ctx.createBufferSource(); s.buffer=noise();
  s.playbackRate.value = .7+Math.random()*.6;
  const f=ctx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=ctx.createGain();
  g.gain.setValueAtTime(1e-4,t);
  g.gain.exponentialRampToValueAtTime(Math.max(1e-4,g0),t+.0015);
  g.gain.exponentialRampToValueAtTime(1e-4,t+dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(t); s.stop(t+dur+.03);
}
const rnd = a => 1 + (Math.random()-.5)*a;

/* 악기는 모두 이 표 하나를 거친다 — 학교 악기 녹음으로 바꿀 자리 */
const INST = {
  // 장구 궁편 — 손으로 치는 낮고 둥근 가죽
  '쿵': (t,v)=>{
    v*=rnd(.12);
    modes(gJang,t,94,[[1,1,.46],[1.59,.40,.30],[2.13,.20,.19],[2.92,.09,.12]],.62*v,{bend:1.22,bendT:.05});
    strike(gJang,t,.30*v,.055,620,.7,'lowpass');
  },
  // 장구 채편 — 대나무 열채로 때리는 얇고 날카로운 가죽
  '따': (t,v)=>{
    v*=rnd(.14);
    modes(gJang,t,615,[[1,1,.135],[1.59,.52,.09],[2.13,.30,.062],[2.92,.16,.042],[3.50,.09,.028]],.30*v,{bend:1.10,bendT:.012});
    strike(gJang,t,.50*v,.013,5400,.8);       // 채가 닿는 딱 소리
    strike(gJang,t,.16*v,.045,1500,3);        // 통 울림
  },
  '덩': (t,v)=>{ INST['쿵'](t,v); INST['따'](t,v*.88); },
  // 북 — 깊고 나무통 울림이 긴 가죽
  '둥': (t,v)=>{
    v*=rnd(.12);
    modes(gBuk,t,107,[[1,1,.62],[1.59,.36,.40],[2.13,.17,.26],[2.92,.07,.16]],.60*v,{bend:1.17,bendT:.06});
    strike(gBuk,t,.26*v,.07,900,.8,'lowpass');
  },
  // 꽹과리 열린 소리 — 놋쇠의 어긋난 배음과 쨍한 맥놀이
  '갱': (t,v)=>{
    v*=rnd(.14);
    modes(gKkwa,t,726,[
      [1,1,.58],[1.49,.72,.50],[2.07,.55,.40],[2.61,.42,.32,.012],
      [3.28,.30,.24,.018],[4.13,.22,.17,.022],[5.02,.15,.12,.026],[6.35,.09,.08,.03]
    ],.15*v,{beat:5.5});
    strike(gKkwa,t,.34*v,.05,4200,.7);
  },
  // 꽹과리 막은 소리 — 손으로 눌러 짧게 끊는다
  '깩': (t,v)=>{
    v*=rnd(.14);
    modes(gKkwa,t,742,[[1,1,.085],[1.49,.68,.07],[2.07,.5,.055],[3.28,.28,.038],[4.13,.18,.028]],.13*v,{beat:7});
    strike(gKkwa,t,.30*v,.028,4600,.7);
  },
  // 징 — 낮고 길며, 친 뒤에 소리가 서서히 부풀어 오른다
  '징': (t,v)=>{
    v*=rnd(.1);
    modes(gJing,t,97,[
      [1,1,4.2,.05],[1.44,.62,3.6,.10],[1.98,.45,3.0,.18],[2.48,.34,2.5,.28],
      [3.12,.26,2.0,.40],[3.90,.19,1.6,.52],[4.85,.13,1.25,.62],[6.10,.08,.95,.70]
    ],.24*v,{beat:2.1});
    strike(gJing,t,.22*v,.42,620,.5,'lowpass');   // 솜방망이라 부드럽다
  }
};
function play(name,t,v){ try{ INST[name] && INST[name](t, v==null?1:v); }catch(e){} }
function flourish(t){
  ['갱','깩','갱'].forEach((n,i)=>play(n, t+i*.08, .55-i*.12));
  play('징', t, .5);
}

/* =============================== 상태 =============================== */
const S = {
  bpm:90, level:'basic', showGuem:true, demo:false,
  running:false, finished:false,
  notes:[], cycleIdx:0, nextCycleT:0, firstCycleT:0, endT:0,
  beatDur:0, subDur:0, cycleDur:0, perfectWin:0, goodWin:0, approachT:1.6,
  score:0, combo:0, maxCombo:0,
  cnt:{perfect:0, good:0, wrong:0, miss:0, stray:0},
  heung:20, hstage:0,
  pops:[], parts:[], flash:{쿵:0,따:0},
  chuimAt:0, lastT:0, blast:0
};
const COUNTIN = 2, PLAY = 16;

/* =============================== 화면 =============================== */
const cv = document.getElementById('stage');
let g = cv.getContext('2d');
const gMain = g;
function withCtx(c, fn){ const o=g; g=c; try{ fn(); } finally { g=o; } }
let bgC=null, bgKey='';
let W=0,H=0, hitY=0, trackTop=0, laneW=0, lxL=0, lxR=0, gap=0, ringC={x:0,y:0,r:0}, groundY=0;

function layout(){
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);

  trackTop = Math.max(72, H*0.135);
  hitY     = H*0.735;
  gap      = Math.max(9, W*0.013);
  laneW    = Math.max(66, Math.min(W*0.205, 196));
  lxL      = W/2 - (laneW+gap)/2;
  lxR      = W/2 + (laneW+gap)/2;
  groundY  = H*0.605;
  const rr = Math.min(50, W*0.058, H*0.095);
  ringC = { x: Math.max(rr+20, W*0.10), y: trackTop + rr + 18, r: rr };
  bgKey=''; for(const k in figCache) delete figCache[k];
  document.getElementById('rotate').hidden = !(H > W*1.05 && S.running);
}
window.addEventListener('resize', layout);
if(window.visualViewport) window.visualViewport.addEventListener('resize', layout);

/* =============================== 장단 생성 =============================== */
function genCycle(){
  const start = S.nextCycleT, ci = S.cycleIdx, sd = S.subDur;
  // 반주 — 항상 생성 (볼륨은 신명이 정한다)
  for(const arr of [PATTERN.jing, PATTERN.buk, PATTERN.kkwa])
    for(const [nm,p] of arr) S.notes.push({t:start+p*sd, part:'acc', name:nm});
  // 장구 — 준비 장단(count-in) 뒤부터
  if(ci >= COUNTIN){
    for(const [nm,p] of PATTERN.janggu[S.level].notes){
      S.notes.push({t:start+p*sd, part:'jang', name:nm, pos:p, judged:false, res:null, sched:false});
    }
  }
  S.cycleIdx++;
  S.nextCycleT = start + S.cycleDur;
}
function scheduler(){
  if(!S.running || !ctx) return;
  const now = ctx.currentTime;
  while(S.cycleIdx < COUNTIN+PLAY && S.nextCycleT < now + 2.6) genCycle();
  for(const n of S.notes){
    if(n.sched || n.t > now + 0.12) continue;
    n.sched = true;
    if(n.part === 'acc') play(n.name, Math.max(n.t, now));
    else if(S.demo)      play(n.name, Math.max(n.t, now), .8);
  }
  if(now > S.endT) finish();
}

/* =============================== 판정 =============================== */
let pending=[], flushTimer=null;
const COALESCE = .045;

function tap(zone){                       // zone: '쿵' | '따'
  if(!S.running || !ctx) return;
  const t = ctx.currentTime;
  play(zone, t);                          // 소리는 즉시 — 손맛이 먼저다
  S.flash[zone] = t;
  pending.push({zone,t});
  if(!flushTimer) flushTimer = setTimeout(flush, COALESCE*1000);
}
function flush(){
  flushTimer = null;
  const taps = pending; pending = [];
  if(!taps.length) return;
  const both = taps.some(x=>x.zone==='쿵') && taps.some(x=>x.zone==='따');
  const t = taps.reduce((a,b)=>a+b.t,0)/taps.length;
  judge(both ? '덩' : taps[0].zone, t);
}
function judge(kind, t){
  let best=null, bd=Infinity;
  for(const n of S.notes){
    if(n.part!=='jang' || n.judged) continue;
    const d = Math.abs(n.t - t);
    if(d < bd){ bd = d; best = n; }
  }
  if(!best || bd > S.goodWin){ S.cnt.stray++; S.heung = Math.max(0, S.heung-1.5); return; }
  best.judged = true;
  const ok = (best.name === kind);
  let res;
  if(ok && bd <= S.perfectWin) res = 'perfect';
  else if(ok)                  res = 'good';
  else                         res = 'wrong';
  best.res = res;
  if(res === 'perfect'){
    S.cnt.perfect++; S.combo++;
    S.score += Math.round(100 * (S.hstage>=4?2:1));
    S.heung = Math.min(100, S.heung + 2.4);
    pop('정확', '#e8b23a', 1.12);
    burst(7, laneX(best.name), hitY);
  } else if(res === 'good'){
    S.cnt.good++; S.combo++;
    S.score += Math.round(50 * (S.hstage>=4?2:1));
    S.heung = Math.min(100, S.heung + 1.1);
    pop('좋아요', '#5c8d64', .98);
  } else {
    S.cnt.wrong++;
    S.score += 20;
    S.heung = Math.min(100, S.heung + .4);
    pop(best.name+' 자리예요', '#4a7ba7', .8);
  }
  if(S.combo > S.maxCombo) S.maxCombo = S.combo;
  if(S.combo>0 && S.combo % 8 === 0) chuimsae();
}
function onMiss(n){
  S.cnt.miss++; S.combo = 0;
  S.heung = Math.max(0, S.heung - 6);
  pop('놓쳤어요', 'rgba(47,42,51,.5)', .82);
}
function pop(text, color, scale){
  S.pops = [{text, color, scale, born: ctx ? ctx.currentTime : 0}];
}
function chuimsae(){
  const el = document.getElementById('chuim');
  el.textContent = CHUIM[(Math.random()*CHUIM.length)|0];
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  if(ctx) flourish(ctx.currentTime);
  burst(22, W/2, hitY-40);
}
function burst(n, x, y){
  for(let i=0;i<n;i++) S.parts.push({
    x, y, vx:(Math.random()-.5)*300, vy:-Math.random()*340-70,
    r:Math.random()*6.28, vr:(Math.random()-.5)*9,
    c:OBANG[(Math.random()*OBANG.length)|0], life:1, sz:5+Math.random()*7
  });
}
function laneX(name){ return name==='쿵' ? lxL : (name==='따' ? lxR : W/2); }

/* =============================== 신명 =============================== */
function heungStage(v){
  if(v>=95) return 4; if(v>=75) return 3; if(v>=50) return 2; if(v>=25) return 1; return 0;
}
const STAGE_NAME = ['혼자서','북이 왔다','쇠가 왔다','마을 사람들이 모였다','신 명 폭 발 !'];
function applyStage(){
  const st = heungStage(S.heung);
  if(st === S.hstage) return;
  if(st > S.hstage && st>=1) S.blast = 1;
  S.hstage = st;
  if(ctx){
    const now = ctx.currentTime;
    gBuk .gain.setTargetAtTime(st>=1 ? .85 : 0, now, .12);
    gKkwa.gain.setTargetAtTime(st>=2 ? .70 : 0, now, .12);
    gJing.gain.setTargetAtTime(st>=4 ? 1.0 : .9, now, .2);
  }
  document.getElementById('gstage').textContent = STAGE_NAME[st];
}

/* =============================== 그리기 =============================== */
function ensureBG(blast){
  const key = Math.round(W)+'x'+Math.round(H)+':'+(blast?1:0);
  if(bgKey===key && bgC) return;
  bgKey = key;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  bgC = document.createElement('canvas');
  bgC.width = Math.max(1,Math.round(W*dpr)); bgC.height = Math.max(1,Math.round(H*dpr));
  const b = bgC.getContext('2d');
  b.setTransform(dpr,0,0,dpr,0,0);
  withCtx(b, ()=>{ paintScenery(blast); paintPanel(); });
}
function draw(now){
  g.clearRect(0,0,W,H);
  ensureBG(S.hstage>=4);
  g.drawImage(bgC, 0, 0, W, H);
  drawMadang(now);
  drawTrack(now);
  drawNotes(now);
  drawJanggu(now);
  drawRing(now);
  drawPops(now);
  drawParts();
  drawCountIn(now);
}

/* 배경 — 화면 크기나 신명 단계가 바뀔 때만 다시 그린다 */
function paintScenery(blast){
  const sky = g.createLinearGradient(0,0,0,groundY);
  if(blast){ sky.addColorStop(0,'#fff6df'); sky.addColorStop(1,'#f8dfa8'); }
  else     { sky.addColorStop(0,'#fbf1da'); sky.addColorStop(1,'#f1ddb8'); }
  g.fillStyle = sky; g.fillRect(0,0,W,groundY);
  g.fillStyle = blast ? 'rgba(150,170,140,.45)' : 'rgba(150,165,145,.34)';
  hill(W*0.18, groundY+6, W*0.30, H*0.15);
  hill(W*0.84, groundY+6, W*0.34, H*0.18);
  g.fillStyle = blast ? 'rgba(126,148,120,.42)' : 'rgba(128,145,125,.28)';
  hill(W*0.48, groundY+6, W*0.42, H*0.11);
  const gr = g.createLinearGradient(0,groundY,0,H);
  gr.addColorStop(0,'#c9a173'); gr.addColorStop(1,'#a87f52');
  g.fillStyle = gr; g.fillRect(0,groundY,W,H-groundY);
  g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(0,groundY-2,W,3);
  if(blast){
    const rad = g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.6);
    rad.addColorStop(0,'rgba(232,178,58,.20)'); rad.addColorStop(1,'rgba(232,178,58,0)');
    g.fillStyle = rad; g.fillRect(0,0,W,H);
  }
}
function paintPanel(){
  const x0 = lxL-laneW/2-10, wTot = (lxR+laneW/2+10)-x0, bot = hitY+30;
  g.save();
  g.fillStyle='rgba(43,37,45,.82)';
  g.shadowColor='rgba(60,40,20,.35)'; g.shadowBlur=22; g.shadowOffsetY=6;
  roundRect(x0, trackTop-10, wTot, bot-trackTop+10, 18); g.fill();
  g.restore();
  g.fillStyle='rgba(255,255,255,.05)';
  roundRect(lxL-laneW/2, trackTop, laneW, bot-trackTop-8, 11); g.fill();
  roundRect(lxR-laneW/2, trackTop, laneW, bot-trackTop-8, 11); g.fill();
}
function drawMadang(now){
  const blast = S.hstage>=4;
  const beat = S.running ? beatPhase(now) : ((now*.8)%1);
  const bob  = Math.max(0, Math.sin(beat*Math.PI))*6;
  const sc   = Math.min(1.25, W/760);

  // 농기
  banner(W*0.030, groundY, sc, '#d4564f', bob*.35);
  banner(W*0.972, groundY, sc, '#4a7ba7', bob*.3);

  // 관객
  if(S.hstage>=3){
    g.save();
    for(let i=0;i<16;i++){
      const x = W*0.04 + (i/15)*W*0.92;
      if(Math.abs(x-W/2) < laneW*1.6) continue;
      const y = groundY - 2 - (i%3)*8;
      g.globalAlpha = .72;
      const b = (i%2 ? bob*.5 : bob*.2);
      const AC=['#4a7ba7','#d4564f','#e8b23a','#5c8d64','#8a6bab'];
      g.fillStyle = AC[i%AC.length];
      g.beginPath(); g.moveTo(x-7,y-10-b); g.quadraticCurveTo(x,y-26-b,x+7,y-10-b); g.closePath(); g.fill();
      g.fillStyle = '#d9b48a';
      g.beginPath(); g.arc(x, y-28-b, 5.5, 0, 6.2832); g.fill();
      g.fillStyle = '#3a3029';
      g.beginPath(); g.arc(x, y-29.5-b, 5.5, Math.PI*1.05, Math.PI*1.95); g.fill();
      if(S.hstage>=4){                        // 손뼉
        g.strokeStyle='rgba(90,64,38,.5)'; g.lineWidth=2.5; g.lineCap='round';
        const w = Math.sin(performance.now()/110 + i)*4;
        g.beginPath(); g.moveTo(x-8,y-22-b); g.lineTo(x-11,y-30-b-w); g.stroke();
        g.beginPath(); g.moveTo(x+8,y-22-b); g.lineTo(x+11,y-30-b+w); g.stroke();
      }
    }
    g.restore();
  }

  // 풍물패 — 신명이 오르면 하나씩 들어온다
  band(W*0.105, groundY, sc, '징', '#4a7ba7', true,  bob);
  if(S.hstage>=1) band(W*0.235, groundY, sc, '북', '#5c8d64', true, bob*.8);
  if(S.hstage>=2) band(W*0.760, groundY, sc, '쇠', '#d4564f', false, bob);
  band(W*0.900, groundY, sc, '장', '#e8b23a', false, bob*.8);
}
function hill(cx, by, w, h){
  g.beginPath(); g.moveTo(cx-w/2, by);
  g.quadraticCurveTo(cx, by-h*2.0, cx+w/2, by);
  g.closePath(); g.fill();
}
function banner(x, gy, sc, color, bob){
  const s = 62*sc, y = gy - bob;
  g.save(); g.translate(x,y);
  g.strokeStyle='#6b4a2e'; g.lineWidth=Math.max(2,s*.055); g.lineCap='round';
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-s*2.1); g.stroke();
  g.fillStyle=color;
  const sw = Math.sin(performance.now()/620)*s*.06;
  g.beginPath();
  g.moveTo(0,-s*2.05); g.lineTo(s*.62+sw,-s*1.92);
  g.lineTo(s*.62+sw,-s*1.18); g.lineTo(0,-s*1.30);
  g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.55)';
  g.fillRect(s*.10, -s*1.80, s*.42, s*.07);
  g.fillRect(s*.10, -s*1.58, s*.42, s*.07);
  g.fillStyle='#e8b23a';
  g.beginPath(); g.arc(0,-s*2.16,s*.11,0,6.2832); g.fill();
  g.restore();
}

/* 풍물패 — 사람 그림은 한 번만 그려 두고 매 프레임 가져다 쓴다 */
const figCache = {};
function band(x, gy, sc, kind, accent, faceR, bob){
  const s = 82*sc, blast = S.hstage>=4;
  const sway = Math.sin(performance.now()/420 + x*.03)*s*.022;
  g.fillStyle='rgba(88,62,36,.20)';
  g.beginPath(); g.ellipse(x, gy+2, s*.26, s*.05, 0,0,6.2832); g.fill();

  const key = kind+'|'+accent+'|'+(faceR?1:0)+'|'+Math.round(s);
  let c = figCache[key];
  if(!c){
    const w = Math.ceil(s*2.0), h = Math.ceil(s*1.95);
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    c = document.createElement('canvas');
    c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    c._w=w; c._h=h; c._ox=w/2; c._oy=h-s*.14;
    const b = c.getContext('2d');
    b.setTransform(dpr,0,0,dpr,0,0);
    b.translate(c._ox, c._oy);
    withCtx(b, ()=>paintPlayer(s, kind, accent, faceR));
    figCache[key] = c;
  }
  g.save();
  g.translate(Math.round(x+sway), Math.round(gy - bob*.55));
  g.drawImage(c, -c._ox, -c._oy, c._w, c._h);
  if(kind==='쇠'){                                   // 상모 띠는 계속 돈다
    const a = (performance.now()/(blast?85:260))%6.2832;
    g.strokeStyle = 'rgba(250,245,232,'+(blast?.95:.5)+')';
    g.lineWidth = Math.max(1.3, s*.026); g.lineCap='round';
    g.beginPath();
    for(let i=0;i<20;i++){
      const th=a+i*.44, rr=s*.045+i*s*.0125;
      const px=Math.cos(th)*rr, py=-s*1.46-Math.sin(th)*rr*.30;
      i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.stroke();
  }
  g.restore();
}

function paintPlayer(s, kind, accent, faceR){
  const SKIN='#e7c49c', WHITE='#faf5ea', DARK='#3b3029';
  g.save();
  g.scale(faceR?1:-1, 1);

  // 짚신
  g.fillStyle=DARK;
  g.beginPath(); g.ellipse(-s*.135,-s*.035,s*.075,s*.035,0,0,6.2832); g.fill();
  g.beginPath(); g.ellipse( s*.135,-s*.035,s*.075,s*.035,0,0,6.2832); g.fill();
  // 바지
  g.strokeStyle=WHITE; g.lineWidth=s*.125; g.lineCap='round'; g.lineJoin='round';
  g.beginPath();
  g.moveTo(-s*.065,-s*.60); g.lineTo(-s*.135,-s*.11);
  g.moveTo( s*.065,-s*.60); g.lineTo( s*.135,-s*.11);
  g.stroke();
  // 대님
  g.strokeStyle=DARK; g.lineWidth=s*.030;
  g.beginPath();
  g.moveTo(-s*.20,-s*.125); g.lineTo(-s*.07,-s*.125);
  g.moveTo( s*.07,-s*.125); g.lineTo( s*.20,-s*.125);
  g.stroke();

  // 저고리
  const torso = () => {
    g.beginPath();
    g.moveTo(-s*.225,-s*.97);
    g.quadraticCurveTo(-s*.255,-s*.74,-s*.205,-s*.60);
    g.lineTo(s*.205,-s*.60);
    g.quadraticCurveTo(s*.255,-s*.74,s*.225,-s*.97);
    g.quadraticCurveTo(0,-s*1.05,-s*.225,-s*.97);
    g.closePath();
  };
  g.fillStyle=WHITE; torso(); g.fill();
  // 삼색띠
  g.save(); torso(); g.clip();
  g.translate(-s*.02,-s*.80); g.rotate(-.66);
  ['#d4564f','#4a7ba7','#e8b23a'].forEach((c,i)=>{
    g.fillStyle=c; g.fillRect(-s*.085+i*s*.056, -s*.62, s*.053, s*1.24);
  });
  g.restore();
  // 깃 · 고름
  g.fillStyle=accent;
  g.beginPath();
  g.moveTo(-s*.085,-s*1.01); g.lineTo(0,-s*.88); g.lineTo(s*.085,-s*1.01);
  g.lineTo(s*.055,-s*1.03); g.lineTo(0,-s*.94); g.lineTo(-s*.055,-s*1.03);
  g.closePath(); g.fill();
  // 허리띠
  g.fillStyle=accent; roundRect(-s*.19,-s*.66,s*.38,s*.05,s*.02); g.fill();

  // 팔
  g.strokeStyle=WHITE; g.lineWidth=s*.098; g.lineCap='round';
  g.beginPath();
  g.moveTo(-s*.195,-s*.92); g.lineTo(-s*.32,-s*.70);
  g.moveTo( s*.195,-s*.92); g.lineTo( s*.34,-s*.80);
  g.stroke();

  // 목 · 머리
  g.fillStyle=SKIN;
  g.fillRect(-s*.042,-s*1.07,s*.084,s*.085);
  g.beginPath(); g.arc(0,-s*1.185,s*.125,0,6.2832); g.fill();
  g.fillStyle='#2f2620';
  g.beginPath(); g.arc(0,-s*1.185,s*.127,Math.PI*1.04,Math.PI*1.96); g.fill();
  g.fillStyle='#3b3029';
  g.beginPath(); g.arc(-s*.045,-s*1.185,s*.014,0,6.2832); g.fill();
  g.beginPath(); g.arc( s*.045,-s*1.185,s*.014,0,6.2832); g.fill();

  // 머리쓰개
  if(kind==='쇠'){
    g.fillStyle='#3a3038';
    g.beginPath(); g.ellipse(0,-s*1.295,s*.205,s*.052,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse(0,-s*1.355,s*.122,s*.082,0,0,6.2832); g.fill();
    g.fillStyle=accent;
    g.beginPath(); g.arc(0,-s*1.425,s*.032,0,6.2832); g.fill();
  } else {
    g.fillStyle='#fbf7ee';
    g.beginPath();
    g.moveTo(0,-s*1.60);
    g.lineTo(-s*.185,-s*1.235);
    g.quadraticCurveTo(0,-s*1.295,s*.185,-s*1.235);
    g.closePath(); g.fill();
    g.strokeStyle='rgba(120,96,64,.28)'; g.lineWidth=Math.max(1,s*.011); g.stroke();
    [[-.095,-1.285,'#d4564f'],[.072,-1.335,'#4a7ba7'],[-.022,-1.455,'#e8b23a']].forEach(([fx,fy,c])=>{
      g.fillStyle=c;
      for(let k=0;k<5;k++){
        const a=k*1.2566;
        g.beginPath(); g.arc(fx*s+Math.cos(a)*s*.026, fy*s+Math.sin(a)*s*.026, s*.025, 0, 6.2832); g.fill();
      }
      g.fillStyle='#fff6d8';
      g.beginPath(); g.arc(fx*s, fy*s, s*.017, 0, 6.2832); g.fill();
    });
  }

  // 악기
  if(kind==='징' || kind==='쇠'){
    const r = kind==='징' ? s*.30 : s*.165;
    const hx = -s*.44, hy = -s*.70;
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.2,s*.018);
    g.beginPath(); g.moveTo(-s*.32,-s*.70); g.lineTo(hx, hy-r*.55); g.stroke();
    const br=g.createRadialGradient(hx-r*.3,hy-r*.3,r*.1,hx,hy,r);
    br.addColorStop(0,'#f0d68f'); br.addColorStop(.55,'#d9b05c'); br.addColorStop(1,'#a8813a');
    g.fillStyle=br; g.beginPath(); g.arc(hx,hy,r,0,6.2832); g.fill();
    g.strokeStyle='#8d6a2c'; g.lineWidth=Math.max(1.2,s*.02);
    g.beginPath(); g.arc(hx,hy,r,0,6.2832); g.stroke();
    g.fillStyle='rgba(126,92,30,.30)';
    g.beginPath(); g.arc(hx,hy,r*.40,0,6.2832); g.fill();
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.4,s*.024); g.lineCap='round';
    g.beginPath(); g.moveTo(s*.34,-s*.80); g.lineTo(s*.14,-s*.72); g.stroke();
    if(kind==='징'){ g.fillStyle='#e8ddc6'; g.beginPath(); g.arc(s*.13,-s*.715,s*.055,0,6.2832); g.fill(); }
  } else if(kind==='북'){
    const bw=s*.21, bh=s*.17;
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.2,s*.016);
    g.beginPath(); g.moveTo(-s*.18,-s*.95); g.lineTo(0,-s*.80); g.lineTo(s*.18,-s*.95); g.stroke();
    const bg2=g.createLinearGradient(0,-s*.80-bh,0,-s*.80+bh);
    bg2.addColorStop(0,'#c07a48'); bg2.addColorStop(1,'#8f5029');
    g.fillStyle=bg2;
    g.beginPath(); g.ellipse(0,-s*.80,bw,bh,0,0,6.2832); g.fill();
    g.fillStyle='#f2e6cd';
    g.beginPath(); g.ellipse(-bw*.88,-s*.80,bw*.16,bh*.94,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse( bw*.88,-s*.80,bw*.16,bh*.94,0,0,6.2832); g.fill();
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.4,s*.024); g.lineCap='round';
    g.beginPath(); g.moveTo(s*.34,-s*.80); g.lineTo(s*.16,-s*.86); g.stroke();
  } else {
    const jw=s*.26, jh=s*.105, jwaist=s*.028;
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.2,s*.016);
    g.beginPath(); g.moveTo(-s*.18,-s*.95); g.lineTo(0,-s*.78); g.lineTo(s*.18,-s*.95); g.stroke();
    g.save(); g.translate(0,-s*.78);
    const jg=g.createLinearGradient(0,-jh,0,jh);
    jg.addColorStop(0,'#c07a48'); jg.addColorStop(1,'#8f5029');
    g.fillStyle=jg;
    g.beginPath();
    g.moveTo(-jw,-jh);
    g.bezierCurveTo(-jw*.72,-jh*.92,-jw*.34,-jwaist*1.02,-jw*.09,-jwaist);
    g.lineTo(jw*.09,-jwaist);
    g.bezierCurveTo(jw*.34,-jwaist*1.02,jw*.72,-jh*.92,jw,-jh);
    g.lineTo(jw,jh);
    g.bezierCurveTo(jw*.72,jh*.92,jw*.34,jwaist*1.02,jw*.09,jwaist);
    g.lineTo(-jw*.09,jwaist);
    g.bezierCurveTo(-jw*.34,jwaist*1.02,-jw*.72,jh*.92,-jw,jh);
    g.closePath(); g.fill();
    g.strokeStyle='rgba(244,233,214,.75)'; g.lineWidth=Math.max(1,s*.011);
    [.72,.50].forEach(k=>[-1,1].forEach(sg=>{
      g.beginPath(); g.moveTo(-jw*.94, sg*jh*k); g.lineTo(jw*.94, sg*jh*k); g.stroke();
    }));
    g.fillStyle='#4a301d';
    g.beginPath(); g.ellipse(-jw,0,jw*.11,jh*1.10,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse( jw,0,jw*.11,jh*1.10,0,0,6.2832); g.fill();
    g.fillStyle='#f2e6cd';
    g.beginPath(); g.ellipse(-jw,0,jw*.07,jh*.94,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse( jw,0,jw*.07,jh*.94,0,0,6.2832); g.fill();
    g.restore();
    g.strokeStyle='#8a6a3e'; g.lineWidth=Math.max(1.3,s*.020); g.lineCap='round';
    g.beginPath(); g.moveTo(s*.34,-s*.80); g.lineTo(s*.20,-s*.78); g.stroke();
  }
  g.restore();
}

function drawTrack(now){
  const x0 = lxL-laneW/2-10, wTot = (lxR+laneW/2+10)-x0;
  // 박선
  if(S.running && S.firstCycleT){
    g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1;
    const pps = (hitY-trackTop)/S.approachT;
    let b = Math.floor((now - S.firstCycleT)/S.beatDur);
    for(let i=0;i<12;i++,b++){
      const bt = S.firstCycleT + b*S.beatDur;
      const y = hitY - (bt-now)*pps;
      if(y < trackTop+2 || y > hitY-2) continue;
      const isDown = ((b%4)+4)%4 === 0;
      g.globalAlpha = isDown ? .55 : .2;
      g.beginPath(); g.moveTo(x0+10,y); g.lineTo(x0+wTot-10,y); g.stroke();
    }
    g.globalAlpha = 1;
  }
  // 판정 자리 — 레인마다 받침
  const t = ctx ? ctx.currentTime : 0;
  [[lxL,'쿵','#4a7ba7'],[lxR,'따','#e8b23a']].forEach(([x,nm,c])=>{
    const f = Math.max(0, 1-(t-S.flash[nm])*6);
    g.fillStyle = f>0 ? c : 'rgba(255,255,255,.10)';
    g.globalAlpha = f>0 ? .25+f*.55 : 1;
    roundRect(x-laneW/2+4, hitY-21, laneW-8, 42, 12); g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = f>0 ? c : 'rgba(255,255,255,.22)';
    g.lineWidth = f>0 ? 3 : 1.5;
    roundRect(x-laneW/2+4, hitY-21, laneW-8, 42, 12); g.stroke();
  });
  // 판정선
  const pulse = S.running ? Math.max(0, 1-(now-(S.lastBeatT||0))*4.5) : 0;
  g.strokeStyle = 'rgba(232,178,58,'+(0.55+pulse*.45)+')';
  g.lineWidth = 2.5 + pulse*2.5;
  g.beginPath(); g.moveTo(x0+8,hitY); g.lineTo(x0+wTot-8,hitY); g.stroke();
}

function drawNotes(now){
  const pps = (hitY-trackTop)/S.approachT;
  const h = Math.max(27, Math.min(40, laneW*.24));
  g.textAlign='center'; g.textBaseline='middle';
  g.save();
  roundRect(lxL-laneW/2-10, trackTop-10, (lxR+laneW/2+10)-(lxL-laneW/2-10), hitY+30-trackTop+10, 18);
  g.clip();
  for(const n of S.notes){
    if(n.part!=='jang') continue;
    const dy = (n.t - now)*pps;
    const y = hitY - dy;
    if(y < trackTop-60 || y > hitY+70) continue;
    if(n.judged && n.res && n.res!=='miss' && n.t < now-.05) continue;

    const wide = n.name==='덩';
    const w = wide ? (laneW*2+gap)*.94 : laneW*.86;
    const cx = wide ? W/2 : laneX(n.name);
    const col = n.name==='덩' ? '#d4564f' : (n.name==='쿵' ? '#4a7ba7' : '#e8b23a');
    let a = 1;
    if(n.judged) a = n.res==='miss' ? .22 : .45;
    else if(y > hitY) a = Math.max(0, 1-(y-hitY)/70);

    g.save(); g.globalAlpha = a;
    g.fillStyle = col;
    if(!n.judged){ g.shadowColor = col; g.shadowBlur = 9; }
    roundRect(cx-w/2, y-h/2, w, h, h/2.6); g.fill();
    g.shadowBlur = 0;
    g.fillStyle='rgba(255,255,255,.34)';
    roundRect(cx-w/2+5, y-h/2+4, w-10, h*.30, h*.16); g.fill();
    if(S.showGuem){
      g.fillStyle = n.name==='따' ? '#3a2f22' : '#fff8ea';
      g.font = '900 '+Math.round(h*.56)+'px "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif';
      g.fillText(n.name, cx, y+1);
    }
    g.restore();
  }
  g.restore();
}

function drawJanggu(now){
  const cy = hitY + (H-hitY)*0.48;
  const s  = Math.min(W*.175, (H-hitY)*.62, 152);
  const t = ctx ? ctx.currentTime : 0;
  const fL = Math.max(0, 1-(t-S.flash['쿵'])*7);
  const fR = Math.max(0, 1-(t-S.flash['따'])*7);
  const shake = Math.max(fL,fR);
  g.save();
  g.fillStyle='rgba(90,64,38,.20)';
  g.beginPath(); g.ellipse(W/2, cy+s*.60, s*1.12, s*.09, 0, 0, 6.2832); g.fill();
  g.translate(W/2 + (fL-fR)*s*.018, cy + shake*shake*s*.02);

  // 실제 비례: 길이 66cm에 가죽면 지름 25cm, 조롱목 8cm — 꽤 길쭉하다
  const MOUTH=s*.325, WAIST=s*.105, HEAD=s*.385, HRX=s*.098, EX=s*.86;

  // ── 조임줄: 양쪽 가죽테를 팽팽히 잇는다. 허리가 잘록해 가운데가 비어 보인다
  g.strokeStyle='#e6d6b8'; g.lineWidth=Math.max(1.1,s*.013); g.lineCap='round';
  [.285,.205].forEach(k=>[-1,1].forEach(sg=>{
    g.beginPath(); g.moveTo(-EX, sg*s*k); g.lineTo(EX, sg*s*k); g.stroke();
  }));

  // ── 통: 두 개의 바가지가 잘록한 조롱목에서 만난다
  const body = g.createLinearGradient(0,-MOUTH,0,MOUTH);
  body.addColorStop(0,'#cf8b56'); body.addColorStop(.30,'#b56740');
  body.addColorStop(.72,'#96502d'); body.addColorStop(1,'#7d4021');
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(-EX,-MOUTH);
  g.bezierCurveTo(-s*.70,-MOUTH*.93, -s*.34,-WAIST*1.02, -s*.085,-WAIST);
  g.lineTo(s*.085,-WAIST);
  g.bezierCurveTo(s*.34,-WAIST*1.02, s*.70,-MOUTH*.93, EX,-MOUTH);
  g.lineTo(EX, MOUTH);
  g.bezierCurveTo(s*.70, MOUTH*.93, s*.34, WAIST*1.02, s*.085, WAIST);
  g.lineTo(-s*.085, WAIST);
  g.bezierCurveTo(-s*.34, WAIST*1.02, -s*.70, MOUTH*.93, -EX, MOUTH);
  g.closePath(); g.fill();
  // 통 입구의 테
  g.save(); g.clip();
  g.fillStyle='rgba(70,36,16,.22)';
  g.fillRect(-EX,-MOUTH,s*.055,MOUTH*2);
  g.fillRect(EX-s*.055,-MOUTH,s*.055,MOUTH*2);
  g.restore();
  // 통 위쪽에 닿는 빛 — 가장자리에만 살짝
  g.save();
  g.beginPath();
  g.moveTo(-EX,-MOUTH);
  g.bezierCurveTo(-s*.70,-MOUTH*.93, -s*.34,-WAIST*1.02, -s*.085,-WAIST);
  g.lineTo(s*.085,-WAIST);
  g.bezierCurveTo(s*.34,-WAIST*1.02, s*.70,-MOUTH*.93, EX,-MOUTH);
  g.lineTo(EX,MOUTH); g.lineTo(-EX,MOUTH); g.closePath();
  g.clip();
  g.strokeStyle='rgba(255,233,200,.30)'; g.lineWidth=Math.max(1.6,s*.026);
  g.beginPath();
  g.moveTo(-EX,-MOUTH);
  g.bezierCurveTo(-s*.70,-MOUTH*.93, -s*.34,-WAIST*1.02, -s*.085,-WAIST);
  g.lineTo(s*.085,-WAIST);
  g.bezierCurveTo(s*.34,-WAIST*1.02, s*.70,-MOUTH*.93, EX,-MOUTH);
  g.stroke();
  g.restore();

  // ── 축수: 줄을 조여 가죽을 팽팽하게 하는 가죽 고리
  [-.30,.30].forEach(u=>[-1,1].forEach(sg=>{
    g.fillStyle='#5f3a1f';
    roundRect(u*s-s*.026, sg>0? s*.188 : -s*.305, s*.052, s*.117, s*.018); g.fill();
  }));

  // ── 가죽면: 통보다 넓게 튀어나온다. 왼쪽 궁편이 오른쪽 채편보다 크다
  [[-1,fL,'#4a7ba7',1],[1,fR,'#e8b23a',.92]].forEach(([d,f,c,k])=>{
    const ry=HEAD*k, cxh=d*EX;
    if(f>0){
      g.save(); g.globalAlpha=f*.6; g.strokeStyle=c; g.lineWidth=5+f*13;
      g.beginPath(); g.ellipse(cxh,0,HRX+7,ry+7,0,0,6.2832); g.stroke(); g.restore();
    }
    g.fillStyle='#4a301d';                                   // 가죽테(쇠가죽 끈)
    g.beginPath(); g.ellipse(cxh,0,HRX,ry,0,0,6.2832); g.fill();
    let skin;
    if(f>0) skin=c;
    else {
      skin=g.createLinearGradient(cxh-HRX,0,cxh+HRX,0);
      skin.addColorStop(0,'#ddc7a0'); skin.addColorStop(.40,'#f8eed8'); skin.addColorStop(1,'#d3bd95');
    }
    g.fillStyle=skin;
    g.beginPath(); g.ellipse(cxh,0,HRX*.68,ry*.88,0,0,6.2832); g.fill();
    g.strokeStyle='rgba(74,48,29,.40)'; g.lineWidth=Math.max(1,s*.009);
    g.beginPath(); g.ellipse(cxh,0,HRX*.68,ry*.88,0,0,6.2832); g.stroke();
  });
  g.restore();
  // 손 안내 — 머리 아래
  g.textAlign='center'; g.textBaseline='middle';
  g.font='800 '+Math.round(Math.max(10, Math.min(14, s*.15)))+'px "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif';
  g.fillStyle='rgba(74,56,34,.68)';
  g.fillText('왼손 · 궁편 · 쿵',  W/2 - s*.86, cy + s*.62);
  g.fillText('오른손 · 채편 · 따', W/2 + s*.86, cy + s*.62);
}

function drawRing(now){
  const {x,y,r} = ringC;
  const total = PATTERN.beats*PATTERN.subdiv;
  let cur = -1, ph = 0;
  if(S.running && S.firstCycleT && now >= S.firstCycleT){
    const e = (now - S.firstCycleT)/S.subDur;
    cur = ((Math.floor(e)%total)+total)%total;
    ph = e - Math.floor(e);
  }
  g.save();
  g.fillStyle='rgba(43,37,45,.80)';
  g.shadowColor='rgba(60,40,20,.3)'; g.shadowBlur=16; g.shadowOffsetY=4;
  g.beginPath(); g.arc(x,y,r+17,0,6.2832); g.fill();
  g.shadowBlur=0; g.shadowOffsetY=0;
  // 지나온 만큼 채우는 테두리
  if(S.running && S.firstCycleT && now >= S.firstCycleT){
    const e=(now-S.firstCycleT)/S.cycleDur, fr=e-Math.floor(e);
    g.strokeStyle='rgba(232,178,58,.55)'; g.lineWidth=3;
    g.beginPath(); g.arc(x,y,r+13,-Math.PI/2,-Math.PI/2+fr*6.2832); g.stroke();
  }
  const notes = PATTERN.janggu[S.level].notes;
  const posMap = {}; notes.forEach(([nm,p])=>posMap[p]=nm);
  for(let i=0;i<total;i++){
    const a = -Math.PI/2 + (i/total)*6.2832;
    const px = x+Math.cos(a)*r, py = y+Math.sin(a)*r;
    const isBeat = i % PATTERN.subdiv === 0;
    const nm = posMap[i];
    let rad = isBeat ? 7 : 4;
    if(nm) rad += 2.5;
    g.fillStyle = nm ? (nm==='덩'?'#d4564f':nm==='쿵'?'#4a7ba7':'#e8b23a')
                     : (isBeat ? 'rgba(246,239,226,.62)' : 'rgba(246,239,226,.26)');
    g.beginPath(); g.arc(px,py,rad,0,6.2832); g.fill();
    if(i===0){
      g.strokeStyle='rgba(246,239,226,.75)'; g.lineWidth=2;
      g.beginPath(); g.arc(px,py,rad+5,0,6.2832); g.stroke();
    }
    if(i===cur){
      g.fillStyle='rgba(255,255,255,'+(0.85-ph*.5)+')';
      g.beginPath(); g.arc(px,py,rad+4+ph*4,0,6.2832); g.fill();
    }
  }
  if(cur>=0){
    const a = -Math.PI/2 + ((cur+ph)/total)*6.2832;
    g.strokeStyle='rgba(232,178,58,.85)'; g.lineWidth=2.5; g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*r*.72, y+Math.sin(a)*r*.72); g.stroke();
  }
  g.fillStyle='rgba(246,239,226,.9)'; g.textAlign='center'; g.textBaseline='middle';
  g.font='800 11px system-ui,sans-serif';
  g.fillText('한 장단', x, y-6);
  g.font='900 15px system-ui,sans-serif';
  g.fillText(total+'소박', x, y+9);
  g.restore();
}

function drawPops(now){
  g.textAlign='center'; g.textBaseline='middle';
  for(const p of S.pops){
    const age = now - p.born;
    if(age > .62) continue;
    const k = age/.62;
    g.save();
    g.globalAlpha = Math.min(1, (1-k)*1.8);
    const sz = Math.min(32, W*.032) * p.scale * (1 + (1-Math.min(1,k*5))*.28);
    g.font = '900 '+Math.round(sz)+'px "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif';
    const ty = hitY - 96 - k*26;
    const tw = g.measureText(p.text).width;
    g.fillStyle = 'rgba(26,22,28,.80)';
    roundRect(W/2-tw/2-16, ty-sz*.78, tw+32, sz*1.56, sz*.78); g.fill();
    g.fillStyle = p.color; g.fillText(p.text, W/2, ty+1);
    g.restore();
  }
  S.pops = S.pops.filter(p => now - p.born < .62);
}

function drawParts(){
  for(const p of S.parts){
    g.save();
    g.globalAlpha = Math.max(0, Math.min(1, p.life));
    g.translate(p.x,p.y); g.rotate(p.r);
    g.fillStyle = p.c;
    g.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*.66);
    g.restore();
  }
}

function drawCountIn(now){
  if(!S.running || !S.firstCycleT) return;
  const playStart = S.firstCycleT + COUNTIN*S.cycleDur;
  if(now >= playStart) return;
  const left = playStart - now;
  const beatsLeft = Math.ceil(left / S.beatDur);
  const words = ['넷','셋','둘','하나'];
  const txt = beatsLeft > 4 ? '준 비' : words[4-beatsLeft] || '';
  const frac = 1 - ((left % S.beatDur)/S.beatDur);
  g.save();
  g.globalAlpha = .9 - frac*.35;
  g.fillStyle = '#2f2a33'; g.textAlign='center'; g.textBaseline='middle';
  g.font = '900 '+Math.round(Math.min(96, W*.13))+'px "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif';
  g.fillText(txt, W/2, hitY - 130);
  g.restore();
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function beatPhase(now){
  if(!S.firstCycleT) return 0;
  const e = (now - S.firstCycleT)/S.beatDur;
  return e - Math.floor(e);
}

/* =============================== 루프 =============================== */
let prevMs = performance.now();
function frame(){
  requestAnimationFrame(frame);
  const ms = performance.now();
  const dt = Math.min(.05, (ms-prevMs)/1000); prevMs = ms;
  const now = ctx ? ctx.currentTime : ms/1000;

  if(S.running){
    scheduler();
    // 놓친 노트
    for(const n of S.notes){
      if(n.part==='jang' && !n.judged && now > n.t + S.goodWin){
        n.judged = true; n.res = 'miss'; onMiss(n);
      }
    }
    S.notes = S.notes.filter(n => n.t > now - 1.2);
    S.heung = Math.max(0, S.heung - dt*0.45);
    applyStage();
    const bp = beatPhase(now);
    if(bp < (S.lastBp||0)) S.lastBeatT = now;
    S.lastBp = bp;
    const gf = document.getElementById('gfill');
    gf.style.width = S.heung.toFixed(1)+'%';
    gf.style.backgroundPosition = (100 - S.heung)+'% 0';
    document.getElementById('scoreVal').textContent = S.score.toLocaleString('ko-KR');
    document.getElementById('comboVal').textContent = S.combo + ' 연속';
  }
  // 색동 조각
  for(const p of S.parts){
    p.vy += 760*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt; p.life -= dt*.75;
  }
  S.parts = S.parts.filter(p => p.life > 0 && p.y < H+40);

  draw(now);
}

/* =============================== 흐름 =============================== */
const $ = id => document.getElementById(id);

function segment(boxId, onPick, multi){
  const box = $(boxId);
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b || b.disabled) return;
    if(multi){
      const on = b.getAttribute('aria-pressed')==='true';
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
      onPick(b.dataset.v, !on);
    } else {
      [...box.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      onPick(b.dataset.v, true);
    }
  });
}
segment('segLv',  v => S.level = v);
segment('segBpm', v => S.bpm = +v);
segment('segAid', (v,on) => { if(v==='guem') S.showGuem = on; else S.demo = on; }, true);

function startGame(){
  audioInit();
  if(ctx.state === 'suspended') ctx.resume();
  // 무음 한 번 — 모바일 오디오 깨우기
  try{ const s=ctx.createBufferSource(); s.buffer=ctx.createBuffer(1,1,ctx.sampleRate); s.connect(ctx.destination); s.start(0); }catch(e){}

  S.beatDur  = 60/S.bpm;
  S.subDur   = S.beatDur/PATTERN.subdiv;
  S.cycleDur = S.beatDur*PATTERN.beats;
  S.perfectWin = Math.max(.05,  Math.min(.10, S.subDur*.35));
  S.goodWin    = Math.max(.105, Math.min(.20, S.subDur*.72));
  S.approachT  = Math.max(1.0,  Math.min(2.1, S.cycleDur*.85));

  S.notes=[]; S.cycleIdx=0; S.score=0; S.combo=0; S.maxCombo=0;
  S.cnt={perfect:0,good:0,wrong:0,miss:0,stray:0};
  S.heung=20; S.hstage=-1; S.pops=[]; S.parts=[]; S.flash={쿵:0,따:0};
  S.finished=false;

  S.firstCycleT = ctx.currentTime + .7;
  S.nextCycleT  = S.firstCycleT;
  S.endT        = S.firstCycleT + (COUNTIN+PLAY)*S.cycleDur + S.cycleDur*.55;

  $('lvName').textContent = PATTERN.janggu[S.level].name;
  $('start').hidden = true; $('result').hidden = true; $('hud').hidden = false;
  S.running = true;
  applyStage();
  layout();
}

function finish(){
  if(S.finished) return;
  S.finished = true; S.running = false;
  $('hud').hidden = true; $('rotate').hidden = true;
  if(ctx){ gBuk.gain.setTargetAtTime(0,ctx.currentTime,.3); gKkwa.gain.setTargetAtTime(0,ctx.currentTime,.3); }

  const c = S.cnt;
  const total = c.perfect + c.good + c.wrong + c.miss;
  const acc = total ? Math.round((c.perfect*100 + c.good*60 + c.wrong*30)/total) : 0;
  const stars = acc>=90 ? 3 : acc>=72 ? 2 : acc>=50 ? 1 : 0;
  let rank = RANKS[0][1];
  for(const [need,nm] of RANKS) if(acc >= need) rank = nm;

  $('stars').textContent = '★★★☆☆☆'.slice(3-stars, 6-stars);
  $('stars').style.color = stars>=3 ? '#e8b23a' : stars>=1 ? '#c9a15a' : '#b9ab93';
  $('rankName').textContent = rank;
  $('accVal').textContent = acc + '%';
  $('tP').textContent=c.perfect; $('tG').textContent=c.good;
  $('tW').textContent=c.wrong;   $('tM').textContent=c.miss; $('tC').textContent=S.maxCombo;

  let adv;
  if(c.miss > total*.3)      adv = '아직 장단이 손에 안 붙었어요. <b>시범 듣기</b>를 켜고 한 장단만 따라가 보세요.';
  else if(c.miss > total*.12) adv = '거의 다 왔어요. <b>빠르기</b>를 한 단계 낮춰서 끝까지 한 번 쳐 보세요.';
  else if(c.wrong > total*.12) adv = '박자는 좋은데 손이 바뀌어요. 왼손은 <b>쿵</b>, 오른손은 <b>따</b>, 둘 다는 <b>덩</b>이에요.';
  else if(acc >= 90 && S.level==='basic') adv = '기본형을 다 익혔어요. 이제 <b>원형</b>에 도전해 보세요!';
  else if(acc >= 90)         adv = '훌륭해요. <b>빠르기</b>를 한 단계 올려 볼까요?';
  else                       adv = '좋아요. 징이 울리는 자리가 장단의 첫 박이에요. 거기에 <b>덩</b>을 맞춰 보세요.';
  $('advice').innerHTML = adv;

  $('result').hidden = false;
  if(stars>=2){ burst(46, W/2, H*.42); if(ctx) flourish(ctx.currentTime+.15); }
}

$('btnStart').addEventListener('click', startGame);
$('btnAgain').addEventListener('click', startGame);
$('btnHome').addEventListener('click', ()=>{ $('result').hidden=true; $('start').hidden=false; });
$('quit').addEventListener('click', ()=>{
  S.running=false; S.finished=true;
  $('hud').hidden=true; $('rotate').hidden=true; $('start').hidden=false;
  if(ctx){ gBuk.gain.setTargetAtTime(0,ctx.currentTime,.2); gKkwa.gain.setTargetAtTime(0,ctx.currentTime,.2); }
});

/* 입력 */
cv.addEventListener('pointerdown', e => {
  if(!S.running) return;
  e.preventDefault();
  tap(e.clientX < W/2 ? '쿵' : '따');
}, {passive:false});
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k==='f' || k==='arrowleft')  { e.preventDefault(); tap('쿵'); }
  else if(k==='j' || k==='arrowright'){ e.preventDefault(); tap('따'); }
  else if(k===' ' || k==='arrowdown') { e.preventDefault(); tap('쿵'); tap('따'); }
});

layout();
requestAnimationFrame(frame);
})();
</script>
