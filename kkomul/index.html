<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꼬물이 구구단">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>꼬물이 구구단</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html{min-height:100%;background:linear-gradient(#cdeaff,#fff6ea 55%,#d9f2cf) fixed}
body{margin:0;font-family:Jua,"Malgun Gothic",sans-serif;color:#3d3030}
main{max-width:1000px;margin:0 auto;padding:24px 16px 32px;text-align:center}
#hero{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
h1{font-size:clamp(40px,7vw,64px);margin:4px 0 4px;color:#3d3030;letter-spacing:2px}
p.sub{font-size:clamp(18px,2.6vw,24px);margin:0 0 22px;color:#6b5555}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
a.card{display:block;text-decoration:none;color:#3d3030;background:#fffdf8;border:4px solid #3d3030;border-radius:28px;padding:14px 14px 18px;box-shadow:0 8px 0 rgba(61,48,48,.25);transition:transform .12s}
a.card:hover{transform:translateY(-4px)}
a.card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(61,48,48,.25)}
a.card canvas{width:100%;height:auto;display:block;border-radius:18px}
a.card b{display:block;font-size:32px;font-weight:normal;margin:10px 0 2px}
a.card span{font-size:20px;color:#6b5555}
</style>
</head>
<body>
<main>
<canvas id="hero" width="560" height="130"></canvas>
<h1>꼬물이 구구단</h1>
<p class="sub">꼬물이 친구들과 놀다 보면 구구단이 쏙쏙!</p>
<div class="cards">
  <a class="card" href="bus.html"><canvas width="300" height="150" data-k="bus"></canvas><b>꼬물이 버스</b><span>몇씩 몇 묶음 태우기</span></a>
  <a class="card" href="jelly.html"><canvas width="300" height="150" data-k="jelly"></canvas><b>곱하기 젤리</b><span>방울을 떨어뜨려 쑥쑥 키우기</span></a>
  <a class="card" href="line.html"><canvas width="300" height="150" data-k="line"></canvas><b>줄줄이 꼬물이</b><span>곱이 큰 문으로 친구 모으기</span></a>
</div>
</main>
<script src="chars.js?v=2610251900"></script>
<script>
const hero = document.getElementById('hero'), hc = hero.getContext('2d');
const cards = [...document.querySelectorAll('a.card canvas')];
const BG = { bus: '#d4ecff', jelly: '#ffe3ec', line: '#e2f5d6' };
const t0 = performance.now();
function hop(t, i){ const s = Math.sin(t * 4 + i * 0.9); return { y: Math.max(0, s) * 14, sq: s < 0 ? -s * 0.25 : -Math.max(0, s) * 0.08 }; }
function frame(){
  requestAnimationFrame(frame);
  const t = (performance.now() - t0) / 1000;
  hc.clearRect(0, 0, 560, 130);
  CHAR_IDS.forEach((id, i) => { const h = hop(t, i); drawChar(hc, id, 42 + i * 68, 118 - h.y, 56, { t: t + i, squish: h.sq, mood: i % 3 === 0 ? 'happy' : 'normal' }); });
  for (const cv of cards){
    const c = cv.getContext('2d'), k = cv.dataset.k;
    c.fillStyle = BG[k]; c.fillRect(0, 0, 300, 150);
    if (k === 'bus'){
      c.fillStyle = '#ffd86b'; c.strokeStyle = '#3d3030'; c.lineWidth = 4;
      c.beginPath(); c.roundRect ? c.roundRect(40, 30, 220, 80, 22) : c.rect(40, 30, 220, 80); c.fill(); c.stroke();
      for (let i = 0; i < 4; i++){ c.fillStyle = '#eaf7ff'; c.fillRect(56 + i * 50, 44, 36, 30); c.strokeRect(56 + i * 50, 44, 36, 30); }
      for (const x of [90, 210]){ c.beginPath(); c.arc(x, 112, 14, 0, 7); c.fillStyle = '#5a4a4a'; c.fill(); c.stroke(); }
      ['tori', 'kongi', 'bori'].forEach((id, i) => drawChar(c, id, 64 + i * 24, 74, 26, { t: t + i }));
      ['haneul', 'ssuki', 'nabi'].forEach((id, i) => drawChar(c, id, 164 + i * 24, 74, 26, { t: t + i, mood: 'happy' }));
    } else if (k === 'jelly'){
      c.fillStyle = 'rgba(255,255,255,.6)'; c.strokeStyle = '#3d3030'; c.lineWidth = 4;
      c.beginPath(); c.roundRect ? c.roundRect(95, 28, 110, 116, 22) : c.rect(95, 28, 110, 116); c.fill(); c.stroke();
      drawChar(c, 'bori', 150, 140, 70, { t, num: 12, mood: 'wow', squish: Math.sin(t * 6) * 0.08 });
      const dy = (t * 50) % 40;
      c.beginPath(); c.arc(150, 6 + dy, 14, 0, 7); c.fillStyle = '#b9e2ff'; c.fill(); c.stroke();
      c.fillStyle = '#3d3030'; c.font = '16px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('×4', 150, 7 + dy);
      drawChar(c, 'mongsil', 50, 140, 50, { t, num: 3 }); drawChar(c, 'tori', 250, 140, 50, { t: t + 1, num: 5 });
    } else {
      c.fillStyle = '#f2dfb8'; c.fillRect(60, 0, 180, 150);
      for (let i = 0; i < 7; i++){
        const id = CHAR_IDS[i % 8], x = 150 + Math.sin(t * 3 - i * 0.6) * 18;
        drawChar(c, id, x, 140 - i * 17, i ? 30 : 40, { t: t + i, mood: i ? 'normal' : 'happy' });
      }
    }
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
