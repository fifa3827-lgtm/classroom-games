<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="컴퓨터 실력 5단계(이기면 자동 승급)와 렌주·표준·자유룰을 고를 수 있는 오목 게임.">
<meta name="theme-color" content="#E6E2D6">
<style>*{margin:0}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>오목 대국</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E6E2D6; --surface:#F3F0E7; --surface-2:#DBD6C7; --sunk:#D2CCBA;
  --ink:#1B211E; --ink-2:#5A625B; --ink-3:#858C84;
  --line:#C5BFAD; --line-soft:#D8D2C2;
  --jade:#14675C; --jade-ink:#0C4A41; --jade-soft:#D9E7E2; --on-jade:#FFFFFF;
  --verm:#AE3A1E; --verm-soft:#F0DCD4;
  --gold:#9A6A12; --gold-soft:#F1E3C2;
  --wood-1:#E3B579; --wood-2:#C58E4E; --wood-edge:#8A6234; --wood-line:#7A5528;
  --stone-b1:#4A4F4B; --stone-b2:#0C0F0D; --stone-w1:#FFFEFA; --stone-w2:#CFC9BA;
  --shadow:0 1px 2px rgba(30,26,14,.10), 0 6px 18px rgba(30,26,14,.08);
  --shadow-lg:0 -8px 30px rgba(30,26,14,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111512; --surface:#1A201C; --surface-2:#252D28; --sunk:#0C0F0D;
    --ink:#E9E7DD; --ink-2:#98A199; --ink-3:#6E776F;
    --line:#313A34; --line-soft:#262E29;
    --jade:#54C3AB; --jade-ink:#8FDCC9; --jade-soft:#16332D; --on-jade:#08110F;
    --verm:#E46A4C; --verm-soft:#3A1E16;
    --gold:#E2B65A; --gold-soft:#3A2E14;
    --wood-1:#8C6337; --wood-2:#6A4922; --wood-edge:#3D2911; --wood-line:#2A1B09;
    --stone-b1:#3A403B; --stone-b2:#080A09; --stone-w1:#F4F1E7; --stone-w2:#B8B2A3;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    --shadow-lg:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A201C; --surface-2:#252D28; --sunk:#0C0F0D;
  --ink:#E9E7DD; --ink-2:#98A199; --ink-3:#6E776F;
  --line:#313A34; --line-soft:#262E29;
  --jade:#54C3AB; --jade-ink:#8FDCC9; --jade-soft:#16332D; --on-jade:#08110F;
  --verm:#E46A4C; --verm-soft:#3A1E16;
  --gold:#E2B65A; --gold-soft:#3A2E14;
  --wood-1:#8C6337; --wood-2:#6A4922; --wood-edge:#3D2911; --wood-line:#2A1B09;
  --stone-b1:#3A403B; --stone-b2:#080A09; --stone-w1:#F4F1E7; --stone-w2:#B8B2A3;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); margin:0; overflow:hidden;
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button{
  font:inherit; color:var(--ink); cursor:pointer;
  border:1px solid var(--line); background:var(--surface);
  border-radius:9px; transition:background .13s,border-color .13s,transform .08s;
}
button:hover:not(:disabled){background:var(--surface-2)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* ── 앱 골격: 판이 남는 공간을 전부 쓴다 ── */
.app{
  height:100vh; height:100dvh;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:100%;
  grid-template-areas:"top" "stage" "dock";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.top{grid-area:top; display:flex; align-items:center; gap:10px; padding:10px 12px 6px}
.brand{font-family:'Gowun Batang',serif; font-weight:700; font-size:19px; letter-spacing:.05em; white-space:nowrap}
.status{flex:1; min-width:0; display:flex; align-items:center; gap:8px; justify-content:center}
.turn-dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 3px rgba(0,0,0,.25)}
.turn-dot.b{background:radial-gradient(circle at 33% 28%,var(--stone-b1),var(--stone-b2) 72%)}
.turn-dot.w{background:radial-gradient(circle at 33% 28%,var(--stone-w1),var(--stone-w2) 78%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.status.think .turn-dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#msg{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; white-space:nowrap;
  background:var(--jade-soft); color:var(--jade-ink);
  border:1px solid color-mix(in srgb,var(--jade) 32%,transparent);
  padding:4px 9px; border-radius:999px;
}
.chip b{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;letter-spacing:0}

.stage{grid-area:stage; position:relative; display:grid; place-items:center; min-height:0; padding:2px 6px}
.board-frame{position:relative; background:var(--wood-edge); padding:6px; border-radius:8px; box-shadow:var(--shadow)}
canvas{display:block; border-radius:3px; touch-action:manipulation}
.toast{
  position:absolute; left:50%; top:10px; transform:translate(-50%,-6px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:500;
  padding:7px 14px; border-radius:999px; white-space:nowrap; z-index:5;
  transition:opacity .18s, transform .18s;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
.overlay{
  position:absolute; inset:6px; border-radius:3px; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;
  background:color-mix(in srgb,var(--sunk) 78%,transparent); backdrop-filter:blur(2px);
}
.overlay.on{display:flex}
.overlay .big{font-family:'Gowun Batang',serif; font-weight:700; font-size:clamp(30px,8vmin,52px); letter-spacing:.08em; line-height:1.1}
.overlay .why{font-size:13px; color:var(--ink-2)}
.overlay .up{
  margin-top:4px; font-size:13.5px; font-weight:600; color:var(--gold);
  background:var(--gold-soft); border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
  padding:5px 12px; border-radius:999px;
}
.overlay .up:empty{display:none}
.overlay button{margin-top:10px; padding:10px 22px}

/* ── 아래 조작줄 ── */
.dock{
  grid-area:dock; display:grid; grid-template-columns:auto repeat(4,minmax(0,1fr)); gap:6px;
  padding:6px 10px calc(10px + env(safe-area-inset-bottom));
}
.side-pick{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.side-pick button{border:0; border-radius:0; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 12px; font-size:11.5px; color:var(--ink-2)}
.side-pick button + button{border-left:1px solid var(--line)}
.side-pick button .turn-dot{width:18px;height:18px}
.side-pick button.on{background:var(--jade-soft); color:var(--jade-ink); font-weight:600}
.tool{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; font-size:11.5px; color:var(--ink-2)}
.tool svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool.off svg{stroke:var(--ink-3)}
.primary{background:var(--jade); border-color:var(--jade); color:var(--on-jade); font-weight:600}
.primary:hover:not(:disabled){background:var(--jade-ink); border-color:var(--jade-ink)}

/* ── 설정 시트 (좁은 화면: 아래에서 올라옴 / 넓은 화면: 오른쪽 칸) ── */
.backdrop{position:fixed; inset:0; background:rgba(10,12,10,.38); opacity:0; pointer-events:none; transition:opacity .2s; z-index:19}
.backdrop.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  max-height:84dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--surface); border-radius:16px 16px 0 0; box-shadow:var(--shadow-lg);
  transform:translateY(102%); transition:transform .26s cubic-bezier(.2,.8,.3,1);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
}
.sheet.on{transform:none}
.sheet-head{position:sticky; top:0; background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:12px 0 8px; z-index:1}
.sheet-head::before{content:""; position:absolute; left:50%; top:5px; width:38px; height:4px; border-radius:2px; background:var(--line); transform:translateX(-50%)}
.sheet-head h2{margin:6px 0 0; font-family:'Gowun Batang',serif; font-size:19px; letter-spacing:.04em}
.sheet-head button{padding:6px 12px; font-size:13px; margin-top:6px}
.sec{padding:12px 0 6px}
.sec + .sec{border-top:1px solid var(--line-soft)}
.sec h3{margin:0 0 8px; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.sec h3 span{text-transform:none; letter-spacing:0; font-family:'IBM Plex Sans KR',sans-serif; font-size:12px; color:var(--ink-2)}

.tally{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px}
.tally div{background:var(--bg); border-radius:9px; padding:7px 10px; font-size:11.5px; color:var(--ink-2)}
.tally b{display:block; font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--ink); font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums}

/* 레벨 사다리 */
.ladder{display:flex; flex-direction:column}
.lvl{display:grid; grid-template-columns:28px 1fr; gap:11px; align-items:start; padding:9px 8px; border-radius:9px; cursor:pointer; border:1px solid transparent; text-align:left; background:transparent; width:100%}
.lvl + .lvl{margin-top:2px}
.lvl:hover{background:var(--surface-2)}
.lvl .num{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); color:var(--ink-3)}
.lvl.cleared .num{border-color:var(--gold); color:var(--gold)}
.lvl .nm{font-weight:600; font-size:14.5px; display:flex; gap:6px; align-items:center}
.lvl .ds{display:block; font-size:12px; color:var(--ink-2); line-height:1.45; margin-top:1px}
.lvl.sel{background:var(--jade-soft); border-color:color-mix(in srgb,var(--jade) 40%,transparent)}
.lvl.sel .num{background:var(--jade); border-color:var(--jade); color:var(--on-jade)}
.lvl.sel .nm{color:var(--jade-ink)}
.badge{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; padding:1px 6px; border-radius:4px; background:var(--gold-soft); color:var(--gold); border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}

.row{display:grid; grid-template-columns:1fr 44px; gap:12px; align-items:start; padding:9px 0}
.row + .row{border-top:1px solid var(--line-soft)}
.row .nm{font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.row .ds{font-size:12px; color:var(--ink-2); line-height:1.5; margin-top:2px}
.tag{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em; padding:2px 6px; border-radius:4px; background:var(--verm-soft); color:var(--verm); border:1px solid color-mix(in srgb,var(--verm) 25%,transparent)}
.sw{position:relative; width:44px; height:25px; margin-top:2px}
.sw input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2}
.sw i{position:absolute; inset:0; border-radius:999px; background:var(--sunk); border:1px solid var(--line); transition:background .15s,border-color .15s}
.sw i::after{content:""; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .16s cubic-bezier(.3,1.3,.5,1)}
.sw input:checked + i{background:var(--jade); border-color:var(--jade)}
.sw input:checked + i::after{transform:translateX(19px)}
.sw input:focus-visible + i{outline:2px solid var(--jade); outline-offset:2px}
.presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px}
.presets button{padding:6px 12px; font-size:12.5px; border-radius:999px}
.presets button.on{background:var(--jade); border-color:var(--jade); color:var(--on-jade); font-weight:600}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-top:6px}
.seg button{border:0; border-radius:0; flex:1; padding:8px 4px; font-size:13px; background:transparent}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--jade); color:var(--on-jade); font-weight:600}
.note{font-size:11.5px; color:var(--ink-3); line-height:1.55; padding-top:8px}
.note b{color:var(--ink-2); font-weight:600}

/* 넓은 가로 화면: 판은 왼쪽에 꽉, 정보는 오른쪽 칸 */
@media (min-width:860px) and (min-aspect-ratio:6/5){
  .app{grid-template-columns:minmax(0,1fr) 352px; grid-template-rows:auto auto minmax(0,1fr); grid-template-areas:"stage top" "stage dock" "stage side"}
  .stage{padding:14px}
  .top{padding:18px 18px 8px; flex-wrap:wrap}
  .status{justify-content:flex-start; order:3; flex-basis:100%; padding-top:6px}
  .brand{font-size:24px}
  .dock{padding:6px 18px 10px; grid-template-columns:auto repeat(3,minmax(0,1fr))}
  #bSet{display:none}
  .sheet{position:static; grid-area:side; transform:none; max-height:none; border-radius:0; box-shadow:none; background:transparent; padding:0 18px 22px; border-top:1px solid var(--line)}
  .sheet-head{background:var(--bg)} .sheet-head::before,.sheet-head button{display:none}
  .sheet-head h2{font-size:15px; margin:4px 0 0}
  .backdrop{display:none}
  .tally div{background:var(--surface)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">오목 대국</div>
    <div class="status" id="status"><span class="turn-dot b" id="dot"></span><span id="msg">내 차례</span></div>
    <div class="chip" id="chip">LV 1 · <b>입문</b></div>
  </header>

  <main class="stage" id="stage">
    <div class="board-frame" id="frame">
      <canvas id="cv" aria-label="오목판"></canvas>
      <div class="overlay" id="ov">
        <div class="big" id="ovBig">승리</div>
        <div class="why" id="ovWhy"></div>
        <div class="up" id="ovUp"></div>
        <button class="primary" id="ovBtn">다음 판</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <nav class="dock" aria-label="대국 조작">
    <div class="side-pick" role="group" aria-label="내 돌 색">
      <button id="pickB" aria-pressed="true"><span class="turn-dot b"></span>흑</button>
      <button id="pickW" aria-pressed="false"><span class="turn-dot w"></span>백</button>
    </div>
    <button class="tool" id="bUndo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>무르기</button>
    <button class="tool" id="bNew"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>새 판</button>
    <button class="tool" id="bSnd"><svg viewBox="0 0 24 24"><path d="M5 9.5h3l4.5-4v13L8 14.5H5z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span>소리</span></button>
    <button class="tool" id="bSet" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>설정</button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" aria-label="설정">
    <div class="sheet-head"><h2>대국 설정</h2><button id="bClose">닫기</button></div>

    <section class="sec">
      <h3>컴퓨터 실력 <span id="ladderNote">이기면 한 단계씩 올라갑니다</span></h3>
      <div class="tally"><div>승<b id="tW">0</b></div><div>패<b id="tL">0</b></div><div>무<b id="tD">0</b></div></div>
      <div class="ladder" id="ladder"></div>
      <div class="row">
        <div><div class="nm">도전 모드</div><div class="ds">컴퓨터를 이기면 다음 판부터 한 단계 강해집니다. 끄면 고른 단계에 머뭅니다.</div></div>
        <label class="sw"><input type="checkbox" id="chal" aria-label="도전 모드"><i></i></label>
      </div>
    </section>

    <section class="sec">
      <h3>대국 규칙 <span id="presetName">표준룰</span></h3>
      <div class="presets" id="presets"></div>
      <div id="rules"></div>
      <div class="note"><b>금수(禁手)란?</b> 먼저 두는 흑이 너무 유리해서, 렌주룰에서는 흑에게만 몇 가지 자리를 막아 둡니다. 내가 흑일 때는 판 위에 <span style="color:var(--verm)">✕</span>로 미리 표시하고 둘 수 없게 합니다. 5목을 완성하는 수는 금수가 아닙니다.</div>
    </section>

    <section class="sec">
      <h3>판 크기</h3>
      <div class="seg" id="segSize"></div>
      <div class="note">판이 넓을수록 초반이 느슨해지고 수읽기 여유가 생깁니다. 바꾸면 새 판이 시작됩니다.</div>
    </section>
  </aside>
</div>

<script>
(function(){
"use strict";
/*ENGINE-START*/
/* ── 오목 엔진 ──────────────────────────────────────────
   칸마다 4방향 모양(열린3·4·5 …)을 미리 계산해 두고, 돌을 놓거나 뺄 때
   주변 40칸만 다시 계산한다. 금수 판정도 같은 모양 표로 하므로
   렌주룰에서도 탐색 속도가 떨어지지 않는다. */
const Engine=(function(){
  const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
  const NONE=0,TWO=1,OPEN2=2,THREE=3,OPEN3=4,FOUR=5,DFOUR=6,OPEN4=7,FIVE=8,OVER=9;
  const S_FIVE=100000000, S_WIN=1000000, S_43=500000, S_33=100000, CAP=100000, WIN=1000000000;

  /* 모양 표: 한 방향 11칸(가운데 = 지금 놓는 돌)을 3진수로 묶은 번호 → 모양.
     [0] = 장목도 5목으로 인정, [1] = 정확히 5개만 5목 */
  const TBL=[new Int8Array(59049).fill(-1), new Int8Array(59049).fill(-1)];
  const W=new Int8Array(11);
  function runEnds(w){ let a=5,b=5; while(a>0&&w[a-1]===1)a--; while(b<10&&w[b+1]===1)b++; return (a<<4)|b; }
  function fiveState(w,ex){ const r=runEnds(w), L=(r&15)-(r>>4)+1; if(L<5)return 0; if(L===5||!ex)return 1; return 2; }
  function fourLevel(w,ex){
    const f=fiveState(w,ex); if(f===1)return FIVE; if(f===2)return OVER;
    let n=0,e1=-1,e2=-1;
    for(let e=0;e<11;e++){ if(w[e]!==0)continue; w[e]=1; if(fiveState(w,ex)===1){ n++; if(e1<0)e1=e; else e2=e; } w[e]=0; }
    if(!n)return NONE; if(n===1)return FOUR;
    const r=runEnds(w), a=r>>4, b=r&15;
    return (b-a===3 && e1===a-1 && e2===b+1) ? OPEN4 : DFOUR;
  }
  function threeLevel(w,ex){
    let best=NONE;
    for(let e=1;e<10;e++){ if(w[e]!==0)continue; w[e]=1; const g=fourLevel(w,ex); w[e]=0;
      if(g===OPEN4)return OPEN3; if((g===FOUR||g===DFOUR)&&best===NONE)best=THREE; }
    return best;
  }
  function classify(w,ex){
    const f=fourLevel(w,ex); if(f!==NONE)return f;
    const t=threeLevel(w,ex); if(t!==NONE)return t;
    let best=NONE;
    for(let e=1;e<10;e++){ if(w[e]!==0)continue; w[e]=1;
      const g=threeLevel(w,ex); w[e]=0;
      if(g===OPEN3)return OPEN2; if(g===THREE)best=TWO; }
    return best;
  }
  function shape(cd,ex){
    const t=TBL[ex]; let s=t[cd];
    if(s<0){ let q=cd; for(let j=10;j>=0;j--){ if(j===5){W[5]=1;continue;} W[j]=q%3; q=(q/3)|0; } s=classify(W,ex); t[cd]=s; }
    return s;
  }

  /* 판 상태 */
  let N=15,NN=225,NB=null,nbN=0,bd,SHP,SC,FF,FORB,MARK,stamp=0;
  let SUM=[0,0,0],C5=[0,0,0],CW=[0,0,0];
  let act,actF,actLen=0,actStack=[];
  let R={exactFive:true,noOverline:false,noDoubleThree:false,noDoubleFour:false};
  let EX1=1,EX2=1,FORBID=false;
  const TMP=new Int32Array(64);
  let _ff=0,_fb=0;

  function buildNB(){
    if(nbN===N) return;
    NB=new Int16Array(4*NN*11); nbN=N;
    for(let d=0;d<4;d++){ const dx=DIRS[d][0], dy=DIRS[d][1];
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const c=y*N+x, base=(d*NN+c)*11;
        for(let j=0;j<11;j++){ const k=j-5, cx=x+dx*k, cy=y+dy*k; NB[base+j]=(cx>=0&&cx<N&&cy>=0&&cy<N)?cy*N+cx:-1; } } }
  }
  function code(c,d,k){
    let v=0; const base=(d*NN+c)*11;
    for(let j=0;j<11;j++){ if(j===5)continue; const i=NB[base+j]; let x;
      if(i<0)x=2; else { const b=bd[i]; x= b===0?0:(b===k?1:2); } v=v*3+x; }
    return v;
  }
  function setDir(c,d){ SHP[1][c*4+d]=shape(code(c,d,1),EX1); SHP[2][c*4+d]=shape(code(c,d,2),EX2); }

  function combine(c,k){
    let five=0,over=0,o4=0,f4=0,o3=0,t3=0,o2=0,t2=0; const A=SHP[k], b=c*4;
    for(let d=0;d<4;d++){
      switch(A[b+d]){
        case FIVE:five++;break; case OVER:over++;break; case OPEN4:o4++;break; case DFOUR:f4+=2;break;
        case FOUR:f4++;break; case OPEN3:o3++;break; case THREE:t3++;break; case OPEN2:o2++;break; case TWO:t2++;break;
      }
    }
    _ff=0; _fb=0;
    if(five) return S_FIVE;                                   // 5목은 금수보다 우선
    const fours=o4+f4;
    if(k===1 && FORBID){
      if(R.noOverline && over){ _fb=1; return 0; }
      if(R.noDoubleFour && fours>=2){ _fb=2; return 0; }
      if(R.noDoubleThree && o3>=2){ _fb=3; return 0; }
    }
    if(fours) _ff=1;
    if(o4 || fours>=2) return S_WIN;
    if(fours && o3) return S_43;
    if(o3>=2) return S_33;
    return fours*12000 + o3*6000 + t3*800 + o2*500 + t2*80 + 2;
  }
  function rescore(c){
    for(let k=1;k<=2;k++){
      const old=SC[k][c];
      if(old){ SUM[k]-= old>CAP?CAP:old; if(old>=S_FIVE)C5[k]--; else if(old>=S_WIN)CW[k]--; }
      let s=0; _ff=0; _fb=0;
      if(bd[c]===0) s=combine(c,k);
      SC[k][c]=s; FF[k][c]=_ff; if(k===1) FORB[c]=_fb;
      if(s){ SUM[k]+= s>CAP?CAP:s; if(s>=S_FIVE)C5[k]++; else if(s>=S_WIN)CW[k]++; }
    }
  }
  function touch(c){
    ++stamp; let n=0;
    if(bd[c]===0) for(let d=0;d<4;d++) setDir(c,d);
    for(let d=0;d<4;d++){ const base=(d*NN+c)*11;
      for(let j=0;j<11;j++){ if(j===5)continue; const i=NB[base+j];
        if(i>=0 && bd[i]===0){ setDir(i,d); if(MARK[i]!==stamp){ MARK[i]=stamp; TMP[n++]=i; } } } }
    rescore(c); for(let i=0;i<n;i++) rescore(TMP[i]);
  }
  function place(c,k){
    bd[c]=k; touch(c);
    const x=c%N, y=(c/N)|0; let p=0;
    for(let dy=-2;dy<=2;dy++){ const yy=y+dy; if(yy<0||yy>=N)continue;
      for(let dx=-2;dx<=2;dx++){ const xx=x+dx; if(xx<0||xx>=N)continue; const i=yy*N+xx;
        if(!actF[i]){ actF[i]=1; act[actLen++]=i; p++; } } }
    actStack.push(p);
  }
  function remove(c){
    bd[c]=0; touch(c);
    let p=actStack.pop(); while(p--){ actF[act[--actLen]]=0; }
  }
  function init(n,rules){
    N=n; NN=n*n; R=Object.assign({},rules);
    EX1=(R.exactFive||R.noOverline)?1:0; EX2=R.exactFive?1:0;
    FORBID=!!(R.noOverline||R.noDoubleThree||R.noDoubleFour);
    buildNB();
    bd=new Int8Array(NN);
    SHP=[null,new Uint8Array(NN*4),new Uint8Array(NN*4)];
    SC=[null,new Int32Array(NN),new Int32Array(NN)];
    FF=[null,new Uint8Array(NN),new Uint8Array(NN)];
    FORB=new Uint8Array(NN); MARK=new Int32Array(NN);
    act=new Int16Array(NN); actF=new Uint8Array(NN); actLen=0; actStack=[];
    SUM=[0,0,0]; C5=[0,0,0]; CW=[0,0,0];
    for(let c=0;c<NN;c++) for(let d=0;d<4;d++) setDir(c,d);
    for(let c=0;c<NN;c++) rescore(c);
  }
  function legal(c,k){ return bd[c]===0 && !(k===1 && FORB[c]); }

  /* ── 탐색 ── */
  let ABORT=false, deadline=0, nodes=0, vN=0, vLim=0;
  function tick(){ if((++nodes&255)===0 && performance.now()>deadline) ABORT=true; return ABORT; }
  function sortBy(arr,s){ const A=SC[s],B=SC[3-s]; arr.sort((a,b)=>(A[b]+B[b])-(A[a]+B[a])); }
  function genAll(s,limit){
    const out=[]; for(let i=0;i<actLen;i++){ const c=act[i]; if(legal(c,s)) out.push(c); }
    sortBy(out,s); return out.length>limit?out.slice(0,limit):out;
  }
  function genMoves(s,limit){
    const o=3-s, B=SC[o], out=[];
    if(C5[o]>0){                                              // 상대 4 → 막는 수만
      for(let i=0;i<actLen;i++){ const c=act[i]; if(B[c]>=S_FIVE && legal(c,s)) out.push(c); }
      return out;
    }
    if(CW[o]>0){                                              // 상대 열린3 등 → 막기 + 내 4로 반격
      const A=SC[s], F=FF[s];
      for(let i=0;i<actLen;i++){ const c=act[i]; if(!legal(c,s))continue;
        if(B[c]>=12000 || F[c] || A[c]>=S_33) out.push(c); }
      if(out.length){ sortBy(out,s); return out.length>limit+4?out.slice(0,limit+4):out; }
    }
    return genAll(s,limit);
  }
  function evalPos(s){ return SUM[s]*1.1 - SUM[3-s]; }
  function negamax(depth,alpha,beta,s,ply){
    if(tick()) return 0;
    const o=3-s;
    if(C5[s]>0) return WIN-ply;
    if(C5[o]>=2) return -(WIN-ply-1);
    if(C5[o]===0 && CW[s]>0) return WIN-ply-2;
    if(depth<=0 && (C5[o]===0 || ply>=24)) return evalPos(s);
    const moves=genMoves(s, depth>=5?8 : depth>=3?10 : 12);
    if(!moves.length) return C5[o]>0 ? -(WIN-ply-1) : 0;
    const forced=C5[o]>0;
    let best=-WIN*2;
    for(let i=0;i<moves.length;i++){
      const m=moves[i];
      place(m,s); const v=-negamax(forced?depth:depth-1,-beta,-alpha,o,ply+1); remove(m);
      if(ABORT) return 0;
      if(v>best){ best=v; if(v>alpha){ alpha=v; if(alpha>=beta) break; } }
    }
    return best;
  }
  /* 연속 4로 이기는 수(VCF) 찾기 — 없으면 -1 */
  function vcf(s,depth){
    const o=3-s, A=SC[s];
    if(C5[s]>0){ for(let i=0;i<actLen;i++){ const c=act[i]; if(bd[c]===0&&A[c]>=S_FIVE) return c; } }
    if(C5[o]>0) return -1;
    if(CW[s]>0){ for(let i=0;i<actLen;i++){ const c=act[i]; if(A[c]>=S_WIN&&legal(c,s)) return c; } }
    if(depth<=0 || ++vN>vLim || tick()) return -1;
    const F=FF[s], list=[];
    for(let i=0;i<actLen;i++){ const c=act[i]; if(F[c]&&legal(c,s)) list.push(c); }
    list.sort((a,b)=>A[b]-A[a]);
    const fc=[];
    for(let li=0;li<list.length;li++){
      const c=list[li]; place(c,s);
      fc.length=0; for(let i=0;i<actLen;i++){ const q=act[i]; if(bd[q]===0&&SC[s][q]>=S_FIVE) fc.push(q); }
      let ok=false;
      if(fc.length>=2) ok=true;
      else if(fc.length===1){ const b=fc[0];
        if(o===1 && FORB[b]) ok=true;                         // 흑이 막을 자리가 금수
        else { place(b,o); if(C5[o]===0 && vcf(s,depth-1)>=0) ok=true; remove(b); } }
      remove(c);
      if(ok) return c;
      if(ABORT) return -1;
    }
    return -1;
  }
  function rootSearch(s,cands,maxD){
    const o=3-s; let order=cands.slice(), best=order[0], bestV=-Infinity, last=null;
    for(let d=2; d<=maxD; d+=2){
      let cb=-1, cv=-Infinity, alpha=-Infinity; const vals=[];
      for(const m of order){
        place(m,s); const v=-negamax(d-1,-Infinity,-alpha,o,1); remove(m);
        if(ABORT) break;
        vals.push([v,m]); if(v>cv){ cv=v; cb=m; } if(v>alpha) alpha=v;
      }
      if(ABORT){ if(bestV===-Infinity && cb>=0) best=cb; break; }
      best=cb; bestV=cv;
      vals.sort((a,b)=>b[0]-a[0]); order=vals.map(x=>x[1]); last=vals;
      if(bestV>=WIN-1000 || bestV<=-(WIN-1000)) break;
    }
    // 초반 몇 수는 비슷하게 좋은 수 중에서 골라 매번 다른 판이 되게
    if(last && actStack.length<8 && Math.abs(bestV)<WIN-1000){
      const lim=bestV-Math.abs(bestV)*0.03-60, pool=last.filter(v=>v[0]>=lim).slice(0,3);
      if(pool.length>1) best=pool[(Math.random()*pool.length)|0][1];
    }
    return best;
  }

  const LV=[null,
    null, null,
    {depth:2, time:900,  vcf:6,  vcfN:3000,  ovcf:0},
    {depth:4, time:1700, vcf:10, vcfN:8000,  ovcf:8,  ovcfN:2500},
    {depth:8, time:2600, vcf:16, vcfN:20000, ovcf:12, ovcfN:5000}];

  function choose(s,lv){
    const o=3-s, A=SC[s], B=SC[o];
    if(actLen===0) return (N>>1)*N+(N>>1);
    ABORT=false; nodes=0;
    const pick=(pred)=>{ let bc=-1,bv=-1;
      for(let i=0;i<actLen;i++){ const c=act[i]; if(legal(c,s)&&pred(c)){ const v=A[c]+B[c]; if(v>bv){bv=v;bc=c;} } }
      return bc; };
    if(C5[s]>0 && (lv>1||Math.random()<0.7)){ const c=pick(c=>A[c]>=S_FIVE); if(c>=0) return c; }
    if(C5[o]>0 && (lv>1||Math.random()<0.6)){ const c=pick(c=>B[c]>=S_FIVE); if(c>=0) return c; }
    if(lv>=2 && C5[o]===0 && CW[s]>0){ const c=pick(c=>A[c]>=S_WIN); if(c>=0) return c; }
    if(lv<=2){
      const mv=genAll(s,10); if(!mv.length) return -1;
      if(lv===1){ const k=Math.min(mv.length,6); return Math.random()<0.3 ? mv[0] : mv[(Math.random()*k)|0]; }
      let bc=mv[0],bv=-1;
      for(const c of mv){ const v=(A[c]+B[c]*0.9)*(0.75+Math.random()*0.5); if(v>bv){bv=v;bc=c;} }
      return bc;
    }
    const cfg=LV[lv], t0=performance.now();
    deadline=t0+cfg.time;
    if(cfg.vcf){ vN=0; vLim=cfg.vcfN; const c=vcf(s,cfg.vcf); ABORT=false; if(c>=0) return c; }
    let cands=genMoves(s,14);
    if(!cands.length){ const any=genAll(s,1); return any.length?any[0]:-1; }
    if(cfg.ovcf && C5[o]===0 && C5[s]===0 && cands.length>1){
      deadline=t0+cfg.time*0.55;
      vN=0; vLim=cfg.ovcfN; const threat=vcf(o,cfg.ovcf); ABORT=false;
      if(threat>=0){                                          // 상대에게 연속 4 필승수가 있음 → 그걸 끊는 수만
        const pool=genAll(s,30); for(const c of cands) if(pool.indexOf(c)<0) pool.push(c);
        const safe=[];
        for(const m of pool){ place(m,s); vN=0; const t=vcf(o,cfg.ovcf); remove(m);
          if(ABORT) break; if(t<0) safe.push(m); }
        ABORT=false;
        if(safe.length){ sortBy(safe,s); cands=safe.slice(0,14); }
      }
      deadline=Math.max(t0+cfg.time, performance.now()+cfg.time*0.4);
    }
    if(cands.length===1) return cands[0];
    nodes=0;
    return rootSearch(s,cands,cfg.depth);
  }

  function winLine(c,k){
    const x=c%N, y=(c/N)|0, ex=k===1?EX1:EX2;
    for(const [dx,dy] of DIRS){
      let a=0,b=0;
      while(true){ const cx=x-dx*(a+1), cy=y-dy*(a+1); if(cx<0||cx>=N||cy<0||cy>=N||bd[cy*N+cx]!==k)break; a++; }
      while(true){ const cx=x+dx*(b+1), cy=y+dy*(b+1); if(cx<0||cx>=N||cy<0||cy>=N||bd[cy*N+cx]!==k)break; b++; }
      const L=a+b+1;
      if(L===5 || (L>5&&!ex)) return [(y-dy*a)*N+(x-dx*a), (y+dy*b)*N+(x+dx*b)];
    }
    return null;
  }
  function forbidList(){ const out=[]; if(!FORBID) return out; for(let i=0;i<actLen;i++){ const c=act[i]; if(bd[c]===0&&FORB[c]) out.push(c); } return out; }

  return {
    init, place, remove, legal, choose, winLine, forbidList,
    winsAt:(c,k)=>SC[k][c]>=S_FIVE,
    forbid:(c)=>FORB[c],
    cell:(c)=>bd[c],
    get N(){ return N; }
  };
})();
/*ENGINE-END*/

/* ── 효과음 (WebAudio 합성) ─────────────────────────── */
const Snd=(function(){
  let ctx=null, on=true;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  function ac(){
    if(!on) return null;
    if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ ctx=new C(); }catch(e){ return null; } }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  /* 마스터: 저역을 걷어내 소리가 탁해지지 않게 한다 */
  let bus=null;
  function out(c){
    if(!bus || bus.context!==c){
      const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=140; hp.Q.value=0.7;
      const g=c.createGain(); g.gain.value=0.9;
      hp.connect(g).connect(c.destination); bus=hp;
    }
    return bus;
  }
  /* 감쇠하는 단일 모드(공명 성분) */
  function mode(c,t,freq,dur,peak,type){
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(peak,t+0.0012);      // 1.2ms 어택 = 또렷한 타격감
    g.gain.exponentialRampToValueAtTime(0.00008,t+dur);
    o.connect(g).connect(out(c)); o.start(t); o.stop(t+dur+0.02);
  }
  /* 부딪히는 순간의 짧은 잡음 트랜지언트 */
  function transient(c,t,cut,q,peak,dur){
    const n=Math.max(8,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=cut; f.Q.value=q;
    const g=c.createGain(); g.gain.value=peak;
    src.connect(f).connect(g).connect(out(c)); src.start(t);
  }

  /* 바둑돌 착점음: 짧은 트랜지언트 + 비조화 모드 4개 (나무판 공명) */
  const RATIO=[1, 1.59, 2.44, 3.81];
  const DECAY=[0.115, 0.078, 0.052, 0.034];
  const LEVEL=[0.085, 0.060, 0.042, 0.028];
  function stoneHit(c,t,base,bright){
    const j=1+(Math.random()-0.5)*0.05;                 // 매번 미세하게 다른 음색
    transient(c,t,3400*bright,0.9,0.16,0.014);          // 돌끼리 닿는 딱 소리
    transient(c,t+0.0015,6200*bright,1.6,0.075,0.008);  // 아주 높은 끝맛
    for(let i=0;i<4;i++) mode(c,t,base*RATIO[i]*j,DECAY[i],LEVEL[i],'sine');
    mode(c,t,168,0.045,0.045,'sine');                   // 판이 울리는 아주 짧은 몸통
  }

  return {
    get on(){ return on; },
    toggle(){ on=!on; if(on) ac(); return on; },
    place(p){
      const c=ac(); if(!c) return; const t=c.currentTime+0.001;
      // 흑(점판암)은 조금 낮고 묵직, 백(조개)은 조금 높고 맑게
      stoneHit(c,t, p===1?760:900, p===1?1:1.12);
    },
    win(){
      const c=ac(); if(!c) return; const t=c.currentTime;
      const step=reduced?0.06:0.11;
      [587.33,880,1174.66,1760].forEach((f,i)=>{        // 맑은 종소리 상행
        const s=t+i*step;
        mode(c,s,f,0.75,0.075,'sine');
        mode(c,s,f*2.76,0.22,0.022,'sine');             // 종 특유의 배음
        transient(c,s,f*3,3,0.03,0.01);
      });
      mode(c,t+3*step,293.66,1.3,0.05,'sine');
    },
    lose(){
      const c=ac(); if(!c) return; const t=c.currentTime;
      const step=reduced?0.09:0.16;
      [440,369.99,293.66].forEach((f,i)=>{              // 차분한 하행 3음
        const s=t+i*step;
        mode(c,s,f,0.7,0.07,'sine');
        mode(c,s,f*1.5,0.3,0.018,'sine');
      });
      mode(c,t+2*step,220,1.4,0.055,'sine');            // 낮게 여운
    },
    draw(){
      const c=ac(); if(!c) return; const t=c.currentTime;
      [523.25,523.25].forEach((f,i)=>mode(c,t+i*0.17,f,0.5,0.06,'sine'));
    }
  };
})();

    ds:'흑은 한 줄에 여섯 개 이상을 늘어놓을 수 없습니다. 흑은 정확히 다섯 개로만 이길 수 있고, 백은 장목으로도 이깁니다.' },
  { key:'noDoubleThree', name:'삼삼 금수', black:true,
    ds:'흑은 한 수로 열린 3(양쪽이 뚫린 석 줄)을 두 개 동시에 만들 수 없습니다. 막을 곳이 두 군데라 사실상 필승이 되기 때문입니다.' },
  { key:'noDoubleFour', name:'사사 금수', black:true,
    ds:'흑은 한 수로 4(한 칸만 더 놓으면 5목인 줄)를 두 개 동시에 만들 수 없습니다. 같은 줄 안에서 생기는 두 개의 4도 포함합니다.' }
];
const PRESETS={
  free :{ label:'자유룰', v:{exactFive:false,noOverline:false,noDoubleThree:false,noDoubleFour:false} },
  std  :{ label:'표준룰', v:{exactFive:true, noOverline:false,noDoubleThree:false,noDoubleFour:false} },
  renju:{ label:'렌주룰', v:{exactFive:false,noOverline:true, noDoubleThree:true, noDoubleFour:true } }
};
const LEVELS=[
  { n:'입문',   ds:'아무 데나 두는 편입니다. 5목 자리도 자주 놓칩니다.' },
  { n:'초급',   ds:'눈앞의 공격과 수비만 봅니다. 4와 열린 3은 막지만 함정은 읽지 못합니다.' },
  { n:'중급',   ds:'두 수 앞을 읽고, 4를 연달아 두어 이기는 길(연속 4)을 찾아냅니다.' },
  { n:'상급',   ds:'네 수 앞을 읽습니다. 내가 연속 4로 이기려는 길도 미리 끊어 둡니다.' },
  { n:'최상급', ds:'생각할 시간을 다 써서 여덟 수 앞까지 읽습니다. 4-3, 쌍삼 같은 이중 공격을 먼저 만들어 옵니다.' }
];

const KEY='omok.v2';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
const saved=load();
const S={
  N: saved.N===19?19:15,
  rules: Object.assign({},PRESETS.std.v, saved.rules||{}),
  level: Math.min(5,Math.max(1,saved.level||1)),
  best: Math.min(5,Math.max(0,saved.best||0)),          // 이겨 본 가장 높은 단계
  challenge: saved.challenge!==false,
  human: saved.human===2?2:1,
  sound: saved.sound!==false,
  tally: Object.assign({w:0,l:0,d:0}, saved.tally||{}),
  moves:[], turn:1, over:false, result:null, last:-1, winLine:null, thinking:false
};
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({N:S.N,rules:S.rules,level:S.level,best:S.best,challenge:S.challenge,human:S.human,sound:S.sound,tally:S.tally})); }catch(e){}
}
const ai=()=>3-S.human;
const $=id=>document.getElementById(id);

/* ── 판 그리기 ── */
const cv=$('cv'), ctx=cv.getContext('2d'), frame=$('frame'), stage=$('stage');
let CELL=0, PAD=0, W=0;
function css(k){ return getComputedStyle(document.documentElement).getPropertyValue(k).trim(); }
function px(i){ return PAD+i*CELL; }
function starPoints(N){
  if(N===19) return [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
  return [[3,3],[3,11],[7,7],[11,3],[11,11]];
}
function layout(){
  const r=stage.getBoundingClientRect();
  const cs=getComputedStyle(stage);
  const aw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const size=Math.max(200,Math.floor(Math.min(aw,ah)));
  const inner=size-12;
  W=inner;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=inner+'px'; cv.style.height=inner+'px';
  cv.width=Math.round(inner*dpr); cv.height=Math.round(inner*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  PAD=Math.round(inner*(S.N===19?0.038:0.046));
  CELL=(inner-PAD*2)/(S.N-1);
  draw();
}
function draw(){
  const N=S.N, w=W; if(!w) return;
  const wood1=css('--wood-1'), wood2=css('--wood-2'), wline=css('--wood-line'), verm=css('--verm');
  const g=ctx.createLinearGradient(0,0,w*0.7,w);
  g.addColorStop(0,wood1); g.addColorStop(.55,wood2); g.addColorStop(1,wood1);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,w);
  ctx.save(); ctx.globalAlpha=.055; ctx.strokeStyle=wline; ctx.lineWidth=1;
  for(let i=0;i<16;i++){ const y=(i+.5)*(w/16); ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=0;x<=w;x+=w/8) ctx.quadraticCurveTo(x+w/16, y+Math.sin(i*1.7+x/90)*5, x+w/8, y);
    ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle=wline; ctx.globalAlpha=.72; ctx.lineWidth=Math.max(.7,CELL*0.028);
  ctx.beginPath();
  for(let i=0;i<N;i++){ ctx.moveTo(px(0),px(i)); ctx.lineTo(px(N-1),px(i)); ctx.moveTo(px(i),px(0)); ctx.lineTo(px(i),px(N-1)); }
  ctx.stroke(); ctx.globalAlpha=1;
  ctx.lineWidth=Math.max(1.1,CELL*0.05); ctx.strokeRect(px(0),px(0),px(N-1)-px(0),px(N-1)-px(0));
  ctx.fillStyle=wline;
  for(const [sx,sy] of starPoints(N)){ ctx.beginPath(); ctx.arc(px(sx),px(sy),Math.max(2,CELL*0.09),0,7); ctx.fill(); }
  ctx.globalAlpha=.5;
  ctx.font=`600 ${Math.max(7,Math.min(12,CELL*0.36))}px 'IBM Plex Mono',monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<N;i++){ ctx.fillText(String.fromCharCode(65+i),px(i),PAD*0.45); ctx.fillText(String(N-i),PAD*0.42,px(i)); }
  ctx.globalAlpha=1;
  // 금수 자리
  if(!S.over && !S.thinking && S.turn===S.human && S.human===1){
    const fl=Engine.forbidList();
    if(fl.length){ ctx.strokeStyle=verm; ctx.lineWidth=Math.max(1.4,CELL*0.075); ctx.globalAlpha=.85; const r=CELL*0.2;
      for(const i of fl){ const x=px(i%N), y=px((i/N)|0); ctx.beginPath(); ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.moveTo(x+r,y-r); ctx.lineTo(x-r,y+r); ctx.stroke(); }
      ctx.globalAlpha=1; }
  }
  for(let i=0;i<N*N;i++){ const v=Engine.cell(i); if(v) stone(px(i%N),px((i/N)|0),v); }
  if(S.last>=0){ ctx.strokeStyle=verm; ctx.lineWidth=Math.max(1.4,CELL*0.07);
    ctx.beginPath(); ctx.arc(px(S.last%N),px((S.last/N)|0),CELL*0.17,0,7); ctx.stroke(); }
  if(S.winLine){ const [a,b]=S.winLine; ctx.strokeStyle=verm; ctx.lineWidth=Math.max(2.2,CELL*0.11); ctx.lineCap='round'; ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.moveTo(px(a%N),px((a/N)|0)); ctx.lineTo(px(b%N),px((b/N)|0)); ctx.stroke(); ctx.globalAlpha=1; ctx.lineCap='butt'; }
}
function stone(x,y,p){
  const r=CELL*0.45;
  ctx.save();
  ctx.beginPath(); ctx.arc(x+r*0.06,y+r*0.16,r,0,7); ctx.fillStyle='rgba(0,0,0,.26)'; ctx.fill();
  const g=ctx.createRadialGradient(x-r*0.34,y-r*0.38,r*0.08,x,y,r*1.05);
  if(p===1){ g.addColorStop(0,css('--stone-b1')); g.addColorStop(1,css('--stone-b2')); }
  else { g.addColorStop(0,css('--stone-w1')); g.addColorStop(1,css('--stone-w2')); }
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=g; ctx.fill();
  ctx.restore();
}

/* ── 대국 진행 ── */
function newGame(){
  Engine.init(S.N,S.rules);
  S.moves=[]; S.turn=1; S.over=false; S.result=null; S.last=-1; S.winLine=null; S.thinking=false;
  $('ov').classList.remove('on');
  layout(); updateUI(); maybeAI();
}
function replay(){                                            // 규칙만 바꿀 때: 둔 수는 그대로 두고 다시 계산
  Engine.init(S.N,S.rules);
  for(const m of S.moves) Engine.place(m.c,m.k);
  draw(); updateUI();
}
function play(c,k){
  const win=Engine.winsAt(c,k);
  Engine.place(c,k); S.moves.push({c,k}); S.last=c;
  if(S.sound) Snd.place(k);
  if(win){ S.winLine=Engine.winLine(c,k); finish(k===S.human?'win':'lose'); return; }
  if(S.moves.length>=S.N*S.N){ finish('draw'); return; }
  S.turn=3-k;
}
function hit(ev){
  const r=cv.getBoundingClientRect();
  const x=ev.clientX-r.left, y=ev.clientY-r.top;
  const i=Math.round((x-PAD)/CELL), j=Math.round((y-PAD)/CELL);
  if(i<0||i>=S.N||j<0||j>=S.N) return -1;
  if(Math.hypot(x-px(i),y-px(j))>CELL*0.66) return -1;
  return j*S.N+i;
}
const FORB_NAME=['','장목','사사','삼삼'];
cv.addEventListener('click',e=>{
  if(S.over||S.thinking||S.turn!==S.human) return;
  const c=hit(e); if(c<0) return;
  if(Engine.cell(c)!==0){ toast('이미 돌이 놓인 자리입니다'); return; }
  if(S.human===1){ const f=Engine.forbid(c); if(f){ toast(FORB_NAME[f]+' 금수 자리라 둘 수 없습니다'); return; } }
  play(c,S.human); draw(); updateUI();
  maybeAI();
});
function maybeAI(){
  if(S.over || S.turn!==ai()) return;
  S.thinking=true; updateUI(); draw();
  setTimeout(()=>{
    const m=Engine.choose(ai(),S.level);
    S.thinking=false;
    if(m<0) finish('draw'); else play(m,ai());
    draw(); updateUI();
  },70);
}
function finish(kind){
  S.over=true; S.result=kind;
  let up='';
  if(kind==='win'){
    S.tally.w++;
    if(S.level>S.best) S.best=S.level;
    if(S.challenge && S.level<5){ S.level++; up=`다음 판부터 레벨 ${S.level} · ${LEVELS[S.level-1].n}`; }
    else if(S.level===5) up='최상급을 꺾었습니다';
    if(S.sound) setTimeout(()=>Snd.win(),200);
  } else if(kind==='lose'){ S.tally.l++; if(S.sound) setTimeout(()=>Snd.lose(),200); }
  else { S.tally.d++; if(S.sound) setTimeout(()=>Snd.draw(),200); }
  save();
  $('ovBig').textContent = kind==='win'?'승리':kind==='lose'?'패배':'무승부';
  $('ovWhy').textContent = kind==='draw' ? '판이 가득 찼습니다' : `${S.moves.length}수 만에 끝났습니다`;
  $('ovUp').textContent = up;
  $('ovBtn').textContent = kind==='lose' ? '다시 도전' : '다음 판';
  $('ov').classList.add('on');
  renderLadder(); updateUI();
}
function undo(){
  if(S.thinking || (S.over && S.result==='win')) return;
  if(!S.moves.some(m=>m.k===S.human)) return;
  while(S.moves.length){ const m=S.moves.pop(); Engine.remove(m.c); if(m.k===S.human) break; }
  S.over=false; S.result=null; S.winLine=null;
  S.turn = S.moves.length%2===0 ? 1 : 2;
  S.last = S.moves.length ? S.moves[S.moves.length-1].c : -1;
  $('ov').classList.remove('on');
  draw(); updateUI(); maybeAI();
}

/* ── 상태 표시 ── */
function updateUI(){
  const st=$('status'), dot=$('dot'), msg=$('msg');
  dot.className='turn-dot '+(S.turn===1?'b':'w');
  st.classList.toggle('think',S.thinking);
  if(S.over) msg.textContent = S.result==='win'?'내가 이겼습니다':S.result==='lose'?'컴퓨터가 이겼습니다':'무승부';
  else if(S.thinking) msg.textContent='컴퓨터가 생각 중…';
  else msg.textContent=`내 차례 · ${S.human===1?'흑':'백'}`;
  $('chip').innerHTML=`LV ${S.level} · <b>${LEVELS[S.level-1].n}</b>`;
  $('bUndo').disabled = S.thinking || (S.over&&S.result==='win') || !S.moves.some(m=>m.k===S.human);
  $('pickB').classList.toggle('on',S.human===1); $('pickW').classList.toggle('on',S.human===2);
  $('pickB').setAttribute('aria-pressed',String(S.human===1)); $('pickW').setAttribute('aria-pressed',String(S.human===2));
  const sb=$('bSnd'); sb.classList.toggle('off',!S.sound); sb.querySelector('span').textContent=S.sound?'소리':'소리 끔';
  sb.querySelector('.wave').style.display=S.sound?'':'none';
  $('tW').textContent=S.tally.w; $('tL').textContent=S.tally.l; $('tD').textContent=S.tally.d;
}
let toastT=0;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1800); }

/* ── 설정 ── */
function renderLadder(){
  const el=$('ladder');
  el.innerHTML=LEVELS.map((l,i)=>{ const n=i+1;
    return `<button class="lvl${S.level===n?' sel':''}${S.best>=n?' cleared':''}" data-l="${n}" aria-pressed="${S.level===n}">
      <span class="num">${n}</span>
      <span><span class="nm">${l.n}${S.best>=n?'<span class="badge">이김</span>':''}</span><span class="ds">${l.ds}</span></span>
    </button>`; }).join('');
  el.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{ S.level=+b.dataset.l; save(); renderLadder(); updateUI(); });
  $('ladderNote').textContent = S.challenge ? '이기면 한 단계씩 올라갑니다' : '고른 단계에 머뭅니다';
}
function currentPreset(){
  for(const [k,p] of Object.entries(PRESETS)) if(RULE_DEFS.every(r=>!!S.rules[r.key]===!!p.v[r.key])) return k;
  return null;
}
function renderRules(){
  const cur=currentPreset();
  $('presets').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button data-k="${k}" class="${cur===k?'on':''}">${p.label}</button>`).join('');
  $('presets').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.rules=Object.assign({},PRESETS[b.dataset.k].v); save(); renderRules(); replay(); toast(PRESETS[b.dataset.k].label+'로 바꿨습니다'); });
  $('presetName').textContent = cur?PRESETS[cur].label:'직접 설정';
  $('rules').innerHTML=RULE_DEFS.map(r=>`
    <div class="row">
      <div><div class="nm">${r.name}${r.black?'<span class="tag">흑만</span>':''}</div><div class="ds">${r.ds}</div></div>
      <label class="sw"><input type="checkbox" data-k="${r.key}" ${S.rules[r.key]?'checked':''} aria-label="${r.name}"><i></i></label>
    </div>`).join('');
  $('rules').querySelectorAll('input').forEach(c=>c.onchange=()=>{ S.rules[c.dataset.k]=c.checked; save(); renderRules(); replay(); });
  $('segSize').innerHTML=[[15,'15 × 15'],[19,'19 × 19']].map(([v,l])=>`<button data-v="${v}" class="${S.N===v?'on':''}">${l}</button>`).join('');
  $('segSize').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const v=+b.dataset.v; if(v===S.N) return; S.N=v; save(); renderRules(); newGame(); });
}
function pickSide(h){
  if(S.thinking) return;
  if(h===S.human && !S.over) return;
  S.human=h; save(); newGame();
  toast(h===1?'내가 흑 — 먼저 둡니다':'내가 백 — 컴퓨터가 먼저 둡니다');
}
function openSheet(on){
  $('sheet').classList.toggle('on',on); $('backdrop').classList.toggle('on',on);
  $('bSet').setAttribute('aria-expanded',String(on));
}

$('pickB').onclick=()=>pickSide(1);
$('pickW').onclick=()=>pickSide(2);
$('bUndo').onclick=undo;
$('bNew').onclick=()=>{ if(!S.thinking) newGame(); };
$('ovBtn').onclick=()=>newGame();
$('bSnd').onclick=()=>{ S.sound=!S.sound; save(); updateUI(); if(S.sound) Snd.place(1); };
$('bSet').onclick=()=>openSheet(true);
$('bClose').onclick=()=>openSheet(false);
$('backdrop').onclick=()=>openSheet(false);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') openSheet(false); });
$('chal').checked=S.challenge;
$('chal').onchange=e=>{ S.challenge=e.target.checked; save(); renderLadder(); };

if(window.ResizeObserver) new ResizeObserver(()=>layout()).observe(stage);
else window.addEventListener('resize',layout);
if(window.matchMedia) window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>setTimeout(draw,30));
new MutationObserver(()=>setTimeout(draw,30)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

renderLadder(); renderRules(); newGame();

})();
</script>
