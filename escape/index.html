<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>열다섯 개의 문</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2610052000">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>

<!-- 게임 중 화면 -->
<div id="hud" class="hidden">
  <div id="topbar">
    <button id="btnMenu" class="ibtn" title="메뉴">☰</button>
    <div id="stageName"></div>
    <div id="timer">00:00</div>
    <button id="btnHint" class="ibtn" title="힌트">?</button>
  </div>
  <button id="btnBack" class="hidden">↩ 뒤로</button>
  <div id="tip" class="hidden"></div>
  <div id="say"></div>
  <div id="invWrap">
    <div id="inv"></div>
    <div id="invActions" class="hidden">
      <span id="selName"></span>
      <button id="btnInspect">살펴보기</button>
    </div>
  </div>
</div>

<!-- 창들 -->
<div id="modal" class="hidden"><div id="modalBox"></div></div>

<!-- 시작 화면 -->
<div id="title">
  <div class="titleInner">
    <div class="titleSmall">ESCAPE ROOM</div>
    <h1>열다섯 개의 문</h1>
    <p class="titleSub">열다섯 곳의 닫힌 방. 단서를 모으고, 조합하고, 빠져나가세요.</p>
    <div id="stageGrid"></div>
    <div class="titleFoot">
      <label><input type="checkbox" id="optHigh"> 고화질</label>
      <label><input type="checkbox" id="optSound" checked> 소리</label>
      <span class="howto">끌어서 둘러보기 · 눌러서 조사 · 물건을 고른 뒤 눌러서 사용 · 물건끼리 눌러 조합</span>
    </div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><div>방을 준비하는 중…</div></div>
<div id="fade"></div>

<script type="module" src="js/main.js?v=2610052000"></script>
</body>
</html>
