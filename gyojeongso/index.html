<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림 글자 교정소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;800&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Sunflower:wght@500;700&family=Hi+Melody&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FA; --paper:#FFFFFF; --ink:#262B42; --sub:#6A708A; --line:#E2E5F0;
  --red:#EE4F6C; --red-soft:#FFE3E8; --mint:#2C9C72; --mint-soft:#D9F4E8;
  --lilac:#7B6CF0; --lilac-soft:#ECE9FF; --sun:#FFD84D; --sun-soft:#FFF7D6; --stage:#E6E9F3;
  --shadow:0 1px 2px rgba(38,43,66,.06),0 8px 24px rgba(38,43,66,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171A26; --paper:#222638; --ink:#EEF0F8; --sub:#A3A9C2; --line:#33384E;
  --red:#FF6B86; --red-soft:#4A2531; --mint:#5BD3A2; --mint-soft:#1F3D33; --lilac:#A497FF; --lilac-soft:#2E2A4D; --stage:#1C2030; --sun-soft:#3A3420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#171A26; --paper:#222638; --ink:#EEF0F8; --sub:#A3A9C2; --line:#33384E;
  --red:#FF6B86; --red-soft:#4A2531; --mint:#5BD3A2; --mint-soft:#1F3D33; --lilac:#A497FF; --lilac-soft:#2E2A4D; --stage:#1C2030; --sun-soft:#3A3420;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
svg{flex:none}

/* ===== 전체 틀: 한 화면에 모두 ===== */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;max-width:1400px;margin:0 auto}
.work,.sheet,.pane,.ed{min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr);column-gap:14px;padding:0 14px 14px}
  .top{grid-column:1/-1}
  .sheet{border-radius:20px;box-shadow:var(--shadow)}
  .work{border-radius:20px}
}

.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--red);display:grid;place-items:center;transform:rotate(-6deg);flex:none}
.logo svg{width:19px;height:19px}
.top h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0;letter-spacing:-.4px;white-space:nowrap}
.top .sp{flex:1}
.saveTop{border:0;background:var(--mint);color:#fff;font-weight:700;border-radius:12px;padding:9px 14px;display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
.saveTop svg{width:17px;height:17px}
.saveTop:disabled{opacity:.35;cursor:not-allowed}

/* ===== 작업 영역 ===== */
.work{background:var(--paper);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.tools{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.tools::-webkit-scrollbar{display:none}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap;user-select:none;-webkit-user-select:none;flex:none}
.tbtn svg{width:16px;height:16px}
.tbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn.star{background:var(--lilac-soft);border-color:transparent;color:var(--lilac)}
.tbtn:disabled{opacity:.4}
.tbtn:active{transform:scale(.97)}
.area{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
.area.hand #ov{cursor:grab}
.zoom{position:absolute;right:10px;bottom:10px;display:none;gap:4px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);z-index:3}
.zoom button{border:0;background:none;min-width:36px;height:36px;border-radius:10px;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px}
.zoom button svg{width:18px;height:18px}
.zoom button.on{background:var(--ink);color:var(--paper)}
.zoom .zv{min-width:50px;color:var(--sub);font-size:12.5px}

#drop{position:absolute;inset:10px;border:2.5px dashed #C9CEE3;border-radius:16px;display:grid;place-items:center;text-align:center;padding:18px;background:linear-gradient(transparent 31px,var(--line) 32px) 0 0/100% 32px}
#drop.over{background-color:var(--lilac-soft);border-color:var(--lilac)}
.dropin h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:24px;margin:12px 0 2px}
.dropin p{margin:0 0 14px;color:var(--sub);font-size:14px}
.paper{width:112px;height:80px;margin:0 auto;position:relative}
.paper .pg{position:absolute;inset:0;background:var(--paper);border-radius:11px;box-shadow:var(--shadow);transform:rotate(-4deg)}
.paper .ln{position:absolute;left:16px;height:8px;border-radius:4px;background:var(--line)}
.paper .mk{position:absolute;left:10px;top:14px;width:66px;height:21px;border:3px solid var(--red);border-radius:6px;transform:rotate(-4deg)}
.pick{background:var(--red);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:15.5px;box-shadow:0 6px 16px rgba(238,79,108,.3)}
.small{font-size:12.5px;color:var(--sub);margin-top:10px}
.resume{margin-top:18px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:2px solid var(--mint);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.resume b{display:block;font-size:15px}
.resume span{font-size:12.5px;color:var(--sub)}
.resume .pick{background:var(--mint);box-shadow:none;padding:10px 16px;font-size:14.5px;white-space:nowrap}

#stage{position:absolute;left:0;top:0;display:none;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;background:repeating-conic-gradient(var(--stage) 0 25%,transparent 0 50%) 0 0/20px 20px}
#cv{display:block;width:100%;height:100%;border-radius:10px}
#ov{position:absolute;inset:0;cursor:crosshair}
.mark{position:absolute;border:2.5px dashed var(--red);border-radius:6px;background:rgba(238,79,108,.08);cursor:move}
.mark.fix{border-style:solid;border-color:var(--mint);background:transparent}
.mark.erase{border-style:solid;border-color:var(--lilac);background:transparent}
.mark.sel{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--sun)}
.mark .n{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:700 12px/22px "IBM Plex Sans KR",sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:move}
.mark .n::after{content:"";position:absolute;inset:-8px}
.mark.done:not(.sel),.mark:not(.sel){cursor:crosshair}
.mark.fix .n{background:var(--mint)} .mark.erase .n{background:var(--lilac)}
.mark .h{position:absolute;right:-12px;bottom:-12px;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--red);cursor:nwse-resize;display:none}
.mark.sel .h{display:block}
.mark.fix .h{border-color:var(--mint)} .mark.erase .h{border-color:var(--lilac)}
#stage.clean .mark{opacity:0;pointer-events:none}
.hint{flex:none;font-size:12.5px;color:var(--sub);padding:0 14px 10px;text-align:center}
.hint b{color:var(--red)}

/* ===== 오른쪽(휴대폰은 아래) 패널 ===== */
.sheet{background:var(--paper);display:flex;flex-direction:column;min-height:0;box-shadow:0 -6px 20px rgba(38,43,66,.08);border-radius:20px 20px 0 0;height:clamp(338px,52dvh,480px)}
@media (max-width:899px){.app{display:flex;flex-direction:column}.work{flex:1}.sheet{flex:none} body.has .hint{display:none} body.editing .top{display:none} body.editing .work{border-radius:0}}
@media (min-width:900px){#saveTool{display:none}}
@media (max-width:899px){#undoBtn,#redoBtn{font-size:0;gap:0;padding:6px 9px}}
:fullscreen{background:var(--bg)}
.gemnote{display:none;font-size:12.5px;color:var(--sub)}
.ptitle{display:none;font-family:"Do Hyeon",sans-serif;font-size:20px;margin:0 0 8px;align-items:center;gap:8px;font-weight:400}
.ptitle .cnt{font:700 12px "IBM Plex Sans KR",sans-serif;background:var(--red-soft);color:var(--red);border-radius:999px;padding:0 7px;line-height:19px}
.shead{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;flex:none;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px}
.shead .cnt{font:700 12px "IBM Plex Sans KR",sans-serif;background:var(--mint-soft);color:var(--mint);border-radius:999px;padding:0 8px;line-height:20px}
.shead .sp{flex:1}
.fold{border:0;background:var(--bg);border-radius:10px;width:38px;height:34px;align-self:center;display:grid;place-items:center;color:var(--sub)}
.fold svg{width:18px;height:18px;transition:transform .2s}
@media (max-width:899px){.sheet.min{height:auto}
.sheet.min .pane{display:none!important}}
.sheet.min .fold svg{transform:rotate(180deg)}
.sheet.min .tab{border-bottom-color:transparent}
.tab{border:0;background:none;padding:9px 6px 10px;font-weight:700;font-size:14.5px;color:var(--sub);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .cnt{font-size:12px;background:var(--red-soft);color:var(--red);border-radius:999px;padding:0 7px;line-height:19px}
.pane{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;display:flex;flex-direction:column}
.pane.on{display:flex}

.chips{display:flex;gap:6px;align-items:center;flex:none;overflow-x:auto;scrollbar-width:none;padding:2px}
.mchip{flex:none;min-width:32px;height:32px;border-radius:11px;border:2px solid transparent;font-weight:700;color:#fff;background:var(--red);padding:0 8px}
.mchip.fix{background:var(--paper);color:var(--mint);border-color:var(--mint)} .mchip.fix.done{background:var(--mint);color:#fff} .mchip.erase{background:var(--lilac)}
.mchip.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--sun)}
.chips .sp{flex:1;text-align:right;padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{border:0;background:var(--bg);color:var(--sub);font-size:13px;padding:7px 11px;border-radius:10px;flex:none;display:flex;gap:4px;align-items:center}
.del svg{width:15px;height:15px}
.del:hover{color:var(--red);background:var(--red-soft)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px;padding:12px}
.empty b{color:var(--ink)}

.ed{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.pos{font-size:12.5px;color:var(--sub)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 2px;font-size:13px;font-weight:500;color:var(--sub)}
.seg button.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:700}
.seg button.on[data-m="gemini"]{color:var(--red)} .seg button.on[data-m="fix"]{color:var(--mint)} .seg button.on[data-m="erase"]{color:var(--lilac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:block}
.fld span{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.fld input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.fld input:focus{border-color:var(--lilac);outline:none}
.fonts{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 4px;scrollbar-width:thin}
.fonts button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-size:16px;line-height:1.25;white-space:nowrap}
.fonts button.on{border-color:var(--mint);background:var(--mint-soft)}
.row{display:flex;gap:6px;align-items:center}
.row input[type=range]{flex:1;min-width:60px;accent-color:var(--mint)}
.lbl{font-size:12px;color:var(--sub);flex:none}
.val{font-size:12px;color:var(--sub);min-width:30px;text-align:right}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 9px;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--mint-soft);border-color:var(--mint);color:var(--mint);font-weight:700}
.sw{width:32px;height:30px;border:1.5px solid var(--line);border-radius:9px;padding:0;background:none;flex:none}
.tin{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:16px;line-height:1.45;resize:vertical}
textarea.tin{min-height:68px}
.copyall{border:1.5px dashed var(--mint);background:var(--mint-soft);color:var(--mint);font-weight:700;font-size:13px;border-radius:11px;padding:9px;display:flex;align-items:center;justify-content:center;gap:6px}
.copyall svg{width:16px;height:16px}
.keyhint{font-size:12px;color:var(--sub);margin-top:-2px;padding-left:2px}
.writebox{background:var(--sun-soft);border:2.5px solid var(--sun);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.writebox .wlabel{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15.5px;color:var(--ink)}
.writebox .wlabel svg{width:20px;height:20px;color:var(--red)}
.tin.big{font-size:21px;font-weight:500;line-height:1.45;min-height:118px;border:2px solid var(--mint);border-radius:12px;padding:12px 14px;background:var(--paper)}
.tin.big:focus{border-color:var(--mint);box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 25%,transparent);outline:none}
.tin.big::placeholder{color:color-mix(in srgb,var(--sub) 60%,transparent);font-weight:400}
.writebox.blank{animation:nudge 1.6s ease-in-out 2}
@keyframes nudge{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 45%,transparent)}}
.writebox .aprow{margin:0}
.writebox .apply{font-size:16px;padding:12px 10px}
.modeseg{display:inline-flex;flex:none;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.modeseg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--sub);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.modeseg button svg{width:16px;height:16px}
.modeseg button.on[data-tool=pan]{background:var(--ink);color:var(--paper)}
.modeseg button.on[data-tool=box]{background:var(--mint);color:#fff}
.area.boxmode #ov{cursor:crosshair}
.area.hand .mark{cursor:pointer}
.keyhint b{color:var(--ink)}
.keyhint kbd{font:600 11px "IBM Plex Sans KR",sans-serif;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink)}
@media (max-width:899px){textarea.tin{min-height:52px}.tin.big{min-height:92px;font-size:19px}.orig{padding:20px 8px 6px}}
.orig{position:relative;background:repeating-conic-gradient(var(--stage) 0 25%,var(--paper) 0 50%) 0 0/14px 14px;border:1.5px solid var(--line);border-radius:12px;padding:22px 10px 8px;display:flex;justify-content:center}
.orig span{position:absolute;left:10px;top:4px;font-size:11.5px;color:var(--sub);font-weight:700}
.orig canvas{display:block;max-width:100%;border-radius:4px}
.fixp{border-color:var(--mint)}
.fixp span{color:var(--mint)}
.aprow .apply{flex:1;width:auto}
.aprow .apply:disabled{opacity:.4}
.applied{flex:1;color:var(--mint);font-weight:700;font-size:14px}
.mark.fix.pending{border-style:dashed}
.mark.fix.done:not(.sel){border-color:rgba(44,156,114,.35);border-width:1.5px}
.mark.fix.done:not(.sel) .n{opacity:.75;transform:scale(.85)}
#ov.picking{cursor:copy}
.big.mint{background:var(--mint);color:#fff}
.num{width:58px;border:1.5px solid var(--line);border-radius:9px;padding:5px 6px;text-align:center;background:var(--paper);font-size:15px;-moz-appearance:textfield}
.num::-webkit-inner-spin-button{-webkit-appearance:none}
.step{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;width:30px;height:32px;font-weight:700;font-size:16px;flex:none}
.tin:focus{border-color:var(--lilac);outline:none}
.seg4{flex:1;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg4 button{border:0;background:none;border-radius:8px;padding:5px 2px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.seg4 button.on{background:var(--paper);color:var(--mint);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:9px 11px}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.flow div{background:var(--bg);border-radius:11px;padding:7px 8px;font-size:12px;line-height:1.35;color:var(--sub)}
.flow b{display:block;color:var(--red);font-size:12.5px;margin-bottom:1px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;flex:none}
.big{border:0;border-radius:12px;padding:11px 8px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.big svg{width:17px;height:17px}
.big.red{background:var(--red);color:#fff}
.big.soft{background:var(--red-soft);color:var(--red)}
.big:disabled{opacity:.4;cursor:not-allowed}
#prompt{flex:1;min-height:90px;width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;line-height:1.6;background:var(--bg);resize:none}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.top h1{font-size:21px}.saveTop span{display:none}.saveTop{padding:9px 11px}.area{padding:12px}}
@media (min-width:900px){
  .sheet{height:auto}
  #foldBtn{display:none}
  .fonts{flex-wrap:wrap;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg></div>
    <h1>그림 글자 교정소</h1>
    <div class="sp"></div>
    <button class="saveTop" id="saveFinal" disabled title="완성 그림 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>완성 그림<span>&nbsp;저장</span></button>
  </header>

  <section class="work">
    <div class="tools">
      <div class="modeseg" role="radiogroup" aria-label="조작 방법">
        <button id="mPan" class="on" data-tool="pan" title="그림 옮기기·네모 고르기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-7.5a1.5 1.5 0 0 1 3 0V12m0-6a1.5 1.5 0 0 1 3 0v6.5m0-3a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4.2 15a1.6 1.6 0 0 1 2.6-1.8L8 15"/></svg>이동</button>
        <button id="mBox" data-tool="box" title="틀린 글자에 네모 그리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2" stroke-dasharray="3.5 2.5"/></svg>네모 그리기</button>
      </div>
      <button class="tbtn" id="undoBtn" disabled title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>되돌리기</button>
      <button class="tbtn" id="redoBtn" disabled title="다시 하기 (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>다시</button>
      <button class="tbtn star" id="starBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5 5 9.4 10 10-5 .6-9.4 5-10 10-.6-5-5-9.4-10-10 5-.6 9.4-5 10-10z"/></svg>별 표식 지우기</button>
      <button class="tbtn star" id="labelBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h16M4 12h11M4 16h7"/></svg>글자 표식 지우기</button>
      <button class="tbtn" id="origBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>누르면 원본</button>
      <button class="tbtn" id="cleanBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg><span>네모 숨기기</span></button>
      <button class="tbtn" id="saveTool" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>완성 저장</button>
      <button class="tbtn" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 그림</button>
    </div>
    <div class="area" id="area">
      <div id="drop">
        <div class="dropin">
          <div class="paper" aria-hidden="true"><div class="pg"><div class="ln" style="top:20px;width:56px"></div><div class="ln" style="top:40px;width:78px"></div><div class="ln" style="top:56px;width:64px"></div></div><div class="mk"></div></div>
          <h2>고칠 그림을 올려 주세요</h2>
          <p>틀린 글자 위에 네모를 그리면 준비 끝이에요.</p>
          <button class="pick" id="pickBtn">그림 고르기</button>
          <div class="small">PC에서는 끌어다 놓거나 Ctrl+V로 붙여 넣어도 돼요</div>
        </div>
      </div>
      <div id="stage"><canvas id="cv"></canvas><div id="ov"></div></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="zoom" id="zoom">
        <button id="zOut" aria-label="작게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="zv" id="zFit" title="화면에 맞추기">맞춤</button>
        <button id="zIn" aria-label="크게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zFull" aria-label="전체 화면" title="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div class="hint" id="hint" hidden>위쪽 <b>「네모 그리기」</b>를 누르고 틀린 글자 위를 드래그하세요 · 두 손가락이나 휠로 <b>확대</b></div>
  </section>

  <aside class="sheet">
    <div class="shead">
      <h2>고칠 곳 <span class="cnt" id="cnt">0</span></h2>
      <span class="sp"></span>
      <button class="fold" id="foldBtn" aria-label="패널 접기" title="패널 접기/펴기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="pane on" id="pane-marks"></div>
  </aside>
</div>
<div id="toast" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
const ov=$('#ov'), stage=$('#stage'), area=$('#area'), pane=$('#pane-marks');
const FONTS=[
 {f:'Noto Sans KR',n:'고딕',w:[400,700]},
 {f:'Black Han Sans',n:'굵은 제목',w:[400]},
 {f:'Do Hyeon',n:'도톰체',w:[400]},
 {f:'Jua',n:'둥근체',w:[400]},
 {f:'Gowun Dodum',n:'부드러운',w:[400]},
 {f:'Sunflower',n:'해바라기',w:[500,700]},
 {f:'Nanum Myeongjo',n:'명조',w:[400,800]},
 {f:'Gaegu',n:'귀여운 손글씨',w:[400,700]},
 {f:'Nanum Pen Script',n:'펜 손글씨',w:[400]},
 {f:'Hi Melody',n:'멜로디',w:[400]}
];
let img=null, W=0, H=0, orig=null, marks=[], sel=null, uid=1, showOrig=false, fileBase='그림';
const fontOf=m=>FONTS.find(f=>f.f===m.font)||FONTS[0];

/* ---------- 탭 ---------- */
function tab(){ $('.sheet').classList.remove('min'); requestAnimationFrame(()=>{const m=marks.find(q=>q.id===sel);drawOrigPrev(m);drawFixPrev(m);}); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{$('.sheet').classList.remove('min');tab(t.dataset.tab);});
$('#foldBtn').onclick=()=>{$('.sheet').classList.toggle('min'); requestAnimationFrame(()=>{const m=marks.find(q=>q.id===sel);drawOrigPrev(m);drawFixPrev(m);});};

/* ---------- 불러오기 ---------- */
$('#pickBtn').onclick=()=>$('#file').click();
$('#newBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0]; if(f) load(f); e.target.value='';};
const drop=$('#drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>{const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/')); if(f) load(f);});
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if(it) load(it.getAsFile());});

/* ---------- 작업 이어 하기: 그림과 네모를 이 컴퓨터(브라우저)에 저장 ---------- */
const DB={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gyojeongso',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('s','readwrite'); t.objectStore('s').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async get(k){ const d=await this.open(); return new Promise((res,rej)=>{ const r=d.transaction('s').objectStore('s').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
};
let saveT=0, restoring=false;
function saveSoon(){ if(!img||restoring) return; clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ await DB.put('work',{name:fileBase,marks:marks.map(m=>({...m,_s:undefined})),uid,time:Date.now()}); }catch(_){} },400); }
async function showResume(){
  try{
    const [im,wk]=await Promise.all([DB.get('img'),DB.get('work')]); if(!im||!im.blob) return;
    const n=(wk?.marks||[]).length, done=(wk?.marks||[]).filter(q=>q.ap||q.mode==='erase').length;
    const d=new Date(wk?.time||im.time||Date.now()), when=`${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const box=document.createElement('div'); box.className='resume';
    box.innerHTML=`<div><b>지난 작업이 남아 있어요</b><span>${esc(im.name||'그림')} · 네모 ${n}개 중 ${done}곳 고침 · ${when}</span></div><button class="pick" type="button">이어서 하기</button>`;
    box.querySelector('button').onclick=()=>load(new File([im.blob],(im.name||'그림')+'.png',{type:im.blob.type||'image/png'}),wk);
    $('.dropin').appendChild(box);
  }catch(_){}
}
function load(file,resume){
  if(!file||!file.type.startsWith('image/')){toast('그림 파일만 올릴 수 있어요');return;}
  fileBase=(file.name||'그림').replace(/\.[^.]+$/,'')||'그림';
  if(!resume){ DB.put('img',{blob:file,name:fileBase,time:Date.now()}).catch(()=>{}); DB.put('work',{name:fileBase,marks:[],uid:1,time:Date.now()}).catch(()=>{}); }
  const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{
    img=im; W=im.naturalWidth; H=im.naturalHeight; cv.width=W; cv.height=H;
    const t=document.createElement('canvas'); t.width=W; t.height=H; const tc=t.getContext('2d'); tc.drawImage(im,0,0);
    orig=tc.getImageData(0,0,W,H);
    marks=resume?.marks||[]; uid=Math.max(1,resume?.uid||1); sel=null; UND.length=0; RED.length=0;
    drop.style.display='none'; stage.style.display='block'; $('#hint').hidden=false;
    ['#starBtn','#labelBtn','#origBtn','#cleanBtn','#saveFinal','#saveTool'].forEach(s=>$(s).disabled=false);
    $('#zoom').style.display='flex'; document.body.classList.add('editing'); tab('marks');
    if(!matchMedia('(min-width:900px)').matches) $('.sheet').classList.add('min');
    fitStage(true); render(); refresh(); updUndo(); setTool('pan',true);
    toast(resume?'지난 작업을 불러왔어요':'「네모 그리기」를 누르고 틀린 글자 위를 드래그하세요');
  };
  im.onerror=()=>toast('그림을 열 수 없어요. 다른 파일로 해 보세요');
  im.src=url;
}
/* 확대·이동: 기본은 화면에 꼭 맞추고, 두 손가락·휠·버튼으로 키워서 봄 */
let Z=1, panX=0, panY=0, baseK=1;
const PAD=12;
function fitStage(reset){
  if(!W) return;
  const aw=area.clientWidth-PAD*2, ah=area.clientHeight-PAD*2;
  const oldK=baseK*Z; baseK=Math.min(aw/W,ah/H);
  if(reset){ Z=1; }
  else if(oldK&&Z>1){ /* 화면 크기가 바뀌어도 보던 곳 유지 */ const r=baseK*Z/oldK; panX*=r; panY*=r; }
  layout();
}
function layout(){
  const aw=area.clientWidth-PAD*2, ah=area.clientHeight-PAD*2, k=baseK*Z, sw=W*k, sh=H*k;
  panX=sw<=aw?(aw-sw)/2:Math.min(0,Math.max(aw-sw,panX));
  panY=sh<=ah?(ah-sh)/2:Math.min(0,Math.max(ah-sh,panY));
  stage.style.width=sw+'px'; stage.style.height=sh+'px';
  stage.style.left=(PAD+panX)+'px'; stage.style.top=(PAD+panY)+'px';
  $('#zFit').textContent=Z>1.01?Math.round(Z*100)+'%':'맞춤';
}
function zoomAt(z,cx,cy){
  z=Math.max(1,Math.min(8,z)); const r=z/Z;
  panX=cx-(cx-panX)*r; panY=cy-(cy-panY)*r; Z=z; layout();
}
const areaCenter=()=>[(area.clientWidth-PAD*2)/2,(area.clientHeight-PAD*2)/2];
$('#zIn').onclick=()=>zoomAt(Z*1.5,...areaCenter());
$('#zOut').onclick=()=>zoomAt(Z/1.5,...areaCenter());
$('#zFit').onclick=()=>{Z=1;layout();};
/* 조작 방법: 기본은 이동(손), 「네모 그리기」를 고르면 드래그로 네모를 그림 */
let tool='pan';
function setTool(t,quiet){ tool=t; $('#mPan').classList.toggle('on',t==='pan'); $('#mBox').classList.toggle('on',t==='box'); area.classList.toggle('hand',t==='pan'||spaceDown); area.classList.toggle('boxmode',t==='box');
  if(!quiet) toast(t==='box'?'틀린 글자 위를 드래그해서 네모를 그리세요':'그림을 끌어서 옮기고, 네모를 누르면 고칠 수 있어요'); }
$('#mPan').onclick=()=>setTool('pan'); $('#mBox').onclick=()=>setTool('box');
area.addEventListener('wheel',e=>{ if(!img) return; e.preventDefault(); const r=area.getBoundingClientRect(); zoomAt(Z*Math.exp(-e.deltaY*0.0018),e.clientX-r.left-PAD,e.clientY-r.top-PAD); },{passive:false});
let spaceDown=false;
addEventListener('keydown',e=>{ if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ spaceDown=true; area.classList.add('hand'); e.preventDefault(); } });
addEventListener('keyup',e=>{ if(e.code==='Space'){ spaceDown=false; area.classList.toggle('hand',tool==='pan'); } });
new ResizeObserver(()=>fitStage(false)).observe(area);

/* ---------- 그리기 ---------- */
let rq=0;
function render(){cancelAnimationFrame(rq); rq=requestAnimationFrame(doRender);}
async function doRender(){
  if(!img) return;
  await doFonts();
  paint(ctx,{edits:!showOrig});
  drawGhost();
  drawMarks(); syncSize();
}
/* 고치는 중인 네모에 원래 글씨를 흐리게 겹쳐 보여 주기 (화면에만, 저장 그림에는 안 들어감) */
let ghost=false;
function drawGhost(){
  if(!ghost||showOrig) return;
  const m=marks.find(q=>q.id===sel); if(!m||m.mode!=='fix'||!m.to.trim()) return;
  const [x,y,w,h]=clampRect(m,0); if(w<1||h<1) return;
  const t=document.createElement('canvas'); t.width=w; t.height=h; t.getContext('2d').putImageData(orig,-x,-y);
  ctx.save(); ctx.globalAlpha=.32; ctx.drawImage(t,x,y); ctx.restore();
}
function syncSize(){ const m=marks.find(q=>q.id===sel), n=pane.querySelector('[data-k=sizeN]'); if(!m||!n||document.activeElement===n) return; n.value=m.size||Math.round(m._s||0)||''; const r=pane.querySelector('[data-k=size]'); if(r&&!m.size) r.value=Math.round(m._s||4); }
async function doFonts(){ await Promise.all(marks.filter(m=>m.mode==='fix'&&m.ap).map(m=>{const a={...m,...m.ap};return document.fonts.load(fontStr(a,40),a.to).catch(()=>{});})); }
function paint(c,{edits=true,boxes=false}={}){
  c.putImageData(orig,0,0);
  if(edits) for(const m of marks){ if(m.mode==='erase') inpaint(c,m); else if(m.mode==='fix'&&m.ap){ inpaint(c,m); drawText(c,{...m,...m.ap}); } }
  if(boxes) drawBoxes(c);
}
function clampRect(m,pad){
  const x0=Math.max(0,Math.floor(m.x-pad)), y0=Math.max(0,Math.floor(m.y-pad));
  const x1=Math.min(W,Math.ceil(m.x+m.w+pad)), y1=Math.min(H,Math.ceil(m.y+m.h+pad));
  return [x0,y0,x1-x0,y1-y0];
}
/* 네모 안을 바깥 테두리 색으로 부드럽게 메우기 */
function inpaint(c,m){
  const [bx,by,bw,bh]=clampRect(m,0); if(bw<2||bh<2) return;
  const [ox,oy,ow,oh]=clampRect(m,4);
  const d=c.getImageData(ox,oy,ow,oh), p=d.data, ix=bx-ox, iy=by-oy;
  const get=(x,y)=>{x=Math.max(0,Math.min(ow-1,x));y=Math.max(0,Math.min(oh-1,y));const i=(y*ow+x)*4;return [p[i],p[i+1],p[i+2]];};
  const med=a=>[0,1,2].map(k=>a.map(v=>v[k]).sort((q,w)=>q-w)[a.length>>1]);
  const hasL=bx>0, hasR=bx+bw<W, hasT=by>0, hasB=by+bh<H;
  const L=[],R=[],T=[],B=[];
  for(let y=0;y<bh;y++){const yy=iy+y; L.push(hasL?med([1,2,3].map(k=>get(ix-k,yy))):null); R.push(hasR?med([0,1,2].map(k=>get(ix+bw+k,yy))):null);}
  for(let x=0;x<bw;x++){const xx=ix+x; T.push(hasT?med([1,2,3].map(k=>get(xx,iy-k))):null); B.push(hasB?med([0,1,2].map(k=>get(xx,iy+bh+k))):null);}
  /* 테두리 색을 옆과 섞어 줄무늬가 생기지 않게 */
  const smooth=(a,rad)=>a.map((v,i)=>{ if(!v) return v; let r=0,g=0,b=0,c=0; for(let j=Math.max(0,i-rad);j<=Math.min(a.length-1,i+rad);j++){const q=a[j]; if(q){r+=q[0];g+=q[1];b+=q[2];c++;}} return [r/c,g/c,b/c]; });
  const rv=Math.max(2,Math.round(bh*.12)), rh=Math.max(2,Math.round(bw*.06));
  L.splice(0,L.length,...smooth(L,rv)); R.splice(0,R.length,...smooth(R,rv)); T.splice(0,T.length,...smooth(T,rh)); B.splice(0,B.length,...smooth(B,rh));
  /* 한쪽 테두리만 색이 크게 다르면(다른 칸·배경에 걸친 경우) 그쪽은 빼고 메움 */
  { const sides=[L,R,T,B].map(a=>{const v=a.filter(Boolean); if(!v.length) return null; return [0,1,2].map(k=>v.reduce((s,q)=>s+q[k],0)/v.length);});
    const have=sides.map((c,i)=>c?i:-1).filter(i=>i>=0);
    if(have.length>=3){ const med=[0,1,2].map(k=>have.map(i=>sides[i][k]).sort((a,b)=>a-b)[have.length>>1]);
      const far=have.filter(i=>Math.hypot(...[0,1,2].map(k=>sides[i][k]-med[k]))>28);
      if(far.length&&have.length-far.length>=2) for(const i of far){ const arr=[L,R,T,B][i]; arr.fill(null); } } }
  let sum=0,sq=0,n=0; for(const a of [L,R,T,B]) for(const v of a) if(v){const g=(v[0]+v[1]+v[2])/3;sum+=g;sq+=g*g;n++;}
  const sd=n?Math.sqrt(Math.max(0,sq/n-(sum/n)**2)):0, noise=Math.min(sd*0.35,4);
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    let r=0,g=0,b=0,ws=0;
    const add=(v,dist)=>{if(!v)return;const w=1/(dist*dist);r+=v[0]*w;g+=v[1]*w;b+=v[2]*w;ws+=w;};
    add(L[y],x+1); add(R[y],bw-x); add(T[x],y+1); add(B[x],bh-y);
    if(!ws) continue;
    const nz=noise?(Math.random()-.5)*2*noise:0, i=((iy+y)*ow+ix+x)*4;
    p[i]=r/ws+nz; p[i+1]=g/ws+nz; p[i+2]=b/ws+nz; p[i+3]=255;
  }
  c.putImageData(d,ox,oy);
}
function fontStr(m,size){const f=fontOf(m);return `${m.bold?f.w[f.w.length-1]:f.w[0]} ${size}px "${f.f}"`;}
function textSize(c,m){
  const lines=m.to.split('\n'); let s=m.size||Math.floor(m.h*0.8/(lines.length*1.18-0.18||1));
  if(!m.size){ c.font=fontStr(m,s); const mw=Math.max(...lines.map(l=>c.measureText(l).width)); if(mw>m.w*0.96) s=Math.floor(s*m.w*0.96/mw); }
  return Math.max(2,s);
}
function drawText(c,m){
  const t=m.to; if(!t.trim()) return;
  const lines=t.split('\n');
  c.save(); c.fillStyle=m.color||m.auto||'#222';
  if(m.shadow){c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=8;c.shadowOffsetY=3;}
  if(m.align==='auto'&&m.lines&&lines.length>1){

/* 원래 글자 분석: 글자색과 글자가 실제로 차지한 범위 */
function analyze(m){
  m.auto=null; m.ink=null; m.lines=null;
  const [x0,y0,w,h]=clampRect(m,0); if(w<3||h<3) return;
  const P=orig.data, at=(x,y)=>{const i=(y*W+x)*4;return [P[i],P[i+1],P[i+2]];};
  const ring=[]; const [rx,ry,rw,rh]=clampRect(m,3);
  for(let x=rx;x<rx+rw;x+=2){ring.push(at(x,ry));ring.push(at(x,ry+rh-1));}
  for(let y=ry;y<ry+rh;y+=2){ring.push(at(rx,y));ring.push(at(rx+rw-1,y));}
  const bg=[0,1,2].map(k=>ring.reduce((s,v)=>s+v[k],0)/ring.length);
  const px=[]; const step=Math.max(1,Math.floor(Math.sqrt(w*h/9000)));
  for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){const v=at(x,y);px.push({v,x,y,d:(v[0]-bg[0])**2+(v[1]-bg[1])**2+(v[2]-bg[2])**2});}
  const max=px.reduce((a,q)=>Math.max(a,q.d),0); if(max<900) return;
  const top=[...px].sort((a,b)=>b.d-a.d).slice(0,Math.max(3,Math.floor(px.length*.08)));
  m.auto='#'+[0,1,2].map(k=>Math.round(top.reduce((s,q)=>s+q.v[k],0)/top.length).toString(16).padStart(2,'0')).join('');
  const ink=px.filter(q=>q.d>max*.22); if(ink.length<4) return;
  const xs=ink.map(q=>q.x).sort((a,b)=>a-b), ys=ink.map(q=>q.y).sort((a,b)=>a-b), cut=a=>[a[Math.floor(a.length*.01)],a[Math.ceil(a.length*.99)-1]];
  const [ix0,ix1]=cut(xs),[iy0,iy1]=cut(ys);
  if(iy1-iy0<4||ix1-ix0<4) return;
  m.ink={x0:ix0,x1:ix1+step,y0:iy0,y1:iy1+step};
  /* 여러 줄 찾기: 가로로 글자가 비는 줄 사이 틈으로 나눔 */
  const rows=new Map(); for(const q of ink){ const r=rows.get(q.y)||{n:0,x0:1e9,x1:-1}; r.n++; r.x0=Math.min(r.x0,q.x); r.x1=Math.max(r.x1,q.x); rows.set(q.y,r); }
  const runs=[]; let cur=null;
  for(let y=y0;y<y0+h;y+=step){ const r=rows.get(y);
    if(r&&r.n>0){ if(!cur) cur={y0:y,y1:y,x0:r.x0,x1:r.x1}; else { cur.y1=y; cur.x0=Math.min(cur.x0,r.x0); cur.x1=Math.max(cur.x1,r.x1); } }
    else if(cur){ runs.push(cur); cur=null; } }
  if(cur) runs.push(cur);
  if(runs.length>1){
    const hs=runs.map(r=>r.y1-r.y0+step).sort((a,b)=>a-b), med=hs[hs.length>>1];
    const merged=[runs[0]];
    for(const r of runs.slice(1)){ const p=merged[merged.length-1];
      if(r.y0-p.y1<med*.3||(r.y1-r.y0+step)<med*.35){ p.y1=Math.max(p.y1,r.y1); p.x0=Math.min(p.x0,r.x0); p.x1=Math.max(p.x1,r.x1); } else merged.push(r); }
    m.lines=merged.length>1?merged.map(r=>({x0:r.x0,x1:r.x1+step,y0:r.y0,y1:r.y1+step})):null;
  } else m.lines=null;
}
function drawBoxes(c){
  const lw=Math.max(3,Math.round(Math.min(W,H)/220)), r=Math.max(14,Math.round(Math.min(W,H)/40));
  marks.filter(m=>m.mode==='gemini').forEach(m=>{

    c.save(); c.strokeStyle='#FF1F3D'; c.lineWidth=lw; c.strokeRect(m.x-lw,m.y-lw,m.w+lw*2,m.h+lw*2);
    let cx=m.x-lw, cy=m.y-lw-r-2; if(cy-r<0) cy=m.y+m.h+lw+r+2; if(cy+r>H) cy=m.y+m.h/2; if(cx-r<0) cx=r;
    c.fillStyle='#FF1F3D'; c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
    c.fillStyle='#fff'; c.font=`700 ${Math.round(r*1.2)}px "Noto Sans KR",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(k,cx,cy+1);
    c.restore();
  });
}

let drag=null; const pts=new Map(); let pinch=null;

ov.addEventListener('pointermove',e=>{

    const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;

    <div class="keyhint">${COARSE?'<b>줄바꿈</b>은 키보드의 줄바꿈 키 · 다 적으면 아래 <b>적용하기</b>':'<kbd>Enter</kbd> 적용하기 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 줄바꿈 (<kbd>Shift</kbd>+<kbd>Enter</kbd>도 돼요)'}</div>
      ${applyRow(m)}
    </div>
    <div class="orig fixp"><span>고친 모습 미리보기</span><canvas id="fixPrev"></canvas></div>
    <div class="fonts">${FONTS.map(f=>`<button data-font="${f.f}" class="${m.font===f.f?'on':''}" style="font-family:'${f.f}';font-weight:${m.bold?f.w[f.w.length-1]:f.w[0]}">${f.n}</button>`).join('')}</div>
    <div class="row"><span class="lbl">크기</span>
      <button class="step" data-step="-1" aria-label="작게">−</button><input type="number" class="num" data-k="sizeN" min="2" max="2000" inputmode="numeric" value="${m.size||Math.round(m._s||0)||''}"><button class="step" data-step="1" aria-label="크게">+</button>
      <input type="range" min="2" max="${Math.max(40,Math.round(Math.min(W,H)/4))}" value="${m.size||Math.round(m._s||10)}" data-k="size" aria-label="글자 크기">
      <button class="chip ${!m.size?'on':''}" data-act="autos">자동</button></div>
    <div class="row" style="flex-wrap:wrap"><span class="lbl">색</span><input type="color" class="sw" data-k="color" value="${m.color||m.auto||'#222222'}" aria-label="글자색"><button class="chip ${!m.color?'on':''}" data-act="autoc">원래 색</button><button class="chip" data-act="pick">그림에서 색 고르기</button>
      <button class="chip ${m.bold?'on':''}" data-act="bold">굵게</button><button class="chip ${m.shadow?'on':''}" data-act="shadow">그림자</button></div>
    ${marks.filter(q=>q.mode==='fix'&&q!==m).length?`<button class="copyall" data-act="copyall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>이 글꼴·굵기·색을 다른 네모에도 똑같이</button>`:''}
    <div class="row"><span class="lbl">위치</span><div class="seg4">${['auto','left','center','right'].map(a=>`<button class="${m.align===a?'on':''}" data-align="${a}">${{auto:'원래 자리',left:'왼쪽',center:'가운데',right:'오른쪽'}[a]}</button>`).join('')}</div></div>`;
  pane.innerHTML=T+chips+`<div class="ed">${body}</div>`;
  drawOrigPrev(m); drawFixPrev(m);
  if(lastSel!==sel){ pane.scrollTop=0; lastSel=sel; }
}
let lastSel=null;
const snap=m=>({to:m.to,font:m.font,bold:m.bold,size:m.size,color:m.color,align:m.align,shadow:m.shadow});
const same=(a,b)=>a&&b&&JSON.stringify(a)===JSON.stringify(b);
function applyRow(m){
  const empty=!m.to.trim(), done=same(m.ap,snap(m));
  return `<div class="row aprow">${done
    ?`<span class="applied">✓ 고쳐졌어요</span><button class="chip" data-act="unapply">이 곳 되돌리기</button>`
    :`<button class="big mint apply" data-act="apply" ${empty?'disabled':''}>${m.ap?'바뀐 내용 다시 적용':(COARSE?'적용하기':'적용하기 (Enter)')}</button>${m.ap?'<button class="chip" data-act="unapply">이 곳 되돌리기</button>':''}`}</div>`;
}
/* 적용: 틀린 글자를 지우고 고친 글자를 넣은 뒤, 아직 안 고친 다음 곳으로 넘어감 */
function applyMark(m){
  if(!m||!m.to.trim()){ toast('고칠 글자를 먼저 적어 주세요'); return; }
  pushHist(); m.ap=snap(m);
  const rest=marks.filter(q=>q.mode==='fix'&&!q.ap);
  const next=rest.find(q=>marks.indexOf(q)>marks.indexOf(m))||rest[0];
  if(next) sel=next.id;
  render(); refresh();
  toast(next?`적용했어요. ${marks.indexOf(next)+1}번으로 넘어갈게요`:'모두 고쳤어요! 「완성 그림 저장」을 누르세요');
  if(next&&matchMedia('(min-width:900px)').matches) setTimeout(()=>pane.querySelector('[data-k=to]')?.focus(),30);
}
const COARSE=matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches;
let picking=false;
function startPick(){ picking=true; ov.classList.add('picking'); if(!matchMedia('(min-width:900px)').matches) $('.sheet').classList.add('min'); toast('그림에서 원하는 글자색을 눌러 주세요'); }
function pickColor(e){
  picking=false; ov.classList.remove('picking');
  const r=ov.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)*W/r.width), y=Math.floor((e.clientY-r.top)*H/r.height);
  const i=(Math.max(0,Math.min(H-1,y))*W+Math.max(0,Math.min(W-1,x)))*4, P=orig.data;
  const m=marks.find(q=>q.id===sel); if(!m) return;
  m.color='#'+[P[i],P[i+1],P[i+2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  tab(); refresh(); toast('글자색을 골랐어요');
}
pane.addEventListener('keydown',e=>{
  if(e.target.dataset.k!=='to'||e.key!=='Enter'||e.isComposing) return;
  if(COARSE&&!e.ctrlKey&&!e.metaKey) return; /* 휴대폰 자판: 줄바꿈 키는 그대로 줄바꿈 */
  if(e.ctrlKey||e.metaKey){ /* Ctrl+Enter: 줄바꿈 */
    e.preventDefault(); const t=e.target, a=t.selectionStart, b=t.selectionEnd;
    t.value=t.value.slice(0,a)+'\n'+t.value.slice(b); t.selectionStart=t.selectionEnd=a+1;
    t.dispatchEvent(new Event('input',{bubbles:true})); return;
  }
  if(e.shiftKey) return; /* Shift+Enter도 줄바꿈 */
  e.preventDefault(); applyMark(marks.find(q=>q.id===sel));
});
function updApplyRow(m){ const r=pane.querySelector('.aprow'); if(r) r.outerHTML=applyRow(m); }
/* 고친 모습을 패널 안에서만 미리 보여 주기 (그림은 「적용하기」를 눌러야 바뀜) */
let wk=null,wkc=null;
async function drawFixPrev(m){
  const c=pane.querySelector('#fixPrev'); if(!c||!m) return;
  if(m.to.trim()) await document.fonts.load(fontStr(m,40),m.to).catch(()=>{});
  if(!wk||wk.width!==W||wk.height!==H){ wk=document.createElement('canvas'); wk.width=W; wk.height=H; wkc=wk.getContext('2d',{willReadFrequently:true}); }
  const pad=Math.round(Math.max(m.w,m.h)*.06), [x,y,w,h]=clampRect(m,pad); if(w<1||h<1) return;
  const [ox,oy,ow,oh]=clampRect(m,pad+6);
  wkc.putImageData(orig,0,0,ox,oy,ow,oh);
  if(m.to.trim()){ inpaint(wkc,m); drawText(wkc,m); }
  const cw=Math.round(c.parentElement.clientWidth-20)||300, k=Math.min(cw/w,(matchMedia('(min-width:900px)').matches?84:62)/h,8), dpr=devicePixelRatio||1;
  c.width=Math.round(w*k*dpr); c.height=Math.round(h*k*dpr); c.style.width=Math.round(w*k)+'px'; c.style.height=Math.round(h*k)+'px';
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(wk,x,y,w,h,0,0,c.width,c.height);
  syncSize();
}
/* 고르고 있는 네모의 원래 글씨를 크게 보여 주기 */
function drawOrigPrev(m){
  const c=pane.querySelector('#origPrev'); if(!c||!m) return;
  const pad=Math.round(Math.max(m.w,m.h)*.06), [x,y,w,h]=clampRect(m,pad); if(w<1||h<1) return;
  const cw=Math.round(c.parentElement.clientWidth-20)||300, k=Math.min(cw/w,(matchMedia('(min-width:900px)').matches?84:62)/h, 8);
  const dpr=devicePixelRatio||1; c.width=Math.round(w*k*dpr); c.height=Math.round(h*k*dpr); c.style.width=Math.round(w*k)+'px'; c.style.height=Math.round(h*k)+'px';
  const t=document.createElement('canvas'); t.width=w; t.height=h; t.getContext('2d').putImageData(orig,-x,-y);
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(t,0,0,c.width,c.height);
}
pane.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.pick){ sel=+b.dataset.pick; drawMarks(); refresh(); return; }
  const m=marks.find(q=>q.id===sel); if(!m) return;
  if(b.dataset.act==='del'){ pushHist(); marks=marks.filter(q=>q!==m); sel=marks.length?marks[marks.length-1].id:null; render(); refresh(); return; }
  if(b.dataset.m){ if(m.mode===b.dataset.m) return; pushHist(); m.mode=b.dataset.m; if(!m.ink) analyze(m); }
  else if(b.dataset.font) m.font=b.dataset.font;
  else if(b.dataset.align) m.align=b.dataset.align;
  else if(b.dataset.act==='bold') m.bold=!m.bold;
  else if(b.dataset.act==='shadow') m.shadow=!m.shadow;
  else if(b.dataset.act==='autoc'){ m.color=''; analyze(m); }
  else if(b.dataset.act==='autos'){ m.size=0; }
  else if(b.dataset.act==='apply'){ applyMark(m); return; }
  else if(b.dataset.act==='unapply'){ pushHist(); m.ap=null; render(); refresh(); toast('이 곳만 원래 글씨로 되돌렸어요'); return; }
  else if(b.dataset.act==='pick'){ startPick(); return; }
  else if(b.dataset.act==='copyall'){
    pushHist(); const others=marks.filter(q=>q.mode==='fix'&&q!==m);
    if(m.ap) m.ap={...m.ap,font:m.font,bold:m.bold,shadow:m.shadow,color:m.color};
    for(const q of others){ q.font=m.font; q.bold=m.bold; q.shadow=m.shadow; q.color=m.color;
      if(q.ap){ q.ap={...q.ap,font:m.font,bold:m.bold,shadow:m.shadow,color:m.color}; } }
    render(); refresh(); toast(`다른 네모 ${others.length}곳에도 똑같이 맞췄어요`); return; }
  else if(b.dataset.step){ m.size=Math.max(2,Math.round(m.size||m._s||12)+(+b.dataset.step)); }
  const sx=pane.querySelector('.fonts')?.scrollLeft||0;
  render(); refresh();
  const f=pane.querySelector('.fonts'); if(f) f.scrollLeft=sx;
});
pane.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k) return; const m=marks.find(q=>q.id===sel); if(!m) return;
  if(k==='size'){ m.size=+e.target.value; const n=pane.querySelector('[data-k=sizeN]'); if(n) n.value=m.size; pane.querySelector('[data-act=autos]')?.classList.remove('on'); }
  else if(k==='sizeN'){ const v=Math.round(+e.target.value); if(!v||v<2) return; m.size=v; const r=pane.querySelector('[data-k=size]'); if(r) r.value=v; pane.querySelector('[data-act=autos]')?.classList.remove('on'); }
  else if(k==='color'){ m.color=e.target.value; pane.querySelector('[data-act=autoc]')?.classList.remove('on'); }
  else m[k]=e.target.value;
  if(m.mode==='fix'){ drawFixPrev(m); updApplyRow(m); } else render();
  buildPrompt(); saveSoon();
});

function buildPrompt(){}

/* ---------- 저장 ---------- */
let dl=null; (async()=>{ try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(_){ dl=null; } })();
function exportCanvas(boxes){ const c=document.createElement('canvas'); c.width=W; c.height=H; paint(c.getContext('2d',{willReadFrequently:true}),{edits:true,boxes}); return c; }
async function save(c,name){
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(dl){ try{ await dl.save({filename:name,data:blob}); toast('저장했어요'); }
    catch(e){ if(e?.code==='declined') return; if(e?.code==='rate_limited'){toast('잠시 후 다시 눌러 주세요');return;} fallback(blob,name); } }
  else fallback(blob,name);
}
function fallback(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('저장했어요'); }
$('#saveFinal').onclick=async()=>{ if(!img) return; const pend=marks.filter(m=>m.mode==='fix'&&m.to.trim()&&!same(m.ap,snap(m))).length; if(pend) toast(`적용하지 않은 곳 ${pend}개는 빼고 저장해요`); await doFonts(); save(exportCanvas(false),`${fileBase}_고침.png`); };

let tt; function toast(s){const t=$('#toast'); t.textContent=s; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600);}
refresh(); showResume();
window.__gj={get Z(){return Z},get marks(){return marks},exportCanvas:b=>exportCanvas(b)};
})();
