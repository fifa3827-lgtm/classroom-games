<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd6e4">
<title>몽글 점프</title>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a3b5c; --pink: #ff7aa8; --mint: #6fd6c0; --gold: #ffc84a; --card: rgba(255,255,255,.92);
    --font: "Jua", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe3ec; color: var(--ink); font-family: var(--font);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  canvas#gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  .hide { display: none !important; }

  /* 위쪽 점수판 */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none; }
  #score { text-align: center; font-size: 64px; line-height: 1; color: #fff; -webkit-text-stroke: 2px #ff7aa8; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(74,59,92,.3); }
  #best { display: table; margin: 6px auto 0; font-size: 15px; color: var(--ink); background: rgba(255,255,255,.75); border-radius: 999px; padding: 2px 12px; }
  .chip { position: fixed; top: calc(env(safe-area-inset-top) + 12px); display: flex; align-items: center; gap: 6px; background: var(--card);
    border-radius: 999px; padding: 6px 12px; font-size: 18px; box-shadow: 0 3px 0 rgba(74,59,92,.15); pointer-events: auto; }
  #starChip { left: 12px; }
  /* 좁은 화면에서는 점수를 단추 줄 아래로 내린다 */
  @media (max-width: 600px) { #hud { padding-top: calc(env(safe-area-inset-top) + 60px); } }
  #btnRow { right: 12px; padding: 4px; gap: 4px; z-index: 20; }
  #btnRow button { width: 38px; height: 38px; border-radius: 50%; background: transparent; font-size: 20px; }
  #btnRow button:hover { background: #ffe7ef; }

  /* 떠오르는 글자 */
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-size: 30px; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(74,59,92,.35); animation: popUp 1.1s ease-out forwards; }
  .pop { -webkit-text-stroke: 4px rgba(74,59,92,.55); paint-order: stroke fill; }
  .pop.perfect { color: #fff6b0; font-size: 34px; -webkit-text-stroke: 5px #e2558a; text-shadow: 0 3px 0 rgba(74,59,92,.35), 0 0 16px rgba(255,200,74,.9); }
  .pop.small { font-size: 22px; }
  @keyframes popUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 34px); transform: translateX(-50%); background: var(--card);
    padding: 10px 18px; border-radius: 999px; font-size: 18px; box-shadow: 0 3px 0 rgba(74,59,92,.15); pointer-events: none; white-space: nowrap;
    transition: opacity .4s; }

  /* 창 */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .screen.dim { background: rgba(74,59,92,.28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .panel { background: var(--card); border-radius: 28px; padding: 24px 22px; width: min(360px, 100%); text-align: center;
    box-shadow: 0 8px 0 rgba(74,59,92,.12), 0 18px 40px rgba(74,59,92,.18); animation: panelIn .35s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow: auto; }
  @keyframes panelIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .big { display: block; width: 100%; padding: 14px; border-radius: 18px; font-size: 22px; color: #fff; background: var(--pink); box-shadow: 0 5px 0 #d9507f; margin-top: 12px; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9507f; }
  .big.mint { background: var(--mint); box-shadow: 0 5px 0 #3fae98; }
  .big.mint:active { box-shadow: 0 2px 0 #3fae98; }
  .big.plain { background: #efe8f6; color: var(--ink); box-shadow: 0 5px 0 #d6cbe4; }
  .big.plain:active { box-shadow: 0 2px 0 #d6cbe4; }
  .big:disabled { background: #ece6f2; color: #7d7090; box-shadow: 0 5px 0 #d8cfe3; cursor: default; }
  .big:disabled:active { transform: none; }
  .row { display: flex; gap: 10px; } .row .big { flex: 1; }

  /* 제목 화면: 아래쪽에 띄워 캐릭터가 보이게 */
  #title { align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom) + 22px); }
  #title .logo { position: fixed; top: calc(env(safe-area-inset-top) + 9vh); left: 0; right: 0; text-align: center; pointer-events: none; }
  #title .logo h1 { margin: 0; font-size: clamp(52px, 15vw, 86px); font-weight: normal; color: #fff; letter-spacing: 2px;
    text-shadow: 0 5px 0 #ff7aa8, 0 10px 0 rgba(74,59,92,.18); animation: bob 2.4s ease-in-out infinite; }
  #title .logo p { display: inline-block; margin: 10px 0 0; font-size: 19px; color: #fff; background: rgba(74,59,92,.78); border-radius: 999px; padding: 4px 16px; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
  #title .panel { padding: 16px; }
  #title .row .big { font-size: 18px; white-space: nowrap; padding: 12px 6px; }
  #titleBest { font-size: 16px; opacity: .75; margin-bottom: 2px; }

  #overScore { font-size: 72px; line-height: 1.05; color: var(--pink); }
  #overMsg { font-size: 20px; margin: 2px 0 6px; min-height: 26px; }
  #overInfo { font-size: 16px; opacity: .8; }
  .newbest { display: inline-block; background: var(--gold); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px;
    animation: wiggle .6s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-4deg) scale(1); } to { transform: rotate(4deg) scale(1.08); } }

  /* 친구 도감 */
  #friendsPanel h2, #gachaPanel h2 { margin: 0 0 4px; font-weight: normal; font-size: 28px; }
  .sub { font-size: 15px; opacity: .7; margin-bottom: 12px; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { background: #fff5f8; border-radius: 18px; padding: 8px 4px 6px; border: 3px solid transparent; position: relative; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  .card .nm { font-size: 15px; margin-top: 2px; }
  .card.locked img { filter: brightness(0) opacity(.18); }
  .card.locked .nm { opacity: .5; }
  .card.sel { border-color: var(--pink); background: #ffe7ef; }
  .card.sel::after { content: "함께해요"; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--pink); color: #fff;
    font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  #gachaBtn small { font-size: 15px; opacity: .9; }

  /* 뽑기 */
  #gacha { z-index: 12; }
  #gachaStage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-left: 16px; padding-right: 16px;
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
  #gachaText { font-size: 30px; color: #fff; text-shadow: 0 2px 0 rgba(74,59,92,.5); text-align: center; margin-bottom: 14px; min-height: 40px;
    background: rgba(74,59,92,.82); border-radius: 22px; padding: 10px 22px; max-width: calc(100vw - 32px); }
  #gachaText:empty { visibility: hidden; }
  #gachaText small { display: block; font-size: 18px; }

  /* 도입 장면 */
  #story { z-index: 14; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom) + 22px); cursor: pointer; }
  #storyCard { background: rgba(74,59,92,.88); color: #fff; border-radius: 26px; padding: 18px 20px 14px; width: min(440px, 100%);
    text-align: center; box-shadow: 0 10px 30px rgba(74,59,92,.3); }
  #storyText { font-size: 21px; line-height: 1.45; min-height: 92px; word-break: keep-all; display: flex; align-items: center; justify-content: center; }
  #storyPics { min-height: 54px; }
  #storyText b { color: #ffd84a; font-weight: normal; }
  #storyPics { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  #storyPics img { width: 54px; height: 54px; object-fit: contain; animation: pop2 .5s cubic-bezier(.2,1.6,.4,1) both; }
  #storyPics img.sil { filter: brightness(0) invert(1) opacity(.55); }
  @keyframes pop2 { from { transform: scale(0); } to { transform: scale(1); } }
  #storyNav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 16px; }
  #storyNav button { background: rgba(255,255,255,.16); border-radius: 999px; padding: 8px 16px; color: #fff; }
  #storyNav .next { background: var(--pink); }
  .dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .3; }
  .dots i.on { opacity: 1; }

  /* 게임 방법 */
  #howto { z-index: 16; }
  #howto .panel { width: min(380px, 100%); }
  #howto h2 { margin: 0; font-weight: normal; font-size: 26px; }
  #howPic { height: 150px; margin: 12px 0 6px; border-radius: 20px; background: linear-gradient(#cfeeff, #ffe3ec); position: relative; overflow: hidden; }
  #howText { font-size: 17px; line-height: 1.5; min-height: 76px; word-break: keep-all; }
  #howText b { color: var(--pink); font-weight: normal; }
  #howto .dots { justify-content: center; margin: 10px 0 2px; color: var(--pink); }
  .hp { position: absolute; }
  .hp img { width: 100%; height: 100%; object-fit: contain; }
  /* 1 꾹 누르기 */
  .h1 .hero { left: calc(50% - 40px); bottom: 34px; width: 80px; height: 80px; transform-origin: 50% 100%; animation: squash 1.6s ease-in-out infinite; }
  .h1 .finger { left: calc(50% + 30px); top: 8px; font-size: 40px; animation: pressF 1.6s ease-in-out infinite; }
  .h1 .bar { left: 20%; right: 20%; bottom: 14px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.8); overflow: hidden; }
  .h1 .bar i { display: block; height: 100%; background: var(--pink); animation: fill 1.6s ease-in-out infinite; }
  @keyframes squash { 0%,10% { transform: scale(1,1); } 70% { transform: scale(1.25,.6); } 80%,100% { transform: scale(1,1); } }
  @keyframes pressF { 0%,10% { transform: translateY(-6px); } 20%,70% { transform: translateY(6px); } 80%,100% { transform: translateY(-6px); } }
  @keyframes fill { 0%,10% { width: 0; } 70% { width: 100%; } 80%,100% { width: 0; } }
  /* 2 떼면 폴짝 */
  .plat { width: 70px; height: 26px; border-radius: 50%; background: #ffb3c8; box-shadow: 0 8px 0 #e993ae; bottom: 26px; }
  .h2 .p1 { left: 10%; } .h2 .p2 { right: 10%; background: #ffe08a; box-shadow: 0 8px 0 #e2c264; }
  .h2 .hero { width: 56px; height: 56px; left: calc(10% + 7px); bottom: 44px; animation: hop 2s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes hop { 0%,15% { transform: translate(0,0) rotate(0); } 50% { transform: translate(var(--half), -36px) rotate(180deg); }
    85%,100% { transform: translate(var(--full), 0) rotate(360deg); } }
  /* 3 퍼펙트 */
  .h3 .target { left: calc(50% - 70px); bottom: 20px; width: 140px; height: 54px; border-radius: 50%; background: #ffb3c8; box-shadow: 0 8px 0 #e993ae; }
  .h3 .target::after { content: ""; position: absolute; left: 50%; top: 50%; width: 36px; height: 14px; transform: translate(-50%,-50%); border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.45); }
  .h3 .hero { left: calc(50% - 30px); bottom: 44px; width: 60px; height: 60px; animation: drop 1.8s ease-in infinite; }
  .h3 .ptxt { left: 0; right: 0; top: 12px; text-align: center; font-size: 24px; color: #fff6b0; -webkit-text-stroke: 4px #e2558a; paint-order: stroke fill; animation: ptxt 1.8s infinite; }
  @keyframes drop { 0% { transform: translateY(-80px); } 40%,100% { transform: translateY(0); } }
  @keyframes ptxt { 0%,40% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.15); } 60%,90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  /* 4 별 · 뽑기 */
  .h4 .row4 { left: 0; right: 0; top: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 40px; }
  .h4 .row4 .cap { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(#ff7aa8 50%, #fff 50%); box-shadow: inset 0 0 0 3px rgba(74,59,92,.15); animation: wiggle .6s ease-in-out infinite alternate; }
  .h4 .row4 small { font-size: 18px; color: var(--ink); }
  .h4 .sils { left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 4px; }
  .h4 .sils img { width: 40px; height: 40px; filter: brightness(0) opacity(.25); }

  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    background: linear-gradient(#ffd6e4, #c9ecff); z-index: 30; font-size: 22px; transition: opacity .5s; }
  #loadBar { width: 200px; height: 14px; border-radius: 999px; background: rgba(255,255,255,.7); overflow: hidden; }
  #loadBar i { display: block; height: 100%; width: 0; background: var(--pink); border-radius: 999px; transition: width .2s; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pops"></div>

<div id="hud" class="hide">
  <div id="score">0</div>
  <div id="best"></div>
</div>
<div id="starChip" class="chip hide">⭐ <span id="stars">0</span></div>
<div id="btnRow" class="chip">
  <button id="btnPause" class="hide" title="잠깐 쉬기" aria-label="잠깐 쉬기">⏸</button>
  <button id="btnSound" title="소리 켜기/끄기" aria-label="소리">🔊</button>
  <button id="btnFull" title="전체 화면" aria-label="전체 화면">⛶</button>
</div>
<div id="hint" class="hide">화면을 꾹 눌렀다가 떼면 점프!</div>

<div id="title" class="screen">
  <div class="logo"><h1>몽글 점프</h1><p>꾹~ 눌렀다 떼면 폴짝!</p></div>
  <div class="panel">
    <div id="titleBest"></div>
    <button class="big" id="btnStart">시작하기</button>
    <button class="big mint" id="btnFriends">친구 도감 · 뽑기</button>
    <div class="row"><button class="big plain" id="btnHow">❓ 게임 방법</button><button class="big plain" id="btnStory">📖 이야기</button></div>
  </div>
</div>

<div id="over" class="screen dim hide">
  <div class="panel">
    <div id="overNew"></div>
    <div id="overScore">0</div>
    <div id="overMsg"></div>
    <div id="overInfo"></div>
    <button class="big" id="btnAgain">다시 하기</button>
    <div class="row">
      <button class="big mint" id="btnOverFriends">뽑기</button>
      <button class="big plain" id="btnHome">처음으로</button>
    </div>
  </div>
</div>

<div id="pause" class="screen dim hide">
  <div class="panel">
    <h2 style="margin:0 0 6px;font-weight:normal;font-size:28px">잠깐 쉬어요</h2>
    <div class="sub">지금 점수 <span id="pauseScore">0</span>점</div>
    <button class="big" id="btnResume">계속하기</button>
    <button class="big plain" id="btnPauseHow">❓ 게임 방법</button>
    <button class="big plain" id="btnQuit">처음으로</button>
  </div>
</div>

<div id="friends" class="screen dim hide">
  <div class="panel" id="friendsPanel">
    <h2>친구 도감</h2>
    <div class="sub">함께 뛸 친구를 눌러 고르세요</div>
    <div id="grid"></div>
    <button class="big mint" id="gachaBtn"></button>
    <button class="big plain" id="btnFriendsClose">닫기</button>
  </div>
</div>

<div id="gacha" class="screen hide">
  <div id="gachaStage">
    <div id="gachaText"></div>
    <div class="row" style="width:min(360px,100%)">
      <button class="big" id="btnGachaOk" style="visibility:hidden">좋아요!</button>
    </div>
  </div>
</div>

<div id="story" class="screen hide">
  <div id="storyCard">
    <div id="storyPics"></div>
    <div id="storyText"></div>
    <div id="storyNav"><button id="btnSkip">건너뛰기</button><div class="dots" id="storyDots"></div><button class="next" id="btnStoryNext">다음 ▶</button></div>
  </div>
</div>

<div id="howto" class="screen dim hide">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div id="howPic"></div>
    <div id="howText"></div>
    <div class="dots" id="howDots"></div>
    <div class="row"><button class="big plain" id="btnHowPrev">◀ 이전</button><button class="big" id="btnHowNext">다음 ▶</button></div>
  </div>
</div>

<div id="loading"><div>몽글몽글 준비 중…</div><div id="loadBar"><i></i></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- 저장 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('monggle:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('monggle:' + k, JSON.stringify(v)); } catch (e) {} },
};
let best = store.get('best', 0), stars = store.get('stars', 0), owned = store.get('owned', ['monggle']), sel = store.get('sel', 'monggle');
let muted = store.get('muted', false), played = store.get('played', 0);
if (!owned.includes(sel)) sel = 'monggle';

// ---------- 캐릭터 · 발판 ----------
const FRIENDS = [
  { id: 'monggle', file: 'c_monggle', name: '몽글이', say: '몽글몽글~ 같이 뛰자!' },
  { id: 'kongtteok', file: 'c_kongtteok', name: '콩떡이', say: '해바라기씨 먹고 힘이 불끈!' },
  { id: 'malang', file: 'c_malang', name: '말랑이', say: '말랑말랑, 통통 튀어요!' },
  { id: 'posong', file: 'c_pengpeng', name: '뽀송이', say: '목도리 휘날리며 출발!' },
  { id: 'bungbung', file: 'c_buzz', name: '붕붕이', say: '붕붕~ 날개는 장식이에요' },
  { id: 'somgureum', file: 'c_cloud', name: '솜구름', say: '구름처럼 사뿐사뿐~' },
];
const GACHA_COST = 30;
// shape: circle(동그란 발판) / box(네모 발판). special: 위에서 잠깐 기다리면 보너스
const PLATS = [
  { id: 'cupcake', shape: 'circle', w: 1 },
  { id: 'macaron', shape: 'circle', w: 1 },
  { id: 'cake', shape: 'circle', w: 1 },
  { id: 'mushroom', shape: 'circle', w: .8 },
  { id: 'drum', shape: 'circle', w: .8, special: 'drum' },
  { id: 'jelly', shape: 'box', w: .8 },
  { id: 'gift', shape: 'box', w: .5, special: 'gift' },
  { id: 'musicbox', shape: 'circle', w: .5, special: 'music' },
];
const CHAR_H = 1.25;          // 캐릭터 키
const MAX_DIST = 4.6;        // 가장 멀리 뛰는 거리
const CHARGE_SPEED = 3.0;    // 1초 누르면 늘어나는 거리
const MODEL_YAW = 0;         // 모델 앞쪽이 +z 가 아니면 여기서 돌린다

// ---------- 화면 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const CAM_OFF = new THREE.Vector3(-6.2, 9, 6.2);

const hemi = new THREE.HemisphereLight(0xffffff, 0xffd0e0, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);

      heroWrap.position.lerpVectors(j.from, j.to, t); heroWrap.position.y = THREE.MathUtils.lerp(j.from.y, j.to.y, t) + Math.sin(t * Math.PI) * j.h;
      // 공중제비
      // 세상 기준 축(j.axis)으로 돌린 것을 몸(heroWrap) 기준으로 바꾼다
      const q = new THREE.Quaternion().setFromAxisAngle(j.axis, -t * Math.PI * 2);
      const yawQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), heroWrap.rotation.y);
      hero.quaternion.copy(yawQ.clone().invert().multiply(q).multiply(yawQ));
      hero.scale.lerp(new THREE.Vector3(.9, 1.15, .9), Math.min(dt * 20, 1));
      hero.position.x = 0;
      // 퍼펙트가 이어지면 반짝이 꼬리
      if (combo >= 2 && Math.random() < .7) sparkles(heroWrap.position.clone().setY(heroWrap.position.y + .5), [0xff9ac0, 0xffd84a, 0x9ad8ff, 0xc8b0ff][Math.floor(Math.random() * 4)], 1, .6);
      const p = plats[cur]; p.model.scale.y += (p.baseScaleY - p.model.scale.y) * Math.min(dt * 20, 1);
      if (t >= 1) landed();
    } else if (state === 'falling') {
      const j = jump; j.t += dt; j.v.y -= 14 * dt; heroWrap.position.addScaledVector(j.v, dt);
      hero.rotation.z += j.spin * dt; hero.rotation.x += j.spin * .6 * dt;
      if (j.t > 1.1) { jump = null; gameOver(); }
    } else {
      // 숨쉬기
      idleT += dt; const b = Math.sin(idleT * 3) * .03;
      hero.scale.lerp(new THREE.Vector3(1 - b * .5, 1 + b, 1 - b * .5), Math.min(dt * 10, 1)); hero.position.x = 0;
      // 제목 화면에서는 카메라 쪽을 보며 고개를 살랑살랑
      if (state === 'story') heroWrap.userData.yaw = Math.atan2(Math.sin(elapsed * .25), Math.cos(elapsed * .25)) + MODEL_YAW;
      else if (state === 'title') heroWrap.userData.yaw = Math.sin(elapsed * .6) * .6 + Math.atan2(CAM_OFF.x, CAM_OFF.z) + MODEL_YAW;
      // 특별 발판 위에서 기다리기
      if (state === 'ready' && plats[cur].special && plats[cur].special !== 'drum' && !bonusDone) {
        waitT += dt;
        if (waitT > 2) {
          bonusDone = true; const p = plats[cur], at = new THREE.Vector3(heroWrap.position.x, heroWrap.position.y + 1.6, heroWrap.position.z);
          store.set('found_' + p.special, true);
          if (p.special === 'gift') { score += 10; SND.gift(); stars += 2; starsThisRun += 2; store.set('stars', stars); updateStars();
            sparkles(at, 0xff9ac0, 30, 3.5); sparkles(at, 0xffd84a, 20, 3); pop('선물 발견! +10 ⭐+2', at, 'perfect'); p.wob = 2; }
          else { score += 5; SND.music(); sparkles(at, 0xc8b0ff, 26, 2.5); pop('♪ 오르골 +5', at, 'perfect'); p.wob = 1.5; p.spin = 3; }
          updateScore();
        }
      }
    }
  }
  // 발판 흔들림 · 떨어지는 등장 · 별 돌기
  for (const p of plats) {
    if (p.drop !== undefined && p.drop < 1) { p.drop = Math.min(p.drop + dt * 3.2, 1); const t = p.drop; p.g.position.y = (1 - t) * (1 - t) * 3 - Math.sin(t * Math.PI) * .0; if (t >= 1) p.wob = .8; }
    if (p.wob > 0) { p.wob = Math.max(p.wob - dt * 2.5, 0); if (!(state === 'charging' && p === plats[cur])) p.model.scale.y = p.baseScaleY * (1 + Math.sin(p.wob * 18) * .06 * p.wob);
      if (p === plats[cur] && heroWrap && (state === 'ready' || state === 'title' || state === 'over')) heroWrap.position.y = restY * p.model.scale.y / p.baseScaleY; }
    if (p.spin) { p.model.rotation.y += p.spin * dt; p.spin = Math.max(p.spin - dt * .8, 0); }
    if (p.star) { p.star.rotation.y += dt * 2.5; p.star.position.y = p.top + .9 + Math.sin(elapsed * 3) * .1; }
  }
  updateFx(dt);

  // 카메라
  camLook.lerp(camGoal, Math.min(dt * 3, 1));
  const off = state === 'gacha' ? new THREE.Vector3(0, 2.6, 7.5)
    : state === 'story' ? new THREE.Vector3(Math.sin(elapsed * .25) * 6, 2.6, Math.cos(elapsed * .25) * 6) : CAM_OFF;
  // 제목 화면에서는 장면을 조금 아래로 내려 제목과 겹치지 않게
  titleLift += ((state === 'title' || state === 'story' ? 1 : 0) - titleLift) * Math.min(dt * 4, 1);
  const look = camLook.clone(); look.y += titleLift * 1.1;
  // 이야기 중에는 몽글이를 가운데에 두고 돈다
  if (state === 'story' && heroWrap) { look.copy(heroWrap.position); look.y += .2; }
  camera.position.copy(look).add(off); camera.lookAt(look);
  sun.position.copy(camLook).add(new THREE.Vector3(-4, 10, 6)); sun.target.position.copy(camLook);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- 시작 ----------
await loadAll();
// 도감 그림이 없으면 화면에서 직접 찍는다
resetWorld(); refreshTitle(); updateStars();
const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 500);
if (!store.get('storySeen', false)) openStory(() => { if (!store.get('howSeen', false)) openHow(); });
requestAnimationFrame(frame);
window.__mg = { get state() { return state; }, get score() { return score; }, plats: () => plats, cur: () => cur };
</script>
